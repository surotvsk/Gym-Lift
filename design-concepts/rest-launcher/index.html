<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-variant="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymLift prototype · Rest launcher</title>
<meta name="robots" content="noindex">
<!-- Prototyp (nie je súčasť aplikácie, nie je v precache, nič nečíta z úložiska).
     ?variant=a|b|c&theme=dark|light&lang=en|ar. Mení sa iba tlačidlo Oddych; hlavička aj cvik sú vo všetkých variantoch rovnaké. -->
<script>
  /* Téma, jazyk a variant pred prvým vykreslením, bez čítania úložiska. */
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    var th = q.get('theme');
    if (th !== 'dark' && th !== 'light') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.setAttribute('data-theme', th);
    var v = (q.get('variant') || '').toLowerCase();
    d.setAttribute('data-variant', v === 'b' || v === 'c' ? v : 'a');
    if (q.get('lang') === 'ar') { d.setAttribute('lang', 'ar'); d.setAttribute('dir', 'rtl'); }
  })();
</script>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<main class="gl-app">
  <p class="proto-badge" id="proto-badge"></p>

  <!-- Hlavička prebiehajúceho tréningu: rovnaká vo všetkých variantoch -->
  <section class="bt bt-session" aria-label="Workout header">
    <span class="tr-switch" id="plan-name"></span>
    <span class="duration-value" dir="ltr">00:24:13</span>
    <span class="bt-line" id="summary"></span>
    <div class="mini">
      <button type="button" class="mini-ghost" id="btn-open-rest"><svg class="kico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="rest-text"></span></button>
      <label class="phase-header-toggle"><input type="checkbox"><span id="warmup-text"></span></label>
      <label class="phase-header-toggle"><input type="checkbox"><span id="stretch-text"></span></label>
      <button type="button" class="mini-ghost sess-more" id="btn-more"><svg class="kico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
  </section>

  <!-- Kontext cviku: rovnaký vo všetkých variantoch -->
  <section class="exercise" aria-label="Exercise context">
    <div class="ex-head"><b id="ex-name"></b><span class="meta" id="ex-meta"></span></div>
    <div class="sets" aria-hidden="true"><span class="sq done">1</span><span class="sq now">2</span><span class="sq">3</span><span class="sq">4</span></div>
  </section>

  <p class="cap" id="caption"></p>
</main>
<noscript><p style="padding:16px">This prototype needs JavaScript.</p></noscript>
<script src="launcher.js"></script>
</body>
</html>
