<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GymLift · Workout design choices</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="concept-page">
  <header class="preview-tools">
    <div class="preview-label"><span id="preview-label"></span><a id="theme-link"></a></div>
    <nav id="concept-links" aria-label="Design choices"></nav>
  </header>
  <main class="preview-main" id="preview"></main>
  <nav class="preview-bottom" aria-label="Preview navigation"></nav>
  <dialog id="practice-sheet" class="practice-sheet">
    <header><div><small id="sheet-caption"></small><h2 id="sheet-title"></h2></div><button type="button" id="close-sheet" aria-label="Close">×</button></header>
    <div id="sheet-body"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
