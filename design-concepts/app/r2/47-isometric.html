<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>47 · Isometric — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #DCEBFF, #F2F7FF); color: #24324A; font: 15px/1.4 Fredoka, system-ui, sans-serif;
    --k-acc: #4C7BD9; --k-font: Fredoka, sans-serif; --k-radius: 16px; --k-card: #EAF1FC; --k-line: #D3E0F3; --k-good: #5DBB7A; --k-bad: #F6D0C8; }
  main { flex: 1; overflow-y: auto; padding: 44px 14px 18px; }
  h1 { font: 700 26px/1.1 Fredoka; margin: 0 0 4px; } .sub { color: #5F6F8C; margin: 0 0 6px; }
  .room { margin: 0 -14px; }
  .room svg { width: 100%; display: block; }
  .eq { cursor: pointer; } .eq:hover { filter: brightness(1.08); }
  .card { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 6px 0 #D3E0F3; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; background: #4C7BD9; color: #fff; font: 600 16px Fredoka; padding: 12px 18px; cursor: pointer; box-shadow: 0 5px 0 #2F57A8; }
  .btn.full { width: 100%; } .btn.lt { background: #EAF1FC; color: #24324A; box-shadow: 0 5px 0 #C9D7EE; } .btn.or { background: #F59E5B; box-shadow: 0 5px 0 #C9733A; }
  .cube { width: 50px; height: 76px; border: 0; background: none; cursor: pointer; padding: 0; position: relative; font: 600 12px Fredoka; color: #24324A; }
  .cube svg { position: absolute; left: 0; top: 0; width: 50px; height: 50px; }
  .cube span { position: relative; display: block; padding-top: 52px; line-height: 1.05; } .cube small { display: block; font-size: 9px; }
  .cubes { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: #4C7BD9; font: 600 13px Fredoka; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 2px dashed #E3EBF7; background: none; padding: 10px 0; font: 500 16px Fredoka; cursor: pointer; color: #24324A; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #5F6F8C; }
  nav { display: flex; background: #fff; padding: 6px 6px 24px; box-shadow: 0 -4px 0 #D3E0F3; }
  nav button { flex: 1; border: 0; background: none; color: #8A98B3; font: 600 12px Fredoka; cursor: pointer; padding: 8px 0; border-radius: 12px; }
  nav button.is-active { color: #fff; background: #4C7BD9; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="gym"></section><section data-screen="train" hidden></section><section data-screen="stats" hidden></section><section data-screen="town" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <nav><button data-tab="gym">My gym</button><button data-tab="train">Train</button><button data-tab="stats">Stats</button><button data-tab="town">Town</button><button data-tab="settings">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  /* isometric helpers: x right-down, y left-down, z up. origin at (195, 70) */
  const P = (x, y, z) => [195 + (x - y) * 22, 70 + (x + y) * 12.7 - z * 25];
  const pt = (a) => a.map((q) => q.join(',')).join(' ');
  function box(x, y, z, w, d, h, c) { // c = [top, left, right]
    const t = [P(x, y, z + h), P(x + w, y, z + h), P(x + w, y + d, z + h), P(x, y + d, z + h)];
    const l = [P(x, y + d, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x, y + d, z + h)];
    const r = [P(x + w, y, z), P(x + w, y + d, z), P(x + w, y + d, z + h), P(x + w, y, z + h)];
    return '<polygon points="' + pt(l) + '" fill="' + c[1] + '"/><polygon points="' + pt(r) + '" fill="' + c[2] + '"/><polygon points="' + pt(t) + '" fill="' + c[0] + '"/>';
  }
  function room() {
    const used = new Set(G.state.history.flatMap((w) => w.exercises.map((x) => x.id)));
    const has = (re) => [...used].some((id) => re.test(id));
    let s = '<svg viewBox="0 0 390 300">';
    s += '<polygon points="' + pt([P(0, 0, 0), P(7, 0, 0), P(7, 7, 0), P(0, 7, 0)]) + '" fill="#F4E1C1"/>';
    s += '<polygon points="' + pt([P(0, 0, 0), P(0, 7, 0), P(0, 7, 3.2), P(0, 0, 3.2)]) + '" fill="#8FB1E3"/><polygon points="' + pt([P(0, 0, 0), P(7, 0, 0), P(7, 0, 3.2), P(0, 0, 3.2)]) + '" fill="#A9C4EC"/>';
    for (let k = 1; k < 7; k++) s += '<line x1="' + P(k, 0, 0)[0] + '" y1="' + P(k, 0, 0)[1] + '" x2="' + P(k, 7, 0)[0] + '" y2="' + P(k, 7, 0)[1] + '" stroke="#E7CFA6"/>';
    const W = ['#C98B4E', '#A56B36', '#B87C42'], M = ['#5E6B82', '#3F4A5E', '#4D596F'], R = ['#E06B5A', '#B44E40', '#C95C4C'];
    if (has(/squat|bench|press|row|deadlift/)) s += '<g class="eq" data-open="library">' + box(0.4, 1, 0, 0.2, 0.2, 2.2, M) + box(0.4, 2.6, 0, 0.2, 0.2, 2.2, M) + box(0.2, 0.9, 1.6, 0.1, 2.1, 0.1, ['#9AA6BA', '#7C889C', '#8A96AA']) + '</g>';
    if (has(/bench/)) s += '<g class="eq" data-open="exercise" data-arg="bench-press">' + box(2.2, 1.2, 0, 1.6, 0.6, 0.6, W) + '</g>';
    if (has(/curl|dumbbell|raise/)) s += '<g class="eq" data-open="library">' + box(5.6, 0.4, 0, 1.2, 0.4, 1, M) + box(5.7, 0.45, 1, 0.2, 0.3, 0.2, R) + box(6.1, 0.45, 1, 0.2, 0.3, 0.2, R) + box(6.45, 0.45, 1, 0.2, 0.3, 0.2, R) + '</g>';
    if (has(/pull|chin|dips/)) s += '<g class="eq" data-open="exercise" data-arg="pull-ups">' + box(4, 0.2, 0, 0.15, 0.15, 3, M) + box(5, 0.2, 0, 0.15, 0.15, 3, M) + box(4, 0.2, 2.9, 1.15, 0.15, 0.12, M) + '</g>';
    if (has(/leg-press|leg-curl|calf|cable/)) s += '<g class="eq" data-open="library">' + box(4.6, 4.2, 0, 1.6, 1, 1.2, ['#7BA7E0', '#4C7BD9', '#6390DD']) + '</g>';
    s += box(1.4, 5, 0, 2.6, 1.3, 0.08, ['#7FCB9A', '#5DBB7A', '#6CC388']);
    // character
    const [cx, cy] = P(2.7, 5.6, 0.1);
    s += '<g><ellipse cx="' + cx + '" cy="' + (cy + 2) + '" rx="10" ry="4" fill="rgba(0,0,0,.15)"/><rect x="' + (cx - 6) + '" y="' + (cy - 34) + '" width="12" height="22" rx="5" fill="#4C7BD9"/><circle cx="' + cx + '" cy="' + (cy - 42) + '" r="8" fill="#F2C29B"/><rect x="' + (cx - 5) + '" y="' + (cy - 13) + '" width="4" height="13" fill="#24324A"/><rect x="' + (cx + 1) + '" y="' + (cy - 13) + '" width="4" height="13" fill="#24324A"/></g>';
    return s + '</svg>';
  }
  const cube = (on, label, small, attrs) => '<button class="cube' + (on ? ' on' : '') + '" ' + attrs + '><svg viewBox="0 0 50 50"><polygon points="25,4 46,15 25,26 4,15" fill="' + (on ? '#7FCB9A' : '#FFFFFF') + '" stroke="#24324A" stroke-width="1.5"/><polygon points="4,15 25,26 25,48 4,37" fill="' + (on ? '#5DBB7A' : '#E3EBF7') + '" stroke="#24324A" stroke-width="1.5"/><polygon points="46,15 25,26 25,48 46,37" fill="' + (on ? '#6CC388' : '#CBD8EE') + '" stroke="#24324A" stroke-width="1.5"/></svg><span>' + label + '<small>' + small + '</small></span></button>';
  function gym() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<h1>Your gym, level ' + X.level + '</h1><p class="sub">Equipment appears as you use it. Tap a machine to read about it.</p><div class="room">' + room() + '</div>'
      + '<div class="card"><b>Week ' + w.num + ': ' + w.done + ' of ' + w.goal + ' workouts.</b> ' + G.streak() + '-week streak. ' + G.motivation() + '</div>'
      + (s ? '<button class="btn full" data-tab="train">Back to ' + e(s.planName) + ', <span data-live="elapsed"></span></button>' : rec ? '<button class="btn full" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + ' ✦</button>' : '')
      + '<div style="height:12px"></div><div class="card lst">' + li('XP', X.total, 'data-open="achievements"') + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Go outside: run, walk, ride', '', 'data-open="activity"') + li('Calendar', '', 'data-open="calendar"') + '</div>';
  }
  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Rooms</h1><p class="sub">Each plan is a room in your gym.</p><div class="card lst">' + G.plans().map((p) => li((p === sel ? '🏠 ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' stations', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="card"><b style="font-size:18px">' + e(sel.name) + '</b>' + sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between"><span>' + e(x.name) + '</span><span>' + x.sets + '×' + x.reps + '</span></div>').join('') + '<div style="height:12px"></div><button class="btn" data-do="start" data-arg="' + sel.id + '">Start</button> <button class="btn lt" data-open="editplan" data-arg="' + sel.id + '">Edit</button></div>' : '')
        + '<div class="card lst">' + li('Rearrange rooms', '', 'data-open="plans"') + li('Build a new room', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Equipment catalogue', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<h1 data-live="elapsed"></h1><p class="sub">' + e(s.planName) + ', ' + p.done + ' of ' + p.total + ' blocks placed. Rest <span data-live="rest" data-idle="off" data-done="over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card"' + (i === s.cur ? ' style="box-shadow:0 6px 0 #4C7BD9"' : '') + '><b style="font-size:17px">' + e(x.name) + '</b><div class="sub" style="margin:0">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="cubes">'
          + x.sets.map((st, j) => x.unilateral ? cube(st.L, 'L', G.fmtW(st.w), 'data-do="set" data-arg="' + i + ':' + j + ':L"') + cube(st.R, 'R', '×' + st.r, 'data-do="set" data-arg="' + i + ':' + j + ':R"') : cube(st.done, st.r, G.fmtW(st.w), 'data-do="set" data-arg="' + i + ':' + j + '"')).join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ block</button><button data-open="replace" data-arg="' + i + '">Swap</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="btn full" data-do="finish">Finish, +' + p.xp + ' XP</button><div style="height:10px"></div><button class="btn lt" data-open="rest">Rest timer</button> <button class="btn or" data-do="discard">Discard</button>';
  }
  function stats() {
    const t = G.totals();
    return '<h1>Stats</h1><div class="card" style="color:#4C7BD9"><b style="color:#24324A">Sets per week</b>' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 90, labels: G.weeklySeries(8).map((x) => x.label) }) + '</div>'
      + '<div class="card lst">' + li('This week', t.week.workouts, 'data-open="history"') + li('This month', t.month.workouts, 'data-open="history"') + li('All time', t.all.workouts, 'data-open="history"') + '</div>'
      + '<div class="card lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="card lst">' + li('Records', '', 'data-open="records"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function town() {
    const L = G.leaderboard();
    return '<h1>Town square</h1><div class="card lst">' + li('Top 20 gyms this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Neighbours', '', 'data-open="friends"') + li('Post on the board', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() { return '<h1>Settings</h1><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { gym, train, stats, town, settings }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=train]').click(); } } });
})();
</script>
</body>
</html>
