<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>06 · Bento Forest dark — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="../r2/kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #E9E8E4; color: #121212; font: 15px/1.35 'Space Grotesk', system-ui, sans-serif;
    --k-acc: #121212; --k-font: 'Space Grotesk', system-ui, sans-serif; --k-card: #F2F1ED; --k-line: #E0DED8; --k-radius: 22px; }
  main { flex: 1; overflow-y: auto; padding: 50px 12px 110px; }
  .hd { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px 12px; }
  .hd h1 { margin: 0; font-size: 30px; letter-spacing: -1px; }
  .hd small { color: #6E6C66; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 84px; gap: 8px; }
  .t { position: relative; border-radius: 22px; padding: 14px; background: #fff; overflow: hidden; border: 0; text-align: start; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; }
  .w2 { grid-column: span 2; } .w4 { grid-column: span 4; } .h2 { grid-row: span 2; } .h3 { grid-row: span 3; }
  .t .l { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
  .t .v { font-size: 34px; font-weight: 700; letter-spacing: -1.5px; line-height: 1; margin-top: auto; }
  .t .v small { font-size: 14px; letter-spacing: 0; font-weight: 500; opacity: .7; }
  .dark { background: #121212; color: #F4F3EF; }
  .lime { background: #D6F35A; } .lav { background: #CFC8FF; } .peach { background: #FFC9A8; } .sky { background: #BFE3F2; } .sand { background: #EFE3C8; }
  .t img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38; }
  .t > * { position: relative; }
  .startb { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: #D6F35A; color: #121212; border: 0; border-radius: 999px; padding: 11px 18px; font: 700 16px 'Space Grotesk', sans-serif; cursor: pointer; }
  .dots7 { display: flex; gap: 5px; margin-top: 8px; }
  .dots7 i { flex: 1; height: 26px; border-radius: 8px; background: rgba(0,0,0,.1); }
  .dots7 i.d { background: #121212; } .dots7 i.n { box-shadow: inset 0 0 0 2px #121212; }
  .t .kico { width: 20px; height: 20px; }
  .t .corner { position: absolute; top: 12px; right: 12px; opacity: .6; }
  .avs { display: flex; margin-top: auto; } .avs .k-av { --s: 32px; margin-right: -8px; border: 2px solid #CFC8FF; }
  .spark { margin-top: auto; height: 36px; } .spark .k-chart { margin: 0; height: 36px; color: #121212; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: auto; }
  .sq { height: 52px; border-radius: 14px; border: 2px solid rgba(0,0,0,.15); background: rgba(255,255,255,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 14px 'Space Grotesk', sans-serif; cursor: pointer; color: inherit; padding: 0; }
  .sq small { font-size: 10px; font-weight: 500; opacity: .7; }
  .sq.on { background: #121212; color: #D6F35A; border-color: #121212; }
  .sq.half { border-color: #121212; }
  .mini { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .mini button { border: 0; background: rgba(0,0,0,.08); border-radius: 999px; padding: 6px 10px; font: 600 12px 'Space Grotesk', sans-serif; cursor: pointer; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
  .mini .kico { width: 14px; height: 14px; }
  .tline { font-size: 12px; opacity: .7; }
  .feed .k-post { border: 0; padding: 0; } .feed .k-post-img { max-height: 160px; }
  nav { position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; display: flex; gap: 4px; background: #121212; padding: 6px; border-radius: 999px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  nav button { border: 0; background: none; color: #9C9A94; width: 52px; height: 44px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
  nav button.is-active { background: #D6F35A; color: #121212; }
  .restpill { position: absolute; left: 12px; right: 12px; bottom: 92px; z-index: 5; background: #D6F35A; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.18); }
  .restpill b { font-size: 26px; flex: 1; font-variant-numeric: tabular-nums; }
  .restpill button { border: 0; background: #121212; color: #fff; border-radius: 999px; padding: 8px 12px; font: 600 13px 'Space Grotesk', sans-serif; cursor: pointer; }

  /* ---- r6 colourway: dark ---- */
  body.concept { background: #050906; }
  .app { background: #0A110D; color: #E6EFE3;
    --k-bg: #131D17; --k-fg: #E6EFE3; --k-mute: #93A699; --k-card: #0A110D; --k-line: #22322A;
    --k-acc: #A6E35A; --k-acc-fg: #0E1A0B; color-scheme: dark; }
  .hd small, .tline { color: #93A699; opacity: 1; }
  .t { background: #131D17; color: #E6EFE3; box-shadow: inset 0 0 0 1px #22322A; }
  .dark { background: #050906; color: #E6EFE3; box-shadow: inset 0 0 0 1px #22322A; }
  .dark .tline { color: #E6EFE3; opacity: .75; }
  .lime { background: #2E4A17; } .lav { background: #1E3B2C; } .peach { background: #4A4016; } .sky { background: #1D3A33; } .sand { background: #1A2620; }
  .lime, .lav, .peach, .sky, .sand { color: #E6EFE3; box-shadow: none; }
  .lime .tline, .lav .tline, .peach .tline, .sky .tline, .sand .tline { color: #E6EFE3; opacity: .75; }
  .startb { background: #A6E35A; color: #0E1A0B; }
  .dots7 i { background: rgba(255,255,255,.14); } .dots7 i.d { background: currentColor; } .dots7 i.n { box-shadow: inset 0 0 0 2px currentColor; }
  .avs .k-av { border-color: #1E3B2C; }
  .sq { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
  .sq.on { background: #A6E35A; color: #0E1A0B; border-color: #A6E35A; } .sq.half { border-color: currentColor; }
  .mini button { background: rgba(255,255,255,.14); }
  .mini button[data-do="start"] { background: #A6E35A !important; color: #0E1A0B !important; }
  .mini button[data-do="finish"] { background: #A6E35A !important; color: #0E1A0B !important; }
  .k-bar { background: rgba(255,255,255,.14) !important; } .k-bar i { background: currentColor !important; }
  nav { background: #1C1E22; box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 1px #22322A; }
  nav button { color: #93A699; } nav button.is-active { background: #A6E35A; color: #0E1A0B; }
  .restpill { background: #A6E35A; color: #0E1A0B; } .restpill button { background: #000; color: #E6EFE3; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="home"></section><section data-screen="train" hidden></section><section data-screen="stats" hidden></section><section data-screen="social" hidden></section><section data-screen="me" hidden></section>
  </main>
  <div id="rp"></div>
  <nav><button data-tab="home" aria-label="Home"></button><button data-tab="train" aria-label="Train"></button><button data-tab="stats" aria-label="Stats"></button><button data-tab="social" aria-label="Social"></button><button data-tab="me" aria-label="You"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="../r2/lib.js"></script><script src="../r2/core.js"></script><script src="../r2/kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const ic = { home: 'grid', train: 'dumbbell', stats: 'chart', social: 'users', me: 'user' };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(ic[b.dataset.tab]); });
  const T = (cls, inner, attrs) => '<button class="t ' + cls + '" ' + (attrs || '') + '>' + inner + '</button>';
  const D = (cls, inner) => '<div class="t ' + cls + '" style="cursor:default">' + inner + '</div>';

  function home() {
    const w = G.weekInfo(), rec = G.recommended(), X = G.xp(), s = G.sess(), bw = G.bodySeries('weight'), top = G.records().list[0], f = G.foodDay();
    return '<div class="hd"><div><small>' + G.fmtDate(G.today()) + ' · week ' + w.num + '</small><h1>Hi, ' + e(G.state.profile.name) + '</h1></div></div><div class="grid">'
      + (s ? D('dark w4 h2', '<span class="l">In progress · <span data-live="elapsed"></span></span><b style="font-size:28px;margin-top:6px">' + e(s.planName) + '</b><span class="tline">' + G.progress().done + ' / ' + G.progress().total + ' sets</span><button class="startb" data-tab="train">Continue ' + I('chevron') + '</button>')
        : rec ? D('dark w4 h2', (G.img(rec.exercises[0] && rec.exercises[0].id) ? '<img class="bg" src="' + G.img(rec.exercises[0].id) + '" alt="">' : '') + '<span class="l">Next up ✦</span><b style="font-size:30px;margin-top:6px">' + e(rec.name) + '</b><span class="tline">' + rec.exercises.length + ' exercises · about ' + G.planMinutes(rec) + ' min</span><button class="startb" data-do="start" data-arg="' + rec.id + '">' + I('play') + ' Start</button>') : '')
      + T('lime w2 h2', '<span class="l">This week</span><span class="v">' + w.done + '<small> / ' + w.goal + '</small></span><div class="dots7">' + w.days.map((d) => '<i class="' + (d.done ? 'd' : d.today ? 'n' : '') + '"></i>').join('') + '</div>', 'data-open="calendar"')
      + T('w2', '<span class="l">Streak</span><span class="v">' + G.streak() + '<small> weeks</small></span>', 'data-open="achievements"')
      + T('w2', '<span class="l">' + (w.excused ? 'Excused ✓' : 'Busy week?') + '</span><span class="tline" style="margin-top:auto">' + (w.excused ? 'Tap to undo' : 'Excuse it, keep the streak') + '</span>', 'data-do="excuse"')
      + T('lav w2 h2', '<span class="l">Level ' + X.level + '</span><span class="v">' + X.total + '<small> XP</small></span><div class="k-bar" style="background:rgba(0,0,0,.1)"><i style="width:' + X.pct + '%;background:#121212"></i></div><span class="tline" style="margin-top:6px">' + (X.need - X.into) + ' XP to level ' + (X.level + 1) + '</span>', 'data-open="achievements"')
      + T('sky w2', '<span class="l">Body</span><span class="v" style="font-size:24px">' + (bw.length ? bw[bw.length - 1].v : '—') + '<small> kg</small></span>', 'data-open="body"')
      + T('w2', '<span class="l">Best lift</span><span class="v" style="font-size:22px">' + (top ? G.fmtW(top.kg) : '—') + '</span><span class="tline">' + (top ? e(top.name) : '') + '</span>', 'data-open="records"')
      + T('peach w2', '<span class="l">Food today</span><span class="v" style="font-size:24px">' + f.kcal + '<small> kcal</small></span>', 'data-open="food"')
      + T('sand', I('timer') + '<span class="tline" style="margin-top:auto">Rest</span>', 'data-open="rest"')
      + T('', I('run') + '<span class="tline" style="margin-top:auto">Activity</span>', 'data-open="activity"')
      + T('lav w2', '<span class="l">Friends</span><div class="avs">' + G.state.community.friends.slice(0, 5).map((k) => K.avatar(k)).join('') + '</div>', 'data-open="chats"')
      + T('', I('camera') + '<span class="tline" style="margin-top:auto">Photos</span>', 'data-open="photos"')
      + T('dark', I('settings') + '<span class="tline" style="margin-top:auto">Settings</span>', 'data-open="settings"')
      + '</div>';
  }

  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected(), rec = G.recommended(), cols = ['lime', 'lav', 'peach', 'sky', 'sand'];
      return '<div class="hd"><h1>Train</h1><small>tap a plan</small></div><div class="grid">'
        + G.plans().map((p, k) => T((p === sel ? 'dark' : cols[k % 5]) + ' w2 h2', '<span class="l">' + (p === rec ? 'Next ✦' : 'Plan ' + (k + 1)) + '</span><b style="font-size:22px;margin-top:4px">' + e(p.name) + '</b><span class="tline" style="margin-top:auto">' + p.exercises.length + ' exercises · ' + G.planMinutes(p) + ' min</span>', 'data-do="select" data-arg="' + p.id + '"')).join('')
        + (sel ? D('w4 h3', '<span class="l">' + e(sel.name) + '</span>' + sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px"><span>' + e(x.name) + '</span><b>' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</b></div>').join('') + '<div class="mini" style="margin-top:auto"><button data-do="start" data-arg="' + sel.id + '" style="background:#121212;color:#D6F35A">' + I('play') + ' Start</button><button data-open="editplan" data-arg="' + sel.id + '">' + I('edit') + ' Edit</button></div>') : '')
        + T('w2', I('list') + '<span class="tline" style="margin-top:auto">Manage plans</span>', 'data-open="plans"') + T('w2', I('plus') + '<span class="tline" style="margin-top:auto">New plan</span>', 'data-open="newplan"')
        + T('w2 lime', I('book') + '<span class="tline" style="margin-top:auto">Exercise library</span>', 'data-open="library"') + T('w2', I('grid') + '<span class="tline" style="margin-top:auto">Full Body builder</span>', 'data-open="fullbody"')
        + '</div>';
    }
    const p = G.progress();
    return '<div class="grid">' + D('dark w4 h2', '<span class="l">' + e(s.planName) + '</span><span class="v" data-live="elapsed"></span><div class="mini"><button data-open="rest" style="background:rgba(255,255,255,.12)">' + I('timer') + ' Rest</button><button data-do="finish" style="background:#D6F35A;color:#121212">Finish · +' + p.xp + ' XP</button><button data-do="discard" style="background:rgba(255,255,255,.12)">Discard</button></div>')
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps); const done = x.sets.every((y) => y.done);
        return D((done ? 'lime ' : i === s.cur ? 'lav ' : '') + 'w4 h2', '<span class="l">' + (x.replaces ? 'Replaces ' + e(x.replaces) : c.text) + '</span><b style="font-size:20px">' + e(x.name) + (x.unilateral ? ' <small style="font-weight:500">L / R</small>' : '') + '</b>'
          + '<div class="sets">' + x.sets.map((st, j) => x.unilateral
            ? '<button class="sq' + (st.done ? ' on' : st.L || st.R ? ' half' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':' + (st.L ? 'R' : 'L') + '">' + (st.L ? 'R' : 'L') + '<small>' + G.fmtW(st.w, true) + '</small></button>'
            : '<button class="sq' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w, true) + (st.planFail ? ' F' : '') + '</small></button>').join('') + '</div>'
          + '<div class="mini">' + x.sets.map((st, j) => '<button data-open="set" data-arg="' + i + ':' + j + '">S' + (j + 1) + ' ' + G.fmtW(st.w) + '</button>').slice(0, 2).join('') + '<button data-do="addset" data-arg="' + i + '">' + I('plus') + '</button><button data-open="replace" data-arg="' + i + '">' + I('swap') + '</button><button data-open="exercise" data-arg="' + x.id + '">' + I('info') + '</button></div>'); }).join('') + '</div>';
  }

  function stats() {
    const t = G.totals(), ser = G.weeklySeries(8), rec = G.records().list.slice(0, 3);
    return '<div class="hd"><h1>Stats</h1></div><div class="grid">'
      + [['Week', t.week, 'lime'], ['Month', t.month, ''], ['All', t.all, 'lav']].map(([l, x, c], k) => T(c + (k === 2 ? ' w4' : ' w2'), '<span class="l">' + l + '</span><span class="v">' + x.workouts + '<small> workouts · ' + x.sets + ' sets</small></span>', 'data-open="history"')).join('')
      + D('w4 h2', '<span class="l">Sets per week</span>' + K.bars(ser.map((x) => x.sets), { h: 96, labels: ser.map((x) => x.label) }))
      + T('dark w2 h2', '<span class="l">Records</span>' + rec.map((r) => '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span>' + e(r.name) + '</span><b>' + G.fmtW(r.kg, true) + '</b></div>').join(''), 'data-open="records"')
      + T('peach w2 h2', '<span class="l">Achievements</span><span class="v">' + G.achievements().filter((a) => a.got && a.category !== 'milestone').length + '</span><span class="tline">unlocked</span>', 'data-open="achievements"')
      + T('w2', I('calendar') + '<span class="tline" style="margin-top:auto">Calendar</span>', 'data-open="calendar"') + T('w2', I('clock') + '<span class="tline" style="margin-top:auto">History</span>', 'data-open="history"')
      + G.history().slice(0, 4).map((w) => T('w2', '<span class="l">' + G.fmtShort(w.date) + '</span><b>' + e(w.planName) + '</b><span class="tline">' + w.minutes + ' min · +' + w.xp + ' XP</span>', 'data-open="workout" data-arg="' + w.id + '"')).join('')
      + T('sky w2', I('scale') + '<span class="tline" style="margin-top:auto">Body</span>', 'data-open="body"') + T('w2', I('camera') + '<span class="tline" style="margin-top:auto">Photos</span>', 'data-open="photos"')
      + '</div>';
  }

  function social() {
    const L = G.leaderboard();
    return '<div class="hd"><h1>Social</h1></div><div class="grid">'
      + T('dark w2 h2', '<span class="l">Top 20</span><span class="v">#' + (L.me ? L.me.rank : '–') + '</span><span class="tline">this week</span>', 'data-open="leaderboard"')
      + T('lime w2', I('edit') + '<span class="tline" style="margin-top:auto">New post</span>', 'data-open="post"')
      + T('lav w2', I('chat') + '<span class="tline" style="margin-top:auto">Messages' + (G.chats().some((c) => c.unread) ? ' •' : '') + '</span>', 'data-open="chats"')
      + T('w4', I('users') + '<span class="tline" style="margin-top:auto">Friends · ' + G.state.community.friends.length + (G.state.community.requests.length ? ' · ' + G.state.community.requests.length + ' request' : '') + '</span>', 'data-open="friends"')
      + G.feed().map((p) => '<div class="t w4 feed" style="grid-row:span ' + (p.img || p.photo ? 5 : 3) + '" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('') + '</div>';
  }
  function me() {
    const X = G.xp();
    return '<div class="hd"><h1>You</h1></div><div class="grid">' + D('lav w4 h2', '<div style="display:flex;gap:12px;align-items:center">' + K.avatar('me', 56) + '<div><b style="font-size:22px">' + e(G.state.profile.name) + '</b><div class="tline">@' + e(G.state.profile.handle) + ' · level ' + X.level + '</div></div></div><span class="tline" style="margin-top:auto">' + e(G.state.profile.bio) + '</span>')
      + T('w2', I('user') + '<span class="tline" style="margin-top:auto">Community profile</span>', 'data-open="profile"') + T('lime w2', I('target') + '<span class="tline" style="margin-top:auto">Goal: ' + G.goal() + ' a week</span>', 'data-open="settings"')
      + T('dark w4', I('settings') + '<span class="tline" style="margin-top:auto">Settings · language, units, sound, backup</span>', 'data-open="settings"') + '</div>';
  }

  K.app({ root: document.getElementById('app'), screens: { home, train, stats, social, me },
    actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=train]').click(); } },
    chrome: () => { const r = G.rest(); document.getElementById('rp').innerHTML = r ? '<div class="restpill">' + I('timer') + '<b data-live="rest" data-done="Rest over"></b><button data-do="restadd" data-arg="15">+15</button><button data-do="reststop">' + (r.done ? 'OK' : 'Stop') + '</button></div>' : ''; } });
})();
</script>
</body>
</html>
