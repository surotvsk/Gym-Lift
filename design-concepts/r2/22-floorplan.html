<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>22 · Floorplan — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #ECEAE4; color: #22252A; font: 14px/1.4 'Work Sans', system-ui, sans-serif;
    --k-acc: #E4572E; --k-font: 'Work Sans', sans-serif; --k-radius: 12px; --k-card: #F4F2EC; --k-line: #DAD7CE; }
  main { flex: 1; overflow-y: auto; padding: 46px 14px 18px; }
  h1 { margin: 0 0 2px; font: 800 26px 'Work Sans'; } .sub { color: #6E6A60; margin: 0 0 10px; }
  .map { background: #F7F6F1; border-radius: 16px; border: 1px solid #DAD7CE; padding: 6px; margin-bottom: 12px; }
  .map svg { width: 100%; height: auto; display: block; }
  .stn { cursor: pointer; }
  .stn rect { fill: #fff; stroke: #22252A; stroke-width: 1.5; }
  .stn.on rect { fill: #E4572E; } .stn.on text { fill: #fff; }
  .stn.done rect { fill: #3C8D6E; } .stn.done text { fill: #fff; }
  .stn.cur rect { stroke: #E4572E; stroke-width: 3; }
  .stn text { font: 600 9px 'Work Sans'; fill: #22252A; }
  .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .lbl { font: 600 11px 'Work Sans'; letter-spacing: .1em; text-transform: uppercase; color: #8C877B; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; background: #E4572E; color: #fff; font: 600 15px 'Work Sans'; padding: 12px 16px; cursor: pointer; }
  .btn.full { width: 100%; margin-top: 10px; } .btn.gh { background: #F1EEE6; color: #22252A; }
  .sets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .s { border: 1.5px solid #DAD7CE; background: #fff; border-radius: 10px; padding: 8px 4px; font: 800 16px 'Work Sans'; cursor: pointer; color: #22252A; }
  .s small { display: block; font: 400 11px 'Work Sans'; color: #8C877B; } .s.on { background: #3C8D6E; border-color: #3C8D6E; color: #fff; } .s.on small { color: #D4F0E5; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; } .tools button { border: 0; background: none; color: #E4572E; font: 600 13px 'Work Sans'; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; border-bottom: 1px solid #ECEAE4; background: none; padding: 11px 0; font: 600 15px 'Work Sans'; cursor: pointer; color: #22252A; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #8C877B; font-weight: 400; }
  .row { display: flex; gap: 8px; align-items: center; } .grow { flex: 1; min-width: 0; }
  nav { display: flex; background: #22252A; padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #9A9890; font: 600 11px 'Work Sans'; cursor: pointer; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button.is-active { color: #FF8A65; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="lobby"></section><section data-screen="floor" hidden></section><section data-screen="log" hidden></section><section data-screen="crew" hidden></section><section data-screen="desk" hidden></section>
  </main>
  <nav><button data-tab="lobby"></button><button data-tab="floor"></button><button data-tab="log"></button><button data-tab="crew"></button><button data-tab="desk"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const N = { lobby: ['home', 'Lobby'], floor: ['pin', 'Floor'], log: ['chart', 'Log'], crew: ['users', 'Crew'], desk: ['settings', 'Desk'] };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(N[b.dataset.tab][0]) + N[b.dataset.tab][1]; });
  // stations of the gym floor (x, y, w, h)
  const ST = { rack: [18, 20, 74, 46, 'Squat rack'], bench: [110, 20, 74, 46, 'Bench'], bar: [202, 20, 70, 46, 'Pull-up bar'], cable: [290, 20, 72, 46, 'Cables'], db: [18, 150, 90, 40, 'Dumbbells'], machine: [130, 140, 110, 54, 'Machines'], mat: [262, 140, 100, 54, 'Mat area'], door: [160, 236, 50, 16, 'Entrance'] };
  const stationOf = (id) => { const l = G.LIBMAP[id]; if (!l) return 'mat'; const q = l.equipment; if (/leg-press|leg-curls|leg-extension|hack|pec-deck|machine|adductor|abductor|calf/.test(id)) return 'machine'; if (q.includes('cableMachine')) return 'cable'; if (q.includes('bench') && q.includes('barbell')) return 'bench'; if (q.includes('barbell')) return 'rack'; if (q.includes('pullupBar')) return 'bar'; if (q.includes('dumbbells') || q.includes('bench')) return 'db'; return 'mat'; };
  const ctr = (k) => [ST[k][0] + ST[k][2] / 2, ST[k][1] + ST[k][3] / 2];
  function map(list, cur) { // list: [{id, done}]
    const used = {}; list.forEach((x, i) => { const k = stationOf(x.id); used[k] = used[k] || { done: true, idx: [] }; used[k].idx.push(i); if (!x.done) used[k].done = false; });
    const pts = [ctr('door')].concat(list.map((x) => ctr(stationOf(x.id))));
    return '<div class="map"><svg viewBox="0 0 380 260"><rect x="4" y="4" width="372" height="252" rx="10" fill="none" stroke="#B9B5AA" stroke-width="2"/>'
      + '<polyline points="' + pts.map((p) => p.join(',')).join(' ') + '" fill="none" stroke="#E4572E" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>'
      + Object.keys(ST).map((k) => { const [x, y, w, h, n] = ST[k]; const u = used[k]; const cls = k === 'door' ? '' : u ? (u.done ? 'done' : u.idx.includes(cur) ? 'on cur' : 'on') : '';
          return '<g class="stn ' + cls + '"' + (u ? ' data-do="cur" data-arg="' + u.idx.find((q) => !list[q].done) + '"' : '') + '><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"/><text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 3) + '" text-anchor="middle">' + n + (u ? ' · ' + u.idx.map((q) => q + 1).join(',') : '') + '</text></g>'; }).join('') + '</svg></div>';
  }
  const li = (a, b, attrs) => '<button ' + attrs + '><span>' + a + '</span><small>' + (b == null ? '›' : b) + '</small></button>';
  function lobby() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess();
    return '<h1>Welcome back</h1><p class="sub">' + G.fmtDate(G.today()) + ' · week ' + w.num + ' · ' + w.done + '/' + w.goal + ' done · ' + G.streak() + '-week streak</p>'
      + (rec && !s ? '<div class="lbl">Today’s route: ' + e(rec.name) + ' ✦</div>' + map(rec.exercises.map((x) => ({ id: x.id, done: false })), -1) + '<button class="btn full" data-do="start" data-arg="' + rec.id + '">' + I('play') + ' Walk the route</button>' : s ? '<div class="lbl">In progress: ' + e(s.planName) + '</div>' + map(s.exercises.map((x) => ({ id: x.id, done: x.sets.every((y) => y.done) })), s.cur) + '<button class="btn full" data-tab="floor">Continue · <span data-live="elapsed"></span></button>' : '')
      + '<div class="card lst" style="margin-top:12px">' + li('This week', w.done + ' of ' + w.goal, 'data-open="calendar"') + li(w.excused ? 'Week excused' : 'Excuse this week', w.excused ? 'undo' : 'keeps your streak', 'data-do="excuse"') + li('Rest timer', null, 'data-open="rest"') + li('Run, walk, ride', null, 'data-open="activity"') + li('Level ' + G.xp().level, G.xp().total + ' XP', 'data-open="achievements"') + '</div>';
  }
  function floor() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Plans</h1><div class="card lst">' + G.plans().map((p) => li((p === sel ? '● ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? map(sel.exercises.map((x) => ({ id: x.id, done: false })), -1) + '<div class="row"><button class="btn grow" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button><button class="btn gh" data-open="editplan" data-arg="' + sel.id + '">Edit</button></div>' : '')
        + '<div class="card lst" style="margin-top:12px">' + li('Reorder plans', null, 'data-open="plans"') + li('New plan', null, 'data-open="newplan"') + li('Full Body builder', null, 'data-open="fullbody"') + li('Exercise library', 'by station', 'data-open="library"') + '</div>';
    }
    const i = s.cur, x = s.exercises[i], c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), p = G.progress();
    return '<div class="row"><h1 class="grow" data-live="elapsed"></h1><button class="btn" data-do="finish">Finish</button></div><p class="sub">' + e(s.planName) + ' · ' + p.done + '/' + p.total + ' sets · rest <span data-live="rest" data-idle="—" data-done="over"></span></p>'
      + map(s.exercises.map((y) => ({ id: y.id, done: y.sets.every((z) => z.done) })), i)
      + '<div class="card"><div class="lbl">Station: ' + ST[stationOf(x.id)][4] + ' · ' + (i + 1) + ' of ' + s.exercises.length + '</div><div class="row"><b class="grow" style="font-size:20px">' + e(x.name) + '</b>' + (G.img(x.id) ? '<img src="' + G.img(x.id) + '" alt="" style="width:50px;height:50px;border-radius:10px;object-fit:cover">' : '') + '</div><div style="color:#8C877B">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</div><div class="sets">'
      + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + (st.planFail ? ' · F' : '') + '</small></button>').join('') + '</div>'
      + '<div class="tools"><button data-open="set" data-arg="' + i + ':' + Math.max(0, x.sets.findIndex((y) => !y.done)) + '">Weight & reps</button><button data-do="addset" data-arg="' + i + '">+ Set</button><button data-open="replace" data-arg="' + i + '">Station busy? Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button></div>'
      + '<div class="row" style="margin-top:10px"><button class="btn gh grow" data-do="prev">' + I('back') + ' Prev station</button><button class="btn gh grow" data-do="next">Next station ' + I('chevron') + '</button></div></div>'
      + '<button class="btn full" data-do="finish">Head to the exit · +' + p.xp + ' XP</button><div class="card lst" style="margin-top:12px">' + li('Rest timer', null, 'data-open="rest"') + li('Discard workout', null, 'data-do="discard"') + '</div>';
  }
  function log() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<h1>Log</h1><p class="sub">' + t.all.workouts + ' visits · ' + t.all.sets + ' sets · ' + t.all.minutes + ' min on the floor</p><div class="card"><div class="lbl">Sets per week</div><div style="color:#E4572E">' + K.bars(ser.map((x) => x.sets), { h: 100, labels: ser.map((x) => x.label) }) + '</div></div>'
      + '<div class="card lst">' + G.history().slice(0, 4).map((w) => li(e(w.planName), G.fmtShort(w.date) + ' · ' + w.minutes + ' min', 'data-open="workout" data-arg="' + w.id + '"')).join('') + li('All visits', null, 'data-open="history"') + li('Calendar', null, 'data-open="calendar"') + li('Records', null, 'data-open="records"') + li('Achievements', null, 'data-open="achievements"') + li('Body', null, 'data-open="body"') + li('Food', null, 'data-open="food"') + li('Photos', null, 'data-open="photos"') + '</div>';
  }
  function crew() {
    const L = G.leaderboard();
    return '<h1>On the floor</h1><div class="card lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', null, 'data-open="chats"') + li('Friends', null, 'data-open="friends"') + li('New post', null, 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function desk() { return '<h1>Front desk</h1><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile & reminders', null, 'data-open="profile"') + li('Settings', null, 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { lobby, floor, log, crew, desk }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=floor]').click(); } } });
})();
</script>
</body>
</html>
