<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>54 · Telemetry — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #15171A; color: #fff; font: 14px/1.35 'Titillium Web', system-ui, sans-serif;
    --pb: #B14AED; --gr: #2BD46B; --ye: #F5D90A;
    --k-bg: #1C1F23; --k-fg: #fff; --k-mute: #9BA1A8; --k-card: #24282D; --k-line: #33383F; --k-acc: #E10600; --k-acc-fg: #fff; --k-font: 'Titillium Web', sans-serif; --k-radius: 4px; --k-good: #1F6B3A; --k-bad: #3A2424; }
  main { flex: 1; overflow-y: auto; padding: 44px 0 16px; }
  .pad { padding: 0 12px; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 0 12px 8px; }
  .hd b { font: 900 italic 22px 'Titillium Web'; flex: 1; text-transform: uppercase; }
  .flag { width: 30px; height: 20px; background: conic-gradient(#fff 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0 / 10px 10px; }
  .tower { border-top: 3px solid #E10600; }
  .tr { display: grid; grid-template-columns: 30px 6px 1fr auto auto; gap: 8px; align-items: center; padding: 7px 12px; border-bottom: 1px solid #24282D; cursor: pointer; background: none; width: 100%; border-left: 0; border-right: 0; border-top: 0; color: #fff; font: inherit; text-align: left; }
  .tr:nth-child(odd) { background: #1A1D21; }
  .tr .pos { font: 700 16px 'Titillium Web'; text-align: center; }
  .tr .tm { width: 4px; height: 20px; }
  .tr .gap { color: #9BA1A8; font: 600 13px 'Titillium Web'; font-variant-numeric: tabular-nums; }
  .tr .tyre { width: 18px; height: 18px; border-radius: 50%; border: 3px solid currentColor; font: 700 9px/12px 'Titillium Web'; text-align: center; }
  .tr.me { background: #2A2E34; }
  .sect { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 8px 0; }
  .sect i { height: 26px; background: #2A2E34; display: grid; place-items: center; font: 700 11px 'Titillium Web'; font-style: normal; color: #15171A; }
  .sect i.g { background: var(--gr); } .sect i.p { background: var(--pb); color: #fff; } .sect i.y { background: var(--ye); } .sect i.n { background: #2A2E34; color: #9BA1A8; box-shadow: inset 0 0 0 2px #fff; }
  .big { font: 900 italic 48px/1 'Titillium Web'; font-variant-numeric: tabular-nums; }
  .lbl { font: 600 11px 'Titillium Web'; color: #9BA1A8; text-transform: uppercase; letter-spacing: .1em; }
  .go { display: block; width: 100%; border: 0; background: #E10600; color: #fff; font: 900 italic 18px 'Titillium Web'; text-transform: uppercase; padding: 13px; cursor: pointer; margin: 8px 0; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .go.dk { background: #2A2E34; }
  .lap { display: grid; grid-template-columns: 54px 1fr; gap: 0 8px; padding: 8px 12px; border-bottom: 1px solid #24282D; }
  .lap.cur { background: #22262B; box-shadow: inset 4px 0 0 #E10600; }
  .lap h3 { margin: 0; font: 700 16px 'Titillium Web'; grid-column: 1 / -1; }
  .lap .info { grid-column: 1 / -1; font-size: 12px; color: #9BA1A8; }
  .secs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .sc { min-width: 62px; border: 0; padding: 6px 6px; font: 700 14px 'Titillium Web'; cursor: pointer; background: #2A2E34; color: #fff; text-align: left; font-variant-numeric: tabular-nums; }
  .sc small { display: block; font: 400 10px 'Titillium Web'; color: #9BA1A8; }
  .sc.on { background: var(--gr); color: #15171A; } .sc.on small { color: #15171A; }
  .sc.on.pb { background: var(--pb); color: #fff; } .sc.on.pb small { color: #eee; }
  .tools { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: var(--ye); font: 600 12px 'Titillium Web'; cursor: pointer; padding: 2px 0; text-transform: uppercase; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #24282D; background: none; padding: 10px 12px; font: 600 15px 'Titillium Web'; cursor: pointer; color: #fff; text-align: left; }
  .lst small { color: #9BA1A8; }
  nav { display: flex; background: #0E1012; padding: 6px 4px 24px; border-top: 2px solid #E10600; }
  nav button { flex: 1; border: 0; background: none; color: #9BA1A8; font: 700 12px 'Titillium Web'; text-transform: uppercase; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: #fff; box-shadow: inset 0 3px 0 #E10600; }
  .post { cursor: pointer; padding: 8px 12px; border-bottom: 1px solid #24282D; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #1C1F23; color: #fff; border-color: #33383F; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="weekend"></section><section data-screen="race" hidden></section><section data-screen="data" hidden></section><section data-screen="paddock" hidden></section><section data-screen="garage" hidden></section>
  </main>
  <nav><button data-tab="weekend">Weekend</button><button data-tab="race">Race</button><button data-tab="data">Data</button><button data-tab="paddock">Paddock</button><button data-tab="garage">Garage</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  const TEAM = ['#E10600', '#00D2BE', '#FF8700', '#0600EF', '#006F62', '#DC0000', '#2B4562'];
  function weekend() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), L = G.leaderboard();
    const sect = '<div class="sect">' + w.days.map((d) => '<i class="' + (d.done ? (d.done > 1 ? 'p' : 'g') : d.today ? 'n' : d.future ? '' : 'y') + '">' + d.d.slice(0, 2) + '</i>').join('') + '</div>';
    return '<div class="hd"><span class="flag"></span><b>Round ' + w.num + '</b><span class="lbl">' + G.fmtShort(G.today()) + '</span></div>'
      + '<div class="pad"><div class="lbl">Sectors this week (green done, yellow missed, purple double)</div>' + sect
      + '<div style="display:flex;gap:16px"><div><div class="lbl">Laps</div><div class="big">' + w.done + '/' + w.goal + '</div></div><div><div class="lbl">Streak</div><div class="big">' + G.streak() + '</div></div><div><div class="lbl">Level</div><div class="big">' + G.xp().level + '</div></div></div>'
      + (s ? '<button class="go" data-tab="race">Back on track, <span data-live="elapsed"></span></button>' : rec ? '<button class="go" data-do="start" data-arg="' + rec.id + '">Lights out: ' + e(rec.name) + '</button>' : '') + '</div>'
      + '<div class="lbl pad" style="margin-top:10px">Championship, top 8</div><div class="tower">' + L.top.slice(0, 8).map((r, k) => '<button class="tr' + (r.me ? ' me' : '') + '" data-open="leaderboard"><span class="pos">' + r.rank + '</span><span class="tm" style="background:' + TEAM[k % 7] + '"></span><span>' + e(r.person.name.toUpperCase().slice(0, 3)) + ' <span style="color:#9BA1A8">' + e(r.person.name) + '</span></span><span class="gap">' + (k ? '+' + (L.top[0].xp - r.xp) : r.xp + ' XP') + '</span><span class="tyre" style="color:' + ['#E10600', '#F5D90A', '#fff'][k % 3] + '">' + 'SMH'[k % 3] + '</span></button>').join('') + '</div>'
      + '<div class="lst">' + li(w.excused ? 'Red flag: week excused' : 'Red flag: excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Pit timer', 'rest', 'data-open="rest"') + li('Cool-down lap: run, walk, ride', '', 'data-open="activity"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', G.xp().total + ' XP', 'data-open="achievements"') + '</div>';
  }
  function race() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="hd"><b>Choose a circuit</b></div><div class="lst">' + G.plans().map((p) => li((p === sel ? '▶ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' corners, ' + G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="pad"><button class="go" data-do="start" data-arg="' + sel.id + '">Lights out: ' + e(sel.name) + '</button><button class="go dk" data-open="editplan" data-arg="' + sel.id + '">Setup sheet (edit)</button></div>' : '')
        + '<div class="lst">' + li('Calendar order (rotation)', '', 'data-open="plans"') + li('New circuit', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Technical guide (library)', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress(), bests = Object.fromEntries(G.records().list.map((r) => [r.id, r.kg]));
    return '<div class="hd"><b>' + e(s.planName) + '</b><span class="lbl">Lap ' + (s.cur + 1) + '/' + s.exercises.length + '</span></div><div class="pad" style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="lbl">Race time</div><div class="big" data-live="elapsed"></div></div><div style="text-align:right"><div class="lbl">Pit window</div><div class="big" style="font-size:30px;color:var(--ye)" data-live="rest" data-idle="—" data-done="GO"></div></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), best = bests[x.id] || 0;
        return '<div class="lap' + (i === s.cur ? ' cur' : '') + '"><h3>' + e(x.name) + '</h3><div class="info">' + (x.replaces ? 'Swapped for ' + e(x.replaces) : c.text) + (best ? ', personal best ' + G.fmtW(best) : '') + '</div><div class="secs">'
          + x.sets.map((st, j) => { const pb = st.w > best && best > 0; return x.unilateral ? '<button class="sc' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L"><small>S' + (j + 1) + ' left</small>' + G.fmtW(st.w) + '</button><button class="sc' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R"><small>S' + (j + 1) + ' right</small>× ' + st.r + '</button>' : '<button class="sc' + (st.done ? ' on' : '') + (pb ? ' pb' : '') + '" data-do="set" data-arg="' + i + ':' + j + '"><small>Sector ' + (j + 1) + (pb ? ', PB' : '') + '</small>' + G.fmtW(st.w) + ' × ' + st.r + '</button>'; }).join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Adjust load</button><button data-do="addset" data-arg="' + i + '">+ sector</button><button data-open="replace" data-arg="' + i + '">Swap</button><button data-open="exercise" data-arg="' + x.id + '">Onboard</button><button data-do="rest" data-arg="90">Pit 90 s</button></div></div>'; }).join('')
      + '<div class="pad"><button class="go" data-do="finish">Chequered flag, +' + p.xp + ' XP</button><button class="go dk" data-open="rest">Pit timer</button><button class="go dk" data-do="discard">Retire (discard)</button></div>';
  }
  function data() {
    const t = G.totals();
    return '<div class="hd"><b>Telemetry</b></div><div class="pad"><div class="lbl">Sets per week</div><div style="color:#2BD46B">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90 }) + '</div><div style="display:flex;gap:16px;margin:8px 0"><div><div class="lbl">Week</div><div class="big" style="font-size:32px">' + t.week.workouts + '</div></div><div><div class="lbl">Month</div><div class="big" style="font-size:32px">' + t.month.workouts + '</div></div><div><div class="lbl">Career</div><div class="big" style="font-size:32px">' + t.all.workouts + '</div></div></div></div>'
      + '<div class="lbl pad">Fastest laps (records)</div><div class="tower">' + G.records().list.slice(0, 5).map((r, k) => '<button class="tr" data-open="exercise" data-arg="' + r.id + '"><span class="pos">' + (k + 1) + '</span><span class="tm" style="background:#B14AED"></span><span>' + e(r.name) + '</span><span class="gap">' + G.fmtW(r.kg) + '</span><span></span></button>').join('') + '</div>'
      + '<div class="lst">' + li('All records', '', 'data-open="records"') + li('Race history', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Trophies', '', 'data-open="achievements"') + li('Driver weight (body)', '', 'data-open="body"') + li('Fuel (food)', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function paddock() {
    return '<div class="hd"><b>Paddock</b></div><div class="lst">' + li('Championship', 'top 20', 'data-open="leaderboard"') + li('Team radio', 'messages', 'data-open="chats"') + li('Teammates', '', 'data-open="friends"') + li('Press release', 'new post', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function garage() { return '<div class="hd"><b>Garage</b></div><div class="lst">' + li('Weekly goal', G.goal() + ' laps', 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { weekend, race, data, paddock, garage }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=race]').click(); } } });
})();
</script>
</body>
</html>
