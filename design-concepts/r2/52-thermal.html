<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>52 · Thermal — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0B0F3A; color: #F2EEFF; font: 14px/1.4 'Chakra Petch', system-ui, sans-serif;
    --k-bg: #121750; --k-fg: #F2EEFF; --k-mute: #A9A4D6; --k-card: #1B2066; --k-line: #2C3283; --k-acc: #FF6F00; --k-acc-fg: #0B0F3A; --k-font: 'Chakra Petch', sans-serif; --k-radius: 6px; --k-good: #C2185B; --k-bad: #1B2066; }
  main { flex: 1; overflow-y: auto; padding: 44px 14px 16px; }
  h1 { font: 700 24px/1.1 'Chakra Petch'; margin: 0 0 4px; }
  .mute { color: #A9A4D6; }
  .body { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .body svg { width: 46%; height: auto; }
  .m { cursor: pointer; }
  .scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #A9A4D6; margin: 4px 0 10px; }
  .scale i { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #0B0F3A, #3B1FA3, #C2185B, #FF6F00, #FFE57F, #FFFFFF); border: 1px solid #2C3283; }
  .rd { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .rd button { border: 1px solid #2C3283; background: #121750; border-radius: 6px; padding: 8px; color: inherit; text-align: left; font: inherit; cursor: pointer; }
  .rd b { display: block; font: 700 24px 'Chakra Petch'; }
  .btn { display: block; width: 100%; border: 0; border-radius: 6px; background: linear-gradient(90deg, #C2185B, #FF6F00, #FFE57F); color: #0B0F3A; font: 700 17px 'Chakra Petch'; padding: 13px; cursor: pointer; margin: 6px 0; }
  .btn.o { background: none; color: #F2EEFF; box-shadow: inset 0 0 0 1px #2C3283; }
  .card { background: #121750; border: 1px solid #2C3283; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .s { width: 52px; height: 52px; border-radius: 8px; border: 1px solid #2C3283; background: #0B0F3A; color: #F2EEFF; font: 700 15px 'Chakra Petch'; cursor: pointer; line-height: 1; }
  .s small { display: block; font-size: 9px; font-weight: 400; color: #A9A4D6; }
  .s.on { background: radial-gradient(circle, #FFFFFF 0%, #FFE57F 30%, #FF6F00 60%, #C2185B 100%); color: #0B0F3A; border-color: #FF6F00; } .s.on small { color: #3B1F00; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: #FFB04C; font: 600 12px 'Chakra Petch'; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #2C3283; background: none; padding: 10px 0; font: 600 15px 'Chakra Petch'; cursor: pointer; color: #F2EEFF; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #A9A4D6; font-weight: 400; }
  nav { display: flex; background: #070A28; padding: 6px 4px 24px; border-top: 1px solid #2C3283; }
  nav button { flex: 1; border: 0; background: none; color: #6E69A8; font: 600 12px 'Chakra Petch'; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: #FFE57F; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #0B0F3A; color: #F2EEFF; border-color: #2C3283; } .post .k-post-img { filter: grayscale(1) sepia(1) hue-rotate(250deg) saturate(3); }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="scan"></section><section data-screen="heat" hidden></section><section data-screen="history" hidden></section><section data-screen="crew" hidden></section><section data-screen="cal" hidden></section>
  </main>
  <nav><button data-tab="scan">Scan</button><button data-tab="heat">Train</button><button data-tab="history">History</button><button data-tab="crew">Crew</button><button data-tab="cal">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const STOPS = [[0, [11, 15, 58]], [.25, [59, 31, 163]], [.5, [194, 24, 91]], [.72, [255, 111, 0]], [.88, [255, 229, 127]], [1, [255, 255, 255]]];
  function heat(t) { t = Math.max(0, Math.min(1, t)); for (let k = 1; k < STOPS.length; k++) { const [a, ca] = STOPS[k - 1], [b, cb] = STOPS[k]; if (t <= b) { const f = (t - a) / (b - a); return 'rgb(' + ca.map((v, q) => Math.round(v + (cb[q] - v) * f)).join(',') + ')'; } } return '#fff'; }
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  function figure(front, ms) {
    const mx = Math.max(12, ...Object.values(ms)); const c = (m) => heat((ms[m] || 0) / mx);
    const part = (m, d) => '<path class="m" d="' + d + '" fill="' + c(m) + '" stroke="#0B0F3A" stroke-width="1.5" data-open="library" aria-label="' + G.MUSCLE_LABEL[m] + '"/>';
    const base = '<circle cx="60" cy="20" r="14" fill="' + heat(.2) + '"/><rect x="52" y="32" width="16" height="8" fill="' + heat(.2) + '"/>';
    return '<svg viewBox="0 0 120 250" role="img" aria-label="' + (front ? 'front' : 'back') + ' heat map">' + base
      + (front ? part('shoulders', 'M30 42 q-10 4 -10 20 l12 4 q2-14 10-22z M90 42 q10 4 10 20 l-12 4 q-2-14 -10-22z') + part('chest', 'M40 42 h40 q4 14 0 30 h-40 q-4 -16 0 -30z') + part('arms', 'M20 66 l12 2 l-4 50 l-11 -2z M100 66 l-12 2 l4 50 l11 -2z') + part('core', 'M42 74 h36 l-2 48 h-32z') + part('legs', 'M44 124 h15 l-2 110 h-13z M61 124 h15 l-1 110 h-13z')
        : part('shoulders', 'M30 42 q-10 4 -10 20 l12 4 q2-14 10-22z M90 42 q10 4 10 20 l-12 4 q-2-14 -10-22z') + part('back', 'M40 42 h40 q6 30 -2 70 h-36 q-8 -40 -2 -70z') + part('arms', 'M20 66 l12 2 l-4 50 l-11 -2z M100 66 l-12 2 l4 50 l11 -2z') + part('glutes', 'M42 114 h36 q4 14 0 22 h-36 q-4 -8 0 -22z') + part('legs', 'M44 138 h15 l-2 96 h-13z M61 138 h15 l-1 96 h-13z'))
      + '</svg>';
  }
  function scan() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), ms = G.muscleSets(7), X = G.xp();
    const cold = G.MUSCLES.filter((m) => (ms[m] || 0) < 3).map((m) => G.MUSCLE_LABEL[m].toLowerCase());
    return '<h1>Heat this week</h1><div class="mute">Colour shows how many sets each muscle got in the last 7 days. Tap a muscle to find exercises for it.</div>'
      + '<div class="body">' + figure(true, ms) + figure(false, ms) + '</div><div class="scale">0 sets<i></i>' + Math.max(12, ...Object.values(ms)) + '+</div>'
      + (cold.length ? '<div class="card">Coldest right now: <b>' + cold.join(', ') + '</b>.</div>' : '')
      + '<div class="rd"><button data-open="calendar"><span class="mute">Week</span><b>' + w.done + '/' + w.goal + '</b></button><button data-open="achievements"><span class="mute">Streak</span><b>' + G.streak() + 'w</b></button><button data-open="achievements"><span class="mute">Level</span><b>' + X.level + '</b></button></div>'
      + (s ? '<button class="btn" data-tab="heat">Back to ' + e(s.planName) + ', <span data-live="elapsed"></span></button>' : rec ? '<button class="btn" data-do="start" data-arg="' + rec.id + '">Heat up: start ' + e(rec.name) + '</button>' : '')
      + '<div class="card lst">' + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Run, walk, ride', '', 'data-open="activity"') + '</div><p class="mute">' + G.motivation() + '</p>';
  }
  function heatTab() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Plans</h1><div class="card lst">' + G.plans().map((p) => li((p === sel ? '● ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.map((x) => G.MUSCLE_LABEL[(G.LIBMAP[x.id] || {}).primary] || '').filter((v, k, a) => v && a.indexOf(v) === k).join(', '), 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<button class="btn" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button><button class="btn o" data-open="editplan" data-arg="' + sel.id + '">Edit ' + e(sel.name) + '</button>' : '')
        + '<div class="card lst">' + li('Reorder plans', '', 'data-open="plans"') + li('New plan', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<h1 data-live="elapsed"></h1><div class="mute">' + e(s.planName) + ', ' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="off" data-done="over"></span>.</div><div style="height:8px"></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), frac = x.sets.filter((y) => y.done).length / x.sets.length;
        return '<div class="card" style="border-color:' + heat(.25 + frac * .7) + '"><b style="font-size:16px">' + e(x.name) + '</b> <span class="mute">' + G.MUSCLE_LABEL[(G.LIBMAP[x.id] || {}).primary] + '</span><div class="mute" style="font-size:12px">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>×' + st.r + '</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="btn" data-do="finish">Finish, +' + p.xp + ' XP</button><button class="btn o" data-open="rest">Rest timer</button><button class="btn o" data-do="discard">Discard</button>';
  }
  function history() {
    const t = G.totals(), ms = G.muscleSets(28);
    return '<h1>Four weeks</h1><div class="body">' + figure(true, ms) + figure(false, ms) + '</div><div class="scale">fewer<i></i>more sets</div>'
      + '<div class="card lst">' + li('This month', t.month.workouts + ' workouts', 'data-open="history"') + li('All time', t.all.workouts + ' workouts', 'data-open="history"') + G.records().list.slice(0, 3).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="card lst">' + li('Records', '', 'data-open="records"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function crew() {
    const L = G.leaderboard();
    return '<h1>Crew</h1><div class="card lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('New post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function cal() { return '<h1>Settings</h1><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { scan, heat: heatTab, history, crew, cal }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=heat]').click(); } } });
})();
</script>
</body>
</html>
