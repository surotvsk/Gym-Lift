<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>39 · Zine — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Courier+Prime:wght@400;700&family=Anton&family=Abril+Fatface&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F7F7F2; color: #111; font: 15px/1.4 'Courier Prime', 'Courier New', monospace;
    background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1.4px); background-size: 3px 3px;
    --hl: #FFF04D; --tape: rgba(233,217,176,.85);
    --k-acc: #111; --k-font: 'Courier Prime', monospace; --k-head: 'Permanent Marker', cursive; --k-radius: 0px; --k-card: #EFEFE8; --k-line: #BDBDB5; --k-good: #333; --k-bad: #E6E6DE; }
  main { flex: 1; overflow-y: auto; padding: 46px 14px 18px; }
  .ransom { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 12px; }
  .ransom span { display: inline-block; padding: 2px 5px; font-size: 30px; line-height: 1; box-shadow: 1px 2px 2px rgba(0,0,0,.2); }
  .ransom span:nth-child(5n+1) { font-family: Anton; background: #111; color: #fff; transform: rotate(-4deg); }
  .ransom span:nth-child(5n+2) { font-family: 'Abril Fatface'; background: var(--hl); transform: rotate(3deg); }
  .ransom span:nth-child(5n+3) { font-family: 'Courier Prime'; font-weight: 700; background: #fff; border: 1px solid #111; transform: rotate(-2deg); }
  .ransom span:nth-child(5n+4) { font-family: 'Permanent Marker'; background: #F2B8C6; transform: rotate(5deg); }
  .ransom span:nth-child(5n) { font-family: Anton; background: #fff; transform: rotate(-1deg); }
  .ransom .sp { width: 8px; background: none !important; box-shadow: none; }
  .strip { position: relative; background: #fff; padding: 14px 12px; margin: 16px 2px; box-shadow: 2px 3px 0 rgba(0,0,0,.18); border: 1px solid #ddd; }
  .strip.r1 { transform: rotate(-1.2deg); } .strip.r2 { transform: rotate(1deg); }
  .strip::before { content: ''; position: absolute; top: -10px; left: 30%; width: 80px; height: 22px; background: var(--tape); transform: rotate(-3deg); }
  .mk { font: 400 22px/1.15 'Permanent Marker', cursive; }
  .hl { background: linear-gradient(transparent 45%, var(--hl) 45%, var(--hl) 90%, transparent 90%); }
  .big { font: 400 70px/1 Anton, sans-serif; }
  .arrow { font: 400 18px 'Permanent Marker'; color: #C21E56; }
  .go { display: inline-block; border: 2px solid #111; background: var(--hl); font: 400 20px 'Permanent Marker'; padding: 8px 16px; cursor: pointer; color: #111; transform: rotate(-1deg); box-shadow: 3px 3px 0 #111; }
  .go.w { background: #fff; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px dashed #111; background: none; padding: 10px 0; font: 700 15px 'Courier Prime'; cursor: pointer; color: #111; text-align: left; }
  .lst button:last-child { border: 0; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .s { border: 2px solid #111; background: #fff; font: 700 14px 'Courier Prime'; padding: 6px 8px; cursor: pointer; color: #111; position: relative; }
  .s.on { background: #fff; }
  .s.on::after { content: '✗'; position: absolute; inset: -6px 0 0 0; font: 400 36px/1 'Permanent Marker'; color: #C21E56; text-align: center; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; font: 400 15px 'Permanent Marker'; cursor: pointer; padding: 2px 0; color: #1F3F8F; }
  nav { display: flex; background: #111; padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #DADAD2; font: 400 14px 'Permanent Marker'; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: #111; background: var(--hl); transform: rotate(-2deg); }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-post-img { filter: grayscale(1) contrast(1.4); }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="cover"></section><section data-screen="pages" hidden></section><section data-screen="back" hidden></section><section data-screen="mail" hidden></section><section data-screen="small" hidden></section>
  </main>
  <nav><button data-tab="cover">Cover</button><button data-tab="pages">Train</button><button data-tab="back">Back issues</button><button data-tab="mail">Mail</button><button data-tab="small">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const ransom = (t) => '<div class="ransom" aria-label="' + e(t) + '">' + [...t].map((c) => c === ' ' ? '<span class="sp"></span>' : '<span aria-hidden="true">' + e(c) + '</span>').join('') + '</div>';
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><span>' + (s || '') + '</span></button>';
  function cover() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="mk">issue #' + w.num + '</div>' + ransom(s ? s.planName.toUpperCase() : rec ? rec.name.toUpperCase() + ' NEXT' : 'LIFT')
      + '<div class="strip r1"><div class="big">' + w.done + '/' + w.goal + '</div><div class="mk"><span class="hl">workouts this week</span></div><p>' + G.motivation() + '</p><div class="arrow">↳ ' + G.streak() + ' weeks in a row, don’t break it</div></div>'
      + (s ? '<div class="strip r2"><p class="mk"><span data-live="elapsed"></span> into ' + e(s.planName) + '</p><button class="go" data-tab="pages">get back in there</button></div>'
        : rec ? '<div class="strip r2"><p class="mk" style="margin:0 0 6px">tonight: ' + e(rec.name) + '</p><p style="margin:0 0 10px">' + rec.exercises.map((x) => e(x.name)).join(' / ') + '</p><button class="go" data-do="start" data-arg="' + rec.id + '">start ' + e(rec.name).toLowerCase() + '</button></div>' : '')
      + '<div class="strip"><div class="lst">' + li('level ' + X.level, X.total + ' XP', 'data-open="achievements"') + li(w.excused ? 'week excused (undo)' : 'excuse this week', '', 'data-do="excuse"') + li('rest timer', '', 'data-open="rest"') + li('run / walk / ride', '', 'data-open="activity"') + li('calendar', '', 'data-open="calendar"') + '</div></div>';
  }
  function pages() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return ransom('PLANS') + '<div class="strip r1"><div class="lst">' + G.plans().map((p) => li((p === sel ? '★ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div></div>'
        + (sel ? '<div class="strip r2"><p class="mk" style="margin:0 0 6px"><span class="hl">' + e(sel.name) + '</span></p>' + sel.exercises.map((x) => '<div>' + e(x.name) + ' ...... ' + x.sets + 'x' + x.reps + ' ' + G.fmtW(x.weight) + '</div>').join('') + '<div style="height:10px"></div><button class="go" data-do="start" data-arg="' + sel.id + '">start</button> <button class="go w" data-open="editplan" data-arg="' + sel.id + '">edit</button></div>' : '')
        + '<div class="strip"><div class="lst">' + li('reorder plans', '', 'data-open="plans"') + li('new plan', '', 'data-open="newplan"') + li('full body builder', '', 'data-open="fullbody"') + li('exercise library', '48', 'data-open="library"') + '</div></div>';
    }
    const p = G.progress();
    return ransom(s.planName.toUpperCase()) + '<div class="mk"><span data-live="elapsed"></span> in, ' + p.done + '/' + p.total + ' sets, rest <span data-live="rest" data-idle="off" data-done="over"></span></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="strip ' + (i % 2 ? 'r2' : 'r1') + '"><p class="mk" style="margin:0">' + (i === s.cur ? '<span class="hl">' + e(x.name) + '</span>' : e(x.name)) + '</p><div class="arrow">↳ ' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text.toLowerCase()) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L ' + G.fmtW(st.w) + '</button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R x' + st.r + '</button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' x' + st.r + '</button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">weight?</button><button data-do="addset" data-arg="' + i + '">+1 set</button><button data-open="replace" data-arg="' + i + '">swap it</button><button data-open="exercise" data-arg="' + x.id + '">how</button><button data-do="rest" data-arg="90">rest 90</button></div></div>'; }).join('')
      + '<button class="go" data-do="finish">done! +' + p.xp + ' XP</button> <button class="go w" data-open="rest">rest timer</button> <button class="go w" data-do="discard">bin it</button>';
  }
  function back() {
    const t = G.totals();
    return ransom('BACK ISSUES') + '<div class="strip r1"><div class="big">' + t.all.workouts + '</div><div class="mk">workouts so far, ' + t.all.sets + ' sets</div>' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 80 }) + '</div>'
      + '<div class="strip r2"><p class="mk" style="margin:0 0 4px"><span class="hl">heaviest</span></p>' + G.records().list.slice(0, 4).map((r) => '<div>' + e(r.name) + ' ...... <b>' + G.fmtW(r.kg) + '</b></div>').join('') + '</div>'
      + '<div class="strip"><div class="lst">' + li('records', '', 'data-open="records"') + li('history', '', 'data-open="history"') + li('calendar', '', 'data-open="calendar"') + li('achievements', '', 'data-open="achievements"') + li('body', '', 'data-open="body"') + li('food', '', 'data-open="food"') + li('photos', '', 'data-open="photos"') + '</div></div>';
  }
  function mail() {
    const L = G.leaderboard();
    return ransom('MAIL') + '<div class="strip r1"><div class="lst">' + li('top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('messages', '', 'data-open="chats"') + li('friends', '', 'data-open="friends"') + li('send something in', '', 'data-open="post"') + '</div></div>'
      + G.feed().map((p, k) => '<div class="strip post ' + (k % 2 ? 'r2' : 'r1') + '" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function small() { return ransom('SMALL PRINT') + '<div class="strip"><div class="lst">' + li('weekly goal', G.goal(), 'data-open="settings"') + li('profile and reminders', '', 'data-open="profile"') + li('all settings', '', 'data-open="settings"') + '</div></div>'; }
  K.app({ root: document.getElementById('app'), screens: { cover, pages, back, mail, small }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=pages]').click(); } } });
})();
</script>
</body>
</html>
