<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13 · Index — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #6E5A45; background-image: radial-gradient(rgba(0,0,0,.12) 1px, transparent 1px); background-size: 4px 4px; color: #2A2622; font: 15px/1.4 'Special Elite', 'Courier New', monospace;
    --k-bg: #FBF7EC; --k-card: #F1EAD6; --k-line: #D9CFB6; --k-acc: #B23A32; --k-font: 'Special Elite', 'Courier New', monospace; --k-head: 'Special Elite', monospace; --k-radius: 3px; }
  .tabs { display: flex; gap: 3px; padding: 46px 10px 0; }
  .tabs button { flex: 1; border: 0; border-radius: 8px 8px 0 0; padding: 9px 2px 7px; font: 13px 'Special Elite', monospace; cursor: pointer; color: #2A2622; opacity: .78; transform: translateY(4px); transition: transform .15s; }
  .tabs button.is-active { opacity: 1; transform: none; }
  .tabs button:nth-child(1) { background: #F3D36B; } .tabs button:nth-child(2) { background: #E99A84; } .tabs button:nth-child(3) { background: #9CC7A4; } .tabs button:nth-child(4) { background: #93B5DA; } .tabs button:nth-child(5) { background: #C6B0DA; }
  main { flex: 1; overflow-y: auto; padding: 0 10px 22px; }
  .card { background: #FBF7EC; border-radius: 3px; box-shadow: 0 2px 0 #E7DFC9, 0 4px 0 #D9CFB6, 0 8px 18px rgba(0,0,0,.3); padding: 10px 14px 14px; margin-bottom: 16px; position: relative;
    background-image: linear-gradient(transparent 31px, #E2584C 31px, #E2584C 33px, transparent 33px), repeating-linear-gradient(transparent 0 25px, #A9C3E0 25px 26px); background-position: 0 0, 0 33px; background-repeat: no-repeat, repeat; line-height: 26px; }
  .card h2 { margin: 0 0 8px; font: 400 20px/24px 'Special Elite'; height: 26px; }
  .card .hw { font: 700 24px/26px Caveat, cursive; color: #1F3F8F; }
  .card .stamp { position: absolute; top: 4px; right: 10px; font: 12px 'Special Elite'; color: #B23A32; border: 2px solid #B23A32; padding: 0 6px; transform: rotate(4deg); line-height: 20px; }
  .ln { display: flex; justify-content: space-between; align-items: baseline; height: 26px; }
  .ln button, button.ln { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; text-align: left; }
  button.ln { width: 100%; }
  .hwbtn { border: 0; background: none; font: 700 22px Caveat; color: #B23A32; cursor: pointer; padding: 0; }
  .go { display: block; width: 100%; border: 2px solid #2A2622; background: #F3D36B; font: 17px 'Special Elite'; padding: 10px; cursor: pointer; margin-top: 6px; border-radius: 3px; box-shadow: 2px 2px 0 #2A2622; color: #2A2622; }
  .tk { display: inline-flex; gap: 6px; }
  .tk button { width: 30px; height: 22px; border: 1.5px solid #2A2622; background: #fff; border-radius: 2px; cursor: pointer; font: 700 18px/18px Caveat; color: #1F3F8F; padding: 0; }
  .tk button.on::after { content: '✓'; }
  .tk button.side { width: auto; padding: 0 4px; font: 12px 'Special Elite'; }
  .tk button.side.on { background: #9CC7A4; } .tk button.side.on::after { content: ''; }
  .meta { font: 12px 'Special Elite'; color: #7A6F60; }
  .up { color: #2E7D32; } .down { color: #B23A32; }
  .wk { display: flex; gap: 6px; } .wk span { width: 30px; text-align: center; font: 12px 'Special Elite'; } .wk span.d { color: #1F3F8F; font: 700 20px/26px Caveat; } .wk span.t { text-decoration: underline wavy #B23A32; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; line-height: 1.4; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="tabs"><button data-tab="today">Today</button><button data-tab="cards">Plans</button><button data-tab="file">File</button><button data-tab="pals">Pals</button><button data-tab="me">Me</button></div>
  <main data-scroll>
    <section data-screen="today"></section><section data-screen="cards" hidden></section><section data-screen="file" hidden></section><section data-screen="pals" hidden></section><section data-screen="me" hidden></section>
  </main>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const ln = (a, b, attrs) => '<button class="ln" ' + attrs + '><span>' + a + '</span><span class="meta">' + (b == null ? '›' : b) + '</span></button>';
  function today() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess();
    return '<div class="card" style="margin-top:0;border-top-left-radius:0"><span class="stamp">WEEK ' + w.num + '</span><h2>' + G.fmtDate(G.today()) + '</h2>'
      + '<div class="ln"><span>Done this week</span><span class="hw">' + w.done + ' of ' + w.goal + '</span></div><div class="ln"><span>Streak</span><span class="hw">' + G.streak() + ' weeks</span></div>'
      + '<div class="ln wk">' + w.days.map((d) => '<span class="' + (d.done ? 'd' : '') + (d.today ? ' t' : '') + '">' + (d.done ? '✓' : d.d.slice(0, 2)) + '</span>').join('') + '</div>'
      + '<div class="ln"><span class="hw" style="font-size:20px">' + G.motivation() + '</span></div>' + ln(w.excused ? 'Week excused — undo' : 'Excuse this week', '', 'data-do="excuse"') + '</div>'
      + '<div class="card"><h2>' + (s ? 'In progress' : 'Next card ✦') + '</h2><div class="ln"><span class="hw">' + e(s ? s.planName : rec ? rec.name : '') + '</span><span class="meta">' + (s ? '<span data-live="elapsed"></span>' : rec ? '~' + G.planMinutes(rec) + ' min' : '') + '</span></div>'
      + (rec && !s ? rec.exercises.slice(0, 4).map((x) => '<div class="ln"><span>' + e(x.name) + '</span><span class="meta">' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</span></div>').join('') : '')
      + (s ? '<button class="go" data-tab="cards">Back to the card</button>' : rec ? '<button class="go" data-do="start" data-arg="' + rec.id + '">Pull this card & start</button>' : '') + '</div>'
      + '<div class="card"><h2>Odds & ends</h2>' + ln('Rest timer', null, 'data-open="rest"') + ln('Activity: run, walk, ride', null, 'data-open="activity"') + ln('Calendar', null, 'data-open="calendar"') + ln('Level ' + G.xp().level, G.xp().total + ' XP', 'data-open="achievements"') + '</div>';
  }
  function cards() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="card" style="border-top-left-radius:0"><h2>Dividers</h2>' + G.plans().map((p) => ln((p === sel ? '▸ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' cards', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? sel.exercises.map((x) => '<div class="card"><h2>' + e(x.name) + '</h2><div class="ln"><span>Plan</span><span class="hw">' + x.sets + ' × ' + x.reps + ' @ ' + G.fmtW(x.weight) + '</span></div><div class="ln"><span class="meta">' + (x.unilateral ? 'one side at a time' : '') + (x.failSets.length ? ' failure on ' + x.failSets.join(', ') : '') + '</span><button class="hwbtn" data-open="exercise" data-arg="' + x.id + '">how to →</button></div></div>').join('')
          + '<div class="card"><h2>' + e(sel.name) + '</h2><button class="go" data-do="start" data-arg="' + sel.id + '">Start this stack</button>' + ln('Edit this plan', null, 'data-open="editplan" data-arg="' + sel.id + '"') + ln('Reorder dividers', null, 'data-open="plans"') + ln('New divider (plan)', null, 'data-open="newplan"') + ln('Full Body builder', null, 'data-open="fullbody"') + ln('Card library', '48', 'data-open="library"') + '</div>' : '');
    }
    const p = G.progress();
    return '<div class="card" style="border-top-left-radius:0"><span class="stamp">' + p.done + '/' + p.total + '</span><h2>' + e(s.planName) + '</h2><div class="ln"><span>Time</span><span class="hw" data-live="elapsed"></span></div><div class="ln"><span>Rest</span><span class="hw"><button class="hwbtn" data-open="rest"><span data-live="rest" data-idle="start rest" data-done="rest over"></span></button></span></div><button class="go" data-do="finish">File this workout · +' + p.xp + ' XP</button></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card"' + (i === s.cur ? ' style="transform:rotate(-0.6deg)"' : '') + '><h2>' + e(x.name) + '</h2><div class="ln"><span class="meta ' + c.kind + '">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</span><button class="hwbtn" data-open="exercise" data-arg="' + x.id + '">?</button></div>'
          + x.sets.map((st, j) => '<div class="ln"><button data-open="set" data-arg="' + i + ':' + j + '"><span class="hw" style="font-size:22px">' + G.fmtW(st.w) + ' × ' + st.r + '</span>' + (st.planFail ? ' <span class="meta">(failure)</span>' : '') + '</button><span class="tk">' + (x.unilateral ? '<button class="side' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L</button><button class="side' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R</button>' : '<button class="' + (st.done ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '" aria-label="set ' + (j + 1) + '"></button>') + '</span></div>').join('')
          + '<div class="ln"><button class="hwbtn" data-do="addset" data-arg="' + i + '">+ set</button><button class="hwbtn" data-open="replace" data-arg="' + i + '">swap card</button><button class="hwbtn" data-do="rest" data-arg="90">rest 90</button></div></div>'; }).join('')
      + '<div class="card"><h2>Done?</h2><button class="go" data-do="finish">File it</button>' + ln('Throw this card away', '', 'data-do="discard"') + '</div>';
  }
  function file() {
    const t = G.totals();
    return '<div class="card" style="border-top-left-radius:0"><h2>Totals</h2><div class="ln"><span>This week</span><span class="hw">' + t.week.workouts + ' · ' + t.week.sets + ' sets</span></div><div class="ln"><span>This month</span><span class="hw">' + t.month.workouts + ' · ' + t.month.sets + ' sets</span></div><div class="ln"><span>All time</span><span class="hw">' + t.all.workouts + ' · ' + t.all.sets + ' sets</span></div></div>'
      + '<div class="card"><h2>Best lifts</h2>' + G.records().list.slice(0, 5).map((r) => '<div class="ln"><span>' + e(r.name) + '</span><span class="hw">' + G.fmtW(r.kg) + '</span></div>').join('') + ln('All records', null, 'data-open="records"') + '</div>'
      + '<div class="card"><h2>Filed workouts</h2>' + G.history().slice(0, 5).map((w) => ln(G.fmtShort(w.date) + ' — ' + e(w.planName), w.minutes + ' min', 'data-open="workout" data-arg="' + w.id + '"')).join('') + ln('Whole file', null, 'data-open="history"') + ln('Calendar', null, 'data-open="calendar"') + '</div>'
      + '<div class="card"><h2>Other drawers</h2>' + ln('Achievements', null, 'data-open="achievements"') + ln('Body measurements', null, 'data-open="body"') + ln('Food log', null, 'data-open="food"') + ln('Progress photos', null, 'data-open="photos"') + '</div>';
  }
  function pals() {
    const L = G.leaderboard();
    return '<div class="card" style="border-top-left-radius:0"><h2>Top 20 this week</h2>' + L.top.slice(0, 4).map((r) => '<div class="ln"><span>' + r.rank + '. ' + e(r.person.name) + '</span><span class="hw">' + r.xp + '</span></div>').join('') + ln('You: #' + (L.me ? L.me.rank : '–'), 'full list', 'data-open="leaderboard"') + '</div>'
      + '<div class="card"><h2>Mail</h2>' + ln('Write a post', null, 'data-open="post"') + ln('Messages', null, 'data-open="chats"') + ln('Friends', G.state.community.friends.length, 'data-open="friends"') + '</div>'
      + G.feed().map((p) => '<div class="card post" style="line-height:1.4;background-image:none" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function me() { return '<div class="card" style="border-top-left-radius:0"><h2>' + e(G.state.profile.name) + '</h2>' + ln('Weekly goal', G.goal(), 'data-open="settings"') + ln('Profile & reminders', null, 'data-open="profile"') + ln('Settings', null, 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { today, cards, file, pals, me }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=cards]').click(); } } });
})();
</script>
</body>
</html>
