<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>45 · Origami — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #FDFDFB; color: #2E294E; font: 15px/1.45 'Zen Maru Gothic', system-ui, sans-serif;
    --red: #E94F37; --blue: #3F88C5; --yel: #F6AE2D; --ink: #2E294E;
    --k-acc: #3F88C5; --k-font: 'Zen Maru Gothic', sans-serif; --k-radius: 2px; --k-card: #F3F2EE; --k-line: #E4E2DC; --k-good: #3F88C5; --k-bad: #F7D5CE; }
  main { flex: 1; overflow-y: auto; padding: 46px 16px 18px; }
  h1 { font: 900 28px/1.1 'Zen Maru Gothic'; margin: 0 0 10px; }
  .paper { position: relative; padding: 16px; margin-bottom: 14px; background: var(--c, #fff); color: var(--fc, #2E294E); clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%); box-shadow: 0 4px 10px rgba(46,41,78,.12); }
  .paper::after { content: ''; position: absolute; top: 0; right: 0; width: 26px; height: 26px; background: linear-gradient(225deg, transparent 50%, rgba(0,0,0,.18) 50%, rgba(255,255,255,.35) 100%); }
  .paper .crease { position: absolute; inset: 0; background: linear-gradient(135deg, transparent 49.6%, rgba(255,255,255,.25) 50%, transparent 50.4%), linear-gradient(45deg, transparent 49.6%, rgba(0,0,0,.06) 50%, transparent 50.4%); pointer-events: none; }
  .crane { width: 140px; height: 110px; display: block; margin: 0 auto; }
  .big { font: 900 52px/1 'Zen Maru Gothic'; }
  .fold { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--ink); color: #fff; font: 700 16px 'Zen Maru Gothic'; padding: 12px 20px; cursor: pointer; clip-path: polygon(0 0, 100% 0, 100% 70%, 88% 100%, 0 100%); }
  .fold.lt { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .tris { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
  .tri { position: relative; width: 58px; height: 58px; border: 0; background: none; cursor: pointer; padding: 0; perspective: 300px; }
  .tri .f { position: absolute; inset: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 14px 'Zen Maru Gothic'; color: var(--ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transition: clip-path .4s ease; line-height: 1.1; }
  .tri .f small { font-size: 9px; font-weight: 400; }
  .tri .b { position: absolute; inset: 0; background: var(--c, #E94F37); clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .tri.on .f { clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .tri.on::after { content: '✓'; position: absolute; right: 6px; top: 2px; color: #fff; font: 900 18px 'Zen Maru Gothic'; }
  @media (prefers-reduced-motion: reduce) { .tri .f { transition: none; } }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: inherit; font: 700 13px 'Zen Maru Gothic'; text-decoration: underline; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px dashed rgba(46,41,78,.25); background: none; padding: 10px 0; font: 700 15px 'Zen Maru Gothic'; cursor: pointer; color: inherit; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { font-weight: 400; opacity: .75; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .two .paper { margin: 0; border: 0; text-align: left; font: inherit; cursor: pointer; }
  nav { display: flex; background: #fff; border-top: 2px solid var(--ink); padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #8B87A3; font: 700 12px 'Zen Maru Gothic'; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: #fff; background: var(--ink); clip-path: polygon(0 0, 100% 0, 100% 75%, 85% 100%, 0 100%); }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="desk"></section><section data-screen="fold" hidden></section><section data-screen="flock" hidden></section><section data-screen="friends" hidden></section><section data-screen="box" hidden></section>
  </main>
  <nav><button data-tab="desk">Today</button><button data-tab="fold">Fold</button><button data-tab="flock">Flock</button><button data-tab="friends">Friends</button><button data-tab="box">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const COL = ['#E94F37', '#3F88C5', '#F6AE2D', '#2E294E', '#5BA67A'];
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  /* the crane gains folds (polygons) with the level */
  function crane(level) {
    const polys = ['70,90 20,60 70,70', '70,90 120,60 70,70', '70,70 45,25 70,55', '70,70 95,25 70,55', '45,25 30,10 52,30', '95,25 125,15 92,32', '20,60 5,40 30,62', '120,60 135,42 112,62'];
    const n = Math.min(polys.length, 2 + Math.floor(level / 6));
    return '<svg class="crane" viewBox="0 0 140 110">' + polys.slice(0, n).map((p, k) => '<polygon points="' + p + '" fill="' + COL[k % 4] + '" opacity="' + (k % 2 ? .85 : 1) + '"/>').join('') + '</svg>';
  }
  function desk() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="paper" style="--c:#fff"><span class="crease"></span>' + crane(X.level) + '<p style="text-align:center;margin:4px 0 0">Your crane has ' + Math.min(8, 2 + Math.floor(X.level / 6)) + ' folds. Level ' + X.level + ', ' + X.total + ' XP.</p></div>'
      + '<div class="two"><button class="paper" style="--c:#E94F37;--fc:#fff" data-open="calendar"><span class="crease"></span><div class="big">' + w.done + '/' + w.goal + '</div>this week</button><button class="paper" style="--c:#3F88C5;--fc:#fff" data-open="achievements"><span class="crease"></span><div class="big">' + G.streak() + '</div>weeks in a row</button></div>'
      + (s ? '<div class="paper" style="--c:#F6AE2D"><span class="crease"></span><h1 style="margin:0">' + e(s.planName) + '</h1><p style="margin:2px 0 10px"><span data-live="elapsed"></span> folding</p><button class="fold" data-tab="fold">Keep folding</button></div>'
        : rec ? '<div class="paper" style="--c:#F6AE2D"><span class="crease"></span><h1 style="margin:0">' + e(rec.name) + '</h1><p style="margin:2px 0 10px">Next in your rotation. ' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' min.</p><button class="fold" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + '</button></div>' : '')
      + '<p>' + G.motivation() + '</p><div class="lst">' + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'keeps the streak', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Run, walk, ride', '', 'data-open="activity"') + '</div>';
  }
  function fold() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Choose a sheet</h1><div class="two">' + G.plans().map((p, k) => '<button class="paper" style="--c:' + (p === sel ? COL[3] : COL[k % 3]) + ';--fc:' + (k % 3 === 2 && p !== sel ? '#2E294E' : '#fff') + '" data-do="select" data-arg="' + p.id + '"><span class="crease"></span><b>' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</b><br><small>' + p.exercises.length + ' folds</small></button>').join('') + '</div>'
        + (sel ? '<div class="paper"><span class="crease"></span><h1 style="font-size:22px">' + e(sel.name) + '</h1>' + sel.exercises.map((x) => '<div>' + e(x.name) + ', ' + x.sets + ' × ' + x.reps + ' ' + G.fmtW(x.weight) + '</div>').join('') + '<div style="height:10px"></div><button class="fold" data-do="start" data-arg="' + sel.id + '">Start</button> <button class="fold lt" data-open="editplan" data-arg="' + sel.id + '">Edit</button></div>' : '')
        + '<div class="lst">' + li('Reorder plans', '', 'data-open="plans"') + li('New plan', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<h1 data-live="elapsed"></h1><p style="margin:-6px 0 12px">' + e(s.planName) + ', ' + p.done + ' of ' + p.total + ' sets folded. Rest <span data-live="rest" data-idle="off" data-done="over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), col = COL[i % 5];
        return '<div class="paper" style="' + (i === s.cur ? 'box-shadow:0 0 0 3px ' + col + ',0 4px 10px rgba(46,41,78,.12)' : '') + '"><span class="crease"></span><b style="font-size:18px">' + e(x.name) + '</b><div style="font-size:13px;opacity:.75">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="tris">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="tri' + (st.L ? ' on' : '') + '" style="--c:' + col + '" data-do="set" data-arg="' + i + ':' + j + ':L"><span class="b"></span><span class="f">L<small>' + G.fmtW(st.w) + '</small></span></button><button class="tri' + (st.R ? ' on' : '') + '" style="--c:' + col + '" data-do="set" data-arg="' + i + ':' + j + ':R"><span class="b"></span><span class="f">R<small>×' + st.r + '</small></span></button>' : '<button class="tri' + (st.done ? ' on' : '') + '" style="--c:' + col + '" data-do="set" data-arg="' + i + ':' + j + '"><span class="b"></span><span class="f">' + st.r + '<small>' + G.fmtW(st.w) + '</small></span></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="fold" data-do="finish">Finish, +' + p.xp + ' XP</button> <button class="fold lt" data-open="rest">Rest</button> <button class="fold lt" data-do="discard">Discard</button>';
  }
  function flock() {
    const t = G.totals();
    return '<h1>Your flock</h1><p>' + t.all.workouts + ' workouts, ' + t.all.sets + ' sets. Each one a folded crane.</p><div class="paper"><span class="crease"></span><div style="color:#3F88C5">' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 90, labels: G.weeklySeries(8).map((x) => x.label) }) + '</div></div>'
      + '<div class="paper" style="--c:#2E294E;--fc:#fff"><span class="crease"></span><div class="lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div></div>'
      + '<div class="lst">' + li('Records', '', 'data-open="records"') + li('History', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function friends() {
    const L = G.leaderboard();
    return '<h1>Friends</h1><div class="lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('New post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="paper post" data-open="postview" data-arg="' + p.id + '"><span class="crease"></span>' + K.postCard(p) + '</div>').join('');
  }
  function box() { return '<h1>Settings</h1><div class="lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { desk, fold, flock, friends, box }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=fold]').click(); } } });
})();
</script>
</body>
</html>
