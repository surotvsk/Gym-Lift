<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>59 · Arcana — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #121633; color: #F5F1E6; font: 16px/1.45 'Crimson Pro', Georgia, serif;
    background-image: radial-gradient(1px 1px at 20% 15%, #fff, transparent), radial-gradient(1px 1px at 75% 35%, #fff, transparent), radial-gradient(1px 1px at 40% 70%, #d4af6a, transparent), radial-gradient(1px 1px at 85% 85%, #fff, transparent);
    --gold: #D4AF6A; --rose: #C97B84;
    --k-bg: #181C40; --k-fg: #F5F1E6; --k-mute: #B9B3C9; --k-card: #20254F; --k-line: #343A6E; --k-acc: #D4AF6A; --k-acc-fg: #121633; --k-font: 'Crimson Pro', serif; --k-head: 'Cinzel Decorative', serif; --k-radius: 10px; --k-good: #6E5C2E; --k-bad: #3A2236; }
  main { flex: 1; overflow-y: auto; padding: 44px 16px 18px; }
  h1 { font: 700 22px/1.2 'Cinzel Decorative', serif; color: var(--gold); text-align: center; margin: 0 0 6px; }
  .mute { color: #B9B3C9; }
  .tarot { position: relative; width: 210px; margin: 10px auto 12px; aspect-ratio: 7 / 12; border-radius: 12px; background: #1B2050; border: 1.5px solid var(--gold); box-shadow: 0 0 0 5px #121633, 0 0 0 6px var(--gold), 0 18px 30px rgba(0,0,0,.5); padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; color: inherit; font: inherit; }
  .tarot .rn { font: 400 18px 'Cinzel Decorative'; color: var(--gold); }
  .tarot svg { width: 120px; height: 120px; margin: 10px 0; }
  .tarot .nm { font: 700 15px 'Cinzel Decorative'; color: var(--gold); margin-top: auto; border-top: 1px solid var(--gold); padding-top: 8px; width: 100%; }
  .flip { animation: draw .9s ease-out both; } @keyframes draw { from { transform: rotateY(90deg) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
  .read { text-align: center; font-style: italic; margin: 0 8px 14px; }
  .btn { display: block; width: 100%; border: 1px solid var(--gold); background: var(--gold); color: #121633; font: 700 15px 'Cinzel Decorative'; padding: 12px; cursor: pointer; border-radius: 30px; margin: 6px 0; }
  .btn.o { background: none; color: var(--gold); }
  .spread { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .mini { aspect-ratio: 7 / 11; border: 1px solid var(--gold); border-radius: 8px; background: #1B2050; color: var(--gold); padding: 6px; font: 700 11px 'Cinzel Decorative'; display: flex; flex-direction: column; justify-content: space-between; text-align: center; cursor: pointer; }
  .mini.sel { background: #2A2F66; box-shadow: 0 0 0 2px var(--gold); }
  .mini small { font: italic 12px 'Crimson Pro'; color: #B9B3C9; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #2B3060; background: none; padding: 10px 0; font: 400 17px 'Crimson Pro'; cursor: pointer; color: #F5F1E6; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: var(--gold); font-style: italic; }
  .ex { border: 1px solid #343A6E; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .ex.cur { border-color: var(--gold); }
  .ex b { font: 700 14px 'Cinzel Decorative'; color: var(--gold); }
  .stars { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .st { width: 54px; height: 54px; border: 0; background: none; cursor: pointer; position: relative; padding: 0; color: #F5F1E6; font: 600 13px 'Crimson Pro'; line-height: 1; }
  .st svg { position: absolute; inset: 0; } .st span { position: relative; display: block; padding-top: 18px; } .st small { display: block; font-size: 10px; }
  .st.on span { color: #121633; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: var(--rose); font: italic 400 15px 'Crimson Pro'; cursor: pointer; padding: 2px 0; }
  nav { display: flex; background: #0C0F26; border-top: 1px solid var(--gold); padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #8A85A6; font: 400 13px 'Cinzel Decorative'; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: var(--gold); }
  .post { cursor: pointer; border-bottom: 1px solid #2B3060; padding: 8px 0; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #181C40; color: #F5F1E6; border-color: #343A6E; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="draw"></section><section data-screen="rite" hidden></section><section data-screen="book" hidden></section><section data-screen="circle" hidden></section><section data-screen="altar" hidden></section>
  </main>
  <nav><button data-tab="draw">Today</button><button data-tab="rite">Train</button><button data-tab="book">Book</button><button data-tab="circle">Circle</button><button data-tab="altar">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const ROMAN = ['0', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s == null ? '' : s) + '</small></button>';
  const star = (on) => '<svg viewBox="0 0 54 54"><path d="M27 3 L33 20 L51 21 L37 32 L42 50 L27 40 L12 50 L17 32 L3 21 L21 20 Z" fill="' + (on ? '#D4AF6A' : 'none') + '" stroke="#D4AF6A" stroke-width="1.5"/></svg>';
  /* the card art: a sun whose rays = workouts this week, a moon for rest */
  function art(done, goal) {
    let s = '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="none" stroke="#D4AF6A" stroke-width=".8"/>';
    for (let k = 0; k < goal * 4; k++) { const a = k / (goal * 4) * Math.PI * 2, lit = k < done * 4; s += '<line x1="' + (60 + 26 * Math.cos(a)) + '" y1="' + (60 + 26 * Math.sin(a)) + '" x2="' + (60 + (lit ? 50 : 38) * Math.cos(a)) + '" y2="' + (60 + (lit ? 50 : 38) * Math.sin(a)) + '" stroke="' + (lit ? '#D4AF6A' : '#4A4F86') + '" stroke-width="1.5"/>'; }
    return s + '<circle cx="60" cy="60" r="22" fill="none" stroke="#D4AF6A" stroke-width="1.5"/><path d="M66 50 a12 12 0 1 0 0 20 a9 9 0 1 1 0 -20z" fill="#C97B84"/></svg>';
  }
  function draw() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), idx = Math.max(0, G.plans().indexOf(rec));
    return '<h1>The card of the day</h1><button class="tarot flip" data-open="calendar"><span class="rn">' + ROMAN[Math.min(12, idx + 1)] + '</span>' + art(w.done, w.goal) + '<span class="mute" style="font-style:italic">' + w.done + ' of ' + w.goal + ' this week</span><span class="nm">' + e(s ? s.planName : rec ? rec.name : 'The Fool') + '</span></button>'
      + '<p class="read">' + (s ? 'The ritual has begun. <span data-live="elapsed"></span> have passed.' : 'The cards say ' + e(rec ? rec.name : 'rest') + '. ' + G.motivation()) + '</p>'
      + (s ? '<button class="btn" data-tab="rite">Return to the ritual</button>' : rec ? '<button class="btn" data-do="start" data-arg="' + rec.id + '">Begin ' + e(rec.name) + '</button>' : '')
      + '<div class="lst">' + li('Streak', G.streak() + ' weeks', 'data-open="achievements"') + li('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'the streak holds', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('A walk under the sky', 'run, walk, ride', 'data-open="activity"') + '</div>';
  }
  function rite() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>The major arcana</h1><p class="read mute">Your plans, in the order they are drawn.</p><div class="spread">' + G.plans().map((p, k) => '<button class="mini' + (p === sel ? ' sel' : '') + '" data-do="select" data-arg="' + p.id + '"><span>' + ROMAN[Math.min(12, k + 1)] + '</span><span>' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</span><small>' + p.exercises.length + ' exercises</small></button>').join('') + '</div>'
        + (sel ? '<button class="btn" data-do="start" data-arg="' + sel.id + '">Begin ' + e(sel.name) + '</button><button class="btn o" data-open="editplan" data-arg="' + sel.id + '">Edit this card</button>' : '')
        + '<div class="lst">' + li('Reorder the deck', '', 'data-open="plans"') + li('Create a card', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('The grimoire (library)', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<h1>' + e(s.planName) + '</h1><p class="read"><span data-live="elapsed"></span>, ' + p.done + ' of ' + p.total + ' stars lit. Rest <span data-live="rest" data-idle="not running" data-done="is over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><b>' + e(x.name) + '</b><div class="mute" style="font-style:italic;font-size:14px">' + (x.replaces ? 'in place of ' + e(x.replaces) : c.text) + '</div><div class="stars">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="st' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">' + star(st.L) + '<span>L<small>' + G.fmtW(st.w) + '</small></span></button><button class="st' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">' + star(st.R) + '<span>R<small>×' + st.r + '</small></span></button>' : '<button class="st' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + star(st.done) + '<span>' + st.r + '<small>' + G.fmtW(st.w) + '</small></span></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">weight</button><button data-do="addset" data-arg="' + i + '">another set</button><button data-open="replace" data-arg="' + i + '">replace</button><button data-open="exercise" data-arg="' + x.id + '">how to</button><button data-do="rest" data-arg="90">rest 90 s</button></div></div>'; }).join('')
      + '<button class="btn" data-do="finish">Seal the ritual, +' + p.xp + ' XP</button><button class="btn o" data-open="rest">Rest timer</button><button class="btn o" data-do="discard">Break the circle (discard)</button>';
  }
  function book() {
    const t = G.totals();
    return '<h1>Book of days</h1><p class="read">' + t.all.workouts + ' rituals, ' + t.all.sets + ' stars, ' + t.month.workouts + ' this month.</p><div style="color:#D4AF6A">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 80 }) + '</div>'
      + '<div class="lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + li('All records', '', 'data-open="records"') + li('Every ritual', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Suits collected (achievements)', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function circle() {
    const L = G.leaderboard();
    return '<h1>The circle</h1><div class="lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('Share a reading (post)', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function altar() { return '<h1>Settings</h1><div class="lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { draw, rite, book, circle, altar }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=rite]').click(); } } });
})();
</script>
</body>
</html>
