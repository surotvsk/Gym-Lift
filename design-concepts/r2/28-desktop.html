<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>28 · Desktop — GymQuest concept</title>
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #008080; color: #000; font: 13px/1.35 Tahoma, Verdana, 'Segoe UI', sans-serif;
    --k-acc: #000080; --k-font: Tahoma, Verdana, sans-serif; --k-radius: 0px; --k-bg: #C0C0C0; --k-card: #fff; --k-line: #808080; --k-good: #008000; --k-bad: #E0B0B0; --k-shadow: none; }
  .k-root .k-sheet { border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px #808080, inset 1px 1px #DFDFDF; }
  .k-root .k-head { background: linear-gradient(90deg, #000080, #1084D0); color: #fff; padding: 6px 8px; }
  .k-root .k-head h2 { font: 700 13px Tahoma; }
  .k-root .k-btn { border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px #808080; background: #C0C0C0; color: #000; }
  .k-root .k-btn.primary { background: #C0C0C0; color: #000; outline: 1px solid #000; }
  main { flex: 1; overflow-y: auto; padding: 44px 8px 10px; }
  .win { background: #C0C0C0; border: 2px solid; border-color: #DFDFDF #000 #000 #DFDFDF; box-shadow: inset 1px 1px #fff, inset -1px -1px #808080; margin-bottom: 10px; }
  .tb { display: flex; align-items: center; gap: 6px; background: linear-gradient(90deg, #000080, #1084D0); color: #fff; font: 700 12px Tahoma; padding: 3px 4px 3px 6px; }
  .tb span { flex: 1; } .tb.off { background: linear-gradient(90deg, #808080, #B5B5B5); }
  .tb button { width: 18px; height: 16px; border: 2px solid; border-color: #fff #000 #000 #fff; background: #C0C0C0; font: 700 10px Tahoma; padding: 0; cursor: pointer; line-height: 10px; }
  .wb { padding: 8px; }
  .b95 { border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: inset -1px -1px #808080, inset 1px 1px #DFDFDF; background: #C0C0C0; padding: 6px 12px; font: 13px Tahoma; cursor: pointer; color: #000; min-width: 70px; }
  .b95:active, .b95.on { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px #808080; }
  .b95.def { outline: 1px solid #000; }
  .sunk { border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; padding: 6px; }
  .prog { height: 20px; border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; padding: 2px; display: flex; gap: 2px; }
  .prog i { width: 10px; background: #000080; }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .icon { border: 0; background: none; color: #fff; font: 12px Tahoma; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; text-shadow: 1px 1px 0 #000; }
  .icon span { width: 36px; height: 36px; display: grid; place-items: center; background: #C0C0C0; color: #000080; border: 2px solid; border-color: #fff #000 #000 #fff; text-shadow: none; }
  .icon:focus span { outline: 1px dotted #fff; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  table.lv { width: 100%; border-collapse: collapse; background: #fff; }
  .lv th { background: #C0C0C0; border: 1px solid; border-color: #fff #808080 #808080 #fff; font-weight: 400; text-align: left; padding: 2px 4px; }
  .lv td { padding: 3px 4px; } .lv tr.sel td { background: #000080; color: #fff; }
  .lv tr { cursor: pointer; }
  .chk { display: inline-flex; align-items: center; gap: 4px; margin: 2px 8px 2px 0; cursor: pointer; border: 0; background: none; font: 13px Tahoma; padding: 2px; color: #000; }
  .chk i { width: 13px; height: 13px; border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; font-style: normal; font-size: 11px; line-height: 9px; text-align: center; }
  .chk.on i::after { content: '✔'; }
  .menu { position: absolute; left: 4px; bottom: 58px; width: 230px; z-index: 30; background: #C0C0C0; border: 2px solid; border-color: #fff #000 #000 #fff; display: flex; }
  .menu .side { width: 26px; background: linear-gradient(#000080, #1084D0); color: #C0C0C0; writing-mode: vertical-rl; transform: rotate(180deg); font: 700 16px Tahoma; padding: 6px 4px; }
  .menu .items { flex: 1; padding: 2px; max-height: 470px; overflow-y: auto; }
  .menu button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; padding: 5px 6px; font: 13px Tahoma; cursor: pointer; text-align: left; color: #000; }
  .menu button:hover, .menu button:focus { background: #000080; color: #fff; }
  .menu .kico { width: 18px; height: 18px; }
  nav { display: flex; gap: 3px; padding: 3px 3px 24px; background: #C0C0C0; border-top: 2px solid #fff; align-items: center; }
  nav button { flex: 1; min-width: 0 !important; padding-left: 2px !important; padding-right: 2px !important; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 12px Tahoma; padding: 5px 2px; }
  nav .start { flex: 0 0 auto; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; min-width: 0; padding: 5px 6px; }
  nav .clock { flex: 0 0 auto; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 4px 6px; font: 12px Tahoma; }
  nav button.is-active { border-color: #000 #fff #fff #000; box-shadow: inset 1px 1px #808080; background: #DFDFDF; }
  .post { background: #fff; border: 1px solid #808080; padding: 6px; margin-bottom: 6px; cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="desk"></section><section data-screen="train" hidden></section><section data-screen="stats" hidden></section><section data-screen="net" hidden></section><section data-screen="cp" hidden></section>
  </main>
  <div id="menu"></div>
  <nav><button class="b95 start" data-do="menu">▣ Start</button><button class="b95" data-tab="desk">Desk</button><button class="b95" data-tab="train">Train</button><button class="b95" data-tab="stats">Stats</button><button class="b95" data-tab="net">Net</button><button class="b95" data-tab="cp" aria-label="Control panel">⚙</button><span class="clock" data-live="clock"></span></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  let menuOpen = false;
  const W = (title, body, off) => '<div class="win"><div class="tb' + (off ? ' off' : '') + '"><span>' + title + '</span><button aria-hidden="true" tabindex="-1">_</button><button aria-hidden="true" tabindex="-1">□</button><button aria-hidden="true" tabindex="-1">×</button></div><div class="wb">' + body + '</div></div>';
  const IC = (ic, l, attrs) => '<button class="icon" ' + attrs + '><span>' + I(ic) + '</span>' + l + '</button>';
  const prog = (pct) => '<div class="prog">' + '<i></i>'.repeat(Math.round(Math.min(100, pct) / 100 * 24)) + '</div>';
  function desk() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="icons">' + IC('calendar', 'Calendar', 'data-open="calendar"') + IC('timer', 'Rest timer', 'data-open="rest"') + IC('run', 'Activity', 'data-open="activity"') + IC('medal', 'Trophies', 'data-open="achievements"') + IC('scale', 'Body', 'data-open="body"') + IC('utensils', 'Food', 'data-open="food"') + IC('camera', 'Photos', 'data-open="photos"') + IC('chat', 'Messages', 'data-open="chats"') + '</div>'
      + W('Weekly goal - ' + w.done + ' of ' + w.goal, '<div>Week ' + w.num + ' · streak ' + G.streak() + ' weeks</div>' + prog(w.done / w.goal * 100) + '<p style="margin:6px 0">' + G.motivation() + '</p><div class="row"><button class="chk' + (w.excused ? ' on' : '') + '" data-do="excuse"><i></i>Excuse this week</button></div>')
      + (s ? W(e(s.planName) + ' - Train.exe', '<p style="margin:0 0 6px">Workout in progress: <b data-live="elapsed"></b></p>' + prog(G.progress().pct) + '<div class="row" style="margin-top:8px"><button class="b95 def" data-tab="train">Open</button></div>')
        : rec ? W('Next workout ✦', '<div class="row"><span style="font-size:30px">💪</span><div><b>' + e(rec.name) + '</b><br>' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' min.</div></div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="b95 def" data-do="start" data-arg="' + rec.id + '">Start</button><button class="b95" data-open="editplan" data-arg="' + rec.id + '">Edit…</button></div>', true) : '')
      + W('Level ' + X.level, '<div>' + X.total + ' XP · ' + (X.need - X.into) + ' to next level</div>' + prog(X.pct), true);
  }
  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return W('Plans - Explorer', '<table class="lv"><tr><th>Name</th><th>Items</th><th>Min</th></tr>' + G.plans().map((p) => '<tr class="' + (p === sel ? 'sel' : '') + '" data-do="select" data-arg="' + p.id + '"><td>📁 ' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</td><td>' + p.exercises.length + '</td><td>' + G.planMinutes(p) + '</td></tr>').join('') + '</table><div class="row" style="margin-top:8px"><button class="b95" data-open="plans">Arrange…</button><button class="b95" data-open="newplan">New…</button><button class="b95" data-open="fullbody">Full Body…</button><button class="b95" data-open="library">Library…</button></div>')
        + (sel ? W(e(sel.name) + '.plan', '<div class="sunk">' + sel.exercises.map((x) => e(x.name) + ' — ' + x.sets + 'x' + x.reps + ' ' + G.fmtW(x.weight)).join('<br>') + '</div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="b95 def" data-do="start" data-arg="' + sel.id + '">Start</button><button class="b95" data-open="editplan" data-arg="' + sel.id + '">Edit…</button></div>') : '');
    }
    const p = G.progress();
    return W('Training ' + e(s.planName) + '…', '<div>Elapsed: <b data-live="elapsed"></b> · Rest: <b data-live="rest" data-idle="–" data-done="done"></b></div>' + prog(p.pct) + '<div>' + p.done + ' of ' + p.total + ' sets</div><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="b95 def" data-do="finish">Finish</button><button class="b95" data-open="rest">Rest…</button><button class="b95" data-do="discard">Cancel</button></div>')
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return W(e(x.name) + (x.unilateral ? ' (L/R)' : ''), '<div style="color:#555;margin-bottom:4px">' + (x.replaces ? 'Replaces ' + e(x.replaces) : c.text) + '</div>' + x.sets.map((st, j) => '<div class="row">' + (x.unilateral ? '<button class="chk' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L"><i></i>L</button><button class="chk' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R"><i></i>R</button>' : '<button class="chk' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '"><i></i>Set ' + (j + 1) + '</button>') + '<button class="b95" style="min-width:0;padding:2px 8px" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + '</button>' + (st.planFail ? ' <span>(failure)</span>' : '') + '</div>').join('')
          + '<div class="row" style="margin-top:6px"><button class="b95" style="min-width:0" data-do="addset" data-arg="' + i + '">+ Set</button><button class="b95" style="min-width:0" data-open="replace" data-arg="' + i + '">Replace…</button><button class="b95" style="min-width:0" data-open="exercise" data-arg="' + x.id + '">Help</button></div>', i !== s.cur); }).join('');
  }
  function stats() {
    const t = G.totals();
    return W('Statistics', '<table class="lv"><tr><th></th><th>Week</th><th>Month</th><th>All</th></tr>' + ['workouts', 'sets', 'minutes'].map((k) => '<tr><td>' + k + '</td><td>' + t.week[k] + '</td><td>' + t.month[k] + '</td><td>' + t.all[k] + '</td></tr>').join('') + '</table><div class="sunk" style="margin-top:6px;color:#000080">' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 80, gap: 2 }) + '</div>')
      + W('History', '<table class="lv"><tr><th>Date</th><th>Plan</th><th>XP</th></tr>' + G.history().slice(0, 6).map((w) => '<tr data-open="workout" data-arg="' + w.id + '"><td>' + G.fmtShort(w.date) + '</td><td>' + e(w.planName) + '</td><td>' + w.xp + '</td></tr>').join('') + '</table><div class="row" style="margin-top:6px"><button class="b95" data-open="history">All…</button><button class="b95" data-open="records">Records…</button><button class="b95" data-open="calendar">Calendar…</button><button class="b95" data-open="achievements">Trophies…</button><button class="b95" data-open="body">Body…</button><button class="b95" data-open="food">Food…</button><button class="b95" data-open="photos">Photos…</button></div>', true);
  }
  function net() {
    const L = G.leaderboard();
    return W('Network Neighborhood', '<div class="row"><button class="b95" data-open="leaderboard">Top 20 (#' + (L.me ? L.me.rank : '–') + ')</button><button class="b95" data-open="chats">Messages</button><button class="b95" data-open="friends">Friends</button><button class="b95 def" data-open="post">New post…</button></div>')
      + W('Inbox - Community', G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join(''), true);
  }
  function cp() { return W('Control Panel', '<div class="icons" style="grid-template-columns:repeat(3,1fr)">' + IC('target', 'Goal', 'data-open="settings"') + IC('bell', 'Profile', 'data-open="profile"') + IC('settings', 'Settings', 'data-open="settings"') + '</div>'); }
  const MENU = [['Plans', 'list', 'plans'], ['Exercise library', 'book', 'library'], ['Rest timer', 'timer', 'rest'], ['Calendar', 'calendar', 'calendar'], ['History', 'clock', 'history'], ['Records', 'trophy', 'records'], ['Achievements', 'medal', 'achievements'], ['Body', 'scale', 'body'], ['Food', 'utensils', 'food'], ['Photos', 'camera', 'photos'], ['Activity', 'run', 'activity'], ['Messages', 'chat', 'chats'], ['Friends', 'users', 'friends'], ['Top 20', 'star', 'leaderboard'], ['New post', 'edit', 'post'], ['Profile', 'user', 'profile'], ['Settings', 'settings', 'settings']];
  const app = K.app({ root: document.getElementById('app'), screens: { desk, train, stats, net, cp },
    chrome: () => { document.getElementById('menu').innerHTML = menuOpen ? '<div class="menu"><div class="side"><b>Gym</b>Quest 95</div><div class="items">' + MENU.map(([l, ic, f]) => '<button data-open="' + f + '" data-do="menuclose">' + I(ic) + l + '</button>').join('') + '</div></div>' : ''; },
    actions: { menu: () => { menuOpen = !menuOpen; app.render(true); }, menuclose: (a, el) => { menuOpen = false; K.FLOWS[el.dataset.open](); app.render(true); }, start: (a) => { G.start(a); document.querySelector('[data-tab=train]').click(); } } });
})();
</script>
</body>
</html>
