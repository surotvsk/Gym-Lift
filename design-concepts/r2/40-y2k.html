<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>40 · Y2K — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; color: #1A1F4A; font: 15px/1.4 Manrope, system-ui, sans-serif;
    background: radial-gradient(120% 60% at 20% 0%, #FFFFFF, #E8F6FF 40%, #D9E6FF 70%, #F3D9FF 100%);
    --chrome: linear-gradient(180deg, #FFFFFF 0%, #C7CED8 45%, #8E99A8 52%, #E4E9F0 100%);
    --iri: conic-gradient(from 90deg, #FF7AD9, #3EE6FF, #B6FF6A, #FFE36E, #FF7AD9);
    --k-acc: #6A4CFF; --k-font: Manrope, sans-serif; --k-head: Unbounded, sans-serif; --k-radius: 22px; --k-bg: #F4F8FF; --k-card: #E9EFFB; --k-line: #D3DCEE; --k-good: #3EBFD9; --k-bad: #FBD4EE; }
  main { flex: 1; overflow-y: auto; padding: 46px 14px 18px; }
  h1 { font: 900 30px/1 Unbounded, sans-serif; margin: 0 0 8px; letter-spacing: -1px; background: linear-gradient(180deg, #1A1F4A, #6A4CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pane { background: rgba(255,255,255,.55); border: 1.5px solid rgba(255,255,255,.95); border-radius: 26px; padding: 16px; margin-bottom: 14px; box-shadow: inset 0 1px 0 #fff, 0 10px 26px rgba(80,90,180,.18); backdrop-filter: blur(10px); }
  .ring { position: relative; width: 190px; height: 190px; margin: 4px auto 8px; border-radius: 50%; background: var(--iri); display: grid; place-items: center; }
  .ring::before { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #E8F0FF 60%, #CBD7F2); box-shadow: inset 0 4px 10px rgba(0,0,0,.08); }
  .ring .mask { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(transparent var(--p), rgba(232,240,255,.92) 0); }
  .ring .in { position: relative; text-align: center; } .ring b { display: block; font: 900 46px/1 Unbounded; color: #1A1F4A; } .ring small { color: #5A6290; }
  .chromebtn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1px solid #8E99A8; border-radius: 999px; padding: 15px; background: var(--chrome); font: 700 17px Unbounded; color: #1A1F4A; cursor: pointer; box-shadow: inset 0 2px 0 #fff, inset 0 -3px 6px rgba(0,0,0,.18), 0 8px 18px rgba(26,31,74,.25); text-shadow: 0 1px 0 #fff; overflow: hidden; }
  .chromebtn::after { content: ''; position: absolute; inset: 0; background: var(--iri); mix-blend-mode: soft-light; opacity: .8; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.6); border-radius: 999px; padding: 8px 14px; font: 700 13px Manrope; cursor: pointer; color: #1A1F4A; box-shadow: 0 4px 10px rgba(80,90,180,.12); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .bub { width: 58px; height: 58px; border-radius: 50%; border: 0; background: radial-gradient(circle at 32% 28%, #fff, #DDE6FA 55%, #AFC0E6); color: #1A1F4A; font: 800 15px Manrope; cursor: pointer; box-shadow: 0 6px 12px rgba(80,90,180,.2); line-height: 1; }
  .bub small { display: block; font-size: 9px; font-weight: 600; }
  .bub.on { background: radial-gradient(circle at 32% 28%, #fff, #FFB5EC 45%, #6A4CFF); color: #fff; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid rgba(106,76,255,.15); background: none; padding: 11px 2px; font: 700 15px Manrope; cursor: pointer; color: #1A1F4A; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #5A6290; font-weight: 400; }
  nav { display: flex; gap: 4px; margin: 0 12px 24px; padding: 6px; border-radius: 999px; background: var(--chrome); box-shadow: inset 0 2px 0 #fff, 0 8px 18px rgba(26,31,74,.25); }
  nav button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 9px 0; font: 700 11px Unbounded; color: #3A4270; cursor: pointer; }
  nav button.is-active { background: #1A1F4A; color: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="home"></section><section data-screen="go" hidden></section><section data-screen="stats" hidden></section><section data-screen="buddy" hidden></section><section data-screen="prefs" hidden></section>
  </main>
  <nav><button data-tab="home">Home</button><button data-tab="go">Go</button><button data-tab="stats">Stats</button><button data-tab="buddy">Buddies</button><button data-tab="prefs">Prefs</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  function home() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<h1>Hey ' + e(G.state.profile.name) + '</h1><div class="pane"><div class="ring" style="--p:' + Math.min(100, w.done / w.goal * 100) + '%"><span class="mask" style="background:conic-gradient(transparent ' + Math.min(100, w.done / w.goal * 100) + '%, rgba(232,240,255,.92) 0)"></span><span class="in"><b>' + w.done + '/' + w.goal + '</b><small>this week</small></span></div><p style="text-align:center;margin:0">' + G.motivation() + '</p></div>'
      + (s ? '<div class="pane"><b style="font:700 18px Unbounded">' + e(s.planName) + '</b><p style="margin:4px 0 12px"><span data-live="elapsed"></span> and counting</p><button class="chromebtn" data-tab="go">Back to it</button></div>'
        : rec ? '<div class="pane"><small>Next up ✦</small><b style="display:block;font:700 22px Unbounded;margin:2px 0 4px">' + e(rec.name) + '</b><p style="margin:0 0 12px;color:#5A6290">' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' min</p><button class="chromebtn" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + '</button></div>' : '')
      + '<div class="pills"><button class="pill" data-open="calendar">' + G.streak() + '-week streak</button><button class="pill" data-open="achievements">Level ' + X.level + ', ' + X.total + ' XP</button><button class="pill" data-do="excuse">' + (w.excused ? 'Week excused, undo' : 'Excuse this week') + '</button><button class="pill" data-open="rest">Rest timer</button><button class="pill" data-open="activity">Run, walk, ride</button></div>';
  }
  function go() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Pick a plan</h1><div class="pane lst">' + G.plans().map((p) => li((p === sel ? '✓ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="pane">' + sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>' + e(x.name) + '</span><b>' + x.sets + '×' + x.reps + '</b></div>').join('') + '<div style="height:12px"></div><button class="chromebtn" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button><div class="pills" style="margin-top:10px"><button class="pill" data-open="editplan" data-arg="' + sel.id + '">Edit</button><button class="pill" data-open="plans">Reorder</button><button class="pill" data-open="newplan">New plan</button><button class="pill" data-open="fullbody">Full body</button><button class="pill" data-open="library">Library</button></div></div>' : '');
    }
    const p = G.progress();
    return '<h1 data-live="elapsed"></h1><div class="pane"><div class="ring" style="width:150px;height:150px"><span class="mask" style="background:conic-gradient(transparent ' + p.pct + '%, rgba(232,240,255,.92) 0)"></span><span class="in"><b style="font-size:34px">' + p.done + '/' + p.total + '</b><small>' + e(s.planName) + '</small></span></div><div class="pills" style="justify-content:center"><button class="pill" data-open="rest">Rest <span data-live="rest" data-idle="" data-done="over"></span></button><button class="pill" data-do="rest" data-arg="90">90 s</button><button class="pill" data-do="discard">Discard</button></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="pane"' + (i === s.cur ? ' style="border-color:#B98CFF;box-shadow:0 0 0 2px #B98CFF,0 10px 26px rgba(80,90,180,.18)"' : '') + '><b style="font:700 17px Unbounded">' + e(x.name) + '</b><div style="color:#5A6290;font-size:13px">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="pills" style="margin:10px 0">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="bub' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="bub' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>×' + st.r + '</small></button>' : '<button class="bub' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="pills"><button class="pill" data-open="set" data-arg="' + i + ':0">Weight</button><button class="pill" data-do="addset" data-arg="' + i + '">+ set</button><button class="pill" data-open="replace" data-arg="' + i + '">Swap</button><button class="pill" data-open="exercise" data-arg="' + x.id + '">How to</button></div></div>'; }).join('')
      + '<button class="chromebtn" data-do="finish">Finish, +' + p.xp + ' XP</button>';
  }
  function stats() {
    const t = G.totals();
    return '<h1>Stats</h1><div class="pane" style="color:#6A4CFF"><b style="color:#1A1F4A">Sets per week</b>' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 100 }) + '</div>'
      + '<div class="pane lst">' + li('This week', t.week.workouts + ' workouts', 'data-open="history"') + li('This month', t.month.workouts + ' workouts', 'data-open="history"') + li('All time', t.all.workouts + ' workouts', 'data-open="history"') + '</div>'
      + '<div class="pane lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="pane lst">' + li('Records', '', 'data-open="records"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function buddy() {
    const L = G.leaderboard();
    return '<h1>Buddy list</h1><div class="pane lst">' + G.state.community.friends.map((k) => '<button data-open="chat" data-arg="' + k + '"><span>' + K.avatar(k, 28) + ' ' + e(G.person(k).name) + '</span><small style="color:#3EBF6A">● online</small></button>').join('') + '</div>'
      + '<div class="pills" style="margin-bottom:14px"><button class="pill" data-open="leaderboard">Top 20, you are #' + (L.me ? L.me.rank : '–') + '</button><button class="pill" data-open="chats">Messages</button><button class="pill" data-open="friends">Friends</button><button class="pill" data-open="post">New post</button></div>'
      + G.feed().map((p) => '<div class="pane post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function prefs() { return '<h1>Prefs</h1><div class="pane lst">' + li('Weekly goal', G.goal() + ' a week', 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { home, go, stats, buddy, prefs }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=go]').click(); } } });
})();
</script>
</body>
</html>
