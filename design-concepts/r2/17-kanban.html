<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17 · Kanban — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F7F7F5; color: #1F2328; font: 14px/1.4 Inter, system-ui, sans-serif;
    --k-acc: #5E6AD2; --k-font: Inter, system-ui, sans-serif; --k-radius: 10px; --k-card: #F1F1EF; --k-line: #E6E6E3; }
  .top { padding: 46px 14px 8px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E6E6E3; background: #fff; }
  .top h1 { margin: 0; font-size: 17px; flex: 1; } .top h1 small { color: #8A8F98; font-weight: 500; }
  .ib { border: 1px solid #E6E6E3; background: #fff; border-radius: 8px; padding: 6px 10px; font: 600 12px Inter; cursor: pointer; color: #1F2328; display: inline-flex; gap: 4px; align-items: center; }
  .ib.pri { background: #5E6AD2; border-color: #5E6AD2; color: #fff; }
  .ib .kico { width: 15px; height: 15px; }
  main { flex: 1; overflow-y: auto; padding: 12px 14px 20px; }
  .board { display: flex; gap: 10px; overflow-x: auto; margin: 0 -14px; padding: 0 14px 10px; scroll-snap-type: x mandatory; }
  .col { flex: 0 0 82%; background: #EFEFEC; border-radius: 12px; padding: 8px; scroll-snap-align: start; min-height: 420px; }
  .col h2 { display: flex; align-items: center; gap: 6px; margin: 2px 4px 8px; font-size: 13px; }
  .col h2 i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #8A8F98; }
  .col.doing h2 i { border-color: #E2B93B; background: linear-gradient(90deg, #E2B93B 50%, transparent 50%); } .col.done h2 i { background: #5E6AD2; border-color: #5E6AD2; }
  .col h2 span { color: #8A8F98; font-weight: 500; }
  .tk { background: #fff; border: 1px solid #E6E6E3; border-radius: 10px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .tk.cur { border-color: #5E6AD2; box-shadow: 0 0 0 1px #5E6AD2; }
  .tk .id { color: #8A8F98; font-size: 11px; font-weight: 600; }
  .tk b { display: block; margin: 2px 0; }
  .lbl { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid #E6E6E3; margin-right: 4px; color: #3C4149; }
  .lbl.up { color: #1F883D; border-color: #A6DDB4; } .lbl.down { color: #BC4C00; border-color: #F2C8A8; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { border: 1px solid #E6E6E3; background: #F7F7F5; border-radius: 6px; padding: 5px 7px; font: 600 12px Inter; cursor: pointer; color: #1F2328; }
  .chip.on { background: #5E6AD2; border-color: #5E6AD2; color: #fff; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; } .tools button { border: 0; background: none; color: #5E6AD2; font: 600 12px Inter; cursor: pointer; padding: 2px 0; }
  .sec { font-size: 12px; font-weight: 600; color: #8A8F98; text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
  .issue { display: flex; align-items: center; gap: 10px; width: 100%; background: #fff; border: 1px solid #E6E6E3; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .issue .grow { flex: 1; min-width: 0; } .issue small { color: #8A8F98; display: block; }
  .issue .st { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #8A8F98; flex: 0 0 auto; } .issue .st.d { background: #5E6AD2; border-color: #5E6AD2; } .issue .st.p { border-color: #E2B93B; background: linear-gradient(90deg, #E2B93B 50%, transparent 50%); }
  .prog { height: 6px; border-radius: 3px; background: #E6E6E3; overflow: hidden; margin: 8px 0; } .prog i { display: block; height: 100%; background: #5E6AD2; }
  .cyc { background: #fff; border: 1px solid #E6E6E3; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  nav { display: flex; background: #fff; border-top: 1px solid #E6E6E3; padding: 4px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #8A8F98; font: 600 11px Inter; padding: 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button.is-active { color: #5E6AD2; }
  nav .kico { width: 20px; height: 20px; }
  .post { background: #fff; border: 1px solid #E6E6E3; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="top" id="top"></div>
  <main data-scroll>
    <section data-screen="inbox"></section><section data-screen="board" hidden></section><section data-screen="cycles" hidden></section><section data-screen="team" hidden></section><section data-screen="me" hidden></section>
  </main>
  <nav><button data-tab="inbox"></button><button data-tab="board"></button><button data-tab="cycles"></button><button data-tab="team"></button><button data-tab="me"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const N = { inbox: ['home', 'This week'], board: ['grid', 'Board'], cycles: ['repeat', 'Cycles'], team: ['users', 'Team'], me: ['user', 'Me'] };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(N[b.dataset.tab][0]) + N[b.dataset.tab][1]; });
  const iss = (st, t, s, r, attrs) => '<button class="issue" ' + attrs + '><span class="st ' + st + '"></span><span class="grow"><b>' + t + '</b>' + (s ? '<small>' + s + '</small>' : '') + '</span><span style="color:#8A8F98;font-size:12px">' + (r || '') + '</span></button>';
  function top(cur) {
    const s = G.sess();
    document.getElementById('top').innerHTML = '<h1>GymQuest <small>/ ' + N[cur][1] + '</small></h1>' + (s ? '<span class="ib" data-live="elapsed"></span><button class="ib pri" data-do="finish">Finish</button>' : '<button class="ib" data-open="settings">' + I('settings') + '</button>');
  }
  function inbox() {
    const w = G.weekInfo(), rec = G.recommended(), X = G.xp();
    return '<div class="cyc"><div style="display:flex;justify-content:space-between"><b>Week ' + w.num + ' sprint</b><span style="color:#8A8F98">' + w.done + '/' + w.goal + ' · ' + G.streak() + '-week streak</span></div><div class="prog"><i style="width:' + Math.min(100, w.done / w.goal * 100) + '%"></i></div><div style="color:#8A8F98;font-size:13px">' + G.motivation() + '</div></div>'
      + '<div class="sec">Up next</div>' + (G.sess() ? iss('p', e(G.sess().planName), 'In progress · ' + G.progress().done + '/' + G.progress().total + ' sets', '', 'data-tab="board"') : rec ? iss('', e(rec.name) + ' ✦', rec.exercises.length + ' exercises · ~' + G.planMinutes(rec) + ' min', '<span class="ib pri">Start</span>', 'data-do="start" data-arg="' + rec.id + '"') : '')
      + '<div class="sec">This week</div>' + w.days.map((d) => d.done ? iss('d', d.plans.join(', '), G.WDL[G.wdi(d.date)], '', 'data-open="day" data-arg="' + d.date + '"') : d.today ? iss('p', 'Today', 'Nothing logged yet', '', 'data-open="day" data-arg="' + d.date + '"') : '').join('')
      + '<div class="sec">Actions</div>' + iss('', w.excused ? 'Week marked excused' : 'Mark week as excused', 'The streak is kept', '', 'data-do="excuse"') + iss('', 'Rest timer', '', '', 'data-open="rest"') + iss('', 'Log activity', 'Run · walk · ride', '', 'data-open="activity"') + iss('', 'Calendar', '', '', 'data-open="calendar"') + iss('d', 'Level ' + X.level, X.total + ' XP', '', 'data-open="achievements"');
  }
  function board() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="sec">Boards (rotation order)</div>' + G.plans().map((p) => iss(p === sel ? 'p' : '', e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' cards · ' + G.planMinutes(p) + ' min', '', 'data-do="select" data-arg="' + p.id + '"')).join('')
        + (sel ? '<div class="cyc"><b>' + e(sel.name) + '</b><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="ib pri" data-do="start" data-arg="' + sel.id + '">' + I('play') + ' Start sprint</button><button class="ib" data-open="editplan" data-arg="' + sel.id + '">' + I('edit') + ' Edit</button><button class="ib" data-open="plans">Reorder</button><button class="ib" data-open="newplan">New board</button><button class="ib" data-open="fullbody">Full body</button><button class="ib" data-open="library">' + I('book') + ' Library</button></div></div>' : '');
    }
    const cols = { todo: [], doing: [], done: [] };
    s.exercises.forEach((x, i) => { const d = x.sets.filter((y) => y.done).length; (d === x.sets.length ? cols.done : d || i === s.cur ? cols.doing : cols.todo).push([x, i]); });
    const card = ([x, i]) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
      return '<div class="tk' + (i === s.cur ? ' cur' : '') + '"><span class="id">GQ-' + (i + 1) + '</span><b>' + e(x.name) + '</b><span class="lbl ' + c.kind + '">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</span>' + (x.unilateral ? '<span class="lbl">L/R</span>' : '') + '<div class="chips">'
        + x.sets.map((st, j) => x.unilateral ? '<button class="chip' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + ' ' + G.fmtW(st.w) + '</button><button class="chip' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '</button>' : '<button class="chip' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + (st.planFail ? ' F' : '') + '</button>').join('') + '</div>'
        + '<div class="tools"><button data-do="cur" data-arg="' + i + '">Focus</button><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ Set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">Docs</button></div></div>'; };
    return '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap"><span class="ib">' + G.progress().done + '/' + G.progress().total + ' sets</span><button class="ib" data-open="rest">' + I('timer') + ' <span data-live="rest" data-idle="Rest" data-done="Rest over"></span></button><button class="ib" data-do="rest" data-arg="90">90 s</button><button class="ib pri" data-do="finish">Finish · +' + G.progress().xp + ' XP</button><button class="ib" data-do="discard">Discard</button></div>'
      + '<div class="board">' + [['todo', 'To do'], ['doing', 'Doing'], ['done', 'Done']].map(([k, l]) => '<div class="col ' + k + '"><h2><i></i>' + l + ' <span>' + cols[k].length + '</span></h2>' + cols[k].map(card).join('') + '</div>').join('') + '</div>';
  }
  function cycles() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<div class="cyc"><b>Velocity</b> <span style="color:#8A8F98">sets per week</span><div style="color:#5E6AD2">' + K.bars(ser.map((x) => x.sets), { h: 100, labels: ser.map((x) => x.label) }) + '</div></div>'
      + '<div class="cyc" style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center">' + [['Week', t.week], ['Month', t.month], ['All', t.all]].map(([l, x]) => '<div><b style="font-size:22px">' + x.workouts + '</b><div style="color:#8A8F98;font-size:12px">' + l + '</div></div>').join('') + '</div>'
      + '<div class="sec">Archive</div>' + G.history().slice(0, 5).map((w) => iss('d', e(w.planName), G.fmtDate(w.date) + ' · ' + w.minutes + ' min', '+' + w.xp, 'data-open="workout" data-arg="' + w.id + '"')).join('')
      + iss('', 'All history', '', '', 'data-open="history"') + iss('', 'Records', G.records().list.length + ' lifts', '', 'data-open="records"') + iss('', 'Calendar', '', '', 'data-open="calendar"') + iss('', 'Achievements', '', '', 'data-open="achievements"') + iss('', 'Body', '', '', 'data-open="body"') + iss('', 'Food', '', '', 'data-open="food"') + iss('', 'Photos', '', '', 'data-open="photos"');
  }
  function team() {
    const L = G.leaderboard();
    return '<div class="sec">Team</div>' + iss('', 'Top 20 this week', 'You are #' + (L.me ? L.me.rank : '–'), '', 'data-open="leaderboard"') + iss('', 'Messages', '', '', 'data-open="chats"') + iss('', 'Friends', '', '', 'data-open="friends"') + iss('', 'New post', '', '', 'data-open="post"')
      + '<div class="sec">Activity</div>' + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function me() { return '<div class="sec">Workspace</div>' + iss('', 'Weekly goal', G.goal() + ' per week', '', 'data-open="settings"') + iss('', 'Profile & reminders', '', '', 'data-open="profile"') + iss('', 'Settings', '', '', 'data-open="settings"'); }
  K.app({ root: document.getElementById('app'), screens: { inbox, board, cycles, team, me }, chrome: top, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=board]').click(); } } });
})();
</script>
</body>
</html>
