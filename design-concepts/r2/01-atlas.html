<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>01 · Atlas — GymQuest concept</title>
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F4F6F9; color: #141821; font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --k-acc: #2F5BEA; --k-bg: #fff; --k-card: #F1F3F7; --k-line: #E3E6EC; }
  main { flex: 1; overflow-y: auto; padding: 48px 16px 20px; }
  h1 { font-size: 30px; letter-spacing: -0.6px; margin: 0; }
  .sub { color: #69707D; margin: 2px 0 16px; font-size: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(20,24,33,.06); }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #69707D; }
  .big { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .week div { text-align: center; font-size: 12px; color: #69707D; }
  .week i { display: grid; place-items: center; height: 34px; border-radius: 10px; background: #F1F3F7; font-style: normal; font-weight: 700; color: #141821; margin-top: 4px; }
  .week .done i { background: #2F5BEA; color: #fff; } .week .today i { box-shadow: inset 0 0 0 2px #2F5BEA; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; background: #2F5BEA; color: #fff; font: 700 16px system-ui; padding: 15px; cursor: pointer; }
  .btn.sec { background: #E9EEFD; color: #2F5BEA; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: #E9EEFD; color: #2F5BEA; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan { text-align: center; border: 2px solid transparent; background: #fff; border-radius: 14px; padding: 14px 8px; font-weight: 700; cursor: pointer; color: inherit; font-size: 15px; box-shadow: 0 1px 2px rgba(20,24,33,.06); }
  .plan.on { border-color: #2F5BEA; color: #2F5BEA; }
  .plan small { display: block; color: #69707D; font-weight: 500; font-size: 12px; }
  .ex { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(20,24,33,.06); }
  .ex.cur { box-shadow: 0 0 0 2px #2F5BEA; }
  .ex h3 { margin: 0; font-size: 16px; }
  .ex img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; }
  .cmp { font-size: 12px; color: #69707D; } .cmp.up { color: #1E8E50; } .cmp.down { color: #C2410C; }
  .sets { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .set { display: flex; align-items: center; gap: 8px; }
  .set .n { width: 22px; color: #69707D; font-weight: 700; font-size: 13px; }
  .set .w { flex: 1; text-align: start; background: #F1F3F7; border: 0; border-radius: 10px; padding: 10px 12px; font: 600 15px system-ui; cursor: pointer; color: inherit; }
  .set .w em { font-style: normal; color: #B45309; font-size: 12px; margin-left: 6px; }
  .tick { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #D5DAE3; background: #fff; display: grid; place-items: center; cursor: pointer; color: transparent; }
  .tick.on { background: #2F5BEA; border-color: #2F5BEA; color: #fff; }
  .tick.half { border-color: #2F5BEA; color: #2F5BEA; }
  .side { width: 36px; height: 44px; border-radius: 10px; border: 2px solid #D5DAE3; background: #fff; font: 700 13px system-ui; cursor: pointer; color: #69707D; }
  .side.on { background: #2F5BEA; border-color: #2F5BEA; color: #fff; }
  .tools { display: flex; gap: 6px; margin-top: 10px; }
  .tools button { flex: 1; border: 0; background: #F1F3F7; border-radius: 10px; padding: 8px; font: 600 13px system-ui; color: #3A4150; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tools .kico { width: 16px; height: 16px; }
  .bar { position: sticky; top: -48px; margin: -48px -16px 12px; padding: 48px 16px 10px; background: rgba(244,246,249,.94); backdrop-filter: blur(10px); z-index: 2; }
  .prog { height: 6px; border-radius: 3px; background: #E3E6EC; overflow: hidden; margin-top: 8px; } .prog i { display: block; height: 100%; background: #2F5BEA; }
  .restbar { position: absolute; left: 12px; right: 12px; bottom: 86px; display: flex; align-items: center; gap: 10px; background: #141821; color: #fff; border-radius: 16px; padding: 10px 12px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .restbar b { font-size: 22px; font-variant-numeric: tabular-nums; flex: 1; }
  .restbar button { border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 10px; padding: 8px 10px; font: 600 13px system-ui; cursor: pointer; }
  .list { background: #fff; border-radius: 18px; padding: 2px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(20,24,33,.06); }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF0F4; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: inherit; text-align: start; cursor: pointer; }
  .li:last-child { border-bottom: 0; }
  .li .kico { color: #2F5BEA; }
  .li small { display: block; color: #69707D; font-size: 13px; }
  .li .r { color: #69707D; font-size: 14px; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stats3 div { background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 1px 2px rgba(20,24,33,.06); }
  .stats3 b { display: block; font-size: 24px; } .stats3 small { color: #69707D; font-size: 12px; }
  .seg { display: flex; background: #E7EAF0; border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 9px; font: 600 14px system-ui; color: #3A4150; cursor: pointer; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .lvl { height: 8px; border-radius: 4px; background: #E3E6EC; overflow: hidden; margin-top: 8px; } .lvl i { display: block; height: 100%; background: linear-gradient(90deg, #2F5BEA, #7B5BEA); }
  nav { display: flex; background: rgba(255,255,255,.96); border-top: 1px solid #E3E6EC; padding: 6px 4px 24px; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; font: 600 11px system-ui; color: #8A909B; padding: 6px 0; cursor: pointer; }
  nav button.is-active { color: #2F5BEA; }
  .fab { position: absolute; right: 16px; bottom: 92px; width: 56px; height: 56px; border-radius: 18px; background: #2F5BEA; color: #fff; border: 0; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(47,91,234,.4); cursor: pointer; z-index: 4; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="today"></section>
    <section data-screen="train" hidden></section>
    <section data-screen="progress" hidden></section>
    <section data-screen="community" hidden></section>
    <section data-screen="you" hidden></section>
  </main>
  <div id="rest"></div>
  <nav>
    <button data-tab="today"></button><button data-tab="train"></button><button data-tab="progress"></button><button data-tab="community"></button><button data-tab="you"></button>
  </nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const navs = { today: ['home', 'Today'], train: ['dumbbell', 'Train'], progress: ['chart', 'Progress'], community: ['users', 'Community'], you: ['user', 'You'] };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { const n = navs[b.dataset.tab]; b.innerHTML = I(n[0]) + n[1]; });
  let progTab = 'overview';

  const li = (ic, title, sub, r, attrs) => '<button class="li" ' + attrs + '>' + I(ic) + '<span class="grow"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</span><span class="r">' + (r || '') + '</span>' + I('chevron') + '</button>';

  function today() {
    const w = G.weekInfo(), rec = G.recommended(), X = G.xp(), s = G.sess();
    return '<h1>Today</h1><p class="sub">' + G.fmtDate(G.today(), true) + ' · week ' + w.num + '</p>'
      + '<div class="card"><div class="row"><div class="grow"><div class="lbl">This week</div><div class="big">' + w.done + ' / ' + w.goal + '</div></div><div style="text-align:end"><div class="lbl">Streak</div><div class="big">' + G.streak() + '<span style="font-size:15px;font-weight:600"> wk</span></div></div></div>'
      + '<div class="week">' + w.days.map((d) => '<div class="' + (d.done ? 'done ' : '') + (d.today ? 'today' : '') + '">' + d.d.slice(0, 1) + '<i>' + d.n + '</i></div>').join('') + '</div>'
      + '<p class="sub" style="margin:12px 0 0">' + G.motivation() + '</p></div>'
      + (s ? '<div class="card"><div class="lbl">In progress</div><h2 style="margin:4px 0">' + e(s.planName) + '</h2><p class="sub"><span data-live="elapsed"></span> · ' + G.progress().done + ' of ' + G.progress().total + ' sets</p><button class="btn" data-tab="train">Continue workout</button></div>'
        : rec ? '<div class="card"><div class="row"><div class="grow"><div class="lbl">Next up ✦</div><h2 style="margin:4px 0 2px">' + e(rec.name) + '</h2><p class="sub" style="margin:0">' + rec.exercises.length + ' exercises · about ' + G.planMinutes(rec) + ' min</p></div>' + (G.img(rec.exercises[0] && rec.exercises[0].id) ? '<img src="' + G.img(rec.exercises[0].id) + '" alt="" style="width:64px;height:64px;border-radius:14px;object-fit:cover">' : '') + '</div><div style="height:12px"></div><button class="btn" data-do="start" data-arg="' + rec.id + '">' + I('play') + ' Start workout</button></div>' : '')
      + '<div class="card"><div class="row"><div class="grow"><div class="lbl">Level ' + X.level + ' · ' + G.levelTitle(X.level) + '</div><b>' + X.total + ' XP</b></div><span class="chip">' + (X.need - X.into) + ' XP to go</span></div><div class="lvl"><i style="width:' + X.pct + '%"></i></div></div>'
      + '<div class="list">' + li('flag', w.excused ? 'This week is excused' : 'Excuse this week', 'Ill or busy: the streak is kept', '', 'data-do="excuse"') + li('run', 'Log an activity', 'Run, walk or ride', '', 'data-open="activity"') + '</div>';
  }

  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected(), rec = G.recommended();
      return '<h1>Train</h1><p class="sub">Pick a plan. ✦ is next in your rotation.</p>'
        + '<div class="plans">' + G.plans().map((p) => '<button class="plan' + (p === sel ? ' on' : '') + '" data-do="select" data-arg="' + p.id + '">' + e(p.name) + (p === rec ? ' ✦' : '') + '<small>' + p.exercises.length + ' ex · ' + G.planMinutes(p) + ' min</small></button>').join('') + '</div>'
        + '<div class="row" style="margin:12px 0"><button class="btn sec" data-open="plans">' + I('list') + ' Manage plans</button><button class="btn sec" data-open="newplan">' + I('plus') + ' New plan</button></div>'
        + (sel ? '<div class="card"><div class="row"><h2 class="grow" style="margin:0">' + e(sel.name) + '</h2><button class="chip" style="border:0;cursor:pointer" data-open="editplan" data-arg="' + sel.id + '">' + I('edit') + ' Edit</button></div>'
          + sel.exercises.map((x) => { const c = G.compare(sel.id, x.id, x.weight, x.reps); return '<div class="row" style="padding:10px 0;border-bottom:1px solid #EEF0F4">' + (G.img(x.id) ? '<img src="' + G.img(x.id) + '" alt="" style="width:42px;height:42px;border-radius:10px;object-fit:cover">' : '') + '<div class="grow"><b>' + e(x.name) + '</b><div class="cmp">' + x.sets + ' × ' + x.reps + ' · ' + G.fmtW(x.weight) + (x.unilateral ? ' · each side' : '') + (x.failSets.length ? ' · failure: set ' + x.failSets.join(', ') : '') + '</div></div><span class="cmp ' + c.kind + '">' + (c.last ? 'last ' + G.fmtW(c.last.weight) : 'new') + '</span></div>'; }).join('')
          + '<div style="height:12px"></div><button class="btn" data-do="start" data-arg="' + sel.id + '">' + I('play') + ' Start ' + e(sel.name) + '</button></div>' : '')
        + '<div class="list">' + li('book', 'Exercise library', '48 exercises · filter by muscle, place and equipment', '', 'data-open="library"') + li('grid', 'Full Body builder', 'Pick exercises from your plans', '', 'data-open="fullbody"') + li('timer', 'Rest timer', 'Presets and custom time', '', 'data-open="rest"') + '</div>';
    }
    const p = G.progress();
    return '<div class="bar"><div class="row"><div class="grow"><div class="lbl">' + e(s.planName) + '</div><b style="font-size:22px" data-live="elapsed"></b></div><button class="chip" style="border:0;cursor:pointer" data-open="rest">' + I('timer') + ' Rest</button><button class="btn" style="width:auto;padding:10px 16px" data-do="finish">Finish</button></div><div class="prog"><i style="width:' + p.pct + '%"></i></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><div class="row">' + (G.img(x.id) ? '<img src="' + G.img(x.id) + '" alt="">' : '') + '<div class="grow"><h3>' + e(x.name) + '</h3><div class="cmp ' + c.kind + '">' + (x.replaces ? 'Replaces ' + e(x.replaces) + ' today' : c.text) + (x.unilateral ? ' · one side at a time' : '') + '</div></div><button class="kico-btn" style="border:0;background:none;cursor:pointer;color:#69707D" data-open="exercise" data-arg="' + x.id + '" aria-label="How to">' + I('info') + '</button></div>'
          + '<div class="sets">' + x.sets.map((st, j) => '<div class="set"><span class="n">' + (j + 1) + '</span><button class="w" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + (st.planFail ? '<em>' + (st.fail ? 'failure ✓' : 'to failure') + '</em>' : st.fail ? '<em>failure</em>' : '') + '</button>'
            + (x.unilateral ? '<button class="side' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L</button><button class="side' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R</button>' : '<button class="tick' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '" aria-label="Set ' + (j + 1) + ' done">' + I('check') + '</button>') + '</div>').join('') + '</div>'
          + '<div class="tools"><button data-do="addset" data-arg="' + i + '">' + I('plus') + ' Set</button><button data-do="rmset" data-arg="' + i + '">' + I('minus') + ' Set</button><button data-open="replace" data-arg="' + i + '">' + I('swap') + ' Replace</button><button data-do="rest" data-arg="90">' + I('timer') + ' 90 s</button></div></div>'; }).join('')
      + '<button class="btn" data-do="finish">Finish workout · +' + p.xp + ' XP</button><div style="height:10px"></div><button class="btn sec" data-do="discard">Discard</button>';
  }

  function progress() {
    const t = G.totals(), seg = '<div class="seg">' + [['overview', 'Progress'], ['body', 'Body'], ['food', 'Food']].map(([k, l]) => '<button class="' + (progTab === k ? 'on' : '') + '" data-do="view" data-arg="' + k + '">' + l + '</button>').join('') + '</div>';
    if (progTab === 'body') {
      const L = G.bodyLatest('weight'), ser = G.bodySeries('weight');
      return '<h1>Progress</h1><p class="sub">Body measurements</p>' + seg + '<div class="card"><div class="lbl">Body weight</div><div class="big">' + (L ? L.value + ' kg' : '—') + '</div><p class="sub" style="margin:0">' + (L && L.change != null ? (L.change > 0 ? '+' : '') + L.change + ' kg since the previous entry' : '') + '</p>' + K.line(ser.map((x) => x.v), { h: 110 }) + '</div>'
        + '<div class="row"><button class="btn" data-open="bodyentry">' + I('plus') + ' New entry</button><button class="btn sec" data-open="body">All measurements</button></div><div style="height:12px"></div><div class="list">' + li('camera', 'Progress photos', G.state.photos.length + ' photos on this device', '', 'data-open="photos"') + '</div>';
    }
    if (progTab === 'food') {
      const f = G.foodDay();
      return '<h1>Progress</h1><p class="sub">Your own food log</p>' + seg + '<div class="card"><div class="lbl">Today</div><div class="big">' + f.kcal + ' kcal</div><p class="sub">' + f.p + ' g protein · ' + f.c + ' g carbs · ' + f.f + ' g fat</p>' + f.items.map((x) => '<div class="row" style="padding:6px 0"><span class="grow">' + e(x.name) + ' <small style="color:#69707D">' + e(x.meal) + '</small></span><b>' + x.kcal + '</b></div>').join('') + '</div><div class="row"><button class="btn" data-open="foodentry">' + I('plus') + ' Log food</button><button class="btn sec" data-open="food">Food log</button></div>';
    }
    const rec = G.records().list.slice(0, 4), ser = G.weeklySeries(8);
    return '<h1>Progress</h1><p class="sub">Your training, all time</p>' + seg
      + '<div class="stats3">' + [['Week', t.week], ['Month', t.month], ['All time', t.all]].map(([l, x]) => '<div><small>' + l + '</small><b>' + x.workouts + '</b><small>' + x.sets + ' sets</small></div>').join('') + '</div>'
      + '<div class="card"><div class="lbl">Sets per week</div>' + K.bars(ser.map((x) => x.sets), { labels: ser.map((x) => x.label), h: 120 }) + '</div>'
      + '<div class="card"><div class="row"><div class="lbl grow">Personal records</div><button class="chip" style="border:0;cursor:pointer" data-open="records">All</button></div>' + rec.map((r) => '<div class="row" style="padding:8px 0;border-bottom:1px solid #EEF0F4"><span class="grow">' + e(r.name) + '<br><small style="color:#69707D">' + G.fmtShort(r.date) + '</small></span><b>' + G.fmtW(r.kg) + '</b></div>').join('') + '</div>'
      + '<div class="list">' + li('calendar', 'Calendar', 'Every day at a glance', '', 'data-open="calendar"') + li('clock', 'History', G.state.history.length + ' workouts · edit or delete', '', 'data-open="history"') + li('medal', 'Achievements', G.achievements().filter((a) => a.got).length + ' unlocked', '', 'data-open="achievements"') + li('run', 'Activities', G.state.activities.length + ' logged', '', 'data-open="activity"') + '</div>'
      + G.history().slice(0, 3).map((w) => '<button class="li card" style="border:0" data-open="workout" data-arg="' + w.id + '">' + I('dumbbell') + '<span class="grow"><b>' + e(w.planName) + '</b><small>' + G.fmtDate(w.date) + ' · ' + w.minutes + ' min</small></span><span class="r">+' + w.xp + ' XP</span></button>').join('');
  }

  function community() {
    const L = G.leaderboard();
    return '<div class="row"><h1 class="grow">Community</h1><button class="chip" style="border:0;cursor:pointer" data-open="chats">' + I('chat') + ' Chats</button></div><p class="sub">Friends, posts and the weekly Top 20</p>'
      + '<div class="card"><div class="row"><div class="grow"><div class="lbl">Top 20 this week</div><b>You are #' + (L.me ? L.me.rank : '–') + '</b></div><button class="btn sec" style="width:auto;padding:8px 14px" data-open="leaderboard">Open</button></div></div>'
      + '<div class="row" style="margin-bottom:12px"><button class="btn" data-open="post">' + I('edit') + ' New post</button><button class="btn sec" data-open="friends">' + I('users') + ' Friends</button></div>'
      + G.feed().map((p) => '<div class="card" data-open="postview" data-arg="' + p.id + '" style="cursor:pointer">' + K.postCard(p) + '</div>').join('');
  }

  function you() {
    const X = G.xp(), pr = G.state.profile;
    return '<div class="row" style="margin-bottom:16px">' + K.avatar('me', 64) + '<div class="grow"><h1 style="font-size:24px">' + e(pr.name) + '</h1><p class="sub" style="margin:0">@' + e(pr.handle) + ' · Level ' + X.level + '</p></div></div>'
      + '<div class="card"><div class="lbl">Top achievements</div><div class="row" style="margin-top:8px">' + G.topAchievements().map((a) => '<div class="grow" style="text-align:center"><div style="font-size:28px">' + a.icon + '</div><small>' + e(a.name) + '</small></div>').join('') + '</div></div>'
      + '<div class="list">' + li('user', 'Community profile', 'Visibility, notifications, reminders', '', 'data-open="profile"') + li('target', 'Weekly goal', G.goal() + ' workouts a week', '', 'data-open="settings"') + li('settings', 'Settings', 'Language, units, sound, backup, reset', '', 'data-open="settings"') + '</div>';
  }

  const app = K.app({ root: document.getElementById('app'), screens: { today, train, progress, community, you },
    actions: { view: (a) => { progTab = a; app.render(true); }, start: (a) => { G.start(a); app.go('train'); } },
    chrome: () => {
      const r = G.rest(), box = document.getElementById('rest');
      box.innerHTML = r ? '<div class="restbar"><span>' + I('timer') + '</span><b data-live="rest" data-done="Rest over"></b><button data-do="restadd" data-arg="15">+15 s</button><button data-do="reststop">' + (r.done ? 'Close' : 'Stop') + '</button></div>' : '';
    } });
})();
</script>
</body>
</html>
