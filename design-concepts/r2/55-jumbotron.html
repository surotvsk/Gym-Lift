<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>55 · Jumbotron — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #050505; color: #FFB000; font: 14px/1.35 Archivo, system-ui, sans-serif;
    --amb: #FFB000; --red: #FF2D2D; --grn: #3DFF7A;
    --k-bg: #121212; --k-fg: #F2F2F2; --k-mute: #9A9A9A; --k-card: #1E1E1E; --k-line: #2E2E2E; --k-acc: #FFB000; --k-acc-fg: #050505; --k-font: Archivo, sans-serif; --k-radius: 4px; --k-good: #7A5500; --k-bad: #3A1515; }
  main { flex: 1; overflow-y: auto; padding: 42px 10px 16px; }
  .panel { background: #0A0A0A; border: 3px solid #1E1E1E; border-radius: 6px; padding: 10px; margin-bottom: 10px; position: relative;
    background-image: radial-gradient(rgba(255,176,0,.07) 1px, transparent 1.5px); background-size: 5px 5px; }
  .dot { font-family: Doto, monospace; font-weight: 900; color: var(--amb); text-shadow: 0 0 6px rgba(255,176,0,.75); letter-spacing: 2px; }
  .dot.r { color: var(--red); text-shadow: 0 0 6px rgba(255,45,45,.75); } .dot.g { color: var(--grn); text-shadow: 0 0 6px rgba(61,255,122,.7); }
  .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; }
  .score .n { font-size: 66px; line-height: 1; }
  .score small { display: block; color: #9A9A9A; font: 700 11px Archivo; letter-spacing: .14em; text-transform: uppercase; }
  .crowd { overflow: hidden; white-space: nowrap; border-top: 2px solid #1E1E1E; border-bottom: 2px solid #1E1E1E; padding: 4px 0; margin: 8px -10px 0; }
  .crowd span { display: inline-block; padding-left: 100%; animation: crawl 16s linear infinite; font-size: 18px; }
  @keyframes crawl { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .crowd span { animation: none; padding-left: 8px; } }
  .go { display: block; width: 100%; border: 3px solid var(--amb); background: none; color: var(--amb); font: 900 20px Doto, monospace; padding: 12px; cursor: pointer; margin-top: 8px; text-shadow: 0 0 6px rgba(255,176,0,.75); border-radius: 4px; letter-spacing: 2px; }
  .go.r { border-color: var(--red); color: var(--red); text-shadow: 0 0 6px rgba(255,45,45,.75); }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #1E1E1E; background: none; padding: 10px 2px; font: 700 15px Archivo; cursor: pointer; color: #F2F2F2; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #FFB000; font-family: Doto, monospace; font-weight: 900; font-size: 16px; }
  .bulbs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .bulb { min-width: 58px; border: 2px solid #2E2E2E; background: #111; color: #6B6B6B; padding: 4px 6px; cursor: pointer; border-radius: 4px; font: 900 18px Doto, monospace; }
  .bulb small { display: block; font: 700 10px Archivo; }
  .bulb.on { border-color: var(--grn); color: var(--grn); text-shadow: 0 0 6px rgba(61,255,122,.7); }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: #F2F2F2; font: 700 12px Archivo; text-decoration: underline; cursor: pointer; padding: 2px 0; }
  .ttl { font: 800 13px Archivo; color: #F2F2F2; letter-spacing: .06em; margin-bottom: 4px; }
  nav { display: flex; background: #0A0A0A; padding: 6px 4px 24px; border-top: 3px solid #1E1E1E; }
  nav button { flex: 1; border: 0; background: none; color: #6B6B6B; font: 900 13px Doto, monospace; cursor: pointer; padding: 8px 0; letter-spacing: 1px; }
  nav button.is-active { color: var(--amb); text-shadow: 0 0 6px rgba(255,176,0,.75); }
  .post { cursor: pointer; color: #F2F2F2; border-bottom: 1px solid #1E1E1E; padding: 6px 0; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #121212; color: #F2F2F2; border-color: #2E2E2E; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="board"></section><section data-screen="game" hidden></section><section data-screen="stats" hidden></section><section data-screen="fans" hidden></section><section data-screen="booth" hidden></section>
  </main>
  <nav><button data-tab="board">BOARD</button><button data-tab="game">GAME</button><button data-tab="stats">STATS</button><button data-tab="fans">FANS</button><button data-tab="booth">BOOTH</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s == null ? '' : s) + '</small></button>';
  function board() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), pr = G.records().events.slice(-1)[0];
    return '<div class="panel"><div class="score"><div><span class="dot n">' + w.done + '</span><small>Done</small></div><div class="dot r" style="font-size:22px">WK' + w.num + '</div><div><span class="dot n">' + w.goal + '</span><small>Goal</small></div></div>'
      + '<div class="crowd dot"><span>' + (w.met ? 'GOAL REACHED! THE CROWD GOES WILD' : 'LET’S GO ' + e(G.state.profile.name).toUpperCase() + '! ' + w.left + ' MORE THIS WEEK') + (pr ? '  ★ NEW RECORD: ' + e(pr.name).toUpperCase() + ' ' + G.fmtW(pr.kg) : '') + '</span></div></div>'
      + '<div class="panel"><div class="ttl">' + (s ? 'Game in progress' : 'Next game ✦') + '</div><div class="dot" style="font-size:30px">' + e((s ? s.planName : rec ? rec.name : '').toUpperCase()) + '</div>' + (s ? '<div class="dot g" style="font-size:24px" data-live="elapsed"></div><button class="go" data-tab="game">BACK TO THE GAME</button>' : rec ? '<button class="go" data-do="start" data-arg="' + rec.id + '">KICK OFF</button>' : '') + '</div>'
      + '<div class="panel lst">' + li('Streak', G.streak() + 'W', 'data-open="calendar"') + li('Level', X.level, 'data-open="achievements"') + li('XP', X.total, 'data-open="achievements"') + li(w.excused ? 'Timeout called (excused)' : 'Call a timeout: excuse this week', '', 'data-do="excuse"') + li('Halftime clock (rest)', '', 'data-open="rest"') + li('Warm-up lap: run, walk, ride', '', 'data-open="activity"') + '</div>';
  }
  function game() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="panel lst">' + G.plans().map((p) => li((p === sel ? '▶ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + "'", 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="panel"><div class="dot" style="font-size:26px">' + e(sel.name.toUpperCase()) + '</div>' + sel.exercises.map((x) => '<div style="color:#F2F2F2">' + e(x.name) + ' <span class="dot" style="font-size:14px">' + x.sets + 'X' + x.reps + '</span></div>').join('') + '<button class="go" data-do="start" data-arg="' + sel.id + '">KICK OFF</button><button class="go r" data-open="editplan" data-arg="' + sel.id + '">EDIT PLAYBOOK</button></div>' : '')
        + '<div class="panel lst">' + li('Season schedule (reorder)', '', 'data-open="plans"') + li('New playbook', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Scouting (library)', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<div class="panel"><div class="score"><div><span class="dot g" style="font-size:40px">' + p.done + '</span><small>Sets</small></div><div class="dot" style="font-size:30px" data-live="elapsed"></div><div><span class="dot r" style="font-size:40px">' + (p.total - p.done) + '</span><small>Left</small></div></div><div class="ttl" style="text-align:center;margin-top:6px">Rest <span class="dot" data-live="rest" data-idle="--" data-done="GO!"></span></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="panel"' + (i === s.cur ? ' style="border-color:#FFB000"' : '') + '><div class="ttl">' + e(x.name) + ' <span style="color:#9A9A9A;font-weight:500">' + (x.replaces ? 'sub for ' + e(x.replaces) : c.text) + '</span></div><div class="bulbs">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="bulb' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="bulb' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="bulb' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Substitute</button><button data-open="exercise" data-arg="' + x.id + '">Replay</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="go" data-do="finish">FINAL WHISTLE +' + p.xp + ' XP</button><button class="go" data-open="rest">HALFTIME CLOCK</button><button class="go r" data-do="discard">FORFEIT</button>';
  }
  function stats() {
    const t = G.totals();
    return '<div class="panel"><div class="score"><div><span class="dot" style="font-size:40px">' + t.week.workouts + '</span><small>Week</small></div><div><span class="dot" style="font-size:40px">' + t.month.workouts + '</span><small>Month</small></div><div><span class="dot" style="font-size:40px">' + t.all.workouts + '</span><small>Season</small></div></div><div style="color:#FFB000">' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 80 }) + '</div></div>'
      + '<div class="panel lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="panel lst">' + li('Records', '', 'data-open="records"') + li('Game log', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Trophies', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Concessions (food)', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function fans() {
    const L = G.leaderboard();
    return '<div class="panel lst">' + li('League table', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Kiss cam: friends', '', 'data-open="friends"') + li('Fan post', '', 'data-open="post"') + '</div>'
      + '<div class="panel">' + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('') + '</div>';
  }
  function booth() { return '<div class="panel lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { board, game, stats, fans, booth }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=game]').click(); } } });
})();
</script>
</body>
</html>
