<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>42 · HUD — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 50% 30%, #0A2633, #04121A 70%); color: #CFF9FF; font: 14px/1.4 Inter, system-ui, sans-serif;
    --cy: #5CF2FF; --am: #FFB547; --rd: #FF4D6D;
    --k-bg: #071C26; --k-fg: #CFF9FF; --k-mute: #7FB3BF; --k-card: #0C2A36; --k-line: #144152; --k-acc: #5CF2FF; --k-acc-fg: #04121A; --k-font: Inter, sans-serif; --k-head: Rajdhani, sans-serif; --k-radius: 0px; --k-good: #12707F; --k-bad: #3A1A24; }
  .app::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(92,242,255,.05) 1px, transparent 1px) 0 0 / 100% 4px; z-index: 30; }
  main { flex: 1; overflow-y: auto; padding: 44px 14px 16px; }
  .rd { font: 600 12px Rajdhani; letter-spacing: .1em; color: #7FB3BF; }
  .val { font: 700 30px/1 Rajdhani; color: var(--cy); }
  .val.am { color: var(--am); }
  .brk { position: relative; padding: 12px; margin-bottom: 12px; }
  .brk::before, .brk::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cy); }
  .brk::before { left: 0; top: 0; border-right: 0; border-bottom: 0; } .brk::after { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .brk.am::before, .brk.am::after { border-color: var(--am); }
  .row { display: flex; gap: 10px; align-items: center; } .grow { flex: 1; min-width: 0; }
  .tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .tri button { border: 1px solid #144152; background: rgba(12,42,54,.6); padding: 8px; text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .scope { position: relative; width: 250px; height: 250px; margin: 0 auto 10px; }
  .scope svg { width: 100%; height: 100%; }
  .scope .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .scope .c b { font: 700 54px/1 Rajdhani; color: var(--cy); }
  .scope .c button.wt { border: 0; background: none; cursor: pointer; padding: 0; font: 700 54px/1 Rajdhani; color: var(--cy); }
  .spin { animation: sp 12s linear infinite; transform-origin: 125px 125px; } @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .eng { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1px solid var(--cy); background: rgba(92,242,255,.12); color: var(--cy); font: 700 17px Rajdhani; letter-spacing: .14em; padding: 12px; cursor: pointer; margin: 6px 0; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .eng.am { border-color: var(--am); background: rgba(255,181,71,.14); color: var(--am); } .eng.rd { border-color: var(--rd); background: rgba(255,77,109,.12); color: var(--rd); }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #144152; background: none; padding: 10px 0; font: 600 15px Rajdhani; letter-spacing: .06em; cursor: pointer; color: #CFF9FF; text-align: left; }
  .lst small { color: #7FB3BF; font: 400 12px Inter; letter-spacing: 0; }
  .tgt { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .t { width: 54px; height: 44px; border: 1px solid #2E6E80; background: none; color: #CFF9FF; font: 700 15px Rajdhani; cursor: pointer; line-height: 1; }
  .t small { display: block; font: 400 9px Inter; color: #7FB3BF; }
  .t.on { border-color: var(--cy); background: rgba(92,242,255,.18); color: var(--cy); }
  .t.lock { border-color: var(--am); box-shadow: 0 0 0 3px rgba(255,181,71,.25); }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: var(--am); font: 600 12px Rajdhani; letter-spacing: .08em; cursor: pointer; padding: 2px 0; }
  .bar { height: 4px; background: #144152; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--cy); box-shadow: 0 0 8px var(--cy); }
  nav { display: flex; border-top: 1px solid #144152; padding: 6px 4px 24px; background: #04121A; }
  nav button { flex: 1; border: 0; background: none; color: #4F7F8B; font: 700 12px Rajdhani; letter-spacing: .12em; cursor: pointer; padding: 9px 0; }
  nav button.is-active { color: var(--cy); text-shadow: 0 0 8px var(--cy); }
  .post { cursor: pointer; border-bottom: 1px solid #144152; padding: 8px 0; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #071C26; color: #CFF9FF; border-color: #144152; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="status"></section><section data-screen="engage" hidden></section><section data-screen="log" hidden></section><section data-screen="squad" hidden></section><section data-screen="cfg" hidden></section>
  </main>
  <nav><button data-tab="status">Status</button><button data-tab="engage">Engage</button><button data-tab="log">Log</button><button data-tab="squad">Squad</button><button data-tab="cfg">Config</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  const ret = (pct, col) => '<svg viewBox="0 0 250 250"><g class="spin"><circle cx="125" cy="125" r="118" fill="none" stroke="#144152" stroke-dasharray="4 8"/></g><circle cx="125" cy="125" r="100" fill="none" stroke="#144152" stroke-width="6"/><circle cx="125" cy="125" r="100" fill="none" stroke="' + col + '" stroke-width="6" stroke-dasharray="' + (628 * pct) + ' 628" transform="rotate(-90 125 125)"/>'
    + '<path d="M125 2v26M125 222v26M2 125h26M222 125h26" stroke="' + col + '" stroke-width="2"/><circle cx="125" cy="125" r="70" fill="none" stroke="#2E6E80"/></svg>';
  function status() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="rd">Week ' + w.num + ', ' + G.fmtDate(G.today()) + '</div><div class="scope">' + ret(Math.min(1, w.done / w.goal), '#5CF2FF') + '<div class="c"><b>' + w.done + '/' + w.goal + '</b><span class="rd">weekly objective</span></div></div>'
      + '<div class="tri"><button data-open="calendar"><span class="rd">Streak</span><div class="val">' + G.streak() + 'W</div></button><button data-open="achievements"><span class="rd">Level</span><div class="val">' + X.level + '</div></button><button data-open="achievements"><span class="rd">XP</span><div class="val am">' + X.total + '</div></button></div>'
      + '<div class="brk' + (s ? ' am' : '') + '"><div class="rd">' + (s ? 'Mission active' : 'Next mission ✦') + '</div><div class="val" style="font-size:26px">' + e(s ? s.planName : rec ? rec.name : '') + '</div><div style="color:#7FB3BF">' + (s ? '<span data-live="elapsed"></span> elapsed' : rec ? rec.exercises.length + ' targets, about ' + G.planMinutes(rec) + ' min' : '') + '</div>'
      + (s ? '<button class="eng am" data-tab="engage">Re-engage</button>' : rec ? '<button class="eng" data-do="start" data-arg="' + rec.id + '">Engage ' + e(rec.name) + '</button>' : '') + '</div>'
      + '<div class="lst">' + li(w.excused ? 'Stand-down active' : 'Stand down this week', w.excused ? 'undo' : 'streak protected', 'data-do="excuse"') + li('Recovery timer', '', 'data-open="rest"') + li('Field run, walk, ride', '', 'data-open="activity"') + '</div><p style="color:#7FB3BF">' + G.motivation() + '</p>';
  }
  function engage() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="rd">Select mission profile</div><div class="lst">' + G.plans().map((p) => li((p === sel ? '◉ ' : '○ ') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' targets', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="brk"><div class="val" style="font-size:24px">' + e(sel.name) + '</div>' + sel.exercises.map((x) => '<div class="row"><span class="grow">' + e(x.name) + '</span><span class="rd">' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</span></div>').join('') + '<button class="eng" data-do="start" data-arg="' + sel.id + '">Engage</button><button class="eng am" data-open="editplan" data-arg="' + sel.id + '">Modify profile</button></div>' : '')
        + '<div class="lst">' + li('Reorder profiles', '', 'data-open="plans"') + li('New profile', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Target database', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress(), i = s.cur, x = s.exercises[i], j = Math.max(0, x.sets.findIndex((y) => !y.done)), st = x.sets[j], c = G.compare(s.planId, x.id, st.w, st.r), allDone = x.sets.every((y) => y.done);
    return '<div class="row"><div class="grow"><div class="rd">' + e(s.planName) + ', T+</div><div class="val" data-live="elapsed"></div></div><div style="text-align:right"><div class="rd">Recovery</div><div class="val am" data-live="rest" data-idle="--" data-done="0:00"></div></div></div><div class="bar"><i style="width:' + p.pct + '%"></i></div>'
      + '<div class="scope">' + ret(x.sets.filter((y) => y.done).length / x.sets.length, '#FFB547') + '<div class="c"><span class="rd">' + e(x.name) + '</span><button class="wt" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + '</button><span class="rd">× ' + st.r + ' reps, set ' + (j + 1) + ' of ' + x.sets.length + '</span></div></div>'
      + '<p style="text-align:center;color:' + (c.kind === 'up' ? '#5CF2FF' : '#7FB3BF') + ';margin:0 0 8px">' + (x.replaces ? 'Substitute for ' + e(x.replaces) : c.text) + '</p>'
      + (allDone ? '<button class="eng" data-do="next">Next target</button>' : x.unilateral ? '<div class="row"><button class="eng" data-do="set" data-arg="' + i + ':' + j + ':L">' + (st.L ? 'Left ✓' : 'Left') + '</button><button class="eng" data-do="set" data-arg="' + i + ':' + j + ':R">' + (st.R ? 'Right ✓' : 'Right') + '</button></div>' : '<button class="eng" data-do="set" data-arg="' + i + ':' + j + '">Confirm set</button>')
      + '<div class="tools" style="justify-content:center"><button data-do="wminus" data-arg="' + i + ':' + j + '">− load</button><button data-do="wplus" data-arg="' + i + ':' + j + '">+ load</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Substitute</button><button data-open="exercise" data-arg="' + x.id + '">Intel</button><button data-do="rest" data-arg="90">Rest 90</button></div>'
      + '<div class="rd" style="margin-top:12px">Targets</div>' + s.exercises.map((y, k) => '<div class="row" style="padding:4px 0"><span class="grow" style="' + (k === i ? 'color:#FFB547' : '') + '">' + e(y.name) + '</span><div class="tgt" style="margin:0">' + y.sets.map((z, m) => '<button class="t' + (z.done ? ' on' : '') + (k === i && m === j ? ' lock' : '') + '" style="width:30px;height:28px" data-do="set" data-arg="' + k + ':' + m + (y.unilateral ? ':L' : '') + '">' + (z.done ? '✓' : m + 1) + '</button>').join('') + '</div></div>').join('')
      + '<button class="eng am" data-do="finish">Mission complete, +' + p.xp + ' XP</button><button class="eng" data-open="rest">Recovery timer</button><button class="eng rd" data-do="discard">Abort mission</button>';
  }
  function log() {
    const t = G.totals();
    return '<div class="tri"><button data-open="history"><span class="rd">Week</span><div class="val">' + t.week.workouts + '</div></button><button data-open="history"><span class="rd">Month</span><div class="val">' + t.month.workouts + '</div></button><button data-open="history"><span class="rd">Total</span><div class="val">' + t.all.workouts + '</div></button></div>'
      + '<div class="brk"><div class="rd">Sets per week telemetry</div><div style="color:#5CF2FF">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90 }) + '</div></div>'
      + '<div class="lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + li('Records', '', 'data-open="records"') + li('Mission log', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Commendations', '', 'data-open="achievements"') + li('Biometrics', '', 'data-open="body"') + li('Rations', '', 'data-open="food"') + li('Visual log', '', 'data-open="photos"') + '</div>';
  }
  function squad() {
    const L = G.leaderboard();
    return '<div class="lst">' + li('Top 20 this week', 'rank ' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Comms', '', 'data-open="chats"') + li('Squad', '', 'data-open="friends"') + li('Broadcast', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function cfg() { return '<div class="lst">' + li('Weekly objective', G.goal(), 'data-open="settings"') + li('Profile and alerts', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { status, engage, log, squad, cfg },
    actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=engage]').click(); }, next: () => { const s = G.sess(); if (s.cur >= s.exercises.length - 1) K.finish(); else G.setCurrent(s.cur + 1); } } });
})();
</script>
</body>
</html>
