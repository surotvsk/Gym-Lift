<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11 · Metro — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; color: #fff; font: 15px/1.35 'Open Sans', 'Segoe UI', sans-serif; overflow: hidden;
    --k-bg: #1F1F1F; --k-fg: #fff; --k-mute: #A0A0A0; --k-card: #2B2B2B; --k-line: #3A3A3A; --k-acc: #00ABA9; --k-acc-fg: #fff; --k-radius: 0px; --k-font: 'Open Sans', sans-serif; --k-good: #00ABA9; --k-bad: #5A2A2A; }
  .pano { padding: 40px 0 0 16px; white-space: nowrap; overflow: hidden; }
  .pano h1 { margin: 0; font: 300 64px/1 'Open Sans', sans-serif; letter-spacing: -2px; transition: transform .35s; }
  .pano h1 span { color: #555; margin-left: 18px; }
  main { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 84px; gap: 6px; }
  .tl { position: relative; overflow: hidden; border: 0; color: #fff; text-align: left; padding: 8px; font: inherit; cursor: pointer; display: flex; flex-direction: column; }
  .tl .lb { margin-top: auto; font-size: 13px; }
  .tl .v { font: 300 40px/1 'Open Sans'; }
  .tl .kico { width: 30px; height: 30px; stroke-width: 1.4; }
  .w2 { grid-column: span 2; } .w4 { grid-column: span 4; } .h2 { grid-row: span 2; }
  .c1 { background: #00ABA9; } .c2 { background: #2D89EF; } .c3 { background: #DA532C; } .c4 { background: #603CBA; } .c5 { background: #00A300; } .c6 { background: #E3A21A; } .c7 { background: #B91D47; } .c8 { background: #1E7145; } .c9 { background: #9F00A7; } .c0 { background: #2B2B2B; }
  .flip { animation: fl 6s infinite; }
  @keyframes fl { 0%, 45% { transform: translateY(0); } 50%, 95% { transform: translateY(-50%); } 100% { transform: translateY(0); } }
  .face { height: 100%; display: flex; flex-direction: column; }
  .flipwrap { position: absolute; inset: 8px; overflow: hidden; } .flip { height: 200%; } .face { height: 50% !important; }
  @media (prefers-reduced-motion: reduce) { .flip { animation: none; } }
  .tl img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .45; }
  .tl > *:not(img) { position: relative; }
  h2 { font: 300 30px/1 'Open Sans'; margin: 16px 0 8px; }
  .lst button { display: block; width: 100%; border: 0; background: none; color: #fff; text-align: left; padding: 9px 0; cursor: pointer; font: 300 22px 'Open Sans'; }
  .lst small { display: block; font: 400 13px 'Open Sans'; color: #A0A0A0; }
  .ex { margin-bottom: 14px; } .ex h3 { margin: 0; font: 300 26px/1.1 'Open Sans'; } .ex .m { color: #A0A0A0; font-size: 13px; }
  .ex.cur h3 { color: #00ABA9; }
  .sq { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .sq button { height: 64px; border: 2px solid #555; background: none; color: #fff; font: 300 22px 'Open Sans'; cursor: pointer; text-align: left; padding: 4px 6px; display: flex; flex-direction: column; justify-content: space-between; }
  .sq small { font-size: 11px; color: #A0A0A0; }
  .sq button.on { background: #00ABA9; border-color: #00ABA9; } .sq button.on small { color: #E0FFFE; }
  .tools { display: flex; gap: 16px; margin-top: 4px; } .tools button { border: 0; background: none; color: #00ABA9; font: 400 13px 'Open Sans'; cursor: pointer; padding: 4px 0; }
  .appbar { display: flex; justify-content: space-around; align-items: center; background: #1F1F1F; padding: 6px 0 26px; }
  .appbar button { width: 44px; height: 44px; border: 2px solid #fff; border-radius: 50%; background: none; color: #fff; display: grid; place-items: center; cursor: pointer; }
  .appbar button.is-active { background: #fff; color: #000; }
  .appbar .kico { width: 20px; height: 20px; }
  .post { border-left: 4px solid #2D89EF; padding: 6px 0 6px 10px; margin-bottom: 12px; cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #1F1F1F; color: #fff; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="pano"><h1 id="pano"></h1></div>
  <main data-scroll>
    <section data-screen="start"></section><section data-screen="workout" hidden></section><section data-screen="progress" hidden></section><section data-screen="people" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <div class="appbar"><button data-tab="start" aria-label="Start"></button><button data-tab="workout" aria-label="Workout"></button><button data-tab="progress" aria-label="Progress"></button><button data-tab="people" aria-label="People"></button><button data-tab="settings" aria-label="Settings"></button></div>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const ics = { start: 'grid', workout: 'dumbbell', progress: 'chart', people: 'users', settings: 'settings' };
  const names = ['start', 'workout', 'progress', 'people', 'settings'];
  document.querySelectorAll('.appbar [data-tab]').forEach((b) => { b.innerHTML = I(ics[b.dataset.tab]); });
  const T = (cls, inner, attrs) => '<button class="tl ' + cls + '" ' + (attrs || '') + '>' + inner + '</button>';
  const flip = (a, b) => '<div class="flipwrap"><div class="flip"><div class="face">' + a + '</div><div class="face">' + b + '</div></div></div>';
  function start() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), r = G.rest();
    return '<div class="tiles">'
      + (s ? T('c1 w4 h2', '<span class="lb">' + e(s.planName) + '</span><span class="v" data-live="elapsed"></span><span class="lb">' + G.progress().done + '/' + G.progress().total + ' sets · tap to continue</span>', 'data-tab="workout"')
        : rec ? T('c1 w4 h2', (G.img(rec.exercises[0] && rec.exercises[0].id) ? '<img src="' + G.img(rec.exercises[0].id) + '" alt="">' : '') + '<span class="v">' + e(rec.name) + '</span><span class="lb">next ✦ · ' + rec.exercises.length + ' exercises · tap to start</span>', 'data-do="start" data-arg="' + rec.id + '"') : '')
      + T('c2 w2 h2', flip('<span class="v">' + w.done + '/' + w.goal + '</span><span class="lb">this week</span>', '<span class="v">' + G.streak() + '</span><span class="lb">week streak</span>'), 'data-open="calendar"')
      + T('c3 w2 h2', flip('<span class="v">' + X.level + '</span><span class="lb">level</span>', '<span class="v">' + X.total + '</span><span class="lb">XP</span>'), 'data-open="achievements"')
      + T('c6', I('timer') + '<span class="lb">' + (r ? '<span data-live="rest"></span>' : 'rest') + '</span>', 'data-open="rest"') + T('c5', I('run') + '<span class="lb">activity</span>', 'data-open="activity"')
      + T('c4 w2', I('flag') + '<span class="lb">' + (w.excused ? 'week excused' : 'excuse week') + '</span>', 'data-do="excuse"')
      + T('c7 w2', flip('<span class="v">' + ((G.bodyLatest('weight') || {}).value || '—') + '</span><span class="lb">body weight</span>', '<span class="v">' + G.foodDay().kcal + '</span><span class="lb">kcal today</span>'), 'data-open="body"')
      + T('c8', I('utensils') + '<span class="lb">food</span>', 'data-open="food"') + T('c9', I('camera') + '<span class="lb">photos</span>', 'data-open="photos"')
      + T('c2 w2', I('chat') + '<span class="lb">messages ' + (G.chats().reduce((a, c) => a + c.unread, 0) || '') + '</span>', 'data-open="chats"')
      + T('c0', I('book') + '<span class="lb">library</span>', 'data-open="library"') + T('c0', I('trophy') + '<span class="lb">records</span>', 'data-open="records"')
      + '</div>';
  }
  function workout() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="lst">' + G.plans().map((p) => '<button data-do="select" data-arg="' + p.id + '" style="' + (p === sel ? 'color:#00ABA9' : '') + '">' + e(p.name).toLowerCase() + (p === G.recommended() ? ' ✦' : '') + '<small>' + p.exercises.length + ' exercises · ' + G.planMinutes(p) + ' min</small></button>').join('') + '</div>'
        + '<div class="tiles" style="margin-top:10px">' + (sel ? T('c1 w2', I('play') + '<span class="lb">start ' + e(sel.name).toLowerCase() + '</span>', 'data-do="start" data-arg="' + sel.id + '"') + T('c2 w2', I('edit') + '<span class="lb">edit plan</span>', 'data-open="editplan" data-arg="' + sel.id + '"') : '')
        + T('c4 w2', I('list') + '<span class="lb">manage plans</span>', 'data-open="plans"') + T('c3', I('plus') + '<span class="lb">new</span>', 'data-open="newplan"') + T('c6', I('grid') + '<span class="lb">full body</span>', 'data-open="fullbody"') + '</div>';
    }
    const p = G.progress();
    return '<div style="display:flex;align-items:baseline;gap:10px"><span style="font:300 44px Open Sans" data-live="elapsed"></span><span style="color:#A0A0A0">' + p.done + '/' + p.total + ' · rest <span data-live="rest" data-idle="—" data-done="over"></span></span></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><h3>' + e(x.name).toLowerCase() + '</h3><div class="m">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</div><div class="sq">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="' + (st.L ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="' + (st.R ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="' + (st.done ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + (st.planFail ? ' · fail' : '') + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">weight</button><button data-do="addset" data-arg="' + i + '">add set</button><button data-open="replace" data-arg="' + i + '">replace</button><button data-open="exercise" data-arg="' + x.id + '">about</button><button data-do="rest" data-arg="90">rest 90</button></div></div>'; }).join('')
      + '<div class="tiles">' + T('c5 w2', I('check') + '<span class="lb">finish +' + p.xp + ' XP</span>', 'data-do="finish"') + T('c6', I('timer') + '<span class="lb">rest</span>', 'data-open="rest"') + T('c7', I('x') + '<span class="lb">discard</span>', 'data-do="discard"') + '</div>';
  }
  function progress() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<div class="tiles">' + [['week', t.week, 'c1'], ['month', t.month, 'c2'], ['all time', t.all, 'c4']].map(([l, x, c], k) => T(c + (k === 2 ? ' w4' : ' w2'), '<span class="v">' + x.workouts + '</span><span class="lb">' + l + ' · ' + x.sets + ' sets</span>', 'data-open="history"')).join('') + '</div>'
      + '<h2>sets per week</h2><div style="color:#00ABA9">' + K.bars(ser.map((x) => x.sets), { h: 100, gap: 4, labels: ser.map((x) => x.label) }) + '</div>'
      + '<h2>records</h2><div class="lst">' + G.records().list.slice(0, 4).map((r) => '<button data-open="exercise" data-arg="' + r.id + '">' + G.fmtW(r.kg) + '<small>' + e(r.name) + ' · ' + G.fmtShort(r.date) + '</small></button>').join('') + '</div>'
      + '<div class="tiles">' + T('c3 w2', I('trophy') + '<span class="lb">all records</span>', 'data-open="records"') + T('c5 w2', I('calendar') + '<span class="lb">calendar</span>', 'data-open="calendar"') + T('c6 w2', I('medal') + '<span class="lb">achievements</span>', 'data-open="achievements"') + T('c7 w2', I('clock') + '<span class="lb">history</span>', 'data-open="history"') + '</div>';
  }
  function people() {
    const L = G.leaderboard();
    return '<div class="tiles">' + T('c4 w2 h2', '<span class="v">#' + (L.me ? L.me.rank : '–') + '</span><span class="lb">top 20 this week</span>', 'data-open="leaderboard"') + T('c2 w2', I('edit') + '<span class="lb">new post</span>', 'data-open="post"') + T('c1', I('chat') + '<span class="lb">chat</span>', 'data-open="chats"') + T('c3', I('users') + '<span class="lb">friends</span>', 'data-open="friends"') + '</div><h2>what’s new</h2>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() {
    return '<div class="lst"><button data-open="settings">weekly goal<small>' + G.goal() + ' workouts</small></button><button data-open="profile">profile<small>visibility, notifications, reminders</small></button><button data-open="settings">settings<small>language, units, sound, backup, reset</small></button></div>';
  }
  K.app({ root: document.getElementById('app'), screens: { start, workout, progress, people, settings },
    chrome: (cur) => { const i = names.indexOf(cur); document.getElementById('pano').innerHTML = cur + '<span>' + names.slice(i + 1).concat(names.slice(0, i)).join(' ') + '</span>'; },
    actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=workout]').click(); } } });
})();
</script>
</body>
</html>
