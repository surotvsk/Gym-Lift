<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>08 · Bauhaus — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F3EEE3; color: #111; font: 15px/1.35 Jost, system-ui, sans-serif;
    --k-acc: #1E4FA3; --k-font: Jost, system-ui, sans-serif; --k-radius: 0px; --k-bg: #F3EEE3; --k-card: #E8E1D2; --k-line: #111; --k-good: #1E4FA3; --k-bad: #E9B8AE; }
  main { flex: 1; overflow-y: auto; padding: 46px 16px 20px; }
  .R { color: #D72E2E; } .Bc { color: #1E4FA3; } .Y { color: #F2C230; }
  .hero { position: relative; height: 270px; margin-bottom: 14px; }
  .hero .c { position: absolute; right: -30px; top: -10px; width: 210px; height: 210px; border-radius: 50%; background: #D72E2E; }
  .hero .sq { position: absolute; left: 0; bottom: 0; width: 130px; height: 130px; background: #1E4FA3; }
  .hero .tr { position: absolute; left: 120px; bottom: 0; width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 120px solid #F2C230; }
  .hero h1 { position: absolute; left: 0; top: 0; margin: 0; font: 800 46px/0.9 Jost, sans-serif; text-transform: uppercase; letter-spacing: -1px; z-index: 2; }
  .hero .n { position: absolute; left: 14px; bottom: 14px; color: #fff; font: 800 64px/1 Jost; z-index: 2; }
  .hero .n small { font-size: 18px; }
  .hero .st { position: absolute; right: 22px; top: 70px; color: #fff; font: 800 18px/1.1 Jost; text-align: right; z-index: 2; }
  .hero .st b { font-size: 54px; display: block; }
  .blk { background: #111; color: #F3EEE3; padding: 16px; margin-bottom: 12px; }
  .blk h2 { margin: 0; font: 800 30px/1 Jost; text-transform: uppercase; }
  .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; padding: 15px 16px; font: 700 17px Jost; cursor: pointer; text-transform: uppercase; letter-spacing: .04em; margin-top: 10px; }
  .btn.r { background: #D72E2E; color: #fff; } .btn.b { background: #1E4FA3; color: #fff; } .btn.y { background: #F2C230; color: #111; } .btn.k { background: #111; color: #F3EEE3; }
  .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 14px; }
  .wk div { aspect-ratio: 1; display: grid; place-items: center; font: 700 12px Jost; border: 2px solid #111; }
  .wk .d1 { background: #D72E2E; color: #fff; border-color: #D72E2E; border-radius: 50%; } .wk .d2 { background: #1E4FA3; color: #fff; border-color: #1E4FA3; } .wk .d0 { background: #F2C230; border-color: #F2C230; clip-path: polygon(50% 0, 100% 100%, 0 100%); padding-top: 30%; }
  .wk .t { outline: 3px solid #111; outline-offset: 2px; }
  .lst button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 2px solid #111; background: none; padding: 12px 0; font: 600 16px Jost; cursor: pointer; color: #111; text-align: left; }
  .lst button span:nth-child(2) { flex: 1; }
  .shp { width: 18px; height: 18px; flex: 0 0 auto; }
  .shp.c { border-radius: 50%; background: #D72E2E; } .shp.s { background: #1E4FA3; } .shp.t { background: #F2C230; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .ex { border-top: 3px solid #111; padding: 12px 0; display: grid; grid-template-columns: 56px 1fr; gap: 12px; }
  .ex .big { width: 56px; height: 56px; }
  .ex h3 { margin: 0; font: 800 20px/1.05 Jost; text-transform: uppercase; }
  .ex .meta { font-size: 13px; color: #555; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .sb { width: 54px; height: 54px; border: 3px solid #111; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 15px Jost; cursor: pointer; color: #111; }
  .sb small { font-size: 10px; font-weight: 500; }
  .sb.c { border-radius: 50%; } .sb.t { clip-path: polygon(50% 0, 100% 100%, 0 100%); border: 0; background: #E8E1D2; padding-top: 18px; }
  .sb.on.c { background: #D72E2E; border-color: #D72E2E; color: #fff; } .sb.on.s { background: #1E4FA3; border-color: #1E4FA3; color: #fff; } .sb.on.t { background: #F2C230; }
  .tools { display: flex; gap: 12px; margin-top: 6px; } .tools button { border: 0; background: none; font: 700 12px Jost; text-transform: uppercase; cursor: pointer; padding: 4px 0; color: #1E4FA3; letter-spacing: .04em; }
  .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .hd h1 { margin: 0; font: 800 34px/1 Jost; text-transform: uppercase; flex: 1; }
  nav { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 0 22px; background: #111; }
  nav button { border: 0; background: none; color: #F3EEE3; font: 700 11px Jost; text-transform: uppercase; padding: 10px 0 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; letter-spacing: .05em; }
  nav button i { width: 16px; height: 16px; display: block; border: 2px solid currentColor; }
  nav button:nth-child(1) i { border-radius: 50%; } nav button:nth-child(3) i { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: currentColor; border: 0; }
  nav button.is-active { color: #F2C230; }
  .post { border-top: 2px solid #111; padding: 10px 0; cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="home"></section><section data-screen="work" hidden></section><section data-screen="form" hidden></section><section data-screen="group" hidden></section><section data-screen="self" hidden></section>
  </main>
  <nav><button data-tab="home"><i></i>Home</button><button data-tab="work"><i></i>Work</button><button data-tab="form"><i></i>Form</button><button data-tab="group"><i></i>Group</button><button data-tab="self"><i></i>Self</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const SH = ['c', 's', 't'];
  const shp = (k) => '<span class="shp ' + SH[k % 3] + '"></span>';
  const li = (k, t, r, attrs) => '<button ' + attrs + '>' + shp(k) + '<span>' + t + '</span><span>' + (r == null ? '→' : r) + '</span></button>';
  function home() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess();
    return '<div class="hero"><h1>Form<br>follows<br>' + (w.met ? 'rest' : 'work') + '</h1><div class="c"></div><div class="sq"></div><div class="tr"></div><div class="n">' + w.done + '<small>/' + w.goal + '</small></div><div class="st">streak<b>' + G.streak() + '</b>weeks</div></div>'
      + '<div class="wk">' + w.days.map((d, k) => '<div class="' + (d.done ? 'd' + (k % 3) : '') + (d.today ? ' t' : '') + '">' + d.d.slice(0, 2) + '</div>').join('') + '</div>'
      + '<div class="blk"><div style="font:700 12px Jost;letter-spacing:.1em;text-transform:uppercase;color:#F2C230">' + (s ? 'In progress' : 'Next composition ✦') + '</div><h2>' + e(s ? s.planName : rec ? rec.name : '') + '</h2><p style="margin:6px 0 0">' + (s ? '<span data-live="elapsed"></span> · ' + G.progress().done + '/' + G.progress().total : G.motivation()) + '</p>' + (s ? '<button class="btn r" data-tab="work">Continue <span>●</span></button>' : rec ? '<button class="btn r" data-do="start" data-arg="' + rec.id + '">Start <span>●</span></button>' : '') + '</div>'
      + '<div class="lst">' + li(0, w.excused ? 'Week excused — undo' : 'Excuse this week', '', 'data-do="excuse"') + li(1, 'Rest timer', null, 'data-open="rest"') + li(2, 'Activity', null, 'data-open="activity"') + li(0, 'Calendar', null, 'data-open="calendar"') + '</div>';
  }
  function work() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="hd"><h1>Plans</h1></div><div class="lst">' + G.plans().map((p, k) => li(k, (p === sel ? '<b>' + e(p.name) + '</b>' : e(p.name)) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + "'", 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="blk" style="margin-top:12px"><h2>' + e(sel.name) + '</h2>' + sel.exercises.map((x, k) => '<div style="display:flex;gap:8px;align-items:center;padding:4px 0">' + shp(k) + '<span style="flex:1">' + e(x.name) + '</span><b>' + x.sets + '×' + x.reps + '</b></div>').join('') + '<button class="btn y" data-do="start" data-arg="' + sel.id + '">Start <span>▲</span></button><button class="btn b" data-open="editplan" data-arg="' + sel.id + '">Edit plan <span>■</span></button></div>' : '')
        + '<div class="lst">' + li(1, 'Manage plans', null, 'data-open="plans"') + li(2, 'New plan', null, 'data-open="newplan"') + li(0, 'Full Body builder', null, 'data-open="fullbody"') + li(1, 'Exercise library', null, 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<div class="hd"><h1 data-live="elapsed"></h1><button class="btn r" style="width:auto;margin:0" data-do="finish">Finish</button></div><div style="height:8px;background:#E8E1D2;margin-bottom:10px"><div style="height:100%;width:' + p.pct + '%;background:#1E4FA3"></div></div>'
      + s.exercises.map((x, i) => { const k = SH[i % 3], c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex"><span class="shp big ' + k + '"' + (i === s.cur ? ' style="outline:3px solid #111;outline-offset:3px"' : '') + '></span><div><h3>' + e(x.name) + '</h3><div class="meta">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="sb ' + k + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w, true) + '</small></button><button class="sb ' + k + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>' + st.r + '</small></button>' : '<button class="sb ' + k + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w, true) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+Set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How</button><button data-open="rest">Rest</button></div></div></div>'; }).join('')
      + '<button class="btn r" data-do="finish">Finish +' + p.xp + ' XP <span>●</span></button><button class="btn k" data-do="discard">Discard <span>■</span></button>';
  }
  function form() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<div class="hd"><h1>Form</h1></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px">' + [['Week', t.week, '#D72E2E'], ['Month', t.month, '#1E4FA3'], ['All', t.all, '#111']].map(([l, x, c]) => '<div style="background:' + c + ';color:#fff;padding:10px"><div style="font:800 32px Jost">' + x.workouts + '</div><small>' + l + '</small></div>').join('') + '</div>'
      + '<div class="Bc">' + K.bars(ser.map((x) => x.sets), { h: 110, gap: 3, labels: ser.map((x) => x.label) }) + '</div>'
      + '<div class="lst">' + G.records().list.slice(0, 4).map((r, k) => li(k, e(r.name), '<b>' + G.fmtW(r.kg) + '</b>', 'data-open="exercise" data-arg="' + r.id + '"')).join('') + li(0, 'All records', null, 'data-open="records"') + li(1, 'History', t.all.workouts, 'data-open="history"') + li(2, 'Achievements', 'L' + G.xp().level, 'data-open="achievements"') + li(0, 'Calendar', null, 'data-open="calendar"') + li(1, 'Body', null, 'data-open="body"') + li(2, 'Food', null, 'data-open="food"') + li(0, 'Photos', null, 'data-open="photos"') + '</div>';
  }
  function group() {
    const L = G.leaderboard();
    return '<div class="hd"><h1>Group</h1></div><div class="blk"><div style="color:#F2C230;font-weight:700">TOP 20</div><h2>No. ' + (L.me ? L.me.rank : '–') + '</h2><button class="btn y" data-open="leaderboard">Table ▲</button></div>'
      + '<div class="lst">' + li(0, 'Post', '+', 'data-open="post"') + li(1, 'Messages', null, 'data-open="chats"') + li(2, 'Friends', G.state.community.friends.length, 'data-open="friends"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function self() {
    return '<div class="hd"><h1>Self</h1></div><div class="lst">' + li(0, 'Weekly goal', G.goal(), 'data-open="settings"') + li(1, 'Profile & reminders', null, 'data-open="profile"') + li(2, 'Settings', null, 'data-open="settings"') + '</div>';
  }
  K.app({ root: document.getElementById('app'), screens: { home, work, form, group, self }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=work]').click(); } } });
})();
</script>
</body>
</html>
