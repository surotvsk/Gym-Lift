<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60 · Atelier — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F7F5F0; color: #0A0A0A; font: 14px/1.6 Jost, system-ui, sans-serif;
    --garnet: #6B0F1A;
    --k-acc: #0A0A0A; --k-font: Jost, sans-serif; --k-head: 'Bodoni Moda', serif; --k-radius: 0px; --k-bg: #F7F5F0; --k-card: #EEEBE3; --k-line: #E2DED4; --k-good: #0A0A0A; --k-bad: #ECE4E0; }
  main { flex: 1; overflow-y: auto; padding: 64px 34px 30px; }
  .brand { font: 400 13px Jost; letter-spacing: .5em; text-align: center; margin-bottom: 46px; }
  .num { font: 400 140px/0.85 'Bodoni Moda', serif; letter-spacing: -6px; }
  .num i { font-style: italic; font-size: 60px; letter-spacing: 0; color: var(--garnet); }
  h1 { font: 400 32px/1.1 'Bodoni Moda', serif; margin: 0 0 8px; }
  h1 em { color: var(--garnet); }
  .cap { font: 300 13px Jost; color: #5A5650; }
  .look { margin: 46px 0; }
  .look img { width: 100%; height: 300px; object-fit: cover; filter: grayscale(1) contrast(1.05); display: block; }
  .look .ln { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
  .look .ln b { font: 400 22px 'Bodoni Moda', serif; } .look .ln span { font: 300 12px Jost; letter-spacing: .1em; }
  .cta { display: inline-block; border: 0; border-bottom: 1px solid #0A0A0A; background: none; padding: 4px 0; font: 400 14px Jost; letter-spacing: .25em; text-transform: uppercase; cursor: pointer; color: #0A0A0A; margin-top: 18px; }
  .cta.g { color: var(--garnet); border-color: var(--garnet); }
  .idx button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; background: none; padding: 9px 0; font: 400 18px 'Bodoni Moda', serif; cursor: pointer; color: #0A0A0A; text-align: left; }
  .idx small { font: 300 12px Jost; color: #5A5650; letter-spacing: .08em; }
  .sets { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0 6px; }
  .s { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: #B3AEA4; font: 400 30px/1 'Bodoni Moda', serif; }
  .s small { display: block; font: 300 11px Jost; letter-spacing: .08em; margin-top: 4px; }
  .s.on { color: #0A0A0A; } .s.on small { color: var(--garnet); }
  .tools { display: flex; flex-wrap: wrap; gap: 16px; } .tools button { border: 0; background: none; color: #5A5650; font: 300 12px Jost; letter-spacing: .1em; cursor: pointer; padding: 2px 0; text-transform: lowercase; }
  .sp { height: 40px; }
  nav { display: flex; gap: 4px; padding: 10px 14px 28px; background: #F7F5F0; }
  nav button { flex: 1; border: 0; background: none; color: #A8A399; font: 400 10px Jost; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: #0A0A0A; }
  .post { cursor: pointer; margin-bottom: 30px; } .post .k-post { border: 0; padding: 0; } .post .k-post-img { filter: grayscale(1); }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="season"></section><section data-screen="collection" hidden></section><section data-screen="archive" hidden></section><section data-screen="salon" hidden></section><section data-screen="maison" hidden></section>
  </main>
  <nav><button data-tab="season">Season</button><button data-tab="collection">Collection</button><button data-tab="archive">Archive</button><button data-tab="salon">Salon</button><button data-tab="maison">Maison</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const ix = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s == null ? '' : s) + '</small></button>';
  function season() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), x0 = rec && rec.exercises[0];
    return '<div class="brand">GYMQUEST</div><div class="num">' + w.done + '<i>/' + w.goal + '</i></div><div class="cap">Week ' + w.num + '. ' + G.motivation() + '</div>'
      + (s ? '<div class="look"><h1>' + e(s.planName) + ', <em>in progress</em></h1><div class="cap"><span data-live="elapsed"></span> since the first look</div><button class="cta g" data-tab="collection">Continue</button></div>'
        : rec ? '<div class="look">' + (x0 ? '<img src="' + G.anyImg(x0.id) + '" alt="">' : '') + '<div class="ln"><b>' + e(rec.name) + '</b><span>' + rec.exercises.length + ' looks</span></div><div class="cap">' + rec.exercises.map((x) => e(x.name)).join(', ') + '. About ' + G.planMinutes(rec) + ' minutes.</div><button class="cta g" data-do="start" data-arg="' + rec.id + '">Begin the collection</button></div>' : '')
      + '<div class="idx">' + ix('Streak', G.streak() + ' weeks', 'data-open="calendar"') + ix('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + ix(w.excused ? 'An excused week' : 'Excuse this week', w.excused ? 'undo' : '', 'data-do="excuse"') + ix('Rest', 'timer', 'data-open="rest"') + ix('Promenade', 'run, walk, ride', 'data-open="activity"') + '</div>';
  }
  function collection() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="brand">COLLECTIONS</div><div class="idx">' + G.plans().map((p) => ix((p === sel ? '<em style="color:#6B0F1A">' + e(p.name) + '</em>' : e(p.name)) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' looks', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="sp"></div><h1>' + e(sel.name) + '</h1>' + sel.exercises.map((x, k) => '<div class="cap">Look ' + (k + 1) + '. ' + e(x.name) + ', ' + x.sets + ' × ' + x.reps + (x.weight ? ', ' + G.fmtW(x.weight) : '') + '</div>').join('') + '<button class="cta g" data-do="start" data-arg="' + sel.id + '">Begin</button>&nbsp;&nbsp;&nbsp;<button class="cta" data-open="editplan" data-arg="' + sel.id + '">Edit</button>' : '')
        + '<div class="sp"></div><div class="idx">' + ix('Order of collections', '', 'data-open="plans"') + ix('New collection', '', 'data-open="newplan"') + ix('Full Body builder', '', 'data-open="fullbody"') + ix('The library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress(), i = s.cur, x = s.exercises[i], c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
    return '<div class="brand">' + e(s.planName).toUpperCase() + '</div><div class="cap" style="text-align:center"><span data-live="elapsed"></span>, look ' + (i + 1) + ' of ' + s.exercises.length + ', rest <span data-live="rest" data-idle="not running" data-done="over"></span></div>'
      + '<div class="look">' + (G.img(x.id) ? '<img src="' + G.img(x.id) + '" alt="' + e(x.name) + '">' : '') + '<div class="ln"><b>' + e(x.name) + '</b><span>look ' + (i + 1) + '</span></div><div class="cap">' + (x.replaces ? 'In place of ' + e(x.replaces) + '.' : c.text + '.') + '</div><div class="sets">'
      + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>' + st.r + ' reps</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
      + '<div class="tools"><button data-open="set" data-arg="' + i + ':' + Math.max(0, x.sets.findIndex((y) => !y.done)) + '">weight</button><button data-do="addset" data-arg="' + i + '">add a set</button><button data-open="replace" data-arg="' + i + '">replace</button><button data-open="exercise" data-arg="' + x.id + '">how to</button><button data-do="rest" data-arg="90">rest 90 s</button></div></div>'
      + '<div class="idx">' + s.exercises.map((y, k) => ix((k === i ? '<em style="color:#6B0F1A">' : '') + (k + 1) + '. ' + e(y.name) + (k === i ? '</em>' : ''), y.sets.filter((z) => z.done).length + ' / ' + y.sets.length, 'data-do="cur" data-arg="' + k + '"')).join('') + '</div>'
      + '<button class="cta g" data-do="finish">Close the show, +' + p.xp + ' XP</button>&nbsp;&nbsp;&nbsp;<button class="cta" data-open="rest">Rest</button>&nbsp;&nbsp;&nbsp;<button class="cta" data-do="discard">Discard</button>';
  }
  function archive() {
    const t = G.totals();
    return '<div class="brand">ARCHIVE</div><div class="num" style="font-size:110px">' + t.all.workouts + '</div><div class="cap">collections shown, ' + t.all.sets + ' looks in total, ' + t.month.workouts + ' this month.</div><div class="sp"></div>' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 70, fill: false, dots: false })
      + '<div class="sp"></div><div class="idx">' + G.records().list.slice(0, 4).map((r) => ix(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + ix('Records', '', 'data-open="records"') + ix('History', '', 'data-open="history"') + ix('Calendar', '', 'data-open="calendar"') + ix('Achievements', '', 'data-open="achievements"') + ix('Body', '', 'data-open="body"') + ix('Food', '', 'data-open="food"') + ix('Photos', '', 'data-open="photos"') + '</div>';
  }
  function salon() {
    const L = G.leaderboard();
    return '<div class="brand">SALON</div><div class="idx">' + ix('Top 20 this week', 'no. ' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + ix('Messages', '', 'data-open="chats"') + ix('Friends', '', 'data-open="friends"') + ix('New post', '', 'data-open="post"') + '</div><div class="sp"></div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function maison() { return '<div class="brand">MAISON</div><div class="idx">' + ix('Weekly goal', G.goal(), 'data-open="settings"') + ix('Profile and reminders', '', 'data-open="profile"') + ix('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { season, collection, archive, salon, maison }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=collection]').click(); } } });
})();
</script>
</body>
</html>
