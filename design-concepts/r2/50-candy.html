<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>50 · Candy — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #FFF7FB; color: #4A2A44; font: 15px/1.4 Fredoka, system-ui, sans-serif;
    background-image: radial-gradient(circle at 10% 20%, rgba(255,77,109,.08) 0 30px, transparent 31px), radial-gradient(circle at 90% 60%, rgba(143,92,255,.08) 0 40px, transparent 41px);
    --red: #FF4D6D; --lime: #9BE564; --grape: #8F5CFF; --orange: #FF9F1C;
    --k-acc: #8F5CFF; --k-font: Fredoka, sans-serif; --k-head: Chewy, cursive; --k-radius: 22px; --k-card: #FBEFF6; --k-line: #F2DCE8; --k-good: #5CC08A; --k-bad: #FFD6DE; }
  main { flex: 1; overflow-y: auto; padding: 44px 14px 18px; }
  h1 { font: 400 34px/1 Chewy, cursive; margin: 0 0 8px; color: var(--grape); }
  .jelly { position: relative; border: 0; border-radius: 26px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); color: #fff; padding: 14px 18px; font: 400 22px Chewy, cursive; cursor: pointer; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15), 0 8px 16px color-mix(in srgb, var(--c) 40%, transparent); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .jelly::before { content: ''; position: absolute; left: 14%; right: 14%; top: 6px; height: 34%; border-radius: 20px; background: linear-gradient(rgba(255,255,255,.7), rgba(255,255,255,0)); }
  .jelly.full { width: 100%; display: block; margin: 8px 0; }
  .jar { position: relative; width: 190px; height: 220px; margin: 0 auto 6px; }
  .jar svg { width: 100%; height: 100%; }
  .gum { transform-box: fill-box; }
  .card { background: #fff; border-radius: 26px; padding: 16px; margin-bottom: 12px; box-shadow: 0 6px 0 #F2DCE8; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 0; border-radius: 999px; padding: 8px 14px; font: 600 13px Fredoka; cursor: pointer; background: #FBEFF6; color: #4A2A44; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .g { width: 54px; height: 60px; border: 0; cursor: pointer; padding: 0; position: relative; background: none; font: 600 13px Fredoka; color: #4A2A44; line-height: 1; }
  .g svg { position: absolute; inset: 0; } .g span { position: relative; display: block; padding-top: 22px; } .g small { display: block; font-size: 9px; }
  .g.on span { color: #fff; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: var(--grape); font: 600 13px Fredoka; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 2px dotted #F2DCE8; background: none; padding: 11px 0; font: 500 16px Fredoka; cursor: pointer; color: #4A2A44; text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #9A7890; }
  nav { display: flex; gap: 6px; padding: 8px 10px 24px; background: #fff; box-shadow: 0 -6px 0 #FBEFF6; }
  nav button { flex: 1; border: 0; border-radius: 18px; background: none; color: #B58BA8; font: 400 15px Chewy, cursive; cursor: pointer; padding: 8px 0; }
  nav button.is-active { background: var(--grape); color: #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="jar"></section><section data-screen="chew" hidden></section><section data-screen="stash" hidden></section><section data-screen="share" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <nav><button data-tab="jar">Jar</button><button data-tab="chew">Train</button><button data-tab="stash">Stash</button><button data-tab="share">Share</button><button data-tab="settings">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const COL = ['#FF4D6D', '#9BE564', '#8F5CFF', '#FF9F1C', '#4CC9F0'];
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  const bear = (col, on) => '<svg viewBox="0 0 54 60"><g fill="' + (on ? col : '#fff') + '" stroke="' + col + '" stroke-width="2.5"><circle cx="15" cy="10" r="7"/><circle cx="39" cy="10" r="7"/><ellipse cx="27" cy="34" rx="20" ry="23"/></g>' + (on ? '<ellipse cx="20" cy="22" rx="6" ry="4" fill="rgba(255,255,255,.6)"/>' : '') + '</svg>';
  function jarSvg(n) {
    let gums = ''; const per = 7;
    for (let k = 0; k < Math.min(n, 42); k++) { const row = Math.floor(k / per), col = k % per; const x = 38 + col * 17 + (row % 2) * 8, y = 196 - row * 16; gums += '<ellipse class="gum" cx="' + x + '" cy="' + y + '" rx="8" ry="7" fill="' + COL[k % 5] + '" stroke="rgba(0,0,0,.12)"/>'; }
    return '<svg viewBox="0 0 190 220"><rect x="55" y="6" width="80" height="18" rx="6" fill="#FF9F1C"/><path d="M40 28 h110 q10 0 10 12 v160 q0 14 -14 14 h-102 q-14 0 -14 -14 v-160 q0 -12 10 -12z" fill="rgba(255,255,255,.7)" stroke="#E7C8DA" stroke-width="3"/>' + gums + '<path d="M44 40 v150" stroke="rgba(255,255,255,.9)" stroke-width="6" stroke-linecap="round"/></svg>';
  }
  function jar() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), sets = G.totals().week.sets + G.progress().done;
    return '<h1>Your gummy jar</h1><div class="jar">' + jarSvg(sets) + '</div><p style="text-align:center;margin:0 0 10px">' + sets + ' gummies this week, one for every set. ' + w.done + ' of ' + w.goal + ' workouts done.</p>'
      + (s ? '<button class="jelly full" style="--c:#8F5CFF" data-tab="chew">Keep going, <span data-live="elapsed"></span></button>' : rec ? '<button class="jelly full" style="--c:#FF4D6D" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + '</button>' : '')
      + '<div class="card"><div class="pills"><button class="pill" data-open="calendar">' + G.streak() + '-week streak</button><button class="pill" data-open="achievements">Level ' + X.level + ', ' + X.total + ' XP</button><button class="pill" data-do="excuse">' + (w.excused ? 'Week excused, undo' : 'Excuse this week') + '</button><button class="pill" data-open="rest">Rest timer</button><button class="pill" data-open="activity">Run, walk, ride</button></div><p style="margin:10px 0 0">' + G.motivation() + '</p></div>';
  }
  function chew() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Pick a flavour</h1>' + G.plans().map((p, k) => '<button class="jelly full" style="--c:' + COL[k % 5] + (p === sel ? ';outline:4px solid #4A2A44' : '') + '" data-do="select" data-arg="' + p.id + '">' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</button>').join('')
        + (sel ? '<div class="card">' + sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between"><span>' + e(x.name) + '</span><span>' + x.sets + '×' + x.reps + '</span></div>').join('') + '<div class="pills" style="margin-top:10px"><button class="pill" style="background:#FF4D6D;color:#fff" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button><button class="pill" data-open="editplan" data-arg="' + sel.id + '">Edit</button><button class="pill" data-open="plans">Reorder</button><button class="pill" data-open="newplan">New</button><button class="pill" data-open="fullbody">Full body</button><button class="pill" data-open="library">Library</button></div></div>' : '');
    }
    const p = G.progress();
    return '<h1 data-live="elapsed"></h1><p style="margin:-4px 0 10px">' + e(s.planName) + ', ' + p.done + ' of ' + p.total + ' gummies. Rest <span data-live="rest" data-idle="off" data-done="over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), col = COL[i % 5];
        return '<div class="card"' + (i === s.cur ? ' style="box-shadow:0 6px 0 ' + col + '"' : '') + '><b style="font-size:17px">' + e(x.name) + '</b><div style="color:#9A7890;font-size:13px">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="g' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">' + bear(col, st.L) + '<span>L<small>' + G.fmtW(st.w) + '</small></span></button><button class="g' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">' + bear(col, st.R) + '<span>R<small>×' + st.r + '</small></span></button>' : '<button class="g' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + bear(col, st.done) + '<span>' + st.r + '<small>' + G.fmtW(st.w) + '</small></span></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Swap</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="jelly full" style="--c:#5CC08A" data-do="finish">Finish, +' + p.xp + ' XP</button><div class="pills"><button class="pill" data-open="rest">Rest timer</button><button class="pill" data-do="discard">Discard</button></div>';
  }
  function stash() {
    const t = G.totals();
    return '<h1>The stash</h1><div class="card" style="color:#FF4D6D"><b style="color:#4A2A44">Gummies per week</b>' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 90, labels: G.weeklySeries(8).map((x) => x.label) }) + '</div>'
      + '<div class="card lst">' + li('This month', t.month.workouts + ' workouts', 'data-open="history"') + li('All time', t.all.workouts + ' workouts, ' + t.all.sets + ' gummies', 'data-open="history"') + G.records().list.slice(0, 3).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="card lst">' + li('Records', '', 'data-open="records"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function share() {
    const L = G.leaderboard();
    return '<h1>Share</h1><div class="card lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('New post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() { return '<h1>Settings</h1><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { jar, chew, stash, share, settings }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=chew]').click(); } } });
})();
</script>
</body>
</html>
