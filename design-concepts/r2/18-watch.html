<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18 · Watch — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; color: #fff; font: 15px/1.35 Rubik, system-ui, sans-serif;
    --k-bg: #111; --k-fg: #fff; --k-mute: #8E8E93; --k-card: #1C1C1E; --k-line: #2C2C2E; --k-acc: #A6FF00; --k-acc-fg: #000; --k-font: Rubik, sans-serif; --k-radius: 22px; --k-good: #2E7D32; --k-bad: #3A1C1C; }
  main { flex: 1; overflow-y: auto; padding: 44px 14px 16px; }
  .face { position: relative; width: 320px; height: 320px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1C1C1E, #050505 70%); box-shadow: 0 0 0 6px #1C1C1E, 0 0 0 8px #333; }
  .face svg.r { position: absolute; inset: 0; }
  .ctr { position: absolute; inset: 70px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ctr .t { color: #8E8E93; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .ctr .v { font: 800 44px/1 Rubik; } .ctr .n { font: 700 20px/1.1 Rubik; }
  .cmp { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: #1C1C1E; border: 0; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 16px Rubik; }
  .cmp small { font: 500 9px Rubik; color: #8E8E93; text-transform: uppercase; }
  .cmp.tl { left: 6px; top: 26px; } .cmp.tr { right: 6px; top: 26px; } .cmp.bl { left: 6px; bottom: 26px; } .cmp.br { right: 6px; bottom: 26px; }
  .cmp .kico { width: 20px; height: 20px; }
  .startbtn { margin-top: 8px; border: 0; border-radius: 999px; background: #A6FF00; color: #000; font: 800 15px Rubik; padding: 9px 20px; cursor: pointer; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; justify-items: center; }
  .app-i { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; color: #8E8E93; font: 500 11px Rubik; cursor: pointer; }
  .app-i span { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #000; }
  .pill { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-radius: 22px; background: #1C1C1E; color: #fff; padding: 14px 16px; margin-bottom: 8px; font: 500 16px Rubik; cursor: pointer; text-align: left; }
  .pill .grow { flex: 1; } .pill small { display: block; color: #8E8E93; font-size: 13px; }
  .pill.on { box-shadow: inset 0 0 0 2px #A6FF00; }
  .h { font: 800 26px Rubik; margin: 4px 4px 12px; }
  .dot { position: absolute; width: 34px; height: 34px; margin: -17px; border-radius: 50%; border: 2px solid #3A3A3C; background: #000; color: #8E8E93; font: 700 11px Rubik; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .dot.on { background: #A6FF00; border-color: #A6FF00; color: #000; } .dot.cur { border-color: #fff; color: #fff; }
  .crown { display: flex; justify-content: center; gap: 18px; margin: -4px 0 12px; }
  .crown button { width: 54px; height: 54px; border-radius: 50%; border: 0; background: #1C1C1E; color: #fff; font: 700 24px Rubik; cursor: pointer; }
  .crown button.ok { width: 120px; border-radius: 27px; background: #A6FF00; color: #000; font-size: 17px; }
  .row { display: flex; gap: 8px; } .row .pill { justify-content: center; }
  nav { display: flex; justify-content: center; gap: 10px; padding: 8px 0 26px; }
  nav button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: #3A3A3C; cursor: pointer; padding: 0; }
  nav button.is-active { background: #fff; width: 26px; border-radius: 5px; }
  .post { background: #1C1C1E; border-radius: 22px; padding: 12px; margin-bottom: 8px; cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #111; color: #fff; border-color: #333; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="face"></section><section data-screen="workout" hidden></section><section data-screen="activity" hidden></section><section data-screen="friends" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <nav><button data-tab="face" aria-label="Face"></button><button data-tab="workout" aria-label="Workout"></button><button data-tab="activity" aria-label="Activity"></button><button data-tab="friends" aria-label="Friends"></button><button data-tab="settings" aria-label="Settings"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const arc = (r, pct, col, w) => { const c = 2 * Math.PI * r; return '<circle cx="160" cy="160" r="' + r + '" fill="none" stroke="' + col + '" stroke-opacity=".22" stroke-width="' + w + '"/><circle cx="160" cy="160" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + c * (1 - Math.min(1, pct)) + '" transform="rotate(-90 160 160)"/>'; };
  const P = (t, s, r, attrs, cls) => '<button class="pill ' + (cls || '') + '" ' + attrs + '><span class="grow">' + t + (s ? '<small>' + s + '</small>' : '') + '</span>' + (r || '') + '</button>';
  const A = (ic, l, col, attrs) => '<button class="app-i" ' + attrs + '><span style="background:' + col + '">' + I(ic) + '</span>' + l + '</button>';
  function face() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="face"><svg class="r" viewBox="0 0 320 320">' + arc(150, w.done / w.goal, '#A6FF00', 8) + arc(138, X.into / X.need, '#00D4FF', 6) + '</svg>'
      + '<button class="cmp tl" data-open="calendar"><b>' + G.streak() + '</b><small>streak</small></button><button class="cmp tr" data-open="achievements"><b>' + X.level + '</b><small>level</small></button>'
      + '<button class="cmp bl" data-open="rest">' + (G.rest() ? '<b data-live="rest" style="font-size:13px"></b>' : I('timer')) + '<small>rest</small></button><button class="cmp br" data-do="excuse">' + I('flag') + '<small>' + (w.excused ? 'excused' : 'excuse') + '</small></button>'
      + '<div class="ctr"><span class="t" data-live="clock"></span><span class="v">' + w.done + '/' + w.goal + '</span>' + (s ? '<span class="n" data-live="elapsed"></span><button class="startbtn" data-tab="workout">Resume</button>' : rec ? '<span class="n">' + e(rec.name) + ' ✦</span><button class="startbtn" data-do="start" data-arg="' + rec.id + '">Start</button>' : '') + '</div></div>'
      + '<div class="apps">' + A('run', 'Activity', '#A6FF00', 'data-open="activity"') + A('scale', 'Body', '#00D4FF', 'data-open="body"') + A('utensils', 'Food', '#FF9F0A', 'data-open="food"') + A('camera', 'Photos', '#BF5AF2', 'data-open="photos"') + A('trophy', 'Records', '#FFD60A', 'data-open="records"') + A('clock', 'History', '#64D2FF', 'data-open="history"') + A('book', 'Library', '#30D158', 'data-open="library"') + A('chat', 'Messages', '#0A84FF', 'data-open="chats"') + '</div>';
  }
  function workout() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="h">Workouts</div>' + G.plans().map((p) => P(e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' exercises · ' + G.planMinutes(p) + ' min', I('chevron'), 'data-do="select" data-arg="' + p.id + '"', p === sel ? 'on' : '')).join('')
        + (sel ? P('<b style="color:#A6FF00">Start ' + e(sel.name) + '</b>', '', I('play'), 'data-do="start" data-arg="' + sel.id + '"') + P('Edit ' + e(sel.name), '', I('edit'), 'data-open="editplan" data-arg="' + sel.id + '"') : '') + P('Manage plans', '', I('list'), 'data-open="plans"') + P('New plan', '', I('plus'), 'data-open="newplan"') + P('Full Body builder', '', I('grid'), 'data-open="fullbody"');
    }
    const i = s.cur, x = s.exercises[i], j = Math.max(0, x.sets.findIndex((y) => !y.done)), st = x.sets[j], all = x.sets.every((y) => y.done), n = x.sets.length, c = G.compare(s.planId, x.id, st.w, st.r);
    const dots = x.sets.map((y, k) => { const a = -Math.PI / 2 + (k + .5) * (2 * Math.PI / n) - Math.PI / 2.2 * 0; const px = 160 + 146 * Math.cos(-Math.PI / 2 + k * 2 * Math.PI / Math.max(n, 6)), py = 160 + 146 * Math.sin(-Math.PI / 2 + k * 2 * Math.PI / Math.max(n, 6));
      return x.unilateral ? '<button class="dot' + (y.done ? ' on' : k === j ? ' cur' : '') + '" style="left:' + px + 'px;top:' + py + 'px" data-do="set" data-arg="' + i + ':' + k + ':' + (y.L ? 'R' : 'L') + '">' + (y.L && !y.R ? 'R' : k + 1) + '</button>' : '<button class="dot' + (y.done ? ' on' : k === j ? ' cur' : '') + '" style="left:' + px + 'px;top:' + py + 'px" data-do="set" data-arg="' + i + ':' + k + '">' + (k + 1) + '</button>'; }).join('');
    return '<div class="face"><svg class="r" viewBox="0 0 320 320">' + arc(118, G.progress().pct / 100, '#A6FF00', 6) + '</svg>' + dots
      + '<div class="ctr"><span class="t">' + e(x.name) + '</span><button data-open="set" data-arg="' + i + ':' + j + '" style="border:0;background:none;color:#fff;cursor:pointer;padding:0" class="v">' + G.fmtW(st.w) + '</button><span class="n" style="font-size:15px;color:#8E8E93">× ' + st.r + (x.unilateral ? ' each side' : '') + '</span><span class="t" style="margin-top:6px;color:' + (c.kind === 'up' ? '#A6FF00' : '#8E8E93') + '">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</span></div></div>'
      + '<div class="crown"><button data-do="wminus" data-arg="' + i + ':' + j + '">−</button>' + (all ? '<button class="ok" data-do="next">Next</button>' : x.unilateral ? '<button class="ok" data-do="set" data-arg="' + i + ':' + j + ':' + (st.L ? 'R' : 'L') + '">' + (st.L ? 'Right' : 'Left') + '</button>' : '<button class="ok" data-do="set" data-arg="' + i + ':' + j + '">Done</button>') + '<button data-do="wplus" data-arg="' + i + ':' + j + '">+</button></div>'
      + '<div class="row">' + P('', '', I('back'), 'data-do="prev" aria-label="Previous"') + P('<span data-live="elapsed"></span>', '', '', 'data-open="rest"') + P('', '', I('chevron'), 'data-do="next" aria-label="Next"') + '</div>'
      + P('Rest', '<span data-live="rest" data-idle="tap for presets" data-done="over"></span>', I('timer'), 'data-open="rest"') + P('Replace exercise', '', I('swap'), 'data-open="replace" data-arg="' + i + '"') + P('How to', '', I('info'), 'data-open="exercise" data-arg="' + x.id + '"') + P('Add a set', '', I('plus'), 'data-do="addset" data-arg="' + i + '"')
      + P('<b style="color:#A6FF00">End workout</b>', '+' + G.progress().xp + ' XP', I('check'), 'data-do="finish"') + P('Discard', '', I('x'), 'data-do="discard"');
  }
  function activity() {
    const t = G.totals();
    return '<div class="face" style="width:250px;height:250px"><svg class="r" viewBox="0 0 320 320">' + arc(140, t.week.workouts / G.goal(), '#FF375F', 22) + arc(112, t.week.minutes / 180, '#A6FF00', 22) + arc(84, t.week.sets / 60, '#00D4FF', 22) + '</svg></div>'
      + P('Workouts', t.week.workouts + ' / ' + G.goal() + ' this week', '<b style="color:#FF375F">' + t.all.workouts + '</b>', 'data-open="history"') + P('Minutes', t.week.minutes + ' this week', '<b style="color:#A6FF00">' + t.month.minutes + '</b>', 'data-open="calendar"') + P('Sets', t.week.sets + ' this week', '<b style="color:#00D4FF">' + t.month.sets + '</b>', 'data-open="records"')
      + P('Achievements', 'Level ' + G.xp().level, I('medal'), 'data-open="achievements"') + G.history().slice(0, 3).map((w) => P(e(w.planName), G.fmtDate(w.date) + ' · ' + w.minutes + ' min', I('chevron'), 'data-open="workout" data-arg="' + w.id + '"')).join('');
  }
  function friends() {
    const L = G.leaderboard();
    return '<div class="h">Friends</div>' + P('Top 20', 'You are #' + (L.me ? L.me.rank : '–'), I('star'), 'data-open="leaderboard"') + P('Messages', '', I('chat'), 'data-open="chats"') + P('Friends', G.state.community.friends.length + ' friends', I('users'), 'data-open="friends"') + P('Post', '', I('edit'), 'data-open="post"')
      + G.feed().slice(0, 4).map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() { return '<div class="h">Settings</div>' + P('Weekly goal', G.goal() + ' workouts', I('target'), 'data-open="settings"') + P('Profile & reminders', '', I('bell'), 'data-open="profile"') + P('All settings', '', I('settings'), 'data-open="settings"'); }
  K.app({ root: document.getElementById('app'), screens: { face, workout, activity, friends, settings },
    actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=workout]').click(); }, next: () => { const s = G.sess(); if (s.cur >= s.exercises.length - 1 && s.exercises[s.cur].sets.every((y) => y.done)) K.finish(); else G.setCurrent(s.cur + 1); } } });
})();
</script>
</body>
</html>
