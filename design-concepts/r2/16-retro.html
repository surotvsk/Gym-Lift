<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>16 · Retro — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F6E7C8; color: #3B2314; font: 15px/1.4 'Bricolage Grotesque', system-ui, sans-serif;
    --k-acc: #D9541E; --k-font: 'Bricolage Grotesque', sans-serif; --k-head: Shrikhand, serif; --k-bg: #F6E7C8; --k-card: #EED9B0; --k-line: #D9BE8B; --k-radius: 22px; --k-good: #C9861A; --k-bad: #E8C9A8; }
  main { flex: 1; overflow-y: auto; padding: 46px 16px 20px; }
  .stripes { height: 34px; margin: 0 -16px 10px; background: linear-gradient(#E8A33D 0 25%, #D9541E 25% 50%, #9C3B1A 50% 75%, #5A2A14 75%); }
  .sunbox { position: relative; overflow: hidden; border-radius: 26px; background: #5A2A14; color: #F6E7C8; padding: 18px; margin-bottom: 14px; min-height: 240px; }
  .sun { position: absolute; right: -110px; top: -60px; width: 260px; height: 260px; border-radius: 50%; background: repeating-linear-gradient(#F2B23A 0 26px, transparent 26px 34px); opacity: .95; }
  .sunbox > *:not(.sun) { position: relative; }
  h1 { font: 400 40px/0.95 Shrikhand, serif; margin: 0; color: #D9541E; text-shadow: 3px 3px 0 #5A2A14; }
  .sunbox h1 { color: #F2B23A; text-shadow: 3px 3px 0 #9C3B1A; }
  .big { font: 800 64px/1 'Bricolage Grotesque'; }
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; background: #D9541E; color: #F6E7C8; font: 400 22px Shrikhand, serif; padding: 12px; cursor: pointer; box-shadow: 0 5px 0 #9C3B1A; margin-top: 10px; }
  .btn.mus { background: #E8A33D; color: #3B2314; box-shadow: 0 5px 0 #A96E14; }
  .card { background: #FFF3DC; border: 3px solid #5A2A14; border-radius: 22px; padding: 14px; margin-bottom: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .two .card { margin: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .lab { font: 800 12px 'Bricolage Grotesque'; letter-spacing: .12em; text-transform: uppercase; color: #9C3B1A; }
  .wk { display: flex; gap: 4px; margin-top: 10px; } .wk i { flex: 1; height: 44px; border-radius: 22px 22px 6px 6px; background: rgba(246,231,200,.18); font-style: normal; display: grid; place-items: end center; padding-bottom: 4px; font-size: 11px; font-weight: 800; }
  .wk i.d { background: #F2B23A; color: #5A2A14; } .wk i.t { box-shadow: inset 0 0 0 2px #F2B23A; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .s { width: 60px; height: 60px; border-radius: 50%; border: 3px solid #5A2A14; background: #F6E7C8; font: 800 16px 'Bricolage Grotesque'; cursor: pointer; color: #3B2314; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .s small { font-size: 9px; } .s.on { background: repeating-linear-gradient(#E8A33D 0 8px, #D9541E 8px 16px); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { border: 2px solid #5A2A14; background: #F6E7C8; border-radius: 999px; padding: 6px 11px; font: 800 12px 'Bricolage Grotesque'; cursor: pointer; color: #3B2314; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 2px dotted #C9A46A; background: none; padding: 11px 0; font: 800 16px 'Bricolage Grotesque'; color: #3B2314; cursor: pointer; text-align: left; }
  nav { display: flex; background: #5A2A14; padding: 8px 6px 24px; border-top: 6px solid #E8A33D; box-shadow: 0 -6px 0 #D9541E; }
  nav button { flex: 1; border: 0; background: none; color: #E8C9A8; font: 400 15px Shrikhand, serif; padding: 6px 0; cursor: pointer; }
  nav button.is-active { color: #F2B23A; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="home"></section><section data-screen="pump" hidden></section><section data-screen="gains" hidden></section><section data-screen="club" hidden></section><section data-screen="me" hidden></section>
  </main>
  <nav><button data-tab="home">Home</button><button data-tab="pump">Pump</button><button data-tab="gains">Gains</button><button data-tab="club">Club</button><button data-tab="me">Me</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const li = (a, b, attrs) => '<button ' + attrs + '><span>' + a + '</span><span>' + (b == null ? '→' : b) + '</span></button>';
  function home() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="stripes"></div><div class="sunbox"><div class="sun"></div><div class="lab" style="color:#E8C9A8">Week ' + w.num + '</div><h1>Keep on<br>truckin’</h1><div class="big" style="margin-top:6px">' + w.done + '<span style="font-size:24px">/' + w.goal + '</span></div><div class="wk">' + w.days.map((d) => '<i class="' + (d.done ? 'd' : '') + (d.today ? ' t' : '') + '">' + d.d.slice(0, 2) + '</i>').join('') + '</div></div>'
      + '<div class="card"><div class="lab">' + (s ? 'Now playing' : 'Up next ✦') + '</div><h1 style="font-size:32px;text-shadow:2px 2px 0 #E8A33D">' + e(s ? s.planName : rec ? rec.name : '') + '</h1><p style="margin:6px 0 0">' + (s ? '<span data-live="elapsed"></span> · ' + G.progress().done + '/' + G.progress().total + ' sets' : G.motivation()) + '</p>'
      + (s ? '<button class="btn" data-tab="pump">Groove on</button>' : rec ? '<button class="btn" data-do="start" data-arg="' + rec.id + '">Let’s boogie</button>' : '') + '</div>'
      + '<div class="two"><button class="card" data-open="calendar"><div class="lab">Streak</div><div class="big" style="font-size:40px">' + G.streak() + '</div>weeks</button><button class="card" data-open="achievements"><div class="lab">Level</div><div class="big" style="font-size:40px">' + X.level + '</div>' + X.total + ' XP</button></div>'
      + '<div class="card lst">' + li(w.excused ? 'Week excused, man' : 'Excuse this week', w.excused ? 'undo' : '', 'data-do="excuse"') + li('Rest timer', null, 'data-open="rest"') + li('Jog, stroll or ride', null, 'data-open="activity"') + '</div>';
  }
  function pump() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Pick your jam</h1><div style="height:12px"></div><div class="card lst">' + G.plans().map((p) => li((p === sel ? '★ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="card"><div class="lab">Side A · ' + e(sel.name) + '</div>' + sel.exercises.map((x, k) => '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>' + (k + 1) + '. ' + e(x.name) + '</span><b>' + x.sets + '×' + x.reps + '</b></div>').join('') + '<button class="btn" data-do="start" data-arg="' + sel.id + '">Drop the needle</button><div class="chips"><button data-open="editplan" data-arg="' + sel.id + '">Edit</button><button data-open="plans">Reorder</button><button data-open="newplan">New plan</button><button data-open="fullbody">Full body</button><button data-open="library">Library</button></div></div>' : '');
    }
    const p = G.progress();
    return '<div class="sunbox" style="min-height:0"><div class="lab" style="color:#E8C9A8">' + e(s.planName) + ' · ' + p.done + '/' + p.total + '</div><div class="big" data-live="elapsed"></div><div class="chips"><button data-open="rest">Rest <span data-live="rest" data-idle="" data-done="over"></span></button><button data-do="rest" data-arg="90">90 s</button><button data-do="finish">Finish</button><button data-do="discard">Discard</button></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card"' + (i === s.cur ? ' style="border-color:#D9541E;box-shadow:0 5px 0 #D9541E"' : '') + '><div class="lab">Track ' + (i + 1) + ' · ' + (x.replaces ? 'cover of ' + e(x.replaces) : c.text) + '</div><b style="font-size:20px">' + e(x.name) + '</b><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>×' + st.r + '</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="chips"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Swap</button><button data-open="exercise" data-arg="' + x.id + '">How</button></div></div>'; }).join('')
      + '<button class="btn" data-do="finish">That’s a wrap · +' + p.xp + ' XP</button>';
  }
  function gains() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<h1>Far-out gains</h1><div style="height:12px"></div><div class="two"><button class="card" data-open="history"><div class="lab">This month</div><div class="big" style="font-size:40px">' + t.month.workouts + '</div></button><button class="card" data-open="history"><div class="lab">All time</div><div class="big" style="font-size:40px">' + t.all.workouts + '</div></button></div>'
      + '<div class="card"><div class="lab">Sets per week</div><div style="color:#D9541E">' + K.bars(ser.map((x) => x.sets), { h: 100, labels: ser.map((x) => x.label) }) + '</div></div>'
      + '<div class="card"><div class="lab">Greatest hits</div>' + G.records().list.slice(0, 4).map((r) => '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>' + e(r.name) + '</span><b>' + G.fmtW(r.kg) + '</b></div>').join('') + '</div>'
      + '<div class="card lst">' + li('All records', null, 'data-open="records"') + li('History', null, 'data-open="history"') + li('Calendar', null, 'data-open="calendar"') + li('Gold records', null, 'data-open="achievements"') + li('Body', null, 'data-open="body"') + li('Food', null, 'data-open="food"') + li('Photos', null, 'data-open="photos"') + '</div>';
  }
  function club() {
    const L = G.leaderboard();
    return '<h1>The club</h1><div style="height:12px"></div><div class="sunbox" style="min-height:0"><div class="lab" style="color:#E8C9A8">Top 20 · this week</div><div class="big">#' + (L.me ? L.me.rank : '–') + '</div><button class="btn mus" data-open="leaderboard">See the charts</button></div>'
      + '<div class="chips" style="margin-bottom:14px"><button data-open="post">New post</button><button data-open="chats">Messages</button><button data-open="friends">Friends</button></div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function me() { return '<h1>Groovy you</h1><div style="height:12px"></div><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile & reminders', null, 'data-open="profile"') + li('Settings', null, 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { home, pump, gains, club, me }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=pump]').click(); } } });
})();
</script>
</body>
</html>
