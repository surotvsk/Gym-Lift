<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>49 · Tide — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0B3C49; color: #E4F4F1; font: 15px/1.45 Lexend, system-ui, sans-serif;
    --sea: #1E6F7A; --foam: #E4F4F1; --sand: #E9D8B4;
    --k-bg: #0E4554; --k-fg: #E4F4F1; --k-mute: #9CC7C4; --k-card: #155563; --k-line: #22687A; --k-acc: #E9D8B4; --k-acc-fg: #0B3C49; --k-font: Lexend, sans-serif; --k-radius: 18px; --k-good: #2C8C91; --k-bad: #3A4A55; }
  main { flex: 1; overflow-y: auto; padding: 44px 16px 18px; }
  h1 { font: 300 30px/1.1 Lexend; margin: 0 0 4px; }
  .mute { color: #9CC7C4; }
  .chart { position: relative; margin: 12px -16px 6px; height: 190px; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .wave { animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translateX(-24px); } }
  @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
  .lbl { font: 600 12px Lexend; fill: #9CC7C4; }
  .card { background: rgba(228,244,241,.08); border: 1px solid rgba(228,244,241,.14); border-radius: 22px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .big { font: 600 40px/1 Lexend; }
  .btn { display: block; width: 100%; border: 0; border-radius: 999px; background: var(--sand); color: #0B3C49; font: 600 16px Lexend; padding: 15px; cursor: pointer; margin-top: 12px; }
  .btn.o { background: none; color: var(--foam); box-shadow: inset 0 0 0 1px rgba(228,244,241,.4); }
  .bubbles { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .bb { width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid rgba(228,244,241,.5); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), transparent 50%); color: var(--foam); font: 600 14px Lexend; cursor: pointer; line-height: 1; }
  .bb small { display: block; font-size: 9px; font-weight: 400; color: #9CC7C4; }
  .bb.on { background: radial-gradient(circle at 35% 30%, #fff, #9FE3DA 50%, #2C8C91); color: #0B3C49; border-color: #9FE3DA; } .bb.on small { color: #0B3C49; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; } .tools button { border: 0; background: none; color: var(--sand); font: 400 13px Lexend; cursor: pointer; padding: 2px 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid rgba(228,244,241,.12); background: none; padding: 12px 0; font: 400 15px Lexend; cursor: pointer; color: var(--foam); text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #9CC7C4; }
  nav { display: flex; background: #082E38; padding: 8px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #6FA3A6; font: 400 12px Lexend; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: var(--sand); font-weight: 600; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #0B3C49; color: #E4F4F1; border-color: #22687A; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="tide"></section><section data-screen="swim" hidden></section><section data-screen="log" hidden></section><section data-screen="harbour" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <nav><button data-tab="tide">Tide</button><button data-tab="swim">Train</button><button data-tab="log">Log</button><button data-tab="harbour">Harbour</button><button data-tab="settings">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  /* tide chart: weekly sets as a smooth curve, current week marked */
  function tideChart(series, h) {
    h = h || 190; const W = 390, max = Math.max(...series.map((x) => x.sets), 1), n = series.length;
    const pts = series.map((x, k) => [k * W / (n - 1), h - 30 - (x.sets / max) * (h - 60)]);
    let d = 'M' + pts[0].join(' ');
    for (let k = 1; k < n; k++) { const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], mx = (x0 + x1) / 2; d += ' C' + mx + ' ' + y0 + ', ' + mx + ' ' + y1 + ', ' + x1 + ' ' + y1; }
    const last = pts[n - 1];
    return '<svg viewBox="0 0 ' + W + ' ' + h + '" preserveAspectRatio="none"><defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C8C91"/><stop offset="1" stop-color="#0B3C49"/></linearGradient></defs>'
      + '<g class="wave"><path d="' + d + ' L' + (W + 30) + ' ' + last[1] + ' L' + (W + 30) + ' ' + h + ' L0 ' + h + 'Z" fill="url(#sea)" opacity=".85"/></g><path d="' + d + '" fill="none" stroke="#E4F4F1" stroke-width="2"/>'
      + series.map((x, k) => '<text class="lbl" x="' + Math.min(W - 16, Math.max(14, pts[k][0])) + '" y="' + (h - 8) + '" text-anchor="middle">' + x.label + '</text>').join('')
      + '<circle cx="' + (last[0] - 6) + '" cy="' + last[1] + '" r="6" fill="#E9D8B4"/></svg>';
  }
  function tide() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), ser = G.weeklySeries(8), cur = ser[ser.length - 1], prev = ser[ser.length - 2];
    const rising = cur.sets >= prev.sets * (w.done / Math.max(1, w.goal));
    return '<div class="mute">' + G.fmtDate(G.today(), true) + '</div><h1>' + (w.met ? 'High tide. Goal reached.' : rising ? 'The tide is coming in.' : 'Low tide. A good day to go out.') + '</h1>'
      + '<div class="chart">' + tideChart(ser) + '</div><div class="mute" style="font-size:13px">Sets per week for the last 8 weeks. This week: ' + cur.sets + ' sets, ' + w.done + ' of ' + w.goal + ' workouts.</div>'
      + (s ? '<div class="card"><div class="row"><b>' + e(s.planName) + '</b><span data-live="elapsed"></span></div><button class="btn" data-tab="swim">Back in the water</button></div>'
        : rec ? '<div class="card"><div class="mute">Next swell ✦</div><div class="row"><b style="font-size:22px">' + e(rec.name) + '</b><span class="mute">' + G.planMinutes(rec) + ' min</span></div><button class="btn" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + '</button></div>' : '')
      + '<div class="card"><div class="row"><span>Streak</span><span class="big">' + G.streak() + '</span></div><div class="mute">' + G.motivation() + '</div></div>'
      + '<div class="card lst">' + li('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Run, walk, ride', '', 'data-open="activity"') + li('Calendar', '', 'data-open="calendar"') + '</div>';
  }
  function swim() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Plans</h1><div class="card lst">' + G.plans().map((p) => li((p === sel ? '◉ ' : '○ ') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="card"><b style="font-size:20px">' + e(sel.name) + '</b>' + sel.exercises.map((x) => '<div class="row" style="padding:3px 0"><span>' + e(x.name) + '</span><span class="mute">' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</span></div>').join('') + '<button class="btn" data-do="start" data-arg="' + sel.id + '">Start</button><button class="btn o" data-open="editplan" data-arg="' + sel.id + '">Edit</button></div>' : '')
        + '<div class="card lst">' + li('Reorder plans', '', 'data-open="plans"') + li('New plan', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    const wave = '<svg viewBox="0 0 390 80" preserveAspectRatio="none" style="width:100%;height:80px;display:block;margin:0 -16px;width:calc(100% + 32px)"><path class="wave" d="M0 ' + (70 - p.pct * .55) + ' Q 50 ' + (60 - p.pct * .55) + ' 100 ' + (70 - p.pct * .55) + ' T 200 ' + (70 - p.pct * .55) + ' T 300 ' + (70 - p.pct * .55) + ' T 420 ' + (70 - p.pct * .55) + ' V 80 H 0 Z" fill="#2C8C91"/></svg>';
    return '<div class="mute">' + e(s.planName) + '</div><h1 data-live="elapsed"></h1>' + wave + '<div class="mute">' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="not running" data-done="is over"></span>.</div><div style="height:10px"></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card"' + (i === s.cur ? ' style="border-color:#E9D8B4"' : '') + '><b>' + e(x.name) + '</b><div class="mute" style="font-size:13px">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="bubbles">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="bb' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="bb' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>×' + st.r + '</small></button>' : '<button class="bb' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">Add a set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90 s</button></div></div>'; }).join('')
      + '<button class="btn" data-do="finish">Back to shore, +' + p.xp + ' XP</button><button class="btn o" data-open="rest">Rest timer</button><button class="btn o" data-do="discard">Discard</button>';
  }
  function log() {
    const t = G.totals();
    return '<h1>Logbook</h1><div class="card"><div class="row"><span>This month</span><span class="big">' + t.month.workouts + '</span></div><div class="row"><span>All time</span><span class="big">' + t.all.workouts + '</span></div></div>'
      + '<div class="card lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="card lst">' + li('Records', '', 'data-open="records"') + li('History', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function harbour() {
    const L = G.leaderboard();
    return '<h1>Harbour</h1><div class="card lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('New post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() { return '<h1>Settings</h1><div class="card lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { tide, swim, log, harbour, settings }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=swim]').click(); } } });
})();
</script>
</body>
</html>
