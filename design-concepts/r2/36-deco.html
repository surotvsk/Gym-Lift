<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>36 · Deco — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0E1B1A; color: #EFE6D2; font: 15px/1.45 'Josefin Sans', system-ui, sans-serif;
    --gold: #C9A24B; --jade: #2F6B5E;
    --k-bg: #13231F; --k-fg: #EFE6D2; --k-mute: #B3A98F; --k-card: #1B2F2A; --k-line: #3C4E44; --k-acc: #C9A24B; --k-acc-fg: #0E1B1A; --k-font: 'Josefin Sans', sans-serif; --k-head: 'Poiret One', serif; --k-radius: 0px; --k-good: #2F6B5E; --k-bad: #3B2A26; }
  main { flex: 1; overflow-y: auto; padding: 44px 16px 16px; text-align: center; }
  .crown { display: flex; justify-content: center; margin-bottom: 4px; }
  h1 { font: 400 34px/1.05 'Poiret One', serif; margin: 6px 0; letter-spacing: .06em; color: #EFE6D2; }
  .sub { color: #B3A98F; margin: 0 0 12px; letter-spacing: .04em; }
  .sun { position: relative; width: 250px; height: 250px; margin: 0 auto 10px; }
  .sun svg { position: absolute; inset: 0; }
  .sun .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .sun .n b { font: 400 66px/1 'Poiret One'; color: var(--gold); }
  .frame { position: relative; border: 1px solid var(--gold); padding: 18px 14px; margin: 14px 4px; }
  .frame::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(201,162,75,.45); pointer-events: none; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
  .frame h2 { font: 400 26px 'Poiret One'; margin: 0 0 4px; color: var(--gold); letter-spacing: .05em; }
  .lift { display: inline-block; border: 0; background: var(--gold); color: #0E1B1A; font: 600 15px 'Josefin Sans'; letter-spacing: .14em; padding: 13px 28px; cursor: pointer; margin-top: 10px; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%); }
  .lift.jade { background: var(--jade); color: #EFE6D2; } .lift.thin { background: none; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); clip-path: none; padding: 10px 18px; }
  .rule { display: flex; align-items: center; gap: 10px; color: var(--gold); margin: 16px 0 8px; font: 400 18px 'Poiret One'; letter-spacing: .1em; }
  .rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .menu { text-align: left; }
  .menu button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #2B3B35; background: none; color: #EFE6D2; padding: 12px 2px; font: 400 16px 'Josefin Sans'; cursor: pointer; text-align: left; letter-spacing: .02em; }
  .menu small { color: #B3A98F; }
  .ex { text-align: left; border-top: 1px solid #2B3B35; padding: 12px 0; }
  .ex h3 { margin: 0; font: 400 22px 'Poiret One'; color: #EFE6D2; } .ex.cur h3 { color: var(--gold); }
  .ex .m { color: #B3A98F; font-size: 13px; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .gem { width: 54px; height: 54px; border: 1px solid var(--gold); background: none; color: #EFE6D2; transform: rotate(45deg); cursor: pointer; padding: 0; margin: 6px; }
  .gem span { display: block; transform: rotate(-45deg); font: 600 13px 'Josefin Sans'; line-height: 1.1; } .gem small { display: block; font-size: 9px; color: #B3A98F; }
  .gem.on { background: var(--gold); color: #0E1B1A; } .gem.on small { color: #3D3315; }
  .tools { display: flex; flex-wrap: wrap; gap: 14px; } .tools button { border: 0; background: none; color: var(--gold); font: 400 13px 'Josefin Sans'; cursor: pointer; padding: 3px 0; letter-spacing: .04em; }
  .wk { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
  .wk i { width: 12px; height: 12px; transform: rotate(45deg); border: 1px solid var(--gold); } .wk i.d { background: var(--gold); } .wk i.t { background: var(--jade); }
  nav { display: flex; justify-content: center; gap: 2px; border-top: 1px solid var(--gold); padding: 8px 4px 24px; background: #0A1413; }
  nav button { flex: 1; border: 0; background: none; color: #8F8770; font: 400 14px 'Poiret One'; letter-spacing: .08em; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: var(--gold); }
  .post { text-align: left; cursor: pointer; border-bottom: 1px solid #2B3B35; padding: 8px 0; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #13231F; color: #EFE6D2; border-color: #3C4E44; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="lobby"></section><section data-screen="salon" hidden></section><section data-screen="ledger" hidden></section><section data-screen="guests" hidden></section><section data-screen="desk" hidden></section>
  </main>
  <nav><button data-tab="lobby">Lobby</button><button data-tab="salon">Salon</button><button data-tab="ledger">Ledger</button><button data-tab="guests">Guests</button><button data-tab="desk">Desk</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const crown = '<div class="crown"><svg width="90" height="22" viewBox="0 0 90 22"><path d="M0 21h90M10 21V11l10-10 10 10v10M60 21V11l10-10 10 10v10M30 21V6l15-5 15 5v15" fill="none" stroke="#C9A24B"/></svg></div>';
  const m = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  function sunburst(pct) {
    let rays = ''; const n = 36;
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 - Math.PI / 2, lit = k / n < pct; rays += '<line x1="' + (125 + 70 * Math.cos(a)) + '" y1="' + (125 + 70 * Math.sin(a)) + '" x2="' + (125 + (k % 2 ? 110 : 122) * Math.cos(a)) + '" y2="' + (125 + (k % 2 ? 110 : 122) * Math.sin(a)) + '" stroke="' + (lit ? '#C9A24B' : '#3C4E44') + '" stroke-width="' + (k % 2 ? 1 : 2) + '"/>'; }
    return '<svg viewBox="0 0 250 250">' + rays + '<circle cx="125" cy="125" r="64" fill="none" stroke="#C9A24B"/><circle cx="125" cy="125" r="58" fill="none" stroke="#C9A24B" stroke-opacity=".4"/></svg>';
  }
  function lobby() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return crown + '<h1>The Grand Gymnasium</h1><p class="sub">' + G.fmtDate(G.today(), true) + '</p>'
      + '<div class="sun">' + sunburst(w.done / w.goal) + '<div class="n"><b>' + w.done + '</b><span>of ' + w.goal + ' this week</span></div></div>'
      + '<div class="wk">' + w.days.map((d) => '<i class="' + (d.done ? 'd' : d.today ? 't' : '') + '" title="' + d.d + '"></i>').join('') + '</div><p class="sub">' + G.motivation() + '</p>'
      + '<div class="frame"><h2>' + e(s ? s.planName : rec ? rec.name : '') + '</h2><div class="sub" style="margin:0">' + (s ? 'In session for <span data-live="elapsed"></span>' : rec ? 'This evening’s programme, ' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' minutes' : '') + '</div>'
      + (s ? '<button class="lift" data-tab="salon">Return to the salon</button>' : rec ? '<button class="lift" data-do="start" data-arg="' + rec.id + '">Begin</button>' : '') + '</div>'
      + '<div class="rule">Your standing</div><div class="menu">' + m('Streak', G.streak() + ' weeks', 'data-open="calendar"') + m('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + m(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + m('Rest timer', '', 'data-open="rest"') + m('A stroll, a run, a ride', '', 'data-open="activity"') + '</div>';
  }
  function salon() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return crown + '<h1>Programmes</h1><div class="menu">' + G.plans().map((p) => m((p === sel ? '◆ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="frame"><h2>' + e(sel.name) + '</h2>' + sel.exercises.map((x) => '<div class="sub" style="margin:2px 0">' + e(x.name) + ', ' + x.sets + ' × ' + x.reps + (x.weight ? ' at ' + G.fmtW(x.weight) : '') + '</div>').join('') + '<button class="lift" data-do="start" data-arg="' + sel.id + '">Begin</button><br><button class="lift thin" data-open="editplan" data-arg="' + sel.id + '">Edit the programme</button></div>' : '')
        + '<div class="menu">' + m('Order of the evening', 'reorder plans', 'data-open="plans"') + m('Compose a new programme', '', 'data-open="newplan"') + m('Full Body builder', '', 'data-open="fullbody"') + m('The exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return crown + '<h1 data-live="elapsed"></h1><p class="sub">' + e(s.planName) + ', ' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="not running" data-done="is over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><h3>' + e(x.name) + '</h3><div class="m">' + (x.replaces ? 'In place of ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="gem' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L"><span>L<small>' + G.fmtW(st.w) + '</small></span></button><button class="gem' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R"><span>R<small>×' + st.r + '</small></span></button>' : '<button class="gem' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '"><span>' + st.r + '<small>' + G.fmtW(st.w) + '</small></span></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">Another set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90 s</button></div></div>'; }).join('')
      + '<button class="lift" data-do="finish">Conclude, +' + p.xp + ' XP</button><br><button class="lift thin" data-open="rest">Rest timer</button> <button class="lift thin" data-do="discard">Leave early</button>';
  }
  function ledger() {
    const t = G.totals();
    return crown + '<h1>The ledger</h1><p class="sub">' + t.all.workouts + ' sessions, ' + t.all.sets + ' sets, ' + t.month.workouts + ' this month</p><div style="color:#C9A24B">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90, fill: false }) + '</div>'
      + '<div class="rule">Distinctions</div><div class="menu">' + G.records().list.slice(0, 4).map((r) => m(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="rule">Archives</div><div class="menu">' + m('Every session', '', 'data-open="history"') + m('Calendar', '', 'data-open="calendar"') + m('Records', '', 'data-open="records"') + m('Honours', '', 'data-open="achievements"') + m('Body', '', 'data-open="body"') + m('Dining', 'your food log', 'data-open="food"') + m('Portraits', 'progress photos', 'data-open="photos"') + '</div>';
  }
  function guests() {
    const L = G.leaderboard();
    return crown + '<h1>Guests</h1><div class="menu">' + m('Top 20 of the week', 'you are #' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + m('Correspondence', '', 'data-open="chats"') + m('Friends', '', 'data-open="friends"') + m('Leave a note', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function desk() { return crown + '<h1>Front desk</h1><div class="menu">' + m('Weekly goal', G.goal() + ' sessions', 'data-open="settings"') + m('Profile and reminders', '', 'data-open="profile"') + m('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { lobby, salon, ledger, guests, desk }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=salon]').click(); } } });
})();
</script>
</body>
</html>
