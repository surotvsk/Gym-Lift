<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>04 · Agenda — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; color: #1D1B20; font: 15px/1.4 'DM Sans', system-ui, sans-serif;
    --k-acc: #E8553E; --k-font: 'DM Sans', system-ui, sans-serif; --k-good: #3A9D6B; --k-bad: #F4D3CC; }
  header { padding: 48px 18px 8px; border-bottom: 1px solid #EEE; }
  header .r { display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 24px; }
  header .ic { display: flex; gap: 4px; }
  header .ic button { border: 0; background: #F5F3F2; border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; color: #1D1B20; }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 12px; text-align: center; }
  .strip button { border: 0; background: none; padding: 4px 0 6px; border-radius: 12px; cursor: pointer; font: inherit; color: #8B8790; }
  .strip b { display: block; font-size: 17px; color: #1D1B20; }
  .strip i { display: block; width: 6px; height: 6px; border-radius: 50%; margin: 3px auto 0; background: transparent; }
  .strip .d i { background: #3A9D6B; } .strip .t { background: #E8553E; color: #fff; } .strip .t b { color: #fff; }
  main { flex: 1; overflow-y: auto; padding: 4px 18px 20px; }
  .day { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 14px 0; border-bottom: 1px solid #F0EEEC; }
  .dl { text-align: center; color: #8B8790; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .dl b { display: block; font-size: 24px; color: #1D1B20; letter-spacing: 0; }
  .day.today .dl b { color: #E8553E; }
  .ev { border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; border: 0; width: 100%; text-align: start; font: inherit; display: block; }
  .ev.done { background: #E6F4EC; border-left: 4px solid #3A9D6B; color: #1D1B20; }
  .ev.plan { background: #FDEBE7; border-left: 4px solid #E8553E; color: #1D1B20; }
  .ev.act { background: #E9EEFB; border-left: 4px solid #4D6BD8; }
  .ev.idea { background: #fff; border: 1.5px dashed #D9D5D2; color: #8B8790; }
  .ev small { display: block; color: #6F6B72; font-size: 13px; }
  .ev .go { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; background: #E8553E; color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font: 700 14px 'DM Sans', sans-serif; cursor: pointer; }
  .rest { color: #B5B1B6; font-size: 14px; padding-top: 6px; }
  .sec { font: 700 12px 'DM Sans'; text-transform: uppercase; letter-spacing: .08em; color: #8B8790; margin: 18px 0 6px; }
  /* session as timeline */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: #EEE; }
  .tli { position: relative; padding: 0 0 18px; }
  .tli::before { content: ''; position: absolute; left: -23px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #D9D5D2; }
  .tli.d::before { background: #3A9D6B; border-color: #3A9D6B; } .tli.c::before { border-color: #E8553E; box-shadow: 0 0 0 4px #FDEBE7; }
  .tli h3 { margin: 0; font-size: 17px; } .tli .cmp { font-size: 13px; color: #8B8790; } .cmp.up { color: #3A9D6B !important; } .cmp.down { color: #C2410C !important; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .slot { border: 1.5px solid #E2DEDB; background: #fff; border-radius: 12px; padding: 8px 10px; font: 600 14px 'DM Sans'; cursor: pointer; color: #1D1B20; min-width: 62px; }
  .slot small { display: block; font-weight: 500; font-size: 11px; color: #8B8790; }
  .slot.on { background: #3A9D6B; border-color: #3A9D6B; color: #fff; } .slot.on small { color: #DDF2E5; }
  .tools { display: flex; gap: 12px; margin-top: 6px; }
  .tools button { border: 0; background: none; color: #E8553E; font: 600 13px 'DM Sans'; cursor: pointer; padding: 4px 0; }
  .bar { display: flex; align-items: center; gap: 10px; background: #1D1B20; color: #fff; border-radius: 16px; padding: 12px 14px; margin: 10px 0 16px; }
  .bar b { font-size: 22px; flex: 1; font-variant-numeric: tabular-nums; }
  .bar button { border: 0; border-radius: 10px; padding: 8px 12px; font: 600 13px 'DM Sans'; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; }
  .bar .fin { background: #E8553E; }
  /* month */
  .mhead { display: flex; align-items: center; gap: 8px; margin: 10px 0; } .mhead b { flex: 1; font-size: 20px; }
  .mhead button { border: 0; background: #F5F3F2; border-radius: 10px; padding: 8px 10px; cursor: pointer; font: 600 13px 'DM Sans'; color: inherit; }
  .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mgrid span { text-align: center; font-size: 11px; color: #8B8790; padding: 4px 0; }
  .mgrid button { aspect-ratio: 1; border: 0; border-radius: 50%; background: none; font: 600 14px 'DM Sans'; cursor: pointer; position: relative; color: #1D1B20; }
  .mgrid .s-done { background: #3A9D6B; color: #fff; } .mgrid .s-missed { color: #C9A39A; } .mgrid .out { opacity: .35; } .mgrid .tod { box-shadow: inset 0 0 0 2px #E8553E; } .mgrid .sel { outline: 2px solid #1D1B20; }
  .mgrid small { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 8px; }
  .detail { background: #FAF8F7; border-radius: 16px; padding: 12px; margin-top: 12px; }
  .lst button { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; border-bottom: 1px solid #F0EEEC; background: none; padding: 13px 0; font: inherit; color: inherit; cursor: pointer; text-align: start; }
  .lst small { color: #8B8790; }
  nav { display: flex; border-top: 1px solid #EEE; padding: 6px 4px 24px; background: #fff; }
  nav button { flex: 1; background: none; border: 0; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #A19DA3; font: 600 11px 'DM Sans'; cursor: pointer; }
  nav button.is-active { color: #E8553E; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <header id="hdr"></header>
  <main data-scroll>
    <section data-screen="agenda"></section><section data-screen="month" hidden></section><section data-screen="session" hidden></section><section data-screen="crew" hidden></section><section data-screen="me" hidden></section>
  </main>
  <nav><button data-tab="agenda"></button><button data-tab="month"></button><button data-tab="session"></button><button data-tab="crew"></button><button data-tab="me"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const N = { agenda: ['list', 'Agenda'], month: ['calendar', 'Month'], session: ['dumbbell', 'Session'], crew: ['users', 'Crew'], me: ['user', 'Me'] };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(N[b.dataset.tab][0]) + N[b.dataset.tab][1]; });
  const t0 = G.parse(G.today()); let my = t0.getFullYear(), mm = t0.getMonth(), selDay = G.today();

  function header() {
    const w = G.weekInfo();
    document.getElementById('hdr').innerHTML = '<div class="r"><div><small style="color:#8B8790">Week ' + w.num + ' · ' + w.done + ' of ' + w.goal + ' done · ' + G.streak() + '-week streak</small><h1>' + G.MONTHS[t0.getMonth()] + ' ' + t0.getFullYear() + '</h1></div><div class="ic"><button data-open="calendar" aria-label="Calendar">' + I('calendar') + '</button><button data-open="settings" aria-label="Settings">' + I('settings') + '</button></div></div>'
      + '<div class="strip">' + w.days.map((d) => '<button class="' + (d.done ? 'd ' : '') + (d.today ? 't' : '') + '" data-open="day" data-arg="' + d.date + '">' + d.d.slice(0, 2) + '<b>' + d.n + '</b><i></i></button>').join('') + '</div>';
  }

  function agenda() {
    const w = G.weekInfo(), rec = G.recommended(), plans = G.plans(), s = G.sess();
    let left = w.left, ri = plans.indexOf(rec);
    const days = [];
    for (let k = -3; k <= 6; k++) days.push(G.addDays(G.today(), k));
    return days.map((d) => {
      const day = G.day(d), isT = d === G.today(), fut = d > G.today();
      let body = day.workouts.map((x) => '<button class="ev done" data-open="workout" data-arg="' + x.id + '"><b>' + e(x.planName) + '</b><small>' + x.minutes + ' min · ' + x.exercises.reduce((a, y) => a + y.setsDone, 0) + ' sets · +' + x.xp + ' XP</small></button>').join('')
        + day.activities.map((a) => '<div class="ev act"><b>' + G.ACT_LABEL[a.kind] + '</b><small>' + a.minutes + ' min' + (a.km ? ' · ' + a.km + ' km' : '') + '</small></div>').join('');
      if (isT && s) body += '<div class="ev plan"><b>' + e(s.planName) + ' · in progress</b><small><span data-live="elapsed"></span> · ' + G.progress().done + '/' + G.progress().total + ' sets</small><button class="go" data-tab="session">Open session</button></div>';
      else if (isT && !day.workouts.length && rec) { body += '<div class="ev plan"><b>' + e(rec.name) + ' ✦</b><small>' + rec.exercises.length + ' exercises · about ' + G.planMinutes(rec) + ' min</small><button class="go" data-do="start" data-arg="' + rec.id + '">' + I('play') + ' Start</button></div>'; left--; ri++; }
      else if (fut && left > 0 && (G.wdi(d) % 2 === 0 || 7 - G.wdi(d) <= left) && G.weekKey(d) === w.key) { const p = plans[ri % plans.length]; body += '<button class="ev idea" data-do="select" data-arg="' + p.id + '"><b>Suggested: ' + e(p.name) + '</b><small>to reach your goal of ' + w.goal + '</small></button>'; left--; ri++; }
      if (!body) body = '<div class="rest">' + (fut ? 'Free' : 'Rest day') + '</div>';
      return (G.wdi(d) === 0 ? '<div class="sec">Week ' + G.weekKey(d).split('W')[1] + (G.isExcused(G.weekKey(d)) ? ' · excused' : '') + '</div>' : '') + '<div class="day' + (isT ? ' today' : '') + '"><div class="dl">' + G.WD[G.wdi(d)] + '<b>' + G.parse(d).getDate() + '</b></div><div>' + body + '</div></div>';
    }).join('') + '<div class="lst" style="margin-top:8px"><button data-do="excuse"><span>' + (w.excused ? 'This week is excused' : 'Excuse this week') + '</span><small>keeps the streak</small></button><button data-open="activity"><span>Log an activity</span><small>run · walk · ride</small></button></div>';
  }

  function month() {
    const M = G.month(my, mm), d = G.day(selDay);
    return '<div class="mhead"><button data-do="mprev">' + I('back') + '</button><b>' + M.title + '</b><button data-do="mtoday">Today</button><button data-do="mnext">' + I('chevron') + '</button></div>'
      + '<div class="mgrid">' + G.WD.map((x) => '<span>' + x.slice(0, 1) + '</span>').join('') + M.days.map((x) => '<button class="s-' + x.status + (x.out ? ' out' : '') + (x.today ? ' tod' : '') + (x.date === selDay ? ' sel' : '') + '" data-do="pick" data-arg="' + x.date + '">' + x.n + (x.out ? '<small>' + x.mon + '</small>' : x.count > 1 ? '<small>×' + x.count + '</small>' : '') + '</button>').join('') + '</div>'
      + '<div class="detail"><b>' + d.label + '</b><div style="color:#8B8790;font-size:13px;margin-bottom:6px">' + { done: 'Trained', missed: 'No workout recorded', future: 'Coming up' }[d.status] + '</div>' + d.workouts.map((x) => '<button class="ev done" data-open="workout" data-arg="' + x.id + '"><b>' + e(x.planName) + '</b><small>' + x.exercises.map((y) => e(y.name)).join(', ') + '</small></button>').join('') + d.achievements.map((a) => '<div style="font-size:13px">' + a.icon + ' ' + e(a.name) + '</div>').join('') + '</div>'
      + '<div class="sec">Progress</div><div class="lst"><button data-open="history"><span>All workouts</span><small>' + G.state.history.length + '</small></button><button data-open="records"><span>Personal records</span><small>' + G.records().list.length + '</small></button><button data-open="achievements"><span>Achievements · level ' + G.xp().level + '</span><small>' + G.xp().total + ' XP</small></button><button data-open="body"><span>Body</span><small>' + ((G.bodyLatest('weight') || {}).value || '—') + ' kg</small></button><button data-open="food"><span>Food</span><small>' + G.foodDay().kcal + ' kcal</small></button><button data-open="photos"><span>Progress photos</span><small>' + G.state.photos.length + '</small></button></div>';
  }

  function session() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="sec">Choose a plan</div><div class="lst">' + G.plans().map((p) => '<button data-do="select" data-arg="' + p.id + '"><span>' + (p === sel ? '● ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</span><small>' + p.exercises.length + ' ex · ' + G.planMinutes(p) + ' min</small></button>').join('') + '</div>'
        + (sel ? '<div class="ev plan" style="margin-top:12px"><b>' + e(sel.name) + '</b><small>' + sel.exercises.map((x) => e(x.name) + ' ' + x.sets + '×' + x.reps).join(' · ') + '</small><button class="go" data-do="start" data-arg="' + sel.id + '">' + I('play') + ' Start now</button></div>' : '')
        + '<div class="tools" style="flex-wrap:wrap"><button data-open="editplan" data-arg="' + (sel ? sel.id : '') + '">Edit plan</button><button data-open="plans">Manage plans</button><button data-open="newplan">New plan</button><button data-open="fullbody">Full Body builder</button><button data-open="library">Exercise library</button><button data-open="rest">Rest timer</button></div>';
    }
    return '<div class="bar"><span>' + e(s.planName) + '</span><b data-live="elapsed"></b><button data-open="rest">' + I('timer') + ' <span data-live="rest" data-idle="Rest" data-done="Over"></span></button><button class="fin" data-do="finish">Finish</button></div>'
      + '<div class="tl">' + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps); const dn = x.sets.every((y) => y.done);
        return '<div class="tli' + (dn ? ' d' : i === s.cur ? ' c' : '') + '"><h3>' + e(x.name) + '</h3><div class="cmp ' + c.kind + '">' + (x.replaces ? 'Replaces ' + e(x.replaces) : c.text) + (x.unilateral ? ' · left and right' : '') + '</div><div class="slots">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="slot' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="slot' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>'
            : '<button class="slot' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + '<small>× ' + st.r + (st.planFail ? ' · fail' : '') + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weights</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90 s</button></div></div>'; }).join('') + '</div>'
      + '<div class="lst"><button data-do="discard"><span style="color:#C2410C">Discard workout</span><small></small></button></div>';
  }

  function crew() {
    const L = G.leaderboard();
    return '<div class="sec">Upcoming with friends</div><div class="ev act" style="cursor:default"><b>Anna · Leg day</b><small>Fri 18:00 · she shared a plan with you</small></div>'
      + '<div class="lst"><button data-open="chats"><span>Messages</span><small>' + G.chats().reduce((a, c) => a + c.unread, 0) + ' unread</small></button><button data-open="friends"><span>Friends</span><small>' + G.state.community.friends.length + '</small></button><button data-open="leaderboard"><span>Top 20 this week</span><small>#' + (L.me ? L.me.rank : '–') + '</small></button><button data-open="post"><span>New post</span><small>' + I('edit') + '</small></button></div>'
      + '<div class="sec">Feed</div>' + G.feed().map((p) => '<div data-open="postview" data-arg="' + p.id + '" style="cursor:pointer">' + K.postCard(p) + '</div>').join('');
  }
  function me() {
    return '<div class="sec">You</div><div style="display:flex;gap:12px;align-items:center">' + K.avatar('me', 56) + '<div><b style="font-size:20px">' + e(G.state.profile.name) + '</b><div style="color:#8B8790">Level ' + G.xp().level + ' · ' + G.xp().total + ' XP</div></div></div>'
      + '<div class="lst" style="margin-top:12px"><button data-open="settings"><span>Weekly goal</span><small>' + G.goal() + ' a week</small></button><button data-open="profile"><span>Community profile and reminders</span><small>' + I('chevron') + '</small></button><button data-open="settings"><span>Settings</span><small>' + I('chevron') + '</small></button></div>';
  }

  const app = K.app({ root: document.getElementById('app'), screens: { agenda, month, session, crew, me }, chrome: header,
    actions: {
      start: (a) => { G.start(a); app.go('session'); },
      pick: (a) => { selDay = a; app.render(true); },
      mprev: () => { mm--; if (mm < 0) { mm = 11; my--; } app.render(true); }, mnext: () => { mm++; if (mm > 11) { mm = 0; my++; } app.render(true); },
      mtoday: () => { my = t0.getFullYear(); mm = t0.getMonth(); selDay = G.today(); app.render(true); },
    } });
})();
</script>
</body>
</html>
