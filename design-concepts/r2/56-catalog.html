<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>56 · Catalog — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #6B4A2B; color: #2A2A2A; font: 14px/1.45 'Libre Caslon Text', Georgia, serif;
    background-image: repeating-linear-gradient(92deg, rgba(0,0,0,.06) 0 2px, transparent 2px 14px), linear-gradient(#8A5F38, #6B4A2B);
    --stamp: #5B3A8C;
    --k-acc: #5B3A8C; --k-font: 'Courier Prime', monospace; --k-head: 'Libre Caslon Text', serif; --k-radius: 2px; --k-bg: #FBF8F0; --k-card: #F1EBDC; --k-line: #DCD2BC; --k-good: #5B3A8C; --k-bad: #EADFD2; }
  main { flex: 1; overflow-y: auto; padding: 44px 12px 16px; }
  .drawer { background: linear-gradient(#C9975F, #B98552); border-radius: 4px; padding: 10px; margin-bottom: 12px; box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 3px 0 #4A321C; }
  .holder { width: 120px; margin: 0 auto 8px; background: linear-gradient(#E3C98A, #B8963F); border-radius: 3px; text-align: center; padding: 3px; font: 700 12px 'Courier Prime'; color: #3B2A10; box-shadow: inset 0 0 0 1px #7C5E1E; }
  .pull { width: 60px; height: 12px; margin: 6px auto 0; border-radius: 0 0 20px 20px; background: linear-gradient(#D8BC7A, #8F6F2C); }
  .card { position: relative; background: #FBF8F0; padding: 12px 12px 12px 14px; margin-bottom: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.25); font-family: 'Courier Prime', monospace; }
  .card::before { content: ''; position: absolute; left: 50%; bottom: 8px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #6B4A2B; box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
  .card .call { position: absolute; top: 10px; right: 12px; font: 700 12px 'Courier Prime'; color: #7A6F5C; }
  .card h2 { font: 700 19px/1.2 'Libre Caslon Text', serif; margin: 0 0 4px; padding-right: 60px; }
  .card .line { border-bottom: 1px solid #DCD2BC; padding: 3px 0; display: flex; justify-content: space-between; gap: 8px; }
  .stamp { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); padding: 2px 8px; font: 700 13px 'Courier Prime'; transform: rotate(-4deg); opacity: .9; letter-spacing: .04em; }
  .due { margin: 8px 0 18px; }
  .due table { width: 100%; border-collapse: collapse; font: 13px 'Courier Prime'; }
  .due td { border: 1px solid #DCD2BC; padding: 2px 6px; } .due td:first-child { color: var(--stamp); font-weight: 700; }
  .btn { display: inline-block; border: 1.5px solid #2A2A2A; background: #FBF8F0; padding: 9px 14px; font: 700 14px 'Courier Prime'; cursor: pointer; color: #2A2A2A; margin-top: 8px; box-shadow: 2px 2px 0 #2A2A2A; }
  .btn.p { background: var(--stamp); color: #FBF8F0; border-color: var(--stamp); box-shadow: 2px 2px 0 #2A2A2A; }
  .ck { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; height: 30px; border: 1.5px solid #2A2A2A; background: #fff; font: 700 13px 'Courier Prime'; cursor: pointer; color: #2A2A2A; margin: 3px 3px 0 0; padding: 0 4px; }
  .ck.on { border-color: var(--stamp); color: var(--stamp); transform: rotate(-3deg); background: #F3EEFA; }
  .ck.on::before { content: '✓\00a0'; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; } .tools button { border: 0; background: none; font: 400 12px 'Courier Prime'; text-decoration: underline; cursor: pointer; padding: 2px 0; color: #2A2A2A; }
  .ix button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px dotted #B9AE95; background: none; padding: 8px 0; font: 400 14px 'Courier Prime'; cursor: pointer; color: #2A2A2A; text-align: left; }
  .ix button:last-child { border: 0; } .ix small { color: #7A6F5C; }
  nav { display: flex; gap: 4px; background: #4A321C; padding: 6px 6px 24px; }
  nav button { flex: 1; border: 0; background: linear-gradient(#C9975F, #A97843); color: #3B2A10; font: 700 12px 'Courier Prime'; cursor: pointer; padding: 8px 0; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  nav button.is-active { background: #FBF8F0; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; font-family: 'Libre Caslon Text', serif; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="desk"></section><section data-screen="stacks" hidden></section><section data-screen="records" hidden></section><section data-screen="patrons" hidden></section><section data-screen="office" hidden></section>
  </main>
  <nav><button data-tab="desk">Desk</button><button data-tab="stacks">Train</button><button data-tab="records">Records</button><button data-tab="patrons">Patrons</button><button data-tab="office">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const call = (id) => { const l = G.LIBMAP[id]; const n = { chest: 610, back: 620, shoulders: 630, arms: 640, legs: 650, glutes: 660, core: 670 }[l ? l.primary : 'core'] || 699; return n + '.' + String(Math.max(1, G.LIB.findIndex((x) => x.id === id) + 1)).padStart(2, '0'); };
  const ix = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  const drawer = (label, inner) => '<div class="drawer"><div class="holder">' + label + '</div>' + inner + '<div class="pull"></div></div>';
  function desk() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), h = G.history().slice(0, 4);
    const due = rec ? (w.left > 0 ? 'TODAY' : 'NEXT WEEK') : '';
    return drawer('Circulation desk', '<div class="card"><span class="call">WK ' + w.num + '</span><h2>' + (s ? e(s.planName) + ', checked out' : rec ? e(rec.name) + ' ✦' : 'No plan') + '</h2>'
      + (s ? '<div>Out for <span data-live="elapsed"></span>, ' + G.progress().done + ' of ' + G.progress().total + ' sets.</div><button class="btn p" data-tab="stacks">Back to the stacks</button>'
        : rec ? '<div>' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' min.</div><div class="due"><span class="stamp">DUE ' + due + '</span><table>' + h.map((x) => '<tr><td>' + G.fmtShort(x.date).toUpperCase() + '</td><td>' + e(x.planName) + '</td></tr>').join('') + '</table></div><button class="btn p" data-do="start" data-arg="' + rec.id + '">Check out ' + e(rec.name) + '</button>' : '') + '<div style="height:18px"></div></div>')
      + drawer('Patron record', '<div class="card"><h2>' + e(G.state.profile.name) + '</h2><div class="line"><span>This week</span><span>' + w.done + ' of ' + w.goal + '</span></div><div class="line"><span>Streak</span><span>' + G.streak() + ' weeks</span></div><div class="line"><span>Level</span><span>' + X.level + ' (' + X.total + ' XP)</span></div><div style="margin-top:6px">' + G.motivation() + '</div><div class="ix" style="margin:6px 0 16px">' + ix(w.excused ? 'Week excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + ix('Rest timer', '', 'data-open="rest"') + ix('Run, walk, ride', '', 'data-open="activity"') + ix('Calendar', '', 'data-open="calendar"') + ix('Achievements', '', 'data-open="achievements"') + '</div></div>');
  }
  function stacks() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return drawer('Plans, A to Z by rotation', G.plans().map((p, k) => '<div class="card" style="cursor:pointer" data-do="select" data-arg="' + p.id + '"><span class="call">' + (k + 1) + '</span><h2>' + (p === sel ? '▸ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : '') + '</h2>' + p.exercises.map((x) => e(x.name)).join('; ') + '.<div style="height:16px"></div></div>').join(''))
        + (sel ? '<button class="btn p" data-do="start" data-arg="' + sel.id + '">Check out ' + e(sel.name) + '</button> <button class="btn" data-open="editplan" data-arg="' + sel.id + '">Edit the card</button>' : '')
        + drawer('Cataloguing', '<div class="card ix">' + ix('Reorder plans', '', 'data-open="plans"') + ix('New plan', '', 'data-open="newplan"') + ix('Full Body builder', '', 'data-open="fullbody"') + ix('Subject index (library)', '48', 'data-open="library"') + '<div style="height:16px"></div></div>');
    }
    const p = G.progress();
    return drawer(e(s.planName) + ', <span data-live="elapsed"></span>', '<div style="color:#3B2A10;text-align:center;font:700 13px Courier Prime;margin-bottom:6px">' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="off" data-done="over"></span></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card"' + (i === s.cur ? ' style="outline:2px solid #5B3A8C"' : '') + '><span class="call">' + call(x.id) + '</span><h2>' + e(x.name) + '</h2><div style="font-size:12px;color:#7A6F5C">' + (x.replaces ? 'Substitute for ' + e(x.replaces) : c.text) + '</div><div>'
          + x.sets.map((st, j) => x.unilateral ? '<button class="ck' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L ' + G.fmtW(st.w) + '</button><button class="ck' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R ×' + st.r + '</button>' : '<button class="ck' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + '×' + st.r + '</button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">weight</button><button data-do="addset" data-arg="' + i + '">add set</button><button data-open="replace" data-arg="' + i + '">substitute</button><button data-open="exercise" data-arg="' + x.id + '">see also</button><button data-do="rest" data-arg="90">rest 90</button></div><div style="height:10px"></div></div>'; }).join(''))
      + '<button class="btn p" data-do="finish">Return and stamp, +' + p.xp + ' XP</button> <button class="btn" data-open="rest">Rest timer</button> <button class="btn" data-do="discard">Discard</button>';
  }
  function records() {
    const t = G.totals();
    return drawer('Accessions', '<div class="card"><div class="line"><span>This week</span><span>' + t.week.workouts + '</span></div><div class="line"><span>This month</span><span>' + t.month.workouts + '</span></div><div class="line"><span>All time</span><span>' + t.all.workouts + ' (' + t.all.sets + ' sets)</span></div><div style="color:#5B3A8C">' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 70 }) + '</div><div style="height:12px"></div></div>')
      + drawer('Records by call number', G.records().list.slice(0, 4).map((r) => '<div class="card" style="cursor:pointer" data-open="exercise" data-arg="' + r.id + '"><span class="call">' + call(r.id) + '</span><h2>' + e(r.name) + '</h2><span class="stamp">' + G.fmtW(r.kg) + ', ' + G.fmtShort(r.date) + '</span><div style="height:16px"></div></div>').join(''))
      + drawer('Reference', '<div class="card ix">' + ix('All records', '', 'data-open="records"') + ix('Loan history', '', 'data-open="history"') + ix('Calendar', '', 'data-open="calendar"') + ix('Achievements', '', 'data-open="achievements"') + ix('Body', '', 'data-open="body"') + ix('Food', '', 'data-open="food"') + ix('Photos', '', 'data-open="photos"') + '<div style="height:16px"></div></div>');
  }
  function patrons() {
    const L = G.leaderboard();
    return drawer('Reading room', '<div class="card ix">' + ix('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + ix('Messages', '', 'data-open="chats"') + ix('Friends', '', 'data-open="friends"') + ix('Notice board: new post', '', 'data-open="post"') + '<div style="height:16px"></div></div>')
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '<div style="height:12px"></div></div>').join('');
  }
  function office() { return drawer('Office', '<div class="card ix">' + ix('Weekly goal', G.goal(), 'data-open="settings"') + ix('Profile and reminders', '', 'data-open="profile"') + ix('All settings', '', 'data-open="settings"') + '<div style="height:16px"></div></div>'); }
  K.app({ root: document.getElementById('app'), screens: { desk, stacks, records, patrons, office }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=stacks]').click(); } } });
})();
</script>
</body>
</html>
