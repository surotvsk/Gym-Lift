<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>48 · Scandi — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #F2EFEA; color: #33302C; font: 15px/1.5 'Albert Sans', system-ui, sans-serif;
    --oak: #D9C3A0; --sage: #9AAB94; --char: #33302C;
    --k-acc: #6E8268; --k-font: 'Albert Sans', sans-serif; --k-radius: 16px; --k-bg: #F7F5F1; --k-card: #ECE8E1; --k-line: #E0DBD2; --k-good: #9AAB94; --k-bad: #E6DAD2; }
  main { flex: 1; overflow-y: auto; padding: 56px 24px 24px; }
  h1 { font: 300 34px/1.15 'Albert Sans'; margin: 0 0 6px; letter-spacing: -.5px; }
  .soft { color: #7A746B; }
  .oak { height: 14px; border-radius: 7px; background: #E6E0D6; overflow: hidden; margin: 18px 0 8px; }
  .oak i { display: block; height: 100%; border-radius: 7px; background: repeating-linear-gradient(100deg, #D9C3A0 0 6px, #CDB48D 6px 7px, #DCC8A7 7px 15px, #C9AE85 15px 16px); transition: width .6s; }
  .sec { margin: 34px 0 10px; font: 500 14px 'Albert Sans'; color: #7A746B; }
  .card { background: #FBFAF7; border-radius: 22px; padding: 20px; margin-bottom: 14px; }
  .start { display: flex; align-items: center; justify-content: center; width: 100%; border: 0; border-radius: 999px; background: var(--char); color: #F2EFEA; font: 500 16px 'Albert Sans'; padding: 16px; cursor: pointer; margin-top: 16px; }
  .start.sage { background: var(--sage); color: #1F241D; } .start.lt { background: #E6E0D6; color: var(--char); }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #ECE8E1; }
  .row:last-child { border: 0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #ECE8E1; background: none; padding: 14px 0; font: 400 16px 'Albert Sans'; cursor: pointer; color: var(--char); text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #9A938A; }
  .dots { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 8px; }
  .dot { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #CFC7BA; background: none; font: 500 14px 'Albert Sans'; cursor: pointer; color: var(--char); line-height: 1; }
  .dot small { display: block; font-size: 10px; color: #9A938A; }
  .dot.on { background: var(--sage); border-color: var(--sage); }
  .tools { display: flex; flex-wrap: wrap; gap: 16px; } .tools button { border: 0; background: none; color: #6E8268; font: 500 13px 'Albert Sans'; cursor: pointer; padding: 3px 0; }
  .wk { display: flex; justify-content: space-between; margin-top: 4px; }
  .wk span { width: 34px; text-align: center; font-size: 12px; color: #9A938A; }
  .wk span i { display: block; width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; background: #E0DBD2; } .wk span.d i { background: var(--sage); } .wk span.t { color: var(--char); }
  nav { display: flex; padding: 10px 14px 26px; background: #F2EFEA; }
  nav button { flex: 1; border: 0; background: none; color: #A39C92; font: 400 13px 'Albert Sans'; cursor: pointer; padding: 8px 0; }
  nav button.is-active { color: var(--char); font-weight: 500; }
  nav button.is-active::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--char); margin: 4px auto 0; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="today"></section><section data-screen="train" hidden></section><section data-screen="past" hidden></section><section data-screen="others" hidden></section><section data-screen="home" hidden></section>
  </main>
  <nav><button data-tab="today">Today</button><button data-tab="train">Train</button><button data-tab="past">Past</button><button data-tab="others">Others</button><button data-tab="home">Settings</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  function today() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="soft">' + G.fmtDate(G.today(), true) + '</div><h1>' + (s ? e(s.planName) + ' is under way.' : w.met ? 'This week is done. Rest well.' : rec ? 'Today is ' + e(rec.name) + '.' : 'Make a plan.') + '</h1>'
      + '<div class="oak" role="img" aria-label="' + w.done + ' of ' + w.goal + ' workouts this week"><i style="width:' + Math.min(100, w.done / w.goal * 100) + '%"></i></div><div class="soft">' + w.done + ' of ' + w.goal + ' this week, ' + G.streak() + ' weeks in a row</div>'
      + '<div class="wk">' + w.days.map((d) => '<span class="' + (d.done ? 'd' : '') + (d.today ? ' t' : '') + '">' + d.d.slice(0, 1) + '<i></i></span>').join('') + '</div>'
      + (s ? '<button class="start" data-tab="train">Continue, <span data-live="elapsed"></span></button>' : rec ? '<div class="card" style="margin-top:28px"><div class="soft">' + rec.exercises.length + ' exercises, about ' + G.planMinutes(rec) + ' minutes</div>' + rec.exercises.map((x) => '<div class="row"><span>' + e(x.name) + '</span><span class="soft">' + x.sets + ' × ' + x.reps + '</span></div>').join('') + '<button class="start" data-do="start" data-arg="' + rec.id + '">Begin</button></div>' : '')
      + '<div class="sec">Also</div><div class="lst">' + li('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + li(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'the streak stays', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('A walk or a run', '', 'data-open="activity"') + li('Calendar', '', 'data-open="calendar"') + '</div>';
  }
  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Plans</h1><p class="soft">In the order they come round.</p><div class="lst">' + G.plans().map((p) => li((p === sel ? '<b>' + e(p.name) + '</b>' : e(p.name)) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<button class="start" data-do="start" data-arg="' + sel.id + '">Begin ' + e(sel.name) + '</button><button class="start lt" data-open="editplan" data-arg="' + sel.id + '">Edit ' + e(sel.name) + '</button>' : '')
        + '<div class="sec">Arrange</div><div class="lst">' + li('Change the order', '', 'data-open="plans"') + li('New plan', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<div class="soft">' + e(s.planName) + '</div><h1 data-live="elapsed"></h1><div class="oak"><i style="width:' + p.pct + '%"></i></div><div class="soft">' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="not running" data-done="is over"></span>.</div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="card" style="margin-top:14px' + (i === s.cur ? ';box-shadow:inset 0 0 0 1.5px #9AAB94' : '') + '"><div style="font:500 18px Albert Sans">' + e(x.name) + '</div><div class="soft" style="font-size:13px">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="dots">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="dot' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="dot' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>×' + st.r + '</small></button>' : '<button class="dot' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">Add a set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest</button></div></div>'; }).join('')
      + '<button class="start sage" data-do="finish">Finish, +' + p.xp + ' XP</button><button class="start lt" data-open="rest">Rest timer</button><button class="start lt" data-do="discard">Discard</button>';
  }
  function past() {
    const t = G.totals();
    return '<h1>' + t.all.workouts + ' workouts so far.</h1><p class="soft">' + t.month.workouts + ' this month, ' + t.all.sets + ' sets in total.</p><div style="color:#9AAB94">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90, dots: false }) + '</div>'
      + '<div class="sec">Best lifts</div><div class="lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>'
      + '<div class="sec">More</div><div class="lst">' + li('All records', '', 'data-open="records"') + li('History', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>';
  }
  function others() {
    const L = G.leaderboard();
    return '<h1>Others</h1><div class="lst">' + li('Top 20 this week', 'you are #' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('Write a post', '', 'data-open="post"') + '</div><div style="height:16px"></div>'
      + G.feed().map((p) => '<div class="card post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function home() { return '<h1>Settings</h1><div class="lst">' + li('Weekly goal', G.goal() + ' a week', 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { today, train, past, others, home }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=train]').click(); } } });
})();
</script>
</body>
</html>
