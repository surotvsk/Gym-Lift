<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>44 · Museum — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #FAFAFA; color: #1C1C1C; font: 14px/1.5 Karla, system-ui, sans-serif;
    --wall: #E6E4E0; --brass: #A58A52;
    --k-acc: #1C1C1C; --k-font: Karla, sans-serif; --k-head: 'Cormorant Garamond', serif; --k-radius: 0px; --k-card: #F1F0ED; --k-line: #E1DFDA; --k-good: #6F6A5E; --k-bad: #ECE3DD; }
  main { flex: 1; overflow-y: auto; padding: 50px 26px 20px; }
  .room { font: 600 12px Karla; color: #8A867E; margin-bottom: 18px; }
  h1 { font: 500 38px/1.05 'Cormorant Garamond', serif; margin: 0 0 18px; }
  .exhibit { margin: 0 0 30px; }
  .frame { background: var(--wall); padding: 18px; display: flex; justify-content: center; }
  .frame img { width: 100%; max-height: 220px; object-fit: cover; box-shadow: 0 0 0 10px #fff, 0 0 0 11px #CFCBC3, 0 14px 24px rgba(0,0,0,.18); }
  .label { margin-top: 18px; max-width: 250px; border-left: 2px solid #1C1C1C; padding-left: 12px; }
  .label .t { font: 600 20px/1.15 'Cormorant Garamond', serif; } .label .d { font: italic 15px 'Cormorant Garamond'; color: #555; }
  .label .m { font-size: 12px; color: #6A665E; margin-top: 4px; } .label .acc { font-size: 11px; color: #9A958A; }
  .enter { display: inline-block; border: 1px solid #1C1C1C; background: #1C1C1C; color: #FAFAFA; font: 600 14px Karla; padding: 11px 22px; cursor: pointer; margin-top: 14px; }
  .enter.o { background: none; color: #1C1C1C; }
  .plaque { background: linear-gradient(180deg, #C5AB72, #A58A52); color: #2B2210; padding: 12px 14px; margin: 0 0 24px; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 4px rgba(0,0,0,.15); }
  .plaque b { font: 600 22px 'Cormorant Garamond'; }
  .guide button { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; border-top: 1px solid #E1DFDA; background: none; padding: 12px 0; font: 600 14px Karla; cursor: pointer; color: #1C1C1C; text-align: left; }
  .guide small { color: #8A867E; font-weight: 400; }
  .sets { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .s { border: 1px solid #1C1C1C; background: none; padding: 7px 10px; font: 600 13px Karla; cursor: pointer; color: #1C1C1C; }
  .s.on { background: #1C1C1C; color: #FAFAFA; }
  .tools { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; } .tools button { border: 0; background: none; color: #1C1C1C; text-decoration: underline; text-underline-offset: 3px; font: 400 13px Karla; cursor: pointer; padding: 2px 0; }
  .cur .label { border-left-color: var(--brass); border-left-width: 4px; }
  nav { display: flex; border-top: 1px solid #E1DFDA; background: #FAFAFA; padding: 8px 6px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #9A958A; font: 500 16px 'Cormorant Garamond'; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: #1C1C1C; font-style: italic; }
  .post { cursor: pointer; border-top: 1px solid #E1DFDA; padding: 12px 0; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="foyer"></section><section data-screen="gallery" hidden></section><section data-screen="archive" hidden></section><section data-screen="members" hidden></section><section data-screen="office" hidden></section>
  </main>
  <nav><button data-tab="foyer">Foyer</button><button data-tab="gallery">Gallery</button><button data-tab="archive">Archive</button><button data-tab="members">Members</button><button data-tab="office">Office</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const g = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  const acc = (k) => 'GQ.' + String(G.weekInfo().num).padStart(2, '0') + '.' + String(k + 1).padStart(3, '0');
  const mat = (id) => { const l = G.LIBMAP[id]; return l ? (l.equipment.length ? l.equipment.map((x) => G.EQUIP_LABEL[x].toLowerCase()).join(' and ') : 'bodyweight') : 'custom'; };
  function foyer() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), pr = G.records().events.slice(-1)[0], X = G.xp();
    const x0 = rec && rec.exercises[0];
    return '<div class="room">Week ' + w.num + ', ' + w.done + ' of ' + w.goal + ' visits</div><h1>' + (s ? 'The ' + e(s.planName) + ' room is open' : rec ? 'Today: the ' + e(rec.name) + ' collection' : 'Welcome') + '</h1>'
      + (x0 && !s ? '<div class="exhibit"><div class="frame"><img src="' + G.anyImg(x0.id) + '" alt="' + e(x0.name) + '"></div><div class="label"><div class="t">' + e(rec.name) + '</div><div class="d">' + rec.exercises.length + ' works, about ' + G.planMinutes(rec) + ' minutes</div><div class="m">' + rec.exercises.map((x) => e(x.name)).join(', ') + '</div><div class="acc">Next in your rotation</div></div><button class="enter" data-do="start" data-arg="' + rec.id + '">Enter the exhibition</button></div>' : '')
      + (s ? '<button class="enter" data-tab="gallery">Return to the gallery, <span data-live="elapsed"></span></button><div style="height:24px"></div>' : '')
      + (pr ? '<div class="plaque"><b>' + e(pr.name) + ', ' + G.fmtW(pr.kg) + '</b><br>Your most recent record, set ' + G.fmtShort(pr.date) + '.</div>' : '')
      + '<div class="guide">' + g('Streak', G.streak() + ' weeks', 'data-open="calendar"') + g('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + g(w.excused ? 'This week is excused' : 'Excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + g('Rest timer', '', 'data-open="rest"') + g('Walks and runs', '', 'data-open="activity"') + '</div><p style="color:#6A665E">' + G.motivation() + '</p>';
  }
  function gallery() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="room">Collections in rotation order</div><div class="guide">' + G.plans().map((p) => g((p === sel ? '<i>' + e(p.name) + '</i>' : e(p.name)) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' works', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div style="height:20px"></div><h1 style="font-size:30px">' + e(sel.name) + '</h1>' + sel.exercises.map((x, k) => '<div class="label" style="margin:0 0 14px"><div class="t">' + e(x.name) + '</div><div class="m">' + mat(x.id) + ', ' + x.sets + ' × ' + x.reps + (x.weight ? ' at ' + G.fmtW(x.weight) : '') + '</div><div class="acc">' + acc(k) + '</div></div>').join('') + '<button class="enter" data-do="start" data-arg="' + sel.id + '">Enter</button> <button class="enter o" data-open="editplan" data-arg="' + sel.id + '">Curate</button>' : '')
        + '<div class="guide" style="margin-top:20px">' + g('Rearrange the collections', '', 'data-open="plans"') + g('New collection', '', 'data-open="newplan"') + g('Full Body builder', '', 'data-open="fullbody"') + g('The catalogue', '48 works', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<div class="room">' + e(s.planName) + ', <span data-live="elapsed"></span>, ' + p.done + ' of ' + p.total + ' sets. Rest <span data-live="rest" data-idle="not running" data-done="over"></span></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="exhibit' + (i === s.cur ? ' cur' : '') + '">' + (i === s.cur && G.img(x.id) ? '<div class="frame"><img src="' + G.img(x.id) + '" alt=""></div>' : '') + '<div class="label"><div class="t">' + e(x.name) + '</div><div class="d">' + (x.replaces ? 'on loan, replacing ' + e(x.replaces) : c.text) + '</div><div class="m">' + mat(x.id) + '</div><div class="acc">' + acc(i) + '</div></div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">Left ' + G.fmtW(st.w) + '</button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">Right</button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + '</button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">Add a set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">Audio guide</button><button data-do="rest" data-arg="90">Rest 90 s</button></div></div>'; }).join('')
      + '<button class="enter" data-do="finish">Leave through the gift shop, +' + p.xp + ' XP</button><div class="guide" style="margin-top:16px">' + g('Rest timer', '', 'data-open="rest"') + g('Close without saving', '', 'data-do="discard"') + '</div>';
  }
  function archive() {
    const t = G.totals();
    return '<div class="room">Archive</div><h1>' + t.all.workouts + ' visits</h1><p style="color:#6A665E">' + t.all.sets + ' sets in total, ' + t.month.workouts + ' visits this month.</p>' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90, fill: false })
      + '<div class="room" style="margin-top:20px">Hall of records</div>' + G.records().list.slice(0, 3).map((r) => '<div class="plaque" style="margin-bottom:10px"><b>' + e(r.name) + ', ' + G.fmtW(r.kg) + '</b><br>' + G.fmtShort(r.date) + '</div>').join('')
      + '<div class="guide">' + g('All records', '', 'data-open="records"') + g('Visitor log', '', 'data-open="history"') + g('Calendar', '', 'data-open="calendar"') + g('Honours', '', 'data-open="achievements"') + g('Body', '', 'data-open="body"') + g('Café (food log)', '', 'data-open="food"') + g('Portraits', '', 'data-open="photos"') + '</div>';
  }
  function members() {
    const L = G.leaderboard();
    return '<div class="room">Members</div><div class="guide">' + g('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + g('Messages', '', 'data-open="chats"') + g('Friends', '', 'data-open="friends"') + g('Guest book (new post)', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function office() { return '<div class="room">Office</div><div class="guide">' + g('Weekly goal', G.goal() + ' visits', 'data-open="settings"') + g('Profile and reminders', '', 'data-open="profile"') + g('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { foyer, gallery, archive, members, office }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=gallery]').click(); } } });
})();
</script>
</body>
</html>
