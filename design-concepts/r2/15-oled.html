<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>15 · OLED — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; color: #8C8C8C; font: 15px/1.4 Manrope, system-ui, sans-serif;
    --k-bg: #000; --k-fg: #D0D0D0; --k-mute: #6E6E6E; --k-card: #0E0E0E; --k-line: #1C1C1C; --k-acc: #FF7A1A; --k-acc-fg: #000; --k-good: #7A3A0C; --k-bad: #141414; --k-font: Manrope, sans-serif; --k-radius: 16px; --k-scrim: rgba(0,0,0,.85); --k-shadow: none; }
  .k-root .k-sheet { border-top: 1px solid #1C1C1C; }
  main { flex: 1; overflow-y: auto; padding: 50px 20px 20px; }
  .w { color: #EDEDED; } .o { color: #FF7A1A; }
  .dt { font-size: 13px; letter-spacing: .04em; }
  .xl { font: 800 88px/0.9 Manrope; letter-spacing: -4px; color: #EDEDED; }
  .xl small { font-size: 22px; letter-spacing: 0; color: #6E6E6E; }
  .line { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border: 0; border-bottom: 1px solid #141414; background: none; padding: 14px 0; font: 600 15px Manrope; color: #8C8C8C; cursor: pointer; text-align: left; }
  .line b { color: #EDEDED; font-weight: 600; }
  .ring { display: flex; gap: 6px; margin: 16px 0 26px; } .ring i { flex: 1; height: 4px; border-radius: 2px; background: #1C1C1C; } .ring i.d { background: #EDEDED; } .ring i.t { background: #FF7A1A; }
  .go { width: 100%; border: 1.5px solid #FF7A1A; background: none; color: #FF7A1A; border-radius: 999px; padding: 16px; font: 800 17px Manrope; cursor: pointer; margin: 18px 0 8px; }
  .go:active { background: #FF7A1A; color: #000; }
  .ex { padding: 18px 0; border-bottom: 1px solid #141414; }
  .ex h3 { margin: 0; font: 800 20px Manrope; color: #5A5A5A; } .ex.cur h3 { color: #EDEDED; }
  .ex .cmp { font-size: 13px; } .ex .cmp.up { color: #FF7A1A; }
  .sets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .s { min-width: 60px; padding: 10px 8px; border-radius: 14px; border: 1px solid #262626; background: none; color: #8C8C8C; font: 800 16px Manrope; cursor: pointer; }
  .s small { display: block; font: 600 11px Manrope; color: #5A5A5A; }
  .s.on { border-color: #FF7A1A; color: #FF7A1A; } .s.on small { color: #A9561A; }
  .tools { display: flex; gap: 16px; margin-top: 8px; } .tools button { border: 0; background: none; color: #6E6E6E; font: 600 12px Manrope; cursor: pointer; padding: 4px 0; }
  .hdr { position: sticky; top: -50px; margin: -50px -20px 10px; padding: 50px 20px 10px; background: #000; z-index: 3; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #141414; }
  .hdr b { font: 800 34px Manrope; color: #EDEDED; flex: 1; font-variant-numeric: tabular-nums; }
  .hdr button { border: 1.5px solid #FF7A1A; background: none; color: #FF7A1A; border-radius: 999px; padding: 9px 16px; font: 800 14px Manrope; cursor: pointer; }
  nav { display: flex; justify-content: space-around; padding: 10px 0 26px; }
  nav button { border: 0; background: none; color: #3A3A3A; cursor: pointer; padding: 8px; }
  nav button.is-active { color: #FF7A1A; }
  .post { padding: 14px 0; border-bottom: 1px solid #141414; cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-post-img { filter: brightness(.55); }
  .post .k-share { background: #0A0A0A; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="now"></section><section data-screen="lift" hidden></section><section data-screen="log" hidden></section><section data-screen="crew" hidden></section><section data-screen="set" hidden></section>
  </main>
  <nav><button data-tab="now" aria-label="Now"></button><button data-tab="lift" aria-label="Lift"></button><button data-tab="log" aria-label="Log"></button><button data-tab="crew" aria-label="Crew"></button><button data-tab="set" aria-label="Settings"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const ic = { now: 'sun', lift: 'dumbbell', log: 'chart', crew: 'users', set: 'settings' };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(ic[b.dataset.tab]); });
  const L = (a, b, attrs) => '<button class="line" ' + attrs + '><span>' + a + '</span><b>' + (b == null ? '' : b) + '</b></button>';
  function now() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess();
    return '<div class="dt">' + G.fmtDate(G.today()) + ' · week ' + w.num + '</div><div class="xl" style="margin-top:22px">' + w.done + '<small> / ' + w.goal + '</small></div><div class="dt">this week · ' + G.streak() + '-week streak</div>'
      + '<div class="ring">' + w.days.map((d) => '<i class="' + (d.done ? 'd' : d.today ? 't' : '') + '"></i>').join('') + '</div>'
      + (s ? '<div class="w" style="font:800 26px Manrope">' + e(s.planName) + '</div><div class="dt"><span data-live="elapsed"></span> · ' + G.progress().done + '/' + G.progress().total + '</div><button class="go" data-tab="lift">Continue</button>'
        : rec ? '<div class="dt o">next ✦</div><div class="w" style="font:800 30px Manrope">' + e(rec.name) + '</div><div class="dt">' + rec.exercises.length + ' exercises · ~' + G.planMinutes(rec) + ' min</div><button class="go" data-do="start" data-arg="' + rec.id + '">Start</button>' : '')
      + L(w.excused ? 'Week excused' : 'Excuse week', w.excused ? 'undo' : '', 'data-do="excuse"') + L('Rest timer', '<span data-live="rest"></span>', 'data-open="rest"') + L('Activity', '', 'data-open="activity"') + L('Calendar', '', 'data-open="calendar"');
  }
  function lift() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return G.plans().map((p) => L((p === sel ? '<span class="o">●</span> ' : '') + '<span class="' + (p === sel ? 'w' : '') + '">' + e(p.name) + '</span>' + (p === G.recommended() ? ' <span class="o">✦</span>' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('')
        + (sel ? '<button class="go" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button>' : '') + L('Edit plan', '', 'data-open="editplan" data-arg="' + (sel ? sel.id : '') + '"') + L('Manage plans', '', 'data-open="plans"') + L('New plan', '', 'data-open="newplan"') + L('Full Body builder', '', 'data-open="fullbody"') + L('Exercise library', '48', 'data-open="library"');
    }
    const p = G.progress();
    return '<div class="hdr"><b data-live="elapsed"></b><span class="dt o" data-live="rest"></span><button data-do="finish">Finish</button></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><h3>' + e(x.name) + '</h3><div class="cmp ' + c.kind + '">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R<small>× ' + st.r + '</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w, true) + '<small>× ' + st.r + (st.planFail ? ' · f' : '') + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">replace</button><button data-open="exercise" data-arg="' + x.id + '">info</button><button data-do="rest" data-arg="90">rest</button></div></div>'; }).join('')
      + '<button class="go" data-do="finish">Finish · +' + p.xp + ' XP</button>' + L('Rest presets', '', 'data-open="rest"') + L('Discard', '', 'data-do="discard"');
  }
  function log() {
    const t = G.totals(), X = G.xp();
    return '<div class="xl">' + t.all.workouts + '</div><div class="dt">workouts · level ' + X.level + ' · ' + X.total + ' XP</div><div style="height:16px"></div><div style="color:#FF7A1A">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 80, dots: false }) + '</div>'
      + G.records().list.slice(0, 4).map((r) => L(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('')
      + L('Records', '', 'data-open="records"') + L('History', t.month.workouts + ' this month', 'data-open="history"') + L('Calendar', '', 'data-open="calendar"') + L('Achievements', '', 'data-open="achievements"') + L('Body', ((G.bodyLatest('weight') || {}).value || '') + ' kg', 'data-open="body"') + L('Food', G.foodDay().kcal + ' kcal', 'data-open="food"') + L('Photos', '', 'data-open="photos"');
  }
  function crew() {
    const Lb = G.leaderboard();
    return L('Top 20', '#' + (Lb.me ? Lb.me.rank : '–'), 'data-open="leaderboard"') + L('Messages', G.chats().reduce((a, c) => a + c.unread, 0) || '', 'data-open="chats"') + L('Friends', '', 'data-open="friends"') + L('<span class="o">New post</span>', '', 'data-open="post"')
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function set() { return L('Weekly goal', G.goal(), 'data-open="settings"') + L('Units', G.unit(), 'data-do="unit" data-arg="' + (G.unit() === 'kg' ? 'lb' : 'kg') + '"') + L('Profile & reminders', '', 'data-open="profile"') + L('Settings', '', 'data-open="settings"'); }
  K.app({ root: document.getElementById('app'), screens: { now, lift, log, crew, set }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=lift]').click(); } } });
})();
</script>
</body>
</html>
