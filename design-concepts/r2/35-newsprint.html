<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>35 · Newsprint — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;600;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #EDEAE3; color: #1A1A1A; font: 14px/1.45 'Old Standard TT', Georgia, serif;
    --k-acc: #1A1A1A; --k-font: 'Libre Franklin', sans-serif; --k-head: 'Old Standard TT', serif; --k-radius: 0px; --k-bg: #F2EFE8; --k-card: #E3DFD5; --k-line: #C9C3B6; --k-good: #4A4A4A; --k-bad: #D9C9C9; }
  main { flex: 1; overflow-y: auto; padding: 42px 12px 16px; }
  .mast { text-align: center; border-bottom: 3px double #1A1A1A; padding-bottom: 4px; }
  .mast .nm { font: 400 40px/1 UnifrakturMaguntia, serif; }
  .mast .ed { display: flex; justify-content: space-between; border-top: 1px solid #1A1A1A; margin-top: 4px; padding-top: 3px; font: 600 10px 'Libre Franklin'; font-variant: small-caps; letter-spacing: .04em; }
  .hl { font: 700 34px/1 'Old Standard TT', serif; margin: 10px 0 6px; letter-spacing: -.5px; }
  .deck { font: italic 16px/1.3 'Old Standard TT'; margin: 0 0 8px; color: #333; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .cols > div { min-width: 0; }
  .cols > div + div { border-left: 1px solid #1A1A1A; padding-left: 14px; }
  .sect { font: 800 12px 'Libre Franklin'; font-variant: small-caps; letter-spacing: .06em; border-top: 2px solid #1A1A1A; border-bottom: 1px solid #1A1A1A; padding: 2px 0; margin: 12px 0 6px; }
  .photo { width: 100%; height: 150px; object-fit: cover; filter: grayscale(1) contrast(1.15); display: block; margin: 6px 0 2px; }
  .cap { font: italic 11px 'Old Standard TT'; color: #555; margin-bottom: 6px; }
  p.body { margin: 0 0 8px; text-align: justify; hyphens: auto; }
  .press { display: block; width: 100%; border: 2px solid #1A1A1A; background: #1A1A1A; color: #EDEAE3; padding: 10px; font: 800 14px 'Libre Franklin'; cursor: pointer; margin: 6px 0; }
  .press.red { background: #C1121F; border-color: #C1121F; } .press.out { background: none; color: #1A1A1A; }
  .wx { border: 1px solid #1A1A1A; padding: 6px; text-align: center; }
  .wx b { display: block; font: 700 30px 'Old Standard TT'; }
  .res { width: 100%; border-collapse: collapse; font: 13px 'Libre Franklin'; }
  .res td { padding: 3px 2px; border-bottom: 1px dotted #9A948A; } .res td:last-child { text-align: right; font-weight: 800; }
  .res tr.me td { color: #C1121F; }
  .live { border-left: 3px solid #C1121F; padding-left: 10px; margin: 0 0 12px; }
  .live time { font: 800 11px 'Libre Franklin'; color: #C1121F; }
  .live h3 { font: 700 19px/1.1 'Old Standard TT'; margin: 2px 0; }
  .sets { display: flex; flex-wrap: wrap; gap: 5px; margin: 5px 0; }
  .s { border: 1.5px solid #1A1A1A; background: none; padding: 5px 8px; font: 600 13px 'Libre Franklin'; cursor: pointer; color: #1A1A1A; }
  .s.on { background: #1A1A1A; color: #EDEAE3; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; font: 600 12px 'Libre Franklin'; } .tools button { border: 0; background: none; padding: 2px 0; font: inherit; text-decoration: underline; cursor: pointer; color: #1A1A1A; }
  .cls button { display: block; width: 100%; border: 0; border-bottom: 1px dotted #9A948A; background: none; padding: 7px 0; font: 13px/1.3 'Old Standard TT'; text-align: left; cursor: pointer; color: #1A1A1A; }
  .cls b { font: 800 12px 'Libre Franklin'; font-variant: small-caps; }
  nav { display: flex; border-top: 3px double #1A1A1A; padding: 6px 2px 24px; background: #EDEAE3; }
  nav button { flex: 1; border: 0; background: none; font: 600 12px 'Libre Franklin'; font-variant: small-caps; letter-spacing: .04em; color: #6A665E; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: #1A1A1A; text-decoration: underline; text-underline-offset: 4px; }
  .post { cursor: pointer; border-bottom: 1px solid #1A1A1A; padding: 6px 0; } .post .k-post { border: 0; padding: 0; } .post .k-post-img { filter: grayscale(1); }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="front"></section><section data-screen="live" hidden></section><section data-screen="sport" hidden></section><section data-screen="letters" hidden></section><section data-screen="classifieds" hidden></section>
  </main>
  <nav><button data-tab="front">Front page</button><button data-tab="live">Live</button><button data-tab="sport">Sport</button><button data-tab="letters">Letters</button><button data-tab="classifieds">Classifieds</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const ad = (title, text, attrs) => '<button ' + attrs + '><b>' + title + '.</b> ' + text + '</button>';
  const mast = () => { const w = G.weekInfo(); return '<div class="mast"><div class="nm">The Daily Rep</div><div class="ed"><span>Edition ' + w.num + '</span><span>' + G.fmtDate(G.today(), true) + '</span><span>Free</span></div></div>'; };
  function front() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), last = G.history()[0], pr = G.records().events.slice(-1)[0], X = G.xp();
    const head = s ? e(s.planName) + ' session under way' : w.met ? 'Weekly goal met, ' + G.streak() + '-week streak holds' : (w.left === 1 ? 'One workout from the weekly goal' : w.left + ' workouts still needed this week');
    return mast() + '<h1 class="hl">' + head + '</h1><p class="deck">' + G.motivation() + '</p>'
      + (rec && !s && G.img(rec.exercises[0] && rec.exercises[0].id) ? '<img class="photo" src="' + G.img(rec.exercises[0].id) + '" alt=""><div class="cap">' + e(rec.exercises[0].name) + ' opens ' + e(rec.name) + ', next in the rotation.</div>' : '')
      + (s ? '<button class="press red" data-tab="live">Follow the live coverage, <span data-live="elapsed"></span></button>' : rec ? '<button class="press red" data-do="start" data-arg="' + rec.id + '">Start ' + e(rec.name) + '</button>' : '')
      + '<div class="cols"><div><div class="sect">The week</div><p class="body">' + e(G.state.profile.name) + ' has trained ' + w.done + ' of ' + w.goal + ' times in week ' + w.num + '.' + (last ? ' The last session, ' + e(last.planName) + ', ran ' + last.minutes + ' minutes on ' + G.fmtShort(last.date) + '.' : '') + '</p>'
      + (pr ? '<div class="sect">Record</div><p class="body">' + e(pr.name) + ' rose to ' + G.fmtW(pr.kg) + ', up from ' + G.fmtW(pr.prev) + '.</p>' : '') + '<button class="press out" data-open="records">All records</button></div>'
      + '<div><div class="sect">Forecast</div><div class="wx"><b>' + G.streak() + '</b>week streak</div><div class="wx" style="margin-top:6px"><b>' + X.level + '</b>level, ' + X.total + ' XP</div><button class="press out" data-do="excuse">' + (w.excused ? 'Withdraw the excuse' : 'Excuse this week') + '</button><button class="press out" data-open="calendar">Calendar</button></div></div>'
      + '<div class="sect">Also inside</div><div class="cls">' + ad('Rest timer', 'Presets and custom times.', 'data-open="rest"') + ad('Outdoors', 'Log a run, walk or ride.', 'data-open="activity"') + ad('Honours', 'Achievements and levels.', 'data-open="achievements"') + '</div>';
  }
  function live() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return mast() + '<h1 class="hl" style="font-size:28px">Choose the next story</h1><div class="cls">' + G.plans().map((p) => ad((p === sel ? '■ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.map((x) => e(x.name)).join(', ') + '. About ' + G.planMinutes(p) + ' min.', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<button class="press red" data-do="start" data-arg="' + sel.id + '">Start ' + e(sel.name) + '</button><button class="press out" data-open="editplan" data-arg="' + sel.id + '">Edit the plan</button>' : '')
        + '<div class="cls">' + ad('Rotation', 'Reorder your plans.', 'data-open="plans"') + ad('New plan', 'Write one from scratch.', 'data-open="newplan"') + ad('Full Body builder', 'Combine exercises from your plans.', 'data-open="fullbody"') + ad('Exercise library', '48 exercises with how-to notes.', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return mast() + '<h1 class="hl" style="font-size:28px">Live: ' + e(s.planName) + '</h1><p class="deck">Started ' + G.hhmm(s.started) + ', running <span data-live="elapsed"></span>. ' + p.done + ' of ' + p.total + ' sets filed. Rest <span data-live="rest" data-idle="not running" data-done="over"></span>.</p>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="live"' + (i === s.cur ? ' style="border-left-width:6px"' : '') + '><time>' + (x.sets.every((y) => y.done) ? 'Filed' : i === s.cur ? 'Developing' : 'Coming up') + '</time><h3>' + e(x.name) + '</h3><div style="font-size:13px">' + (x.replaces ? 'Replaces ' + e(x.replaces) + '.' : c.text + '.') + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + ' ' + G.fmtW(st.w) + '</button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '</button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + '</button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Correct the weight</button><button data-do="addset" data-arg="' + i + '">Add a set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">Background</button><button data-do="rest" data-arg="90">Rest 90 s</button></div></div>'; }).join('')
      + '<button class="press red" data-do="finish">Go to print, +' + p.xp + ' XP</button><button class="press out" data-open="rest">Rest timer</button><button class="press out" data-do="discard">Spike the story</button>';
  }
  function sport() {
    const t = G.totals(), L = G.leaderboard();
    return mast() + '<h1 class="hl" style="font-size:28px">Sport</h1><div class="cols"><div><div class="sect">League, top 6</div><table class="res">' + L.top.slice(0, 6).map((r) => '<tr class="' + (r.me ? 'me' : '') + '"><td>' + r.rank + '. ' + e(r.person.name) + '</td><td>' + r.xp + '</td></tr>').join('') + '</table><button class="press out" data-open="leaderboard">Full table</button></div>'
      + '<div><div class="sect">Your season</div><table class="res"><tr><td>This week</td><td>' + t.week.workouts + '</td></tr><tr><td>This month</td><td>' + t.month.workouts + '</td></tr><tr><td>All time</td><td>' + t.all.workouts + '</td></tr><tr><td>Sets</td><td>' + t.all.sets + '</td></tr></table></div></div>'
      + '<div class="sect">Sets per week</div>' + K.bars(G.weeklySeries(8).map((x) => x.sets), { h: 90, labels: G.weeklySeries(8).map((x) => x.label) })
      + '<div class="sect">Results</div><div class="cls">' + G.history().slice(0, 4).map((w) => ad(G.fmtShort(w.date), e(w.planName) + ', ' + w.minutes + ' min, +' + w.xp + ' XP.', 'data-open="workout" data-arg="' + w.id + '"')).join('') + ad('Archive', 'Every past workout.', 'data-open="history"') + ad('Body', 'Weight and measurements.', 'data-open="body"') + ad('Food', 'Your own food log.', 'data-open="food"') + ad('Photos', 'Progress photos.', 'data-open="photos"') + '</div>';
  }
  function letters() {
    return mast() + '<div class="cls">' + ad('Write to us', 'Post to the Community.', 'data-open="post"') + ad('Correspondence', 'Messages with friends.', 'data-open="chats"') + ad('Contributors', 'Friends and requests.', 'data-open="friends"') + '</div>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function classifieds() { return mast() + '<div class="sect">Classifieds</div><div class="cls">' + ad('Wanted', G.goal() + ' workouts a week. Change the weekly goal.', 'data-open="settings"') + ad('Notices', 'Profile, notifications and reminders.', 'data-open="profile"') + ad('Services', 'Language, units, sound, backup and reset.', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { front, live, sport, letters, classifieds }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=live]').click(); } } });
})();
</script>
</body>
</html>
