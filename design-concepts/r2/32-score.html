<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>32 · Score — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Music&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #FBFAF5; color: #151515; font: 14px/1.45 'Work Sans', system-ui, sans-serif;
    --k-acc: #151515; --k-font: 'Work Sans', sans-serif; --k-head: 'EB Garamond', serif; --k-radius: 2px; --k-bg: #FBFAF5; --k-card: #F0EEE6; --k-line: #DCD9CF; --k-good: #3A3A3A; --k-bad: #EAD9DC; }
  main { flex: 1; overflow-y: auto; padding: 46px 16px 16px; }
  .title { text-align: center; margin-bottom: 4px; }
  .title h1 { font: 400 30px/1.1 'EB Garamond', serif; margin: 0; }
  .title p { margin: 2px 0 0; font: italic 16px 'EB Garamond'; color: #555; }
  .comp { text-align: right; font: italic 14px 'EB Garamond'; color: #555; margin-bottom: 4px; }
  .tempo { font: 600 italic 17px 'EB Garamond'; margin: 6px 0 0; }
  .tempo span { font: 400 14px 'Work Sans'; font-style: normal; color: #555; }
  .dyn { font: 600 italic 18px 'EB Garamond'; color: #7A1E2C; }
  svg.staff { width: 100%; height: auto; display: block; overflow: visible; }
  .staff line { stroke: #9A9A9A; stroke-width: 1; }
  .staff .bar { stroke: #151515; stroke-width: 1.5; }
  .staff .clef { font: 46px 'Noto Music', serif; fill: #151515; }
  .staff .rest { font: 30px 'Noto Music', serif; fill: #151515; }
  .staff .lbl { font: italic 12px 'EB Garamond', serif; fill: #333; }
  .staff .num { font: 600 11px 'Work Sans', sans-serif; fill: #555; }
  .nt { cursor: pointer; }
  .nt ellipse { fill: #FBFAF5; stroke: #151515; stroke-width: 2; }
  .nt.on ellipse { fill: #151515; }
  .nt line { stroke: #151515; stroke-width: 1.6; }
  .nt.cur ellipse { stroke: #7A1E2C; }
  .nt:focus-visible ellipse { stroke: #7A1E2C; stroke-width: 3; }
  .mvt { margin: 14px 0 4px; display: flex; align-items: baseline; gap: 8px; }
  .mvt b { font: 600 20px 'EB Garamond'; } .mvt small { color: #555; }
  .mvt.cur b { color: #7A1E2C; }
  .play { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid #151515; background: #151515; color: #FBFAF5; border-radius: 999px; padding: 10px 20px; font: 500 15px 'Work Sans'; cursor: pointer; }
  .play.out { background: none; color: #151515; }
  .play.sm { padding: 6px 12px; font-size: 13px; }
  .center { text-align: center; margin: 12px 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; } .tools button { border: 0; background: none; padding: 2px 0; font: 500 13px 'Work Sans'; color: #151515; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .prog { list-style: none; padding: 0; margin: 0; border-top: 1px solid #151515; }
  .prog li { border-bottom: 1px solid #DCD9CF; }
  .prog button { display: flex; align-items: baseline; gap: 10px; width: 100%; border: 0; background: none; padding: 11px 0; text-align: left; cursor: pointer; color: #151515; font: inherit; }
  .prog .t { font: 400 18px 'EB Garamond'; flex: 1; } .prog small { color: #666; }
  .sec { font: 600 16px 'EB Garamond'; margin: 18px 0 6px; }
  nav { display: flex; border-top: 1px solid #151515; padding: 6px 4px 24px; background: #FBFAF5; }
  nav button { flex: 1; border: 0; background: none; font: 400 15px 'EB Garamond'; color: #777; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: #151515; font-style: italic; text-decoration: underline; text-underline-offset: 4px; }
  .post { cursor: pointer; border-bottom: 1px solid #DCD9CF; padding: 6px 0; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="score"></section><section data-screen="perform" hidden></section><section data-screen="repertoire" hidden></section><section data-screen="ensemble" hidden></section><section data-screen="tuning" hidden></section>
  </main>
  <nav><button data-tab="score">Score</button><button data-tab="perform">Perform</button><button data-tab="repertoire">Repertoire</button><button data-tab="ensemble">Ensemble</button><button data-tab="tuning">Tuning</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const TEMPO = ['', 'Lento', 'Andante', 'Moderato', 'Allegretto', 'Allegro', 'Vivace', 'Presto'];
  const li = (t, s, attrs) => '<li><button ' + attrs + '><span class="t">' + t + '</span><small>' + (s || '') + '</small></button></li>';
  /* a staff with notes; y from a value range. notes: [{v, on, label, attrs, cur}] */
  function staff(notes, o) {
    o = o || {}; const W = 358, top = 22, gap = 9, x0 = 48, n = notes.length || 1, step = (W - x0 - 14) / Math.max(n, 4);
    const vals = notes.map((q) => q.v).filter((v) => v != null); const min = Math.min(...vals, 0), max = Math.max(...vals, 1);
    const y = (v) => top + 4 * gap + 6 - ((v - min) / ((max - min) || 1)) * (4 * gap + 4);
    let s = '<svg class="staff" viewBox="0 0 ' + W + ' 96" role="group" aria-label="' + e(o.aria || 'staff') + '">';
    for (let k = 0; k < 5; k++) s += '<line x1="0" x2="' + W + '" y1="' + (top + k * gap) + '" y2="' + (top + k * gap) + '"/>';
    s += '<text class="clef" x="2" y="' + (top + 4 * gap + 6) + '">𝄞</text><line class="bar" x1="' + (W - 1) + '" x2="' + (W - 1) + '" y1="' + top + '" y2="' + (top + 4 * gap) + '"/>';
    if (o.time) s += '<text class="num" x="32" y="' + (top + 2 * gap - 2) + '">' + o.time[0] + '</text><text class="num" x="32" y="' + (top + 4 * gap - 2) + '">' + o.time[1] + '</text>';
    notes.forEach((q, k) => { const cx = x0 + 12 + k * step;
      if (q.rest) { s += '<text class="rest" x="' + (cx - 6) + '" y="' + (top + 3 * gap + 4) + '">𝄽</text>' + (q.label ? '<text class="lbl" x="' + cx + '" y="90" text-anchor="middle">' + q.label + '</text>' : ''); return; }
      const cy = y(q.v);
      s += '<g class="nt' + (q.on ? ' on' : '') + (q.cur ? ' cur' : '') + '" ' + (q.attrs || '') + ' tabindex="0" role="button" aria-label="' + e(q.aria || '') + '"><ellipse cx="' + cx + '" cy="' + cy + '" rx="7" ry="5.2" transform="rotate(-20 ' + cx + ' ' + cy + ')"/><line x1="' + (cx + 6.5) + '" x2="' + (cx + 6.5) + '" y1="' + cy + '" y2="' + (cy - 28) + '"/>' + (q.label ? '<text class="lbl" x="' + cx + '" y="90" text-anchor="middle">' + q.label + '</text>' : '') + '</g>'; });
    return s + '</svg>';
  }
  function score() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    const weekNotes = w.days.map((d) => d.done ? { v: d.done, on: true, label: d.d.slice(0, 2), attrs: 'data-open="day" data-arg="' + d.date + '"', aria: d.d + ', trained' } : { rest: true, label: d.d.slice(0, 2) });
    return '<div class="comp">' + e(G.state.profile.name) + ', level ' + X.level + '</div><div class="title"><h1>Opus ' + w.num + '</h1><p>A week in ' + w.goal + ' movements</p></div>'
      + '<p class="tempo">' + TEMPO[Math.min(7, w.goal)] + ' <span>(' + w.goal + ' workouts a week)</span> <span class="dyn">' + (w.done >= w.goal ? 'ff' : w.done ? 'mf' : 'p') + '</span></p>'
      + staff(weekNotes, { time: [w.done, w.goal], aria: 'This week: ' + w.done + ' of ' + w.goal })
      + '<p style="margin:4px 0;color:#444">' + G.motivation() + ' A ' + G.streak() + '-week streak.</p>'
      + (s ? '<div class="center"><button class="play" data-tab="perform">Continue the performance, <span data-live="elapsed"></span></button></div>'
        : rec ? '<div class="sec">Next on the programme ✦</div><div class="mvt"><b>' + e(rec.name) + '</b><small>' + rec.exercises.length + ' movements, about ' + G.planMinutes(rec) + ' min</small></div>'
          + staff(rec.exercises.map((x) => ({ v: x.weight, label: e(x.name.split(' ')[0]), attrs: 'data-open="exercise" data-arg="' + x.id + '"', aria: x.name })), { aria: rec.name })
          + '<div class="center"><button class="play" data-do="start" data-arg="' + rec.id + '">Begin ' + e(rec.name) + '</button></div>' : '')
      + '<ul class="prog">' + li(w.excused ? 'This week is a fermata (excused)' : 'Hold a fermata: excuse this week', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Run, walk or ride', '', 'data-open="activity"') + li('Concert calendar', '', 'data-open="calendar"') + li('Level ' + X.level, X.total + ' XP', 'data-open="achievements"') + '</ul>';
  }
  function perform() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="title"><h1>Programme</h1><p>Your plans in rotation order</p></div><ul class="prog">' + G.plans().map((p, k) => li((k + 1) + '. ' + (p === sel ? '<i>' + e(p.name) + '</i>' : e(p.name)) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' movements', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</ul>'
        + (sel ? '<div class="sec">' + e(sel.name) + '</div>' + staff(sel.exercises.map((x) => ({ v: x.weight, label: e(x.name.split(' ')[0]) })), { aria: sel.name }) + '<div class="center"><button class="play" data-do="start" data-arg="' + sel.id + '">Begin</button> <button class="play out" data-open="editplan" data-arg="' + sel.id + '">Revise the score</button></div>' : '')
        + '<ul class="prog">' + li('Arrange the programme', 'reorder', 'data-open="plans"') + li('Compose a new plan', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Exercise library', '48', 'data-open="library"') + '</ul>';
    }
    const p = G.progress();
    return '<div class="title"><h1>' + e(s.planName) + '</h1><p><span data-live="elapsed"></span>, ' + p.done + ' of ' + p.total + ' notes played. Rest <span data-live="rest" data-idle="not counting" data-done="is over"></span>.</p></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        const notes = []; x.sets.forEach((st, j) => { if (x.unilateral) { notes.push({ v: st.w, on: st.L, cur: i === s.cur, label: 'L' + (j + 1), attrs: 'data-do="set" data-arg="' + i + ':' + j + ':L"', aria: 'Set ' + (j + 1) + ' left' }); notes.push({ v: st.w, on: st.R, cur: i === s.cur, label: 'R' + (j + 1), attrs: 'data-do="set" data-arg="' + i + ':' + j + ':R"', aria: 'Set ' + (j + 1) + ' right' }); } else notes.push({ v: st.w + j * 0.01, on: st.done, cur: i === s.cur, label: st.r + '×' + G.fmtW(st.w, true), attrs: 'data-do="set" data-arg="' + i + ':' + j + '"', aria: 'Set ' + (j + 1) + ', ' + G.fmtW(st.w) + ' times ' + st.r }); });
        return '<div class="mvt' + (i === s.cur ? ' cur' : '') + '"><b>' + ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][i] + '. ' + e(x.name) + '</b><small>' + (x.replaces ? 'in place of ' + e(x.replaces) : c.text) + '</small></div>' + staff(notes, { aria: x.name })
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':' + Math.max(0, x.sets.findIndex((y) => !y.done)) + '">Change weight</button><button data-do="addset" data-arg="' + i + '">Add a set</button><button data-open="replace" data-arg="' + i + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90 s</button></div>'; }).join('')
      + '<div class="center"><button class="play" data-do="finish">Final chord, +' + p.xp + ' XP</button></div><div class="center"><button class="play out sm" data-open="rest">Rest timer</button> <button class="play out sm" data-do="discard">Leave the stage</button></div>';
  }
  function repertoire() {
    const t = G.totals();
    return '<div class="title"><h1>Repertoire</h1><p>' + t.all.workouts + ' performances, ' + t.all.sets + ' notes</p></div>'
      + '<div class="sec">Sets per week</div>' + staff(G.weeklySeries(8).map((x) => ({ v: x.sets, on: true, label: x.label })), { aria: 'Sets per week' })
      + '<div class="sec">Recent performances</div><ul class="prog">' + G.history().slice(0, 5).map((w) => li(e(w.planName), G.fmtShort(w.date) + ', ' + w.minutes + ' min', 'data-open="workout" data-arg="' + w.id + '"')).join('') + '</ul>'
      + '<div class="sec">Highest notes</div><ul class="prog">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</ul>'
      + '<ul class="prog" style="margin-top:12px">' + li('Every performance', '', 'data-open="history"') + li('Records', '', 'data-open="records"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Progress photos', '', 'data-open="photos"') + '</ul>';
  }
  function ensemble() {
    const L = G.leaderboard();
    return '<div class="title"><h1>Ensemble</h1></div><ul class="prog">' + li('Top 20 this week', 'you are #' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('Write a post', '', 'data-open="post"') + '</ul>'
      + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function tuning() { return '<div class="title"><h1>Tuning</h1></div><ul class="prog">' + li('Weekly goal', G.goal() + ' movements', 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</ul>'; }
  const root = document.getElementById('app');
  root.addEventListener('keydown', (ev) => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('nt')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  K.app({ root, screens: { score, perform, repertoire, ensemble, tuning }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=perform]').click(); } } });
})();
</script>
</body>
</html>
