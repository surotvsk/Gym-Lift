<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>25 · Forecast — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: linear-gradient(180deg, #3E7CC9 0%, #6FA6E0 45%, #A9CDEF 100%); color: #fff; font: 15px/1.4 Figtree, system-ui, sans-serif;
    --k-acc: #2F6CC0; --k-font: Figtree, sans-serif; --k-radius: 18px; --k-bg: #F4F8FD; --k-card: #E5EEF9; --k-line: #D3E0F1; --k-good: #F2A93B; --k-bad: #C6D3E3; }
  .app.night { background: linear-gradient(180deg, #121B3A 0%, #25356B 60%, #3B4F8F 100%); }
  main { flex: 1; overflow-y: auto; padding: 50px 14px 18px; }
  .hero { text-align: center; padding: 6px 0 16px; }
  .hero .city { font: 400 26px Figtree; text-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .hero .temp { font: 200 96px/1 Figtree; letter-spacing: -4px; margin-left: 20px; }
  .hero .cond { font: 600 18px Figtree; }
  .hero .hl { opacity: .9; }
  .glass { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25); border-radius: 18px; padding: 12px 14px; margin-bottom: 12px; backdrop-filter: blur(12px); }
  .glass .t { font: 600 12px Figtree; letter-spacing: .06em; text-transform: uppercase; opacity: .75; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .glass .t .kico { width: 14px; height: 14px; }
  .strip { display: flex; justify-content: space-between; text-align: center; }
  .strip button { border: 0; background: none; color: #fff; font: 600 14px Figtree; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; border-radius: 12px; }
  .strip button.now { background: rgba(255,255,255,.22); }
  .strip .w { font-size: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid2 .glass { margin: 0; text-align: left; color: #fff; font: inherit; cursor: pointer; }
  .grid2 .v { font: 300 34px Figtree; } .grid2 small { opacity: .85; }
  .go { display: block; width: 100%; border: 0; border-radius: 16px; background: #fff; color: #2F6CC0; font: 800 17px Figtree; padding: 14px; cursor: pointer; margin: 8px 0; }
  .lst button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid rgba(255,255,255,.2); background: none; color: #fff; padding: 11px 0; font: 600 15px Figtree; cursor: pointer; text-align: left; }
  .lst button:last-child { border: 0; } .lst span.g { flex: 1; } .lst small { opacity: .8; font-weight: 400; }
  .hour { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .hr { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 14px; padding: 8px 10px; font: 600 14px Figtree; cursor: pointer; min-width: 58px; }
  .hr small { font-weight: 400; font-size: 11px; opacity: .85; } .hr.on { background: #FFD45C; color: #3B3000; }
  .ex { margin-bottom: 10px; }
  .ex b { font-size: 17px; } .ex .m { opacity: .85; font-size: 13px; }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; } .tools button { border: 0; background: none; color: #FFF3C4; font: 600 13px Figtree; cursor: pointer; padding: 2px 0; }
  nav { display: flex; background: rgba(20,40,80,.35); backdrop-filter: blur(10px); padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: rgba(255,255,255,.65); font: 600 11px Figtree; padding: 6px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button.is-active { color: #fff; }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-post small, .post .k-post footer { color: rgba(255,255,255,.8); } .post .k-share { background: rgba(255,255,255,.9); }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="today"></section><section data-screen="session" hidden></section><section data-screen="climate" hidden></section><section data-screen="nearby" hidden></section><section data-screen="settings" hidden></section>
  </main>
  <nav><button data-tab="today"></button><button data-tab="session"></button><button data-tab="climate"></button><button data-tab="nearby"></button><button data-tab="settings"></button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const N = { today: ['sun', 'Today'], session: ['dumbbell', 'Session'], climate: ['chart', 'Climate'], nearby: ['users', 'Nearby'], settings: ['settings', 'Settings'] };
  document.querySelectorAll('nav [data-tab]').forEach((b) => { b.innerHTML = I(N[b.dataset.tab][0]) + N[b.dataset.tab][1]; });
  /* readiness: rested days raise it, a heavy week lowers it (a playful estimate, not a medical claim) */
  function readiness() {
    const last = G.history()[0]; const days = last ? Math.round((G.parse(G.today()) - G.parse(last.date)) / 864e5) : 7;
    const w = G.weekInfo(); let r = 55 + Math.min(3, days) * 12 - Math.max(0, w.done - w.goal) * 10; if (days === 0) r = 40;
    r = Math.max(20, Math.min(95, r));
    return { r, cond: r >= 80 ? 'Sunny · great day to lift' : r >= 60 ? 'Mostly sunny · good to go' : r >= 45 ? 'Partly cloudy · go lighter' : 'Overcast · rest is fine', icon: r >= 80 ? '☀️' : r >= 60 ? '🌤️' : r >= 45 ? '⛅' : '☁️', days };
  }
  const li = (ic, a, b, attrs) => '<button ' + attrs + '>' + I(ic) + '<span class="g">' + a + '</span><small>' + (b == null ? '' : b) + '</small></button>';
  function today() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), R = readiness();
    return '<div class="hero"><div class="city">' + e(G.state.profile.name) + '’s gym</div><div class="temp">' + R.r + '°</div><div class="cond">' + R.cond + '</div><div class="hl">Week ' + w.num + ' · ' + w.done + ' of ' + w.goal + ' · streak ' + G.streak() + ' wk</div></div>'
      + '<div class="glass"><div class="t">' + I('calendar') + 'This week’s forecast</div><div class="strip">' + w.days.map((d) => '<button class="' + (d.today ? 'now' : '') + '" data-open="day" data-arg="' + d.date + '">' + (d.today ? 'Now' : d.d) + '<span class="w">' + (d.done ? '☀️' : d.future ? '🌥️' : d.today ? (s ? '🌤️' : '⛅') : '🌧️') + '</span>' + d.n + '</button>').join('') + '</div></div>'
      + (s ? '<div class="glass"><div class="t">' + I('dumbbell') + 'Currently</div><b style="font-size:20px">' + e(s.planName) + '</b> · <span data-live="elapsed"></span><button class="go" data-tab="session">Back to session</button></div>'
        : rec ? '<div class="glass"><div class="t">' + I('sun') + 'Recommended ✦</div><b style="font-size:22px">' + e(rec.name) + '</b><div style="opacity:.85">' + rec.exercises.length + ' exercises · about ' + G.planMinutes(rec) + ' min · ' + R.days + ' days since your last workout</div><button class="go" data-do="start" data-arg="' + rec.id + '">Head out: start</button></div>' : '')
      + '<div class="grid2"><button class="glass" data-open="achievements"><div class="t">' + I('star') + 'Level</div><div class="v">' + G.xp().level + '</div><small>' + G.xp().total + ' XP</small></button><button class="glass" data-do="excuse"><div class="t">' + I('flag') + 'Storm warning</div><div class="v" style="font-size:20px">' + (w.excused ? 'Week excused' : 'Excuse week') + '</div><small>' + (w.excused ? 'tap to undo' : 'streak stays safe') + '</small></button>'
      + '<button class="glass" data-open="rest"><div class="t">' + I('timer') + 'Rest</div><div class="v" style="font-size:22px"><span data-live="rest" data-idle="Timer" data-done="Over"></span></div></button><button class="glass" data-open="activity"><div class="t">' + I('run') + 'Outdoors</div><div class="v" style="font-size:22px">Run · walk</div></button></div>'
      + '<p style="font-size:12px;opacity:.8;margin:0 4px">Readiness is a playful guess from your rest days and this week’s load, not a health measurement.</p>';
  }
  function session() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="hero" style="padding-bottom:6px"><div class="city">Plans</div></div><div class="glass lst">' + G.plans().map((p) => li(p === sel ? 'check' : 'sun', e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="glass"><div class="t">' + I('list') + e(sel.name) + '</div>' + sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>' + e(x.name) + '</span><span>' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</span></div>').join('') + '<button class="go" data-do="start" data-arg="' + sel.id + '">Start</button></div>' : '')
        + '<div class="glass lst">' + li('edit', 'Edit plan', '', 'data-open="editplan" data-arg="' + (sel ? sel.id : '') + '"') + li('list', 'Manage plans', '', 'data-open="plans"') + li('plus', 'New plan', '', 'data-open="newplan"') + li('grid', 'Full Body builder', '', 'data-open="fullbody"') + li('book', 'Exercise library', '', 'data-open="library"') + '</div>';
    }
    const p = G.progress(), i = s.cur;
    return '<div class="hero" style="padding-bottom:8px"><div class="city">' + e(s.planName) + '</div><div class="temp" style="font-size:72px" data-live="elapsed"></div><div class="hl">' + p.done + ' of ' + p.total + ' sets · rest <span data-live="rest" data-idle="—" data-done="over"></span></div></div>'
      + '<div class="glass"><div class="t">' + I('clock') + 'Hour by hour (exercises)</div><div class="hour">' + s.exercises.map((x, k) => '<button class="hr' + (k === i ? ' on' : '') + '" data-do="cur" data-arg="' + k + '">' + (x.sets.every((y) => y.done) ? '☀️' : x.sets.some((y) => y.done) ? '🌤️' : '⛅') + '<small>' + e(x.name.split(' ')[0]) + '</small></button>').join('') + '</div></div>'
      + s.exercises.map((x, k) => { if (k !== i) return ''; const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="glass ex"><div class="t">' + I('dumbbell') + 'Now</div><b>' + e(x.name) + '</b><div class="m">' + (x.replaces ? 'instead of ' + e(x.replaces) : c.text) + '</div><div class="hour" style="margin-top:8px">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="hr' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + k + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="hr' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + k + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="hr' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + k + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + k + ':' + Math.max(0, x.sets.findIndex((y) => !y.done)) + '">Weight</button><button data-do="addset" data-arg="' + k + '">+ set</button><button data-open="replace" data-arg="' + k + '">Replace</button><button data-open="exercise" data-arg="' + x.id + '">How to</button><button data-do="rest" data-arg="90">Rest 90</button><button data-do="next">Next ›</button></div></div>'; }).join('')
      + '<button class="go" data-do="finish">Finish · +' + p.xp + ' XP</button><div class="glass lst">' + li('timer', 'Rest timer', '', 'data-open="rest"') + li('x', 'Discard', '', 'data-do="discard"') + '</div>';
  }
  function climate() {
    const t = G.totals();
    return '<div class="hero" style="padding-bottom:6px"><div class="city">Climate</div><div class="hl">' + t.all.workouts + ' workouts · ' + t.all.sets + ' sets in total</div></div>'
      + '<div class="glass"><div class="t">' + I('chart') + 'Sets per week, 10 weeks</div><div style="color:#FFD45C">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90 }) + '</div></div>'
      + '<div class="glass"><div class="t">' + I('trophy') + 'Record highs</div>' + G.records().list.slice(0, 4).map((r) => '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>' + e(r.name) + '</span><b>' + G.fmtW(r.kg) + '</b></div>').join('') + '</div>'
      + '<div class="glass lst">' + li('trophy', 'All records', '', 'data-open="records"') + li('clock', 'History', '', 'data-open="history"') + li('calendar', 'Calendar', '', 'data-open="calendar"') + li('medal', 'Achievements', '', 'data-open="achievements"') + li('scale', 'Body', '', 'data-open="body"') + li('utensils', 'Food', '', 'data-open="food"') + li('camera', 'Photos', '', 'data-open="photos"') + '</div>';
  }
  function nearby() {
    const L = G.leaderboard();
    return '<div class="hero" style="padding-bottom:6px"><div class="city">Nearby</div></div><div class="glass lst">' + li('star', 'Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('chat', 'Messages', '', 'data-open="chats"') + li('users', 'Friends', '', 'data-open="friends"') + li('edit', 'New post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="glass post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function settings() { return '<div class="hero"><div class="city">Settings</div></div><div class="glass lst">' + li('target', 'Weekly goal', G.goal(), 'data-open="settings"') + li('bell', 'Profile & reminders', '', 'data-open="profile"') + li('settings', 'All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { today, session, climate, nearby, settings },
    chrome: () => { const h = new Date().getHours(); document.getElementById('app').classList.toggle('night', h >= 20 || h < 6); },
    actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=session]').click(); }, next: () => G.setCurrent(G.sess().cur + 1) } });
})();
</script>
</body>
</html>
