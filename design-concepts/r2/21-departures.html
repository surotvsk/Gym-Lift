<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21 · Departures — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #111214; color: #F5C518; font: 14px/1.35 'Roboto Condensed', system-ui, sans-serif;
    --k-bg: #1A1B1E; --k-fg: #F2F2F2; --k-mute: #9A9A9A; --k-card: #24262A; --k-line: #33363B; --k-acc: #F5C518; --k-acc-fg: #111; --k-font: 'Roboto Condensed', sans-serif; --k-radius: 4px; --k-good: #2E7D32; --k-bad: #3A2222; }
  .hdr { padding: 44px 12px 10px; display: flex; align-items: center; gap: 10px; background: #F5C518; color: #111; }
  .hdr .ico { width: 40px; height: 40px; border-radius: 50%; background: #111; color: #F5C518; display: grid; place-items: center; }
  .hdr h1 { margin: 0; font: 700 22px 'Roboto Condensed'; text-transform: uppercase; letter-spacing: .04em; flex: 1; line-height: 1; }
  .hdr h1 small { display: block; font-size: 12px; font-weight: 500; }
  .hdr .clk { font: 700 24px 'Roboto Mono'; }
  main { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
  .flap { display: inline-flex; gap: 2px; }
  .flap i { position: relative; display: inline-grid; place-items: center; width: 17px; height: 26px; background: #1E1F22; border-radius: 3px; font: 700 17px 'Roboto Mono'; font-style: normal; color: #F2F2F2; box-shadow: inset 0 -1px 0 #000; }
  .flap i::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000; }
  .flap.y i { color: #F5C518; } .flap.g i { color: #41D96B; } .flap.r i { color: #FF5A4E; }
  .flap.big i { width: 30px; height: 46px; font-size: 32px; }
  .fl i { animation: flip .5s ease-out both; }
  @keyframes flip { 0% { transform: rotateX(80deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fl i { animation: none; } }
  .bd { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
  .bd th { text-align: left; color: #8A8A8A; font: 700 10px 'Roboto Condensed'; letter-spacing: .1em; text-transform: uppercase; padding: 0 4px; }
  .bd td { padding: 2px 3px; vertical-align: middle; }
  .bd tr.rowb { cursor: pointer; }
  .dest { color: #F2F2F2; font: 700 15px 'Roboto Condensed'; text-transform: uppercase; }
  .dest small { display: block; color: #8A8A8A; font-size: 11px; font-weight: 500; text-transform: none; }
  .st { border: 0; border-radius: 3px; padding: 6px 7px; font: 700 12px 'Roboto Mono'; cursor: pointer; background: #1E1F22; color: #F5C518; white-space: nowrap; }
  .st.board { background: #F5C518; color: #111; animation: blink 1.4s infinite; } .st.dep { color: #41D96B; } .st.wait { color: #8A8A8A; }
  @keyframes blink { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .st.board { animation: none; } }
  .sign { display: flex; align-items: center; gap: 10px; background: #1E1F22; border-left: 6px solid #F5C518; padding: 10px; margin: 8px 0; cursor: pointer; width: 100%; border-top: 0; border-right: 0; border-bottom: 0; color: #F2F2F2; font: 700 15px 'Roboto Condensed'; text-transform: uppercase; text-align: left; }
  .sign .kico { color: #F5C518; } .sign span { flex: 1; } .sign small { color: #8A8A8A; font-weight: 500; text-transform: none; }
  .sign.g { border-left-color: #41D96B; } .sign.r { border-left-color: #FF5A4E; } .sign.b { border-left-color: #4EA8FF; }
  .lbl { color: #8A8A8A; font: 700 11px 'Roboto Condensed'; letter-spacing: .12em; text-transform: uppercase; margin: 14px 2px 6px; }
  .go { display: block; width: 100%; border: 0; background: #F5C518; color: #111; padding: 14px; font: 700 18px 'Roboto Condensed'; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; margin: 8px 0; border-radius: 4px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 4px 6px; } .tools button { border: 0; background: none; color: #4EA8FF; font: 700 11px 'Roboto Condensed'; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; padding: 2px 0; }
  nav { display: flex; background: #000; padding: 6px 4px 24px; gap: 3px; }
  nav button { flex: 1; border: 0; background: #1E1F22; color: #8A8A8A; font: 700 11px 'Roboto Condensed'; text-transform: uppercase; letter-spacing: .06em; padding: 9px 0; cursor: pointer; border-radius: 3px; }
  nav button.is-active { background: #F5C518; color: #111; }
  .post { background: #1E1F22; padding: 10px; margin-bottom: 6px; border-radius: 4px; color: #F2F2F2; cursor: pointer; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #111; color: #eee; border-color: #333; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="hdr"><span class="ico" id="hico"></span><h1 id="htitle"></h1><span class="clk" data-live="clock"></span></div>
  <main data-scroll>
    <section data-screen="dep"></section><section data-screen="gate" hidden></section><section data-screen="arr" hidden></section><section data-screen="lounge" hidden></section><section data-screen="info" hidden></section>
  </main>
  <nav><button data-tab="dep">Departures</button><button data-tab="gate">Gate</button><button data-tab="arr">Arrivals</button><button data-tab="lounge">Lounge</button><button data-tab="info">Info</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const F = (txt, cls, n) => { txt = String(txt).toUpperCase(); if (n) txt = txt.padEnd(n).slice(0, n); return '<span class="flap ' + (cls || '') + '">' + [...txt].map((c) => '<i>' + (c === ' ' ? '&nbsp;' : e(c)) + '</i>').join('') + '</span>'; };
  const S = (ic, t, s, attrs, cls) => '<button class="sign ' + (cls || '') + '" ' + attrs + '>' + I(ic) + '<span>' + t + (s ? '<br><small>' + s + '</small>' : '') + '</span>' + I('chevron') + '</button>';
  const T = { dep: ['Departures', 'This week'], gate: ['Gate', 'Boarding now'], arr: ['Arrivals', 'History and records'], lounge: ['Lounge', 'Fellow travellers'], info: ['Information', 'Settings'] };
  function chrome(cur) { document.getElementById('hico').innerHTML = I({ dep: 'send', gate: 'dumbbell', arr: 'download', lounge: 'users', info: 'info' }[cur]); document.getElementById('htitle').innerHTML = T[cur][0] + '<small>' + T[cur][1] + '</small>'; }
  function dep() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), plans = G.plans();
    let ri = plans.indexOf(rec);
    return '<div style="display:flex;gap:10px;align-items:flex-end;margin:4px 2px 10px"><div>' + F(w.done + '/' + w.goal, 'y big fl') + '<div class="lbl" style="margin:4px 0 0">this week</div></div><div>' + F(G.streak() + 'W', 'g big fl') + '<div class="lbl" style="margin:4px 0 0">streak</div></div></div>'
      + '<table class="bd"><tr><th>Day</th><th>Plan</th><th>Status</th></tr>' + w.days.map((d) => { let st, cls, plan, act = '';
          if (d.done) { st = 'DEPARTED'; cls = 'dep'; plan = d.plans.join(' + '); act = 'data-open="day" data-arg="' + d.date + '"'; }
          else if (d.today && s) { st = 'BOARDING'; cls = 'board'; plan = s.planName; act = 'data-tab="gate"'; }
          else if (d.today && rec) { st = 'BOARD NOW'; cls = 'board'; plan = rec.name + ' ✦'; act = 'data-do="start" data-arg="' + rec.id + '"'; }
          else if (d.future) { const p = plans[(++ri) % plans.length]; st = 'SCHEDULED'; cls = 'wait'; plan = p ? p.name : ''; act = 'data-do="select" data-arg="' + (p ? p.id : '') + '"'; }
          else { st = 'NO FLIGHT'; cls = 'wait'; plan = '—'; act = 'data-open="day" data-arg="' + d.date + '"'; }
          return '<tr class="rowb">' + '<td>' + F(d.d.slice(0, 2), 'y') + '</td><td class="dest">' + e(plan) + '<small>' + G.fmtShort(d.date) + '</small></td><td><button class="st ' + cls + '" ' + act + '>' + st + '</button></td></tr>'; }).join('') + '</table>'
      + '<div class="lbl">Announcements</div><div style="color:#F2F2F2;padding:0 4px">' + G.motivation() + '</div>'
      + S('flag', w.excused ? 'Week excused' : 'Excuse this week', 'Your streak keeps its seat', 'data-do="excuse"', 'r') + S('timer', 'Rest timer', '', 'data-open="rest"') + S('run', 'Run, walk or ride', '', 'data-open="activity"', 'g') + S('calendar', 'Timetable', 'Full calendar', 'data-open="calendar"', 'b') + S('star', 'Level ' + G.xp().level, G.xp().total + ' XP · frequent lifter status', 'data-open="achievements"');
  }
  function gate() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="lbl">Routes (rotation order)</div>' + G.plans().map((p) => S('send', e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' stops · ' + G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"', p === sel ? 'g' : '')).join('')
        + (sel ? '<div class="lbl">Manifest · ' + e(sel.name) + '</div><table class="bd">' + sel.exercises.map((x, i) => '<tr><td>' + F('G' + (i + 1), 'y') + '</td><td class="dest">' + e(x.name) + '<small>' + x.sets + ' × ' + x.reps + ' · ' + G.fmtW(x.weight) + '</small></td></tr>').join('') + '</table><button class="go" data-do="start" data-arg="' + sel.id + '">Start boarding</button>' + S('edit', 'Edit route', '', 'data-open="editplan" data-arg="' + sel.id + '"') : '')
        + S('list', 'Reorder routes', '', 'data-open="plans"') + S('plus', 'New route', '', 'data-open="newplan"') + S('grid', 'Full Body builder', '', 'data-open="fullbody"') + S('book', 'Destinations guide', 'Exercise library', 'data-open="library"', 'b');
    }
    const p = G.progress();
    return '<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px"><div><div class="lbl" style="margin:0">' + e(s.planName) + '</div><span class="flap y big" data-live="elapsed" style="font:700 36px Roboto Mono;color:#F5C518"></span></div><div style="text-align:right"><div class="lbl" style="margin:0">rest</div><span style="font:700 22px Roboto Mono;color:#41D96B" data-live="rest" data-idle="--:--" data-done="0:00"></span></div></div>'
      + '<table class="bd"><tr><th>Set</th><th>Destination</th><th>Status</th></tr>' + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
          return x.sets.map((st, j) => { const first = j === 0, isNext = !st.done && x.sets.findIndex((y) => !y.done) === j;
            return '<tr><td>' + F((x.unilateral ? (st.L ? 'R' : 'L') : '') + (j + 1), st.done ? 'g' : 'y') + '</td><td class="dest">' + (first ? e(x.name) + '<small>' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</small>' : '') + '<button class="st wait" style="padding:2px 4px" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' × ' + st.r + (st.planFail ? ' F' : '') + '</button></td><td>'
              + (x.unilateral && !st.done ? '<button class="st ' + (isNext ? 'board' : 'wait') + '" data-do="set" data-arg="' + i + ':' + j + ':' + (st.L ? 'R' : 'L') + '">' + (st.L ? 'BOARD R' : 'BOARD L') + '</button>' : '<button class="st ' + (st.done ? 'dep on' : isNext ? 'board' : 'wait') + '" data-do="set" data-arg="' + i + ':' + j + (x.unilateral ? ':L' : '') + '">' + (st.done ? 'DEPARTED' : isNext ? 'BOARDING' : 'ON TIME') + '</button>') + '</td></tr>'; }).join('')
            + '<tr><td colspan="3"><div class="tools"><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Change gate</button><button data-open="exercise" data-arg="' + x.id + '">Info</button><button data-do="rest" data-arg="90">Rest 90</button></div></td></tr>'; }).join('') + '</table>'
      + '<button class="go" data-do="finish">Land · +' + p.xp + ' XP</button>' + S('timer', 'Rest timer', '', 'data-open="rest"') + S('x', 'Cancel flight', 'Discard', 'data-do="discard"', 'r');
  }
  function arr() {
    const t = G.totals();
    return '<div class="lbl">Arrivals</div><table class="bd">' + G.history().slice(0, 7).map((w) => '<tr class="rowb" data-open="workout" data-arg="' + w.id + '"><td>' + F(String(G.parse(w.date).getDate()).padStart(2, '0'), 'y') + '</td><td class="dest">' + e(w.planName) + '<small>' + G.fmtDate(w.date) + ' · ' + w.minutes + ' min</small></td><td><span class="st dep">+' + w.xp + '</span></td></tr>').join('') + '</table>'
      + '<div class="lbl">Totals</div><div style="display:flex;gap:12px;padding:0 4px">' + [['WK', t.week.workouts], ['MO', t.month.workouts], ['ALL', t.all.workouts]].map(([l, v]) => '<div>' + F(v, 'y') + '<div class="lbl" style="margin:2px 0">' + l + '</div></div>').join('') + '</div>'
      + '<div class="lbl">Record altitudes</div><table class="bd">' + G.records().list.slice(0, 4).map((r) => '<tr><td class="dest">' + e(r.name) + '</td><td>' + F(G.fmtW(r.kg, true), 'g') + '</td></tr>').join('') + '</table>'
      + S('trophy', 'Records', '', 'data-open="records"') + S('clock', 'All arrivals', 'History', 'data-open="history"') + S('calendar', 'Calendar', '', 'data-open="calendar"', 'b') + S('medal', 'Achievements', '', 'data-open="achievements"', 'g') + S('scale', 'Body', '', 'data-open="body"') + S('utensils', 'Food', '', 'data-open="food"') + S('camera', 'Photos', '', 'data-open="photos"');
  }
  function lounge() {
    const L = G.leaderboard();
    return S('star', 'Top 20 · #' + (L.me ? L.me.rank : '–'), 'This week’s frequent lifters', 'data-open="leaderboard"') + S('chat', 'Messages', '', 'data-open="chats"', 'g') + S('users', 'Friends', '', 'data-open="friends"', 'b') + S('edit', 'Post', '', 'data-open="post"')
      + '<div class="lbl">Postcards</div>' + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function info() { return S('target', 'Weekly goal', G.goal() + ' flights a week', 'data-open="settings"') + S('bell', 'Profile & reminders', '', 'data-open="profile"') + S('settings', 'Settings', 'Language, units, sound, backup', 'data-open="settings"'); }
  K.app({ root: document.getElementById('app'), screens: { dep, gate, arr, lounge, info }, chrome, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=gate]').click(); } } });
})();
</script>
</body>
</html>
