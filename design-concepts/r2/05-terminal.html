<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>05 · Terminal — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0B0F0C; color: #A9F0C0; font: 13px/1.55 'JetBrains Mono', ui-monospace, monospace;
    --k-bg: #0E1410; --k-fg: #C3F7D3; --k-mute: #5E8A6C; --k-card: #142019; --k-line: #1F3226; --k-acc: #39D98A; --k-acc-fg: #04140A; --k-danger: #FF6B6B; --k-good: #2E8B57; --k-bad: #3A2222;
    --k-radius: 4px; --k-font: 'JetBrains Mono', ui-monospace, monospace; --k-scrim: rgba(0,0,0,.7); }
  .app::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); z-index: 40; }
  .tb { padding: 44px 12px 6px; color: #5E8A6C; display: flex; justify-content: space-between; border-bottom: 1px solid #1F3226; }
  main { flex: 1; overflow-y: auto; padding: 10px 12px 16px; }
  .p { color: #39D98A; } .p::before { content: 'martin@gymquest:~$ '; color: #5E8A6C; }
  .o { white-space: pre-wrap; margin: 2px 0 12px; color: #A9F0C0; }
  .dim { color: #5E8A6C; } .hi { color: #F5F78B; } .red { color: #FF8A7A; } .grn { color: #39D98A; } .cy { color: #6FD3F2; }
  .cmds { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .cmd { border: 1px solid #2B4A36; background: #101A13; color: #A9F0C0; font: 13px 'JetBrains Mono', monospace; padding: 7px 9px; cursor: pointer; border-radius: 3px; }
  .cmd:hover, .cmd:focus-visible { background: #1A2E21; outline: none; }
  .cmd.go { border-color: #39D98A; color: #0B0F0C; background: #39D98A; font-weight: 700; }
  .cur::after { content: '█'; animation: bl 1s steps(1) infinite; color: #39D98A; }
  @keyframes bl { 50% { opacity: 0; } }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 12px; }
  td, th { padding: 3px 4px; text-align: left; vertical-align: top; font-weight: 400; }
  th { color: #5E8A6C; border-bottom: 1px dashed #2B4A36; }
  .box { border: 1px solid #2B4A36; padding: 8px 10px; margin: 6px 0 12px; }
  .box.cur-ex { border-color: #39D98A; }
  .sb { border: 0; background: none; color: #A9F0C0; font: 13px 'JetBrains Mono', monospace; padding: 4px 2px; cursor: pointer; }
  .sb.on { color: #39D98A; font-weight: 700; }
  .lnk { border: 0; background: none; color: #6FD3F2; font: 13px 'JetBrains Mono', monospace; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
  nav { display: flex; background: #39D98A; color: #04140A; padding: 2px 4px 24px; gap: 2px; font-weight: 700; }
  nav button { border: 0; background: none; color: #04140A; font: 700 12px 'JetBrains Mono', monospace; padding: 6px 4px; cursor: pointer; flex: 1; }
  nav button.is-active { background: #04140A; color: #39D98A; }
  .bar { display: inline-block; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="tb"><span>gymquest — zsh</span><span data-live="clock"></span></div>
  <main data-scroll>
    <section data-screen="today"></section><section data-screen="train" hidden></section><section data-screen="stats" hidden></section><section data-screen="net" hidden></section><section data-screen="cfg" hidden></section>
  </main>
  <nav><button data-tab="today">0:today</button><button data-tab="train">1:train</button><button data-tab="stats">2:stats</button><button data-tab="net">3:net</button><button data-tab="cfg">4:cfg</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const dots = (label, val, w) => label + ' ' + '.'.repeat(Math.max(2, (w || 18) - label.length)) + ' ' + val;
  const bar = (n, of, w) => { w = w || 10; const f = Math.round(Math.min(1, of ? n / of : 0) * w); return '[' + '#'.repeat(f) + '-'.repeat(w - f) + ']'; };
  const C = (label, attrs, cls) => '<button class="cmd ' + (cls || '') + '" ' + attrs + '>' + label + '</button>';
  const P = (c) => '<div class="p">' + c + '</div>';

  function today() {
    const w = G.weekInfo(), X = G.xp(), rec = G.recommended(), s = G.sess();
    return P('gq status') + '<div class="o">' + dots('date', G.fmtDate(G.today()) + ' (w' + w.num + ')') + '\n' + dots('week', w.done + '/' + w.goal + ' ' + bar(w.done, w.goal, 8)) + (w.excused ? ' <span class="hi">excused</span>' : '') + '\n' + dots('streak', G.streak() + ' weeks') + '\n' + dots('level', X.level + ' ' + bar(X.into, X.need, 8) + ' ' + X.total + 'xp') + '\n'
      + dots('days', w.days.map((d) => d.done ? '<span class="grn">■</span>' : d.today ? '<span class="hi">□</span>' : '<span class="dim">·</span>').join(' ')) + '\n<span class="dim"># ' + G.motivation() + '</span></div>'
      + (s ? P('gq session --attach') + '<div class="o"><span class="hi">' + e(s.planName) + '</span> running <span data-live="elapsed"></span>, ' + G.progress().done + '/' + G.progress().total + ' sets</div><div class="cmds">' + C('attach', 'data-tab="train"', 'go') + '</div>'
        : P('gq next') + '<div class="o">' + (rec ? '<span class="hi">' + e(rec.name).toLowerCase() + '</span> ✦ ' + rec.exercises.length + ' exercises, ~' + G.planMinutes(rec) + ' min' : 'no plans') + '</div><div class="cmds">' + (rec ? C('gq start ' + e(rec.name).toLowerCase(), 'data-do="start" data-arg="' + rec.id + '"', 'go') : '') + C('gq excuse' + (w.excused ? ' --undo' : ''), 'data-do="excuse"') + C('gq cal', 'data-open="calendar"') + C('gq rest', 'data-open="rest"') + C('gq run', 'data-open="activity"') + '</div>')
      + '<div class="p cur"></div>';
  }

  function train() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return P('gq plans ls') + '<table><tr><th>#</th><th>plan</th><th>ex</th><th>min</th></tr>' + G.plans().map((p, i) => '<tr><td class="dim">' + i + '</td><td><button class="sb' + (p === sel ? ' on' : '') + '" data-do="select" data-arg="' + p.id + '">' + (p === sel ? '> ' : '  ') + e(p.name).toLowerCase() + (p === G.recommended() ? ' ✦' : '') + '</button></td><td>' + p.exercises.length + '</td><td>' + G.planMinutes(p) + '</td></tr>').join('') + '</table>'
        + (sel ? P('gq plans show ' + e(sel.name).toLowerCase()) + '<table><tr><th>exercise</th><th>sets</th><th>load</th></tr>' + sel.exercises.map((x) => '<tr><td>' + e(x.name) + (x.unilateral ? ' <span class="cy">L/R</span>' : '') + '</td><td>' + x.sets + 'x' + x.reps + (x.failSets.length ? ' <span class="red">f' + x.failSets.join(',') + '</span>' : '') + '</td><td>' + G.fmtW(x.weight) + '</td></tr>').join('') + '</table>' : '')
        + '<div class="cmds">' + (sel ? C('gq start', 'data-do="start" data-arg="' + sel.id + '"', 'go') + C('gq plans edit', 'data-open="editplan" data-arg="' + sel.id + '"') : '') + C('gq plans mv', 'data-open="plans"') + C('gq plans new', 'data-open="newplan"') + C('gq fullbody', 'data-open="fullbody"') + C('gq lib', 'data-open="library"') + '</div><div class="p cur"></div>';
    }
    const p = G.progress();
    return P('gq session') + '<div class="o"><span class="hi">' + e(s.planName) + '</span> elapsed <span data-live="elapsed"></span> ' + bar(p.done, p.total, 12) + ' ' + p.done + '/' + p.total + '\nrest: <span data-live="rest" data-idle="idle" data-done="DONE"></span></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="box' + (i === s.cur ? ' cur-ex' : '') + '"><div><span class="hi">' + e(x.name) + '</span> <span class="' + (c.kind === 'up' ? 'grn' : c.kind === 'down' ? 'red' : 'dim') + '"># ' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</span></div>'
          + x.sets.map((st, j) => '<div>' + (x.unilateral ? '<button class="sb' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">[' + (st.L ? 'x' : ' ') + ']L</button><button class="sb' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">[' + (st.R ? 'x' : ' ') + ']R</button>' : '<button class="sb' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">[' + (st.done ? 'x' : ' ') + '] set ' + (j + 1) + '</button>')
            + ' <button class="lnk" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + ' x ' + st.r + '</button>' + (st.planFail ? ' <span class="red">' + (st.fail ? 'failed✓' : 'to-failure') + '</span>' : '') + '</div>').join('')
          + '<div class="cmds" style="margin:6px 0 0">' + C('+set', 'data-do="addset" data-arg="' + i + '"') + C('swap', 'data-open="replace" data-arg="' + i + '"') + C('man', 'data-open="exercise" data-arg="' + x.id + '"') + C('rest 90', 'data-do="rest" data-arg="90"') + '</div></div>'; }).join('')
      + '<div class="cmds">' + C('gq finish', 'data-do="finish"', 'go') + C('gq rest', 'data-open="rest"') + C('gq discard', 'data-do="discard"') + '</div><div class="p cur"></div>';
  }

  function stats() {
    const t = G.totals(), ser = G.weeklySeries(8), max = Math.max(1, ...ser.map((x) => x.sets));
    return P('gq stats') + '<table><tr><th></th><th>wk</th><th>mo</th><th>all</th></tr>' + [['workouts', 'workouts'], ['sets', 'sets'], ['minutes', 'minutes']].map(([l, k]) => '<tr><td class="dim">' + l + '</td><td>' + t.week[k] + '</td><td>' + t.month[k] + '</td><td>' + t.all[k] + '</td></tr>').join('') + '</table>'
      + P('gq sets --weeks 8') + '<div class="o">' + ser.map((x) => x.label.padEnd(4) + ' ' + '█'.repeat(Math.round(x.sets / max * 18)) + ' ' + x.sets).join('\n') + '</div>'
      + P('gq pr | head -5') + '<table>' + G.records().list.slice(0, 5).map((r) => '<tr><td>' + e(r.name) + '</td><td class="hi">' + G.fmtW(r.kg) + '</td><td class="dim">' + G.fmtShort(r.date) + '</td></tr>').join('') + '</table>'
      + P('gq log -n 4') + '<div class="o">' + G.history().slice(0, 4).map((w) => '<button class="lnk" data-open="workout" data-arg="' + w.id + '">' + w.date + '</button> ' + e(w.planName).toLowerCase() + ' ' + w.minutes + 'm +' + w.xp + 'xp').join('\n') + '</div>'
      + '<div class="cmds">' + C('gq pr', 'data-open="records"') + C('gq log', 'data-open="history"') + C('gq cal', 'data-open="calendar"') + C('gq ach', 'data-open="achievements"') + C('gq body', 'data-open="body"') + C('gq food', 'data-open="food"') + C('gq photos', 'data-open="photos"') + C('gq act', 'data-open="activity"') + '</div><div class="p cur"></div>';
  }

  function net() {
    const L = G.leaderboard();
    return P('gq top --limit 5') + '<table>' + L.top.slice(0, 5).map((r) => '<tr class="' + (r.me ? 'hi' : '') + '"><td>' + r.rank + '</td><td>' + e(r.person.name) + '</td><td>' + r.xp + 'xp</td></tr>').join('') + (L.me && L.me.rank > 5 ? '<tr class="hi"><td>' + L.me.rank + '</td><td>you</td><td>' + L.me.xp + 'xp</td></tr>' : '') + '</table>'
      + '<div class="cmds">' + C('gq top', 'data-open="leaderboard"') + C('gq msg', 'data-open="chats"') + C('gq friends', 'data-open="friends"') + C('gq post', 'data-open="post"', 'go') + '</div>'
      + P('gq feed') + G.feed().map((p) => '<div class="o"><span class="cy">@' + e(G.person(p.who).handle) + '</span> <span class="dim">' + G.timeAgo(p.ts) + '</span>\n' + e(p.text) + (p.workout ? '\n<span class="dim">  ' + p.workout.lines.map(e).join('\n  ') + '</span>' : '') + '\n<button class="lnk" data-do="like" data-arg="' + p.id + '">' + (p.liked ? '♥' : '♡') + ' ' + p.likes + '</button>  <button class="lnk" data-open="postview" data-arg="' + p.id + '">' + p.comments.length + ' replies</button></div>').join('') + '<div class="p cur"></div>';
  }
  function cfg() {
    const s = G.state.settings;
    return P('cat ~/.gymquestrc') + '<div class="o">' + dots('goal', s.weeklyGoal + '/week', 12) + '\n' + dots('units', s.units, 12) + '\n' + dots('sound', s.sound ? 'on (' + s.soundLength + ')' : 'off', 12) + '\n' + dots('sync', s.sync ? 'on' : 'off', 12) + '\n' + dots('lang', s.lang, 12) + '</div>'
      + '<div class="cmds">' + C('gq config', 'data-open="settings"', 'go') + C('gq units ' + (s.units === 'kg' ? 'lb' : 'kg'), 'data-do="unit" data-arg="' + (s.units === 'kg' ? 'lb' : 'kg') + '"') + C('gq profile', 'data-open="profile"') + '</div><div class="p cur"></div>';
  }

  K.app({ root: document.getElementById('app'), screens: { today, train, stats, net, cfg }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=train]').click(); } } });
})();
</script>
</body>
</html>
