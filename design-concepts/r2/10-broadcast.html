<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 · Broadcast — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(120% 70% at 50% 0%, #1B2B57 0%, #0A1027 60%); color: #fff; font: 15px/1.35 Barlow, system-ui, sans-serif;
    --k-bg: #101A3A; --k-fg: #fff; --k-mute: #9CA8CC; --k-card: #18254D; --k-line: #24346A; --k-acc: #FFD400; --k-acc-fg: #0A1027; --k-good: #1FA463; --k-bad: #4A2333; --k-font: Barlow, sans-serif; --k-head: 'Barlow Condensed', sans-serif; --k-radius: 6px; }
  .bug { position: absolute; top: 40px; left: 12px; right: 12px; display: flex; height: 34px; z-index: 5; font: 800 17px 'Barlow Condensed', sans-serif; text-transform: uppercase; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .bug > * { display: flex; align-items: center; padding: 0 10px; }
  .bug .l { background: #FFD400; color: #0A1027; } .bug .s { background: #fff; color: #0A1027; font-size: 20px; } .bug .t { background: #0047BB; flex: 1; justify-content: flex-end; font-variant-numeric: tabular-nums; } .bug .live { background: #E2231A; }
  main { flex: 1; overflow-y: auto; padding: 86px 12px 20px; }
  .l3 { position: relative; margin: 12px 0; }
  .l3 .top { display: inline-block; background: #FFD400; color: #0A1027; font: 800 13px 'Barlow Condensed', sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; }
  .l3 .main { background: linear-gradient(90deg, #fff 0%, #E8ECF7 100%); color: #0A1027; padding: 10px 12px; font: 800 30px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%); }
  .l3 .sub { background: #0047BB; color: #fff; padding: 6px 12px; font: 600 14px Barlow; display: inline-block; clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%); padding-right: 26px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 12px 0; }
  .stats div { background: rgba(255,255,255,.07); border-top: 3px solid #FFD400; padding: 8px 10px; }
  .stats b { display: block; font: 800 34px/1 'Barlow Condensed', sans-serif; } .stats small { color: #9CA8CC; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; background: #E2231A; color: #fff; padding: 15px; font: 800 22px 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); margin: 8px 0; }
  .go.y { background: #FFD400; color: #0A1027; } .go.b { background: #0047BB; }
  .tbl { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  .tbl td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .tbl tr.me td { background: rgba(255,212,0,.15); }
  .tbl td.n { font: 800 18px 'Barlow Condensed'; color: #FFD400; width: 30px; }
  .tbl td.r { text-align: right; font: 700 18px 'Barlow Condensed'; }
  .menu button { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; border-left: 4px solid #0047BB; background: rgba(255,255,255,.06); margin-bottom: 4px; padding: 12px; font: 700 18px 'Barlow Condensed', sans-serif; letter-spacing: .03em; text-transform: uppercase; color: #fff; cursor: pointer; text-align: left; }
  .menu button small { color: #9CA8CC; font: 500 13px Barlow; text-transform: none; }
  .ex { background: rgba(255,255,255,.06); margin-bottom: 8px; border-left: 4px solid #24346A; }
  .ex.cur { border-left-color: #FFD400; }
  .ex .h { display: flex; align-items: center; gap: 10px; padding: 10px 12px 4px; }
  .ex .h b { font: 800 22px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; flex: 1; }
  .ex .cmp { font: 700 12px 'Barlow Condensed'; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; background: #24346A; }
  .ex .cmp.up { background: #1FA463; } .ex .cmp.down { background: #E2231A; }
  .lap { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 4px; padding: 8px 12px; }
  .lap button { border: 0; background: #0A1027; color: #fff; padding: 7px 4px; font: 800 18px 'Barlow Condensed'; cursor: pointer; border-bottom: 3px solid #24346A; }
  .lap button small { display: block; font: 500 11px Barlow; color: #9CA8CC; }
  .lap button.on { border-bottom-color: #1FA463; background: #12391F; }
  .tools { display: flex; gap: 14px; padding: 0 12px 10px; } .tools button { border: 0; background: none; color: #FFD400; font: 700 13px 'Barlow Condensed'; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; padding: 2px 0; }
  .ticker { position: relative; overflow: hidden; white-space: nowrap; background: #FFD400; color: #0A1027; font: 700 14px 'Barlow Condensed', sans-serif; text-transform: uppercase; padding: 5px 0; }
  .ticker span { display: inline-block; padding-left: 100%; animation: tk 30s linear infinite; }
  @keyframes tk { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .ticker span { animation: none; padding-left: 10px; } }
  nav { display: flex; background: #0A1027; padding: 4px 4px 24px; border-top: 2px solid #0047BB; }
  nav button { flex: 1; border: 0; background: none; color: #9CA8CC; font: 800 14px 'Barlow Condensed'; letter-spacing: .06em; text-transform: uppercase; padding: 9px 0; cursor: pointer; }
  nav button.is-active { color: #0A1027; background: #FFD400; }
  .feed { background: rgba(255,255,255,.06); padding: 10px 12px; margin-bottom: 6px; cursor: pointer; }
  .feed .k-post { border: 0; padding: 0; } .feed .k-share { background: #0A1027; color: #fff; border-color: #24346A; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <div class="bug" id="bug"></div>
  <main data-scroll>
    <section data-screen="live"></section><section data-screen="match" hidden></section><section data-screen="stats" hidden></section><section data-screen="league" hidden></section><section data-screen="studio" hidden></section>
  </main>
  <div class="ticker"><span id="tick"></span></div>
  <nav><button data-tab="live">Live</button><button data-tab="match">Match</button><button data-tab="stats">Stats</button><button data-tab="league">League</button><button data-tab="studio">Studio</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, I = K.icon, e = G.esc;
  const M = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '›') + '</small></button>';
  const L3 = (top, main, sub) => '<div class="l3"><div class="top">' + top + '</div><div class="main">' + main + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  function chrome() {
    const w = G.weekInfo(), s = G.sess();
    document.getElementById('bug').innerHTML = '<span class="l">GQ</span><span class="s">' + w.done + '–' + w.goal + '</span><span class="t">' + (s ? '<span data-live="elapsed"></span>' : 'Week ' + w.num) + '</span>' + (s ? '<span class="live">● Live</span>' : '');
    document.getElementById('tick').textContent = G.feed().map((p) => G.person(p.who).name + ': ' + p.text).join('   ◆   ') + '   ◆   Top lift: ' + ((G.records().list[0] || {}).name || '') + ' ' + G.fmtW((G.records().list[0] || {}).kg || 0);
  }
  function live() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return L3('Tonight’s fixture', s ? e(s.planName) + ' · in play' : rec ? e(rec.name) + ' ✦' : 'No fixture', s ? G.progress().done + ' of ' + G.progress().total + ' sets complete' : rec ? rec.exercises.length + ' exercises · approx ' + G.planMinutes(rec) + ' min' : '')
      + (s ? '<button class="go" data-tab="match">' + I('play') + ' Back to the match</button>' : rec ? '<button class="go" data-do="start" data-arg="' + rec.id + '">' + I('play') + ' Kick off</button>' : '')
      + '<div class="stats"><div><small>Week</small><b>' + w.done + '/' + w.goal + '</b></div><div><small>Streak</small><b>' + G.streak() + '</b></div><div><small>Level</small><b>' + X.level + '</b></div></div>'
      + L3('Form guide', w.days.map((d) => d.done ? 'W' : d.today ? '•' : d.future ? '–' : 'R').join(' '), G.motivation())
      + '<div class="menu">' + M(w.excused ? 'Week excused' : 'Excuse this week', w.excused ? 'undo' : 'streak protected', 'data-do="excuse"') + M('Calendar', '', 'data-open="calendar"') + M('Rest clock', '', 'data-open="rest"') + M('Activity', 'run · walk · ride', 'data-open="activity"') + '</div>';
  }
  function match() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return L3('Team sheet', 'Choose a plan', 'Rotation order · ✦ next up') + '<div class="menu">' + G.plans().map((p) => M((p === sel ? '▶ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' ex · ' + G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<table class="tbl">' + sel.exercises.map((x, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + e(x.name) + '</td><td class="r">' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</td></tr>').join('') + '</table><button class="go" data-do="start" data-arg="' + sel.id + '">Kick off ' + e(sel.name) + '</button><button class="go b" data-open="editplan" data-arg="' + sel.id + '">Edit team sheet</button>' : '')
        + '<div class="menu">' + M('Squad rotation', 'manage plans', 'data-open="plans"') + M('New plan', '', 'data-open="newplan"') + M('Full Body builder', '', 'data-open="fullbody"') + M('Scouting: exercise library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return L3('Live · ' + e(s.planName), '<span data-live="elapsed"></span>', p.done + '/' + p.total + ' sets · rest <span data-live="rest" data-idle="—" data-done="over"></span>')
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="ex' + (i === s.cur ? ' cur' : '') + '"><div class="h"><b>' + e(x.name) + '</b><span class="cmp ' + c.kind + '">' + (x.replaces ? 'Sub' : c.text) + '</span></div><div class="lap">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="' + (st.L ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="' + (st.R ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>× ' + st.r + '</small></button>' : '<button class="' + (st.done ? 'on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + '<small>× ' + st.r + (st.planFail ? ' · fail' : '') + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Load</button><button data-do="addset" data-arg="' + i + '">+ Set</button><button data-open="replace" data-arg="' + i + '">Substitute</button><button data-open="exercise" data-arg="' + x.id + '">Replay</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="go y" data-do="finish">Full time · +' + p.xp + ' XP</button><button class="go b" data-open="rest">Rest clock</button><button class="go b" data-do="discard">Abandon match</button>';
  }
  function stats() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return L3('Season stats', t.all.workouts + ' matches', t.all.sets + ' sets · ' + t.all.minutes + ' minutes') + '<div class="stats"><div><small>Week</small><b>' + t.week.workouts + '</b></div><div><small>Month</small><b>' + t.month.workouts + '</b></div><div><small>XP</small><b>' + G.xp().total + '</b></div></div>'
      + '<div style="color:#FFD400">' + K.bars(ser.map((x) => x.sets), { h: 110, labels: ser.map((x) => x.label) }) + '</div>'
      + '<table class="tbl">' + G.records().list.slice(0, 5).map((r, i) => '<tr><td class="n">' + (i + 1) + '</td><td>' + e(r.name) + '</td><td class="r">' + G.fmtW(r.kg) + '</td></tr>').join('') + '</table>'
      + '<div class="menu">' + M('Records', '', 'data-open="records"') + M('Match history', '', 'data-open="history"') + M('Calendar', '', 'data-open="calendar"') + M('Trophies', '', 'data-open="achievements"') + M('Body', '', 'data-open="body"') + M('Nutrition', '', 'data-open="food"') + M('Photos', '', 'data-open="photos"') + '</div>';
  }
  function league() {
    const Lb = G.leaderboard();
    return L3('League table', 'Top 20 this week', 'You: #' + (Lb.me ? Lb.me.rank : '–')) + '<table class="tbl">' + Lb.top.slice(0, 8).map((r) => '<tr class="' + (r.me ? 'me' : '') + '"><td class="n">' + r.rank + '</td><td>' + e(r.person.name) + '</td><td class="r">' + r.xp + '</td></tr>').join('') + '</table>'
      + '<div class="menu">' + M('Full table', '', 'data-open="leaderboard"') + M('Dressing room chat', '', 'data-open="chats"') + M('Teammates', '', 'data-open="friends"') + M('Post an update', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="feed" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function studio() {
    return L3('Studio', e(G.state.profile.name), 'Level ' + G.xp().level + ' · ' + G.goal() + ' workouts a week') + '<div class="menu">' + M('Weekly goal', G.goal(), 'data-open="settings"') + M('Profile and reminders', '', 'data-open="profile"') + M('Settings', 'sound, units, backup', 'data-open="settings"') + '</div>';
  }
  K.app({ root: document.getElementById('app'), screens: { live, match, stats, league, studio }, chrome, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=match]').click(); } } });
})();
</script>
</body>
</html>
