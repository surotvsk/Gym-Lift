<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 · Passport — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=OCR+A+Extended&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1F2A44; color: #2C2A26; font: 14px/1.4 'IBM Plex Sans', system-ui, sans-serif;
    --k-acc: #1F2A44; --k-font: 'IBM Plex Sans', sans-serif; --k-head: 'Cormorant SC', serif; --k-radius: 8px; --k-bg: #F5EFDF; --k-card: #EAE1C8; --k-line: #D8CCAA; --k-good: #2F6B4F; --k-bad: #E6C9BD; }
  main { flex: 1; overflow-y: auto; padding: 44px 12px 16px; }
  .page { position: relative; background: #F5EFDF; border-radius: 6px; padding: 16px 14px; margin-bottom: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
    background-image: repeating-radial-gradient(circle at 30% 20%, transparent 0 10px, rgba(31,42,68,.05) 10px 11px), repeating-linear-gradient(60deg, transparent 0 14px, rgba(160,120,40,.06) 14px 15px); }
  .page .no { position: absolute; top: 8px; right: 12px; font: 11px 'OCR A Extended', monospace; color: #9C8F70; }
  .page h2 { font: 700 22px 'Cormorant SC', serif; margin: 0 0 8px; color: #1F2A44; letter-spacing: .04em; }
  .cover { text-align: center; color: #D9B65A; background: #1F2A44; border: 2px solid #2E3B5C; border-radius: 10px; padding: 18px; margin-bottom: 12px; }
  .cover h1 { font: 700 30px 'Cormorant SC', serif; margin: 6px 0; letter-spacing: .12em; }
  .crest { width: 70px; height: 70px; margin: 0 auto; border: 2px solid #D9B65A; border-radius: 50%; display: grid; place-items: center; font: 700 28px 'Cormorant SC'; }
  .mrz { font: 12px/1.4 'OCR A Extended', monospace; letter-spacing: .1em; color: #2C2A26; word-break: break-all; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; }
  .grid small { display: block; color: #8C8064; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; } .grid b { font-size: 15px; }
  .stamps { display: flex; flex-wrap: wrap; gap: 8px; }
  .stamp { width: 92px; height: 92px; border-radius: 50%; border: 3px double var(--c, #8E2B2B); color: var(--c, #8E2B2B); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(var(--r, -8deg)); font: 700 11px 'IBM Plex Sans'; text-transform: uppercase; cursor: pointer; background: none; opacity: .85; padding: 4px; }
  .stamp b { font: 700 15px 'Cormorant SC'; } .stamp.sq { border-radius: 6px; }
  .stamp.empty { border-style: dashed; opacity: .4; color: #8C8064; border-color: #8C8064; }
  .go { display: block; width: 100%; border: 0; border-radius: 6px; background: #1F2A44; color: #D9B65A; font: 700 18px 'Cormorant SC'; letter-spacing: .1em; padding: 12px; cursor: pointer; margin-top: 10px; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px dashed #CDBF98; background: none; padding: 9px 0; font: 600 14px 'IBM Plex Sans'; cursor: pointer; color: #2C2A26; text-align: left; }
  .lst small { color: #8C8064; font-weight: 400; }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .vs { width: 58px; height: 58px; border-radius: 50%; border: 2px dashed #B9AC88; background: none; font: 700 12px 'IBM Plex Sans'; cursor: pointer; color: #8C8064; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .vs small { font-size: 9px; font-weight: 400; }
  .vs.on { border: 3px double #2F6B4F; color: #2F6B4F; transform: rotate(-10deg); background: rgba(47,107,79,.06); }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; } .tools button { border: 0; background: none; color: #1F2A44; font: 600 12px 'IBM Plex Sans'; text-decoration: underline; cursor: pointer; padding: 2px 0; }
  nav { display: flex; background: #151D30; padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #8B95B3; font: 700 13px 'Cormorant SC'; letter-spacing: .06em; padding: 8px 0; cursor: pointer; }
  nav button.is-active { color: #D9B65A; }
  .post { cursor: pointer; border-bottom: 1px dashed #CDBF98; padding: 8px 0; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="id"></section><section data-screen="border" hidden></section><section data-screen="stamps" hidden></section><section data-screen="fellows" hidden></section><section data-screen="consulate" hidden></section>
  </main>
  <nav><button data-tab="id">Identity</button><button data-tab="border">Border</button><button data-tab="stamps">Stamps</button><button data-tab="fellows">Fellows</button><button data-tab="consulate">Consulate</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const COL = ['#8E2B2B', '#1F5A8E', '#2F6B4F', '#7A4E9C', '#A0661C', '#3B3B3B'];
  const col = (planId) => COL[Math.max(0, G.plans().findIndex((p) => p.id === planId)) % COL.length];
  const li = (a, b, attrs) => '<button ' + attrs + '><span>' + a + '</span><small>' + (b == null ? '→' : b) + '</small></button>';
  function id() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), pr = G.state.profile;
    const mrz = ('P<GQ' + pr.name.toUpperCase() + '<<L' + X.level + '<<' + G.state.history.length + 'W<<<<<<<<<<<<<<<<<<<<<<<<').slice(0, 44);
    return '<div class="cover"><div class="crest">GQ</div><h1>Passport</h1><div style="font:600 12px IBM Plex Sans;letter-spacing:.2em">REPUBLIC OF TRAINING</div></div>'
      + '<div class="page"><span class="no">P. 1</span><div style="display:flex;gap:12px">' + K.avatar('me', 70) + '<div class="grid" style="flex:1"><div><small>Surname / Name</small><b>' + e(pr.name) + '</b></div><div><small>Level</small><b>' + X.level + ' · ' + G.levelTitle(X.level) + '</b></div><div><small>Week ' + w.num + '</small><b>' + w.done + ' / ' + w.goal + '</b></div><div><small>Streak</small><b>' + G.streak() + ' weeks</b></div><div><small>XP</small><b>' + X.total + '</b></div><div><small>Issued</small><b>' + G.fmtShort(G.today()) + '</b></div></div></div><div class="mrz">' + e(mrz) + '<br>' + e(('<<' + w.key.replace('-', '') + '<<<' + w.done + 'OF' + w.goal + '<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0, 44)) + '</div></div>'
      + '<div class="page"><span class="no">P. 2</span><h2>' + (s ? 'Currently abroad' : 'Next journey ✦') + '</h2>' + (s ? '<p style="margin:0">' + e(s.planName) + ' · <span data-live="elapsed"></span></p><button class="go" data-tab="border">Return to the border</button>' : rec ? '<p style="margin:0">' + e(rec.name) + ' · ' + rec.exercises.length + ' checkpoints · about ' + G.planMinutes(rec) + ' min</p><button class="go" data-do="start" data-arg="' + rec.id + '">Depart</button>' : '') + '<p style="color:#8C8064;font-size:13px">' + G.motivation() + '</p></div>'
      + '<div class="page"><span class="no">P. 3</span><div class="lst">' + li(w.excused ? 'Travel waiver granted' : 'Request a travel waiver', w.excused ? 'undo' : 'excuse this week', 'data-do="excuse"') + li('Rest timer', null, 'data-open="rest"') + li('Excursions: run, walk, ride', null, 'data-open="activity"') + li('Calendar', null, 'data-open="calendar"') + li('Visas (achievements)', null, 'data-open="achievements"') + '</div></div>';
  }
  function border() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="page"><h2>Destinations</h2><div class="lst">' + G.plans().map((p) => li('<span style="color:' + col(p.id) + '">◉</span> ' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + (p === sel ? ' (chosen)' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div></div>'
        + (sel ? '<div class="page"><h2>Itinerary · ' + e(sel.name) + '</h2>' + sel.exercises.map((x, i) => '<div style="display:flex;justify-content:space-between;padding:3px 0"><span>' + (i + 1) + '. ' + e(x.name) + '</span><small>' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</small></div>').join('') + '<button class="go" data-do="start" data-arg="' + sel.id + '">Depart</button><div class="tools"><button data-open="editplan" data-arg="' + sel.id + '">Amend itinerary</button><button data-open="plans">Reorder</button><button data-open="newplan">New destination</button><button data-open="fullbody">Full Body builder</button><button data-open="library">Travel guide (library)</button></div></div>' : '');
    }
    const p = G.progress();
    return '<div class="page"><span class="no">' + p.done + '/' + p.total + '</span><h2>' + e(s.planName) + ' · <span data-live="elapsed"></span></h2><div style="color:#8C8064;font-size:13px">Rest: <span data-live="rest" data-idle="none" data-done="over"></span> · <button class="tools" style="display:inline;border:0;background:none;text-decoration:underline;cursor:pointer;padding:0;font:600 13px IBM Plex Sans" data-open="rest">timer</button></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<div class="page"' + (i === s.cur ? ' style="outline:2px solid #D9B65A"' : '') + '><span class="no">CHECKPOINT ' + (i + 1) + '</span><h2 style="font-size:19px">' + e(x.name) + '</h2><div style="color:#8C8064;font-size:12px">' + (x.replaces ? 'Rerouted from ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="vs' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="vs' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="vs' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + (st.done ? 'OK ' : '') + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tools"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Reroute</button><button data-open="exercise" data-arg="' + x.id + '">Guide</button><button data-do="rest" data-arg="90">Rest 90</button></div></div>'; }).join('')
      + '<button class="go" data-do="finish">Stamp passport · +' + p.xp + ' XP</button><div class="page lst" style="margin-top:12px">' + li('Cancel the trip', 'discard', 'data-do="discard"') + '</div>';
  }
  function stamps() {
    const h = G.history().slice(0, 12);
    return '<div class="page"><span class="no">P. 4–5</span><h2>Entry stamps</h2><div class="stamps">' + h.map((w, k) => '<button class="stamp' + (k % 3 === 2 ? ' sq' : '') + '" style="--c:' + col(w.planId) + ';--r:' + ((k * 37) % 24 - 12) + 'deg" data-open="workout" data-arg="' + w.id + '"><b>' + e(w.planName) + '</b>' + G.fmtShort(w.date) + '<span>' + w.minutes + ' MIN</span></button>').join('') + '<button class="stamp empty">next</button></div></div>'
      + '<div class="page"><h2>Visas · records</h2>' + G.records().list.slice(0, 5).map((r) => '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #CDBF98"><span>' + e(r.name) + '</span><b>' + G.fmtW(r.kg) + '</b></div>').join('') + '</div>'
      + '<div class="page lst">' + li('All stamps', G.state.history.length, 'data-open="history"') + li('Calendar', null, 'data-open="calendar"') + li('Records', null, 'data-open="records"') + li('Visas (achievements)', null, 'data-open="achievements"') + li('Health certificate (body)', null, 'data-open="body"') + li('Meals', null, 'data-open="food"') + li('Photos', null, 'data-open="photos"') + '</div>';
  }
  function fellows() {
    const L = G.leaderboard();
    return '<div class="page lst">' + li('Top 20 travellers this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', null, 'data-open="chats"') + li('Fellow travellers', null, 'data-open="friends"') + li('Send a postcard (post)', null, 'data-open="post"') + '</div>'
      + '<div class="page">' + G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('') + '</div>';
  }
  function consulate() { return '<div class="page"><h2>Consulate</h2><div class="lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile & reminders', null, 'data-open="profile"') + li('Settings', null, 'data-open="settings"') + '</div></div>'; }
  K.app({ root: document.getElementById('app'), screens: { id, border, stamps, fellows, consulate }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=border]').click(); } } });
})();
</script>
</body>
</html>
