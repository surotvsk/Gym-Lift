<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>58 · Synth — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1E2024; color: #E8E1D0; font: 14px/1.35 'Barlow Semi Condensed', system-ui, sans-serif;
    --led: #FF3B30; --grn: #34C759; --cream: #E8E1D0;
    --k-bg: #26292F; --k-fg: #E8E1D0; --k-mute: #A39C8C; --k-card: #2E3138; --k-line: #3B3F47; --k-acc: #FF8A3D; --k-acc-fg: #1E2024; --k-font: 'Barlow Semi Condensed', sans-serif; --k-radius: 4px; --k-good: #2C6E3E; --k-bad: #3E2A2A; }
  main { flex: 1; overflow-y: auto; padding: 42px 8px 14px; }
  .mod { position: relative; background: linear-gradient(#3A3E46, #2E3138); border-radius: 4px; padding: 12px 12px 14px; margin-bottom: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 #121316; }
  .mod::before, .mod::after { content: ''; position: absolute; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(#9A9A9A, #4A4A4A); }
  .mod::before { left: 6px; } .mod::after { right: 6px; }
  .mn { font: 700 13px 'Barlow Semi Condensed'; letter-spacing: .16em; text-transform: uppercase; text-align: center; color: var(--cream); margin-bottom: 8px; }
  .knobs { display: flex; justify-content: space-around; align-items: flex-start; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 11px 'Barlow Semi Condensed'; color: #A39C8C; text-transform: uppercase; letter-spacing: .08em; border: 0; background: none; cursor: pointer; }
  .knob .k { position: relative; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #F6F0E2, #CFC6B0 70%); box-shadow: 0 4px 6px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.15); }
  .knob .k::after { content: ''; position: absolute; left: 50%; top: 6px; width: 3px; height: 16px; margin-left: -1.5px; background: #1E2024; transform-origin: 50% 23px; transform: rotate(var(--r, 0deg)); border-radius: 2px; }
  .knob b { font: 700 18px 'Barlow Semi Condensed'; color: var(--cream); letter-spacing: 0; }
  .seq { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 4px 0; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer; color: #A39C8C; font: 600 10px 'Barlow Semi Condensed'; }
  .step i { width: 14px; height: 14px; border-radius: 50%; background: #4A1A18; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  .step.on i { background: var(--led); box-shadow: 0 0 10px var(--led), inset 0 -2px 3px rgba(0,0,0,.3); }
  .step.cur i { outline: 2px solid var(--cream); outline-offset: 2px; }
  .step .pad { width: 42px; height: 34px; border-radius: 4px; background: #CFC6B0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); color: #1E2024; font: 700 13px 'Barlow Semi Condensed'; display: grid; place-items: center; line-height: 1; }
  .step.on .pad { background: #E8E1D0; transform: translateY(1px); }
  .jacks { display: flex; justify-content: space-around; margin-top: 6px; }
  .jack { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#111 40%, #8C8C8C 45%, #5A5A5A 70%); }
  .cables { position: relative; height: 0; } .cables svg { position: absolute; left: 0; top: -14px; width: 100%; height: 40px; pointer-events: none; overflow: visible; }
  .btn { display: block; width: 100%; border: 0; border-radius: 4px; background: #FF8A3D; color: #1E2024; font: 700 16px 'Barlow Semi Condensed'; letter-spacing: .1em; text-transform: uppercase; padding: 12px; cursor: pointer; margin: 6px 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .btn.dk { background: #CFC6B0; } .btn.red { background: var(--led); color: #fff; }
  .lcd { background: #0F1A12; color: #7CFC9A; font: 700 28px 'Barlow Semi Condensed'; padding: 4px 10px; border-radius: 3px; box-shadow: inset 0 2px 5px rgba(0,0,0,.7); text-align: right; font-variant-numeric: tabular-nums; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #3B3F47; background: none; padding: 9px 0; font: 600 15px 'Barlow Semi Condensed'; cursor: pointer; color: var(--cream); text-align: left; }
  .lst button:last-child { border: 0; } .lst small { color: #A39C8C; }
  .tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 6px; } .tools button { border: 0; background: none; color: #FF8A3D; font: 600 12px 'Barlow Semi Condensed'; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; padding: 2px 0; }
  nav { display: flex; gap: 4px; background: #121316; padding: 6px 6px 24px; }
  nav button { flex: 1; border: 0; border-radius: 3px; background: #2E3138; color: #A39C8C; font: 700 12px 'Barlow Semi Condensed'; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; padding: 8px 0; }
  nav button.is-active { background: #CFC6B0; color: #1E2024; }
  .post { cursor: pointer; border-bottom: 1px solid #3B3F47; padding: 8px 0; } .post .k-post { border: 0; padding: 0; } .post .k-share { background: #26292F; color: #E8E1D0; border-color: #3B3F47; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="rack"></section><section data-screen="seq" hidden></section><section data-screen="scope" hidden></section><section data-screen="jam" hidden></section><section data-screen="cfg" hidden></section>
  </main>
  <nav><button data-tab="rack">Rack</button><button data-tab="seq">Sequence</button><button data-tab="scope">Scope</button><button data-tab="jam">Jam</button><button data-tab="cfg">Setup</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const PATCH = ['#FF3B30', '#FFCC00', '#34C759', '#0A84FF', '#BF5AF2'];
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s == null ? '' : s) + '</small></button>';
  const knob = (label, val, pct, attrs) => '<button class="knob" ' + (attrs || '') + '><span class="k" style="--r:' + (-135 + Math.max(0, Math.min(1, pct)) * 270) + 'deg"></span><b>' + val + '</b>' + label + '</button>';
  const M = (name, inner, style) => '<div class="mod"' + (style ? ' style="' + style + '"' : '') + '><div class="mn">' + name + '</div>' + inner + '</div>';
  function cable(n) { let s = '<div class="cables"><svg viewBox="0 0 370 40" preserveAspectRatio="none">'; for (let k = 0; k < n; k++) { const x1 = 40 + k * 70, x2 = 80 + k * 60; s += '<path d="M' + x1 + ' 0 C ' + x1 + ' 34, ' + x2 + ' 34, ' + x2 + ' 40" stroke="' + PATCH[k % 5] + '" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>'; } return s + '</svg></div>'; }
  function rack() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return M('Weekly clock', '<div class="seq">' + w.days.map((d) => '<span class="step' + (d.done ? ' on' : '') + (d.today ? ' cur' : '') + '"><i></i>' + d.d.slice(0, 2) + '</span>').join('') + '</div><div class="knobs" style="margin-top:8px">' + knob('Done', w.done + '/' + w.goal, w.done / w.goal, 'data-open="calendar"') + knob('Streak', G.streak(), G.streak() / 12, 'data-open="achievements"') + knob('Level', X.level, X.into / X.need, 'data-open="achievements"') + '</div>')
      + cable(2)
      + M(s ? 'Now playing' : 'Next patch ✦', s ? '<div class="lcd" data-live="elapsed"></div><div style="text-align:center;margin-top:6px">' + e(s.planName) + '</div><button class="btn" data-tab="seq">Open the sequencer</button>' : rec ? '<div style="text-align:center;font:700 22px Barlow Semi Condensed">' + e(rec.name) + '</div><div style="text-align:center;color:#A39C8C">' + rec.exercises.length + ' modules, about ' + G.planMinutes(rec) + ' min</div><div class="jacks">' + rec.exercises.map(() => '<span class="jack"></span>').join('') + '</div><button class="btn" data-do="start" data-arg="' + rec.id + '">Play ' + e(rec.name) + '</button>' : '')
      + M('Utilities', '<div class="lst">' + li(w.excused ? 'Mute this week (excused)' : 'Mute this week (excuse)', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Run, walk, ride', '', 'data-open="activity"') + '</div><div style="color:#A39C8C;margin-top:6px">' + G.motivation() + '</div>');
  }
  function seq() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return M('Patch memory', '<div class="lst">' + G.plans().map((p, k) => li('<span style="color:' + PATCH[k % 5] + '">●</span> ' + e(p.name) + (p === G.recommended() ? ' ✦' : '') + (p === sel ? ' (loaded)' : ''), p.exercises.length + ' modules', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>')
        + (sel ? M(e(sel.name), sel.exercises.map((x) => '<div style="display:flex;justify-content:space-between"><span>' + e(x.name) + '</span><span>' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</span></div>').join('') + '<button class="btn" data-do="start" data-arg="' + sel.id + '">Play</button><button class="btn dk" data-open="editplan" data-arg="' + sel.id + '">Edit patch</button>') : '')
        + M('Library', '<div class="lst">' + li('Reorder patches', '', 'data-open="plans"') + li('New patch', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Module catalogue', '48', 'data-open="library"') + '</div>');
    }
    const p = G.progress(), i = s.cur, x = s.exercises[i], j = Math.max(0, x.sets.findIndex((y) => !y.done)), st = x.sets[j], c = G.compare(s.planId, x.id, st.w, st.r);
    return M('Transport', '<div style="display:flex;gap:6px"><div class="lcd" style="flex:1" data-live="elapsed"></div><div class="lcd" style="flex:1;color:#FFB04C" data-live="rest" data-idle="--:--" data-done="0:00"></div></div><div style="display:flex;justify-content:space-between;color:#A39C8C;margin-top:4px"><span>time</span><span>' + p.done + '/' + p.total + ' steps</span><span>rest</span></div>')
      + M(e(x.name), '<div class="knobs">' + knob('Load', G.fmtW(st.w), (st.w % 100) / 100, 'data-open="set" data-arg="' + i + ':' + j + '"') + knob('Reps', st.r, st.r / 20, 'data-open="set" data-arg="' + i + ':' + j + '"') + knob('Rest', '90 s', .5, 'data-do="rest" data-arg="90"') + '</div><div style="text-align:center;color:' + (c.kind === 'up' ? '#34C759' : '#A39C8C') + ';margin:6px 0">' + (x.replaces ? 'replaces ' + e(x.replaces) : c.text) + '</div>'
        + '<div class="tools"><button data-do="wminus" data-arg="' + i + ':' + j + '">− load</button><button data-do="wplus" data-arg="' + i + ':' + j + '">+ load</button><button data-do="addset" data-arg="' + i + '">+ step</button><button data-open="replace" data-arg="' + i + '">Swap module</button><button data-open="exercise" data-arg="' + x.id + '">Manual</button></div>', 'box-shadow:inset 0 0 0 2px #FF8A3D')
      + M('Step sequencer', s.exercises.map((y, k) => '<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><button style="border:0;background:none;color:' + PATCH[k % 5] + ';font:700 12px Barlow Semi Condensed;cursor:pointer;width:84px;text-align:left;padding:0" data-do="cur" data-arg="' + k + '">' + e(y.name) + '</button><div class="seq" style="justify-content:flex-start;margin:0">'
        + y.sets.map((z, m) => y.unilateral ? '<button class="step' + (z.L ? ' on' : '') + '" data-do="set" data-arg="' + k + ':' + m + ':L"><i></i><span class="pad">L' + (m + 1) + '</span></button><button class="step' + (z.R ? ' on' : '') + '" data-do="set" data-arg="' + k + ':' + m + ':R"><i></i><span class="pad">R' + (m + 1) + '</span></button>' : '<button class="step' + (z.done ? ' on' : '') + (k === i && m === j ? ' cur' : '') + '" data-do="set" data-arg="' + k + ':' + m + '"><i></i><span class="pad">' + z.r + '</span></button>').join('') + '</div></div>').join(''))
      + '<button class="btn" data-do="finish">Stop and save, +' + p.xp + ' XP</button><button class="btn dk" data-open="rest">Rest timer</button><button class="btn red" data-do="discard">Discard</button>';
  }
  function scope() {
    const t = G.totals();
    return M('Oscilloscope: sets per week', '<div style="background:#0F1A12;padding:6px;border-radius:3px;color:#7CFC9A">' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 90, fill: false }) + '</div>')
      + M('Meters', '<div class="knobs">' + knob('Week', t.week.workouts, t.week.workouts / G.goal(), 'data-open="history"') + knob('Month', t.month.workouts, t.month.workouts / 20, 'data-open="history"') + knob('All', t.all.workouts, t.all.workouts / 100, 'data-open="history"') + '</div>')
      + M('Peaks', '<div class="lst">' + G.records().list.slice(0, 4).map((r) => li(e(r.name), G.fmtW(r.kg), 'data-open="exercise" data-arg="' + r.id + '"')).join('') + '</div>')
      + M('Archive', '<div class="lst">' + li('Records', '', 'data-open="records"') + li('History', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body', '', 'data-open="body"') + li('Food', '', 'data-open="food"') + li('Photos', '', 'data-open="photos"') + '</div>');
  }
  function jam() {
    const L = G.leaderboard();
    return M('Jam session', '<div class="lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', 'share a patch', 'data-open="chats"') + li('Friends', '', 'data-open="friends"') + li('New post', '', 'data-open="post"') + '</div>')
      + M('Feed', G.feed().map((p) => '<div class="post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join(''));
  }
  function cfg() { return M('Setup', '<div class="lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'); }
  K.app({ root: document.getElementById('app'), screens: { rack, seq, scope, jam, cfg }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=seq]').click(); } } });
})();
</script>
</body>
</html>
