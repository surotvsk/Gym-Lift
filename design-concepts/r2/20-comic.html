<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20 · Comic — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; background: #FFF8E1; color: #111; font: 16px/1.3 'Comic Neue', 'Comic Sans MS', sans-serif;
    --k-acc: #E53935; --k-font: 'Comic Neue', sans-serif; --k-head: Bangers, sans-serif; --k-radius: 6px; --k-bg: #FFF8E1; --k-card: #fff; --k-line: #111; --k-good: #43A047; --k-bad: #FFCDD2; }
  .k-root .k-head h2 { letter-spacing: 1px; font-size: 22px; font-weight: 400; }
  main { flex: 1; overflow-y: auto; padding: 44px 10px 18px; }
  .page { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pn { position: relative; border: 3px solid #111; background: #fff; padding: 10px; overflow: hidden; text-align: left; font: inherit; color: inherit; }
  button.pn { cursor: pointer; }
  .pn.w { grid-column: span 2; }
  .dots { background-color: #FFE082; background-image: radial-gradient(#F4A300 22%, transparent 24%); background-size: 9px 9px; }
  .dots.r { background-color: #EF9A9A; background-image: radial-gradient(#E53935 22%, transparent 24%); }
  .dots.b { background-color: #90CAF9; background-image: radial-gradient(#1E88E5 22%, transparent 24%); }
  .cap { display: inline-block; background: #FFEB3B; border: 2px solid #111; padding: 2px 8px; font: 700 12px 'Comic Neue'; text-transform: uppercase; }
  .ttl { font: 400 34px/0.95 Bangers, sans-serif; letter-spacing: 1px; margin: 6px 0; text-shadow: 2px 2px 0 #fff; }
  .bub { position: relative; background: #fff; border: 2.5px solid #111; border-radius: 50% / 40%; padding: 14px 16px; margin: 8px 0 18px; text-align: center; font-weight: 700; }
  .bub::after { content: ''; position: absolute; left: 30px; bottom: -16px; border: 9px solid transparent; border-top: 14px solid #111; }
  .bam { display: inline-block; font: 400 40px/1 Bangers; color: #FFEB3B; -webkit-text-stroke: 2px #111; transform: rotate(-8deg); text-shadow: 3px 3px 0 #E53935; }
  .big { font: 400 64px/0.9 Bangers; }
  .go { display: block; width: 100%; border: 3px solid #111; background: #E53935; color: #fff; font: 400 26px Bangers; letter-spacing: 1px; padding: 10px; cursor: pointer; box-shadow: 4px 4px 0 #111; margin-top: 8px; }
  .go.y { background: #FFEB3B; color: #111; }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .s { min-width: 58px; border: 2.5px solid #111; background: #fff; padding: 6px; font: 700 16px 'Comic Neue'; cursor: pointer; color: #111; border-radius: 4px; }
  .s small { display: block; font-size: 11px; } .s.on { background: #43A047; color: #fff; transform: rotate(-3deg); }
  .s.on::after { content: ' POW'; font: 400 11px Bangers; }
  .tl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; } .tl button { border: 0; background: none; font: 700 13px 'Comic Neue'; text-decoration: underline; cursor: pointer; padding: 2px 0; color: #1565C0; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 2px solid #111; background: none; padding: 9px 2px; font: 700 16px 'Comic Neue'; cursor: pointer; color: #111; text-align: left; }
  nav { display: flex; background: #111; padding: 6px 4px 24px; gap: 4px; }
  nav button { flex: 1; border: 0; background: #fff; color: #111; font: 400 17px Bangers; letter-spacing: 1px; padding: 7px 0; cursor: pointer; transform: skew(-6deg); }
  nav button.is-active { background: #FFEB3B; }
  .post .k-post { border: 0; padding: 0; } .post { cursor: pointer; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="ep"></section><section data-screen="fight" hidden></section><section data-screen="powers" hidden></section><section data-screen="team" hidden></section><section data-screen="hq" hidden></section>
  </main>
  <nav><button data-tab="ep">Today</button><button data-tab="fight">Fight</button><button data-tab="powers">Powers</button><button data-tab="team">Team</button><button data-tab="hq">HQ</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (a, b, attrs) => '<button ' + attrs + '><span>' + a + '</span><span>' + (b == null ? '➜' : b) + '</span></button>';
  function ep() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp();
    return '<div class="page"><div class="pn w dots"><span class="cap">Issue #' + w.num + ' · ' + G.fmtShort(G.today()) + '</span><div class="ttl">The adventures of ' + e(G.state.profile.name) + '!</div><div class="bub">' + G.motivation() + '</div></div>'
      + '<button class="pn dots b" data-open="calendar"><span class="cap">This week</span><div class="big">' + w.done + '/' + w.goal + '</div></button><button class="pn dots r" data-open="achievements"><span class="cap">Streak</span><div class="big">' + G.streak() + '</div><b>weeks!</b></button>'
      + '<div class="pn w">' + (s ? '<span class="cap">Meanwhile…</span><div class="ttl">' + e(s.planName) + ' is ON!</div><span data-live="elapsed"></span><button class="go" data-tab="fight">Back into battle!</button>' : rec ? '<span class="cap">Next time…</span><div class="ttl">' + e(rec.name) + ' ✦</div><div>' + rec.exercises.map((x) => e(x.name)).join(', ') + '</div><button class="go" data-do="start" data-arg="' + rec.id + '">Let’s go!</button>' : '') + '</div>'
      + '<button class="pn" data-open="achievements"><span class="cap">Power level</span><div class="big" style="font-size:44px">' + X.level + '</div>' + X.total + ' XP</button><button class="pn" data-do="excuse"><span class="cap">' + (w.excused ? 'Excused!' : 'Need a break?') + '</span><div class="ttl" style="font-size:22px">' + (w.excused ? 'Undo' : 'Excuse this week') + '</div></button>'
      + '<button class="pn" data-open="rest"><span class="cap">Recharge</span><div class="ttl" style="font-size:24px">Rest timer</div></button><button class="pn" data-open="activity"><span class="cap">Side quest</span><div class="ttl" style="font-size:24px">Run · walk · ride</div></button></div>';
  }
  function fight() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<div class="page"><div class="pn w dots"><div class="ttl">Choose your mission</div></div><div class="pn w lst">' + G.plans().map((p) => li((p === sel ? '★ ' : '') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), G.planMinutes(p) + ' min', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="pn w"><div class="ttl">' + e(sel.name) + '</div>' + sel.exercises.map((x) => '<div>• ' + e(x.name) + ' — ' + x.sets + '×' + x.reps + ' ' + G.fmtW(x.weight) + '</div>').join('') + '<button class="go" data-do="start" data-arg="' + sel.id + '">Begin mission!</button><div class="tl"><button data-open="editplan" data-arg="' + sel.id + '">Edit</button><button data-open="plans">Reorder</button><button data-open="newplan">New plan</button><button data-open="fullbody">Full body builder</button><button data-open="library">Library</button></div></div>' : '') + '</div>';
    }
    const p = G.progress();
    return '<div class="page"><div class="pn w dots r"><span class="cap">' + e(s.planName) + ' · ' + p.done + '/' + p.total + '</span><div class="big" data-live="elapsed"></div><div class="tl"><button data-open="rest">Rest: <span data-live="rest" data-idle="none" data-done="OVER"></span></button><button data-do="rest" data-arg="90">Rest 90</button><button data-do="discard">Retreat (discard)</button></div></div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps), done = x.sets.every((y) => y.done);
        return '<div class="pn w' + (i === s.cur ? ' dots' : '') + '">' + (done ? '<span class="bam" style="position:absolute;right:8px;top:6px">BAM!</span>' : '') + '<span class="cap">Panel ' + (i + 1) + '</span><div class="ttl" style="font-size:28px">' + e(x.name) + '</div><div style="font-size:13px">' + (x.replaces ? 'stand-in for ' + e(x.replaces) : c.text) + '</div><div class="sets">'
          + x.sets.map((st, j) => x.unilateral ? '<button class="s' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L' + (j + 1) + '<small>' + G.fmtW(st.w) + '</small></button><button class="s' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R' + (j + 1) + '<small>×' + st.r + '</small></button>' : '<button class="s' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '">' + st.r + '<small>' + G.fmtW(st.w) + '</small></button>').join('') + '</div>'
          + '<div class="tl"><button data-open="set" data-arg="' + i + ':0">Weight</button><button data-do="addset" data-arg="' + i + '">+ set</button><button data-open="replace" data-arg="' + i + '">Swap</button><button data-open="exercise" data-arg="' + x.id + '">How?</button></div></div>'; }).join('')
      + '<div class="pn w"><button class="go y" data-do="finish">The end! +' + p.xp + ' XP</button></div></div>';
  }
  function powers() {
    const t = G.totals(), ser = G.weeklySeries(8);
    return '<div class="page"><button class="pn dots" data-open="history"><span class="cap">This month</span><div class="big">' + t.month.workouts + '</div></button><button class="pn dots b" data-open="history"><span class="cap">All time</span><div class="big">' + t.all.workouts + '</div></button>'
      + '<div class="pn w"><span class="cap">Sets per week</span><div style="color:#E53935">' + K.bars(ser.map((x) => x.sets), { h: 100, labels: ser.map((x) => x.label) }) + '</div></div>'
      + '<div class="pn w"><span class="cap">Super strength</span>' + G.records().list.slice(0, 4).map((r) => '<div style="display:flex;justify-content:space-between;padding:3px 0"><b>' + e(r.name) + '</b><span>' + G.fmtW(r.kg) + '</span></div>').join('') + '</div>'
      + '<div class="pn w lst">' + li('All records', null, 'data-open="records"') + li('Back issues (history)', null, 'data-open="history"') + li('Calendar', null, 'data-open="calendar"') + li('Medals', null, 'data-open="achievements"') + li('Body', null, 'data-open="body"') + li('Food', null, 'data-open="food"') + li('Photos', null, 'data-open="photos"') + '</div></div>';
  }
  function team() {
    const L = G.leaderboard();
    return '<div class="page"><button class="pn dots r" data-open="leaderboard"><span class="cap">Top 20</span><div class="big">#' + (L.me ? L.me.rank : '–') + '</div></button><div class="pn lst">' + li('Post', null, 'data-open="post"') + li('Chat', null, 'data-open="chats"') + li('Friends', null, 'data-open="friends"') + '</div>'
      + G.feed().map((p) => '<div class="pn w post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('') + '</div>';
  }
  function hq() { return '<div class="page"><div class="pn w dots b"><div class="ttl">Secret HQ</div></div><div class="pn w lst">' + li('Weekly goal', G.goal(), 'data-open="settings"') + li('Profile & reminders', null, 'data-open="profile"') + li('Settings', null, 'data-open="settings"') + '</div></div>'; }
  K.app({ root: document.getElementById('app'), screens: { ep, fight, powers, team, hq }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=fight]').click(); } } });
})();
</script>
</body>
</html>
