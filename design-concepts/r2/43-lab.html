<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>43 · Lab — GymQuest concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frame.css">
<link rel="stylesheet" href="kit.css">
<style>
  .app { position: absolute; inset: 0; display: flex; flex-direction: column; color: #2A2F3A; font: 15px/1.45 'Source Sans 3', system-ui, sans-serif;
    background-color: #F6FBF6; background-image: linear-gradient(#CFE6D2 1px, transparent 1px), linear-gradient(90deg, #CFE6D2 1px, transparent 1px), linear-gradient(#E4F1E6 1px, transparent 1px), linear-gradient(90deg, #E4F1E6 1px, transparent 1px); background-size: 40px 40px, 40px 40px, 8px 8px, 8px 8px;
    --ink: #1F3A93; --hl: #F9F871;
    --k-acc: #1F3A93; --k-font: 'Source Sans 3', sans-serif; --k-head: Kalam, cursive; --k-radius: 6px; --k-bg: #FAFDFA; --k-card: #EAF3EB; --k-line: #CFE6D2; --k-good: #4C8C63; --k-bad: #F2D7D2; }
  main { flex: 1; overflow-y: auto; padding: 44px 16px 16px 30px; position: relative; }
  main::before { content: ''; position: absolute; left: 20px; top: 0; bottom: 0; width: 2px; background: #E88B8B; opacity: .7; }
  .hw { font-family: Kalam, cursive; color: var(--ink); }
  h1 { font: 700 28px/1.1 Kalam, cursive; color: var(--ink); margin: 0 0 4px; }
  h2 { font: 700 20px Kalam, cursive; color: var(--ink); margin: 16px 0 4px; }
  .lbl { font: 600 13px 'Source Sans 3'; color: #5E6A5E; }
  .hl { background: linear-gradient(transparent 50%, var(--hl) 50%); }
  .entry { background: rgba(255,255,255,.75); border: 1px solid #CFE6D2; border-radius: 4px; padding: 12px; margin: 8px 0 12px; }
  .dl { display: grid; grid-template-columns: 100px 1fr; gap: 4px 10px; font-size: 14px; }
  .dl dt { color: #5E6A5E; } .dl dd { margin: 0; font-family: Kalam; color: var(--ink); font-size: 17px; }
  .run { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--ink); color: #fff; font: 700 15px 'Source Sans 3'; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin-top: 8px; }
  .run.o { background: none; color: var(--ink); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; background: rgba(255,255,255,.75); }
  .tbl th { text-align: left; font-weight: 600; color: #5E6A5E; border-bottom: 2px solid #2A2F3A; padding: 4px 6px; }
  .tbl td { border-bottom: 1px solid #CFE6D2; padding: 6px; }
  .tbl td.hw { font-size: 17px; }
  .ck { width: 26px; height: 26px; border: 2px solid #2A2F3A; border-radius: 4px; background: #fff; cursor: pointer; padding: 0; font: 700 18px/1 Kalam; color: var(--ink); }
  .ck.side { width: auto; padding: 0 5px; font-size: 13px; }
  .ck.on { background: var(--hl); }
  .tools { display: flex; flex-wrap: wrap; gap: 12px; margin: 4px 0 6px; } .tools button { border: 0; background: none; color: var(--ink); font: 400 16px Kalam; cursor: pointer; padding: 2px 0; text-decoration: underline; }
  .lst button { display: flex; justify-content: space-between; width: 100%; border: 0; border-bottom: 1px solid #CFE6D2; background: none; padding: 10px 0; font: 600 15px 'Source Sans 3'; cursor: pointer; color: #2A2F3A; text-align: left; }
  .lst small { font: 400 16px Kalam; color: var(--ink); }
  .plot { background: #fff; border: 1px solid #CFE6D2; padding: 8px; color: var(--ink); }
  nav { display: flex; background: #fff; border-top: 2px solid #2A2F3A; padding: 6px 4px 24px; }
  nav button { flex: 1; border: 0; background: none; color: #7C877C; font: 700 15px Kalam; cursor: pointer; padding: 6px 0; }
  nav button.is-active { color: var(--ink); background: linear-gradient(transparent 55%, var(--hl) 55%); }
  .post { cursor: pointer; } .post .k-post { border: 0; padding: 0; }
</style>
</head>
<body class="concept">
<aside class="concept-info" id="info"></aside>
<div class="device"><div class="app" id="app">
  <main data-scroll>
    <section data-screen="notebook"></section><section data-screen="experiment" hidden></section><section data-screen="results" hidden></section><section data-screen="peers" hidden></section><section data-screen="protocol" hidden></section>
  </main>
  <nav><button data-tab="notebook">Notebook</button><button data-tab="experiment">Experiment</button><button data-tab="results">Results</button><button data-tab="peers">Peers</button><button data-tab="protocol">Protocol</button></nav>
</div></div>
<script src="designs.js"></script>
<script src="lib.js"></script><script src="core.js"></script><script src="kit.js"></script>
<script>
(function () {
  const G = GQ2, K = Kit, e = G.esc;
  const li = (t, s, attrs) => '<button ' + attrs + '><span>' + t + '</span><small>' + (s || '') + '</small></button>';
  function notebook() {
    const w = G.weekInfo(), rec = G.recommended(), s = G.sess(), X = G.xp(), n = G.state.history.length + 1;
    return '<div class="lbl">' + G.fmtDate(G.today(), true) + '</div><h1>Experiment ' + n + (s ? ', in progress' : '') + '</h1>'
      + '<div class="entry"><dl class="dl"><dt>Hypothesis</dt><dd>' + (s ? e(s.planName) + ' will be finished today.' : rec ? 'Doing ' + e(rec.name) + ' today keeps the streak alive.' : '—') + '</dd><dt>This week</dt><dd>' + w.done + ' of ' + w.goal + ' trials</dd><dt>Streak</dt><dd>' + G.streak() + ' weeks</dd><dt>Level</dt><dd>' + X.level + ' (' + X.total + ' XP)</dd><dt>Note</dt><dd>' + G.motivation() + '</dd></dl>'
      + (s ? '<button class="run" data-tab="experiment">Return to the bench, <span data-live="elapsed"></span></button>' : rec ? '<button class="run" data-do="start" data-arg="' + rec.id + '">Run ' + e(rec.name) + '</button>' : '') + '</div>'
      + '<h2>Week ' + w.num + ' observations</h2><table class="tbl"><tr><th>Day</th><th>Result</th></tr>' + w.days.map((d) => '<tr data-open="day" data-arg="' + d.date + '" style="cursor:pointer"><td>' + d.d + ' ' + d.n + '</td><td class="hw">' + (d.done ? '✓ ' + e(d.plans.join(', ')) : d.today ? '(today)' : d.future ? '' : 'rest') + '</td></tr>').join('') + '</table>'
      + '<div class="lst" style="margin-top:8px">' + li(w.excused ? 'Week excluded from the study' : 'Exclude this week (excuse)', w.excused ? 'undo' : 'streak kept', 'data-do="excuse"') + li('Rest timer', '', 'data-open="rest"') + li('Field work: run, walk, ride', '', 'data-open="activity"') + li('Calendar', '', 'data-open="calendar"') + '</div>';
  }
  function experiment() {
    const s = G.sess();
    if (!s) {
      const sel = G.selected();
      return '<h1>Choose a method</h1><div class="lst">' + G.plans().map((p) => li((p === sel ? '☑ ' : '☐ ') + e(p.name) + (p === G.recommended() ? ' ✦' : ''), p.exercises.length + ' steps', 'data-do="select" data-arg="' + p.id + '"')).join('') + '</div>'
        + (sel ? '<div class="entry"><h2 style="margin-top:0">Method: ' + e(sel.name) + '</h2><table class="tbl"><tr><th>Exercise</th><th>Sets</th><th>Load</th></tr>' + sel.exercises.map((x) => '<tr><td>' + e(x.name) + '</td><td class="hw">' + x.sets + '×' + x.reps + '</td><td class="hw">' + G.fmtW(x.weight) + '</td></tr>').join('') + '</table><button class="run" data-do="start" data-arg="' + sel.id + '">Start</button> <button class="run o" data-open="editplan" data-arg="' + sel.id + '">Revise method</button></div>' : '')
        + '<div class="lst">' + li('Order of methods', '', 'data-open="plans"') + li('New method', '', 'data-open="newplan"') + li('Full Body builder', '', 'data-open="fullbody"') + li('Reference library', '48', 'data-open="library"') + '</div>';
    }
    const p = G.progress();
    return '<h1>' + e(s.planName) + '</h1><div class="lbl">Elapsed <span class="hw" style="font-size:20px" data-live="elapsed"></span>. Rest <span class="hw" data-live="rest" data-idle="off" data-done="over"></span>. ' + p.done + ' of ' + p.total + ' sets recorded.</div>'
      + s.exercises.map((x, i) => { const c = G.compare(s.planId, x.id, Math.max(...x.sets.map((y) => y.w)), x.reps);
        return '<h2>' + (i + 1) + '. ' + (i === s.cur ? '<span class="hl">' + e(x.name) + '</span>' : e(x.name)) + '</h2><div class="lbl">' + (x.replaces ? 'Substituted for ' + e(x.replaces) : c.text) + '</div><table class="tbl"><tr><th>Set</th><th>Load</th><th>Reps</th><th>Done</th></tr>'
          + x.sets.map((st, j) => '<tr><td>' + (j + 1) + '</td><td class="hw" style="cursor:pointer" data-open="set" data-arg="' + i + ':' + j + '">' + G.fmtW(st.w) + '</td><td class="hw">' + st.r + (st.planFail ? ' (F)' : '') + '</td><td>' + (x.unilateral ? '<button class="ck side' + (st.L ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':L">L</button> <button class="ck side' + (st.R ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + ':R">R</button>' : '<button class="ck' + (st.done ? ' on' : '') + '" data-do="set" data-arg="' + i + ':' + j + '" aria-label="Set ' + (j + 1) + ' done">' + (st.done ? '✓' : '') + '</button>') + '</td></tr>').join('') + '</table>'
          + '<div class="tools"><button data-do="addset" data-arg="' + i + '">add a set</button><button data-open="replace" data-arg="' + i + '">substitute</button><button data-open="exercise" data-arg="' + x.id + '">reference</button><button data-do="rest" data-arg="90">rest 90 s</button></div>'; }).join('')
      + '<button class="run" data-do="finish">Record results, +' + p.xp + ' XP</button> <button class="run o" data-open="rest">Rest timer</button> <button class="run o" data-do="discard">Abandon</button>';
  }
  function results() {
    const t = G.totals();
    return '<h1>Results</h1><div class="plot"><div class="lbl">Fig. 1. Sets per week</div>' + K.line(G.weeklySeries(10).map((x) => x.sets), { h: 110 }) + '</div>'
      + '<h2>Summary</h2><table class="tbl"><tr><th></th><th>Week</th><th>Month</th><th>All</th></tr>' + ['workouts', 'sets', 'minutes'].map((k) => '<tr><td>' + k + '</td><td class="hw">' + t.week[k] + '</td><td class="hw">' + t.month[k] + '</td><td class="hw">' + t.all[k] + '</td></tr>').join('') + '</table>'
      + '<h2>Findings (records)</h2><table class="tbl">' + G.records().list.slice(0, 5).map((r) => '<tr data-open="exercise" data-arg="' + r.id + '" style="cursor:pointer"><td>' + e(r.name) + '</td><td class="hw">' + G.fmtW(r.kg) + '</td></tr>').join('') + '</table>'
      + '<div class="lst" style="margin-top:8px">' + li('All findings', '', 'data-open="records"') + li('Every experiment', '', 'data-open="history"') + li('Calendar', '', 'data-open="calendar"') + li('Achievements', '', 'data-open="achievements"') + li('Body measurements', '', 'data-open="body"') + li('Food log', '', 'data-open="food"') + li('Photographs', '', 'data-open="photos"') + '</div>';
  }
  function peers() {
    const L = G.leaderboard();
    return '<h1>Peer review</h1><div class="lst">' + li('Top 20 this week', '#' + (L.me ? L.me.rank : '–'), 'data-open="leaderboard"') + li('Messages', '', 'data-open="chats"') + li('Colleagues', '', 'data-open="friends"') + li('Publish a post', '', 'data-open="post"') + '</div>'
      + G.feed().map((p) => '<div class="entry post" data-open="postview" data-arg="' + p.id + '">' + K.postCard(p) + '</div>').join('');
  }
  function protocol() { return '<h1>Protocol</h1><div class="lst">' + li('Weekly goal', G.goal() + ' trials', 'data-open="settings"') + li('Profile and reminders', '', 'data-open="profile"') + li('All settings', '', 'data-open="settings"') + '</div>'; }
  K.app({ root: document.getElementById('app'), screens: { notebook, experiment, results, peers, protocol }, actions: { start: (a) => { G.start(a); document.querySelector('[data-tab=experiment]').click(); } } });
})();
</script>
</body>
</html>
